<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fasting">
<meta name="theme-color" content="#12151c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2312151c'/%3E%3Ccircle cx='90' cy='90' r='46' fill='none' stroke='%237fd1c1' stroke-width='9'/%3E%3Cpath d='M90 60v32l20 12' fill='none' stroke='%237fd1c1' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>B.M.C. 食事の間隔メモ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#12151c;color:#e8ecf2;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-user-select:none;user-select:none;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 44px}
h1{font-size:19px;margin:4px 0 2px;letter-spacing:.02em}
.sub{color:#8a94a6;font-size:12.5px;margin:0 0 16px;line-height:1.65}
.card{background:#1a1f29;border:1px solid #262d3a;border-radius:14px;padding:15px 16px;margin-bottom:11px}
.sec{font-size:12px;color:#6f7a8c;margin:24px 0 9px;letter-spacing:.06em}
.btn{
  display:block;width:100%;padding:17px;border-radius:12px;border:none;
  background:#7fd1c1;color:#10161c;font-size:17px;font-weight:700;
  font-family:inherit;cursor:pointer;margin-top:10px;
}
.btn.ghost{background:#232b38;color:#cbd5e3;font-weight:600;font-size:14px;padding:12px}
.btn.link{background:none;color:#8a94a6;font-size:13px;padding:9px;font-weight:500;text-decoration:underline}
.row{display:flex;gap:9px}
.row>*{flex:1}

.big{font-size:64px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 2px;letter-spacing:-.03em;line-height:1.1}
.bigsub{text-align:center;color:#8a94a6;font-size:13px;margin-bottom:6px}

/* 体調チップ */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{
  background:#232b38;border:1px solid #303a4a;color:#cbd5e3;border-radius:999px;
  padding:9px 14px;font-size:13.5px;font-family:inherit;cursor:pointer;
}
.chip.on{background:#2b3a4a;border-color:#4a6076;color:#e8ecf2}
.care{
  margin-top:11px;font-size:12.5px;line-height:1.7;color:#c3b49c;
  background:#1f1c19;border:1px solid #2f2a24;border-radius:10px;padding:11px 13px;
}

/* 記録一覧：良い/悪いを色で出さない。すべて同じ見え方にする */
.rec{border-top:1px solid #232b38;padding:12px 2px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rec:first-of-type{border-top:none}
.rec .l{font-size:14px;line-height:1.5}
.rec .l small{display:block;color:#8a94a6;font-size:12px;margin-top:3px}
.rec .r{font-size:15px;color:#cbd5e3;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec .r.unk{color:#6f7a8c;font-size:13px}
.editb{background:none;border:1px solid #303a4a;color:#8a94a6;border-radius:8px;font-size:12px;padding:6px 9px;font-family:inherit;cursor:pointer}

.note{color:#6f7a8c;font-size:12px;line-height:1.75;margin:10px 0 0}
label{display:block;font-size:12.5px;color:#8a94a6;margin:12px 0 5px}
input[type=datetime-local]{
  width:100%;background:#12151c;border:1px solid #303a4a;color:#e8ecf2;
  border-radius:10px;padding:12px;font-size:15px;font-family:inherit;
}
textarea{width:100%;height:120px;background:#12151c;border:1px solid #303a4a;color:#8a94a6;border-radius:10px;padding:10px;font-size:11px;font-family:ui-monospace,monospace}
.hr{height:1px;background:#232b38;margin:22px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================================
   B.M.C. 食事の間隔メモ（fast.html） v1 — 2026-08-08

   ■ この画面が「やらないこと」（設計上の禁止事項。変更しないでください）
     依頼 指示_2026-08-08_断食記録アプリの作成 §2 の安全4条件に対応します。

     1. 目標値・記録更新（自己ベスト）・連続日数を持たない
        → streak(), best(), goal は「実装しない」。stretch.html には streak() が
          ありますが、こちらへは意図的に移植していません。
     2. 達成バッジ・最長記録の強調など、長時間化を煽る演出を入れない
     3. 短かった日をマイナスに見せない
        → 記録一覧は全件同じ配色・同じ字面。赤・×・「失敗」「未達」の語を使わない。
          長さによる並べ替え・強調も行わない（時系列のみ）。
     4. 体調を1タップで残せる欄と、「続く場合は無理をしない」の1行を画面に置く

   ■ 前提（2026-08-08 Manamiさんのご記入）
     ・対象は「夕方からのファスティング」＝食事の窓を早い時間帯に寄せる形であり、
       断食時間の長さを伸ばす取り組みではない。よって長さは「結果の記録」であって
       指標ではない。平均も「要約」としてのみ出す。
     ・本日（2026-08-08）から試行が始まっているため、開始時刻をさかのぼって
       入力できる必要がある（アプリを開いた時刻＝開始時刻とは限らない）。
     ・「検討中・試行中」の段階。継続を促す表示・催促・通知は置かない。
   ========================================================================= */

const KEY="bmc_fast_v1";
let DB={records:[],active:null};
try{const r=localStorage.getItem(KEY); if(r) DB=JSON.parse(r);}catch(e){}
if(!DB.records) DB.records=[];
if(DB.active===undefined) DB.active=null;

function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); }
  catch(e){ alert("端末に保存できませんでした。下の書き出し欄からコピーして保管してください。"); }
}

/* ---------- 時刻ユーティリティ ---------- */
const MS_H=3600000;
function toLocalInput(ms){                       /* datetime-local 用 */
  const d=new Date(ms - d0().getTimezoneOffset()*60000);
  return d.toISOString().slice(0,16);
}
function d0(){ return new Date(); }
function fromLocalInput(v){ return v ? new Date(v).getTime() : NaN; }
function hhmm(ms){
  const d=new Date(ms);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function mdw(ms){
  const d=new Date(ms), w="日月火水木金土"[d.getDay()];
  return (d.getMonth()+1)+"/"+d.getDate()+"("+w+")";
}
/* 長さの表示。単位は「時間・分」。小数は使わない（比べる数字に見せないため） */
function dur(ms){
  const m=Math.round(ms/60000);
  const h=Math.floor(m/60), mm=m%60;
  return h>0 ? (h+"時間"+(mm?mm+"分":"")) : (mm+"分");
}

/* ---------- 押し忘れの後始末 ----------
   終了を押さないまま24時間を超えた進行中の記録は、「時間不明」として静かに閉じる。
   ・警告もアラートも出さない（責める形にしないため）
   ・長さは null にして、要約の平均から必ず除外する（実態より長い数字が混ざるのを防ぐ）
   ・あとから時刻を直せば、通常の記録として復帰する                               */
function reap(){
  if(!DB.active) return false;
  if(Date.now()-DB.active.start <= 24*MS_H) return false;
  DB.records.push({start:DB.active.start,end:null,ms:null,c1:DB.active.c1||[],c2:[]});
  DB.active=null; save(); return true;
}

/* ---------- 要約（平均） ----------
   「記録の要約」であって成績ではない。直近7件のみ。時間不明は除外。 */
function avg7(){
  const v=DB.records.filter(r=>r.ms!=null).slice(-7);
  if(!v.length) return null;
  return {ms: v.reduce((a,r)=>a+r.ms,0)/v.length, n:v.length};
}

/* ---------- 体調（1タップ） ---------- */
const CONDS=["なし","強い空腹感","頭痛","ふらつき"];
function chipRow(sel,fn){
  return '<div class="chips">'+CONDS.map(function(c){
    return '<button class="chip'+(sel.indexOf(c)>=0?' on':'')+'" onclick="'+fn+'(\''+c+'\')">'+c+'</button>';
  }).join("")+'</div>';
}
function toggle(arr,c){
  if(c==="なし") return arr.indexOf("なし")>=0 ? [] : ["なし"];
  const a=arr.filter(x=>x!=="なし");
  return a.indexOf(c)>=0 ? a.filter(x=>x!==c) : a.concat([c]);
}
function tapStartCond(c){ DB.active.c1=toggle(DB.active.c1||[],c); save(); render(); }
let endCond=[];
function tapEndCond(c){ endCond=toggle(endCond,c); render(); }

const CARE='<div class="care">頭痛・ふらつき・強い空腹感が続くときは、無理をせず切り上げてください。'
  +'<br>持病・お薬・体調の心配がある場合、続けてよいかどうかは医療の専門家にご相談ください。'
  +'このメモは記録を残すだけで、時間の長さが体に合っているかどうかは判断できません。</div>';

/* ===================== 画面 ===================== */
let view="home", editIdx=null;
function go(v){ view=v; render(); }

function render(){
  reap();
  const A=document.getElementById("app");
  if(view==="log")  return void(A.innerHTML=viewLog());
  if(view==="edit") return void(A.innerHTML=viewEdit());
  A.innerHTML = DB.active ? viewRunning() : viewIdle();
}

/* --- 待機中 --- */
function viewIdle(){
  const a=avg7();
  return `
  <h1>食事の間隔メモ</h1>
  <p class="sub">夕方からの食事の間隔を、開始と終了の2タップで残すだけのメモです。<br>
  <strong>長さを競うものではありません。</strong>試している最中の記録なので、合わなければやめて構いません。記録は残ります。</p>

  <div class="card">
    <button class="btn" onclick="start()">開始</button>
    <p class="note">押した時刻で始まります。<strong>あとから開始時刻を直せます</strong>ので、
    「もう始めていたけれど押し忘れていた」場合も、そのまま押してください。</p>
  </div>

  ${a ? `<div class="sec">記録の要約</div>
  <div class="card">
    <div style="font-size:15px">直近${a.n}件の平均 &nbsp;<strong>${dur(a.ms)}</strong></div>
    <p class="note">記録の要約です。目安にもなりません。短い日も長い日も、そのまま並んでいるだけです。</p>
  </div>` : ""}

  <button class="btn ghost" onclick="go('log')">記録を見る・直す（${DB.records.length}件）</button>
  ${CARE}`;
}

/* --- 進行中 --- */
function viewRunning(){
  const el=Date.now()-DB.active.start;
  return `
  <h1>記録中</h1>
  <p class="sub">${mdw(DB.active.start)} ${hhmm(DB.active.start)} から</p>

  <div class="card">
    <div class="big">${dur(el)}</div>
    <div class="bigsub">経過</div>
    <button class="btn" onclick="stop()">終了</button>
    <button class="btn link" onclick="fixStart()">開始時刻を直す</button>
  </div>

  <div class="sec">いまの体調（任意・1タップ）</div>
  <div class="card">
    ${chipRow(DB.active.c1||[],"tapStartCond")}
    <p class="note">選ばなくても記録は残ります。あとで見返すためのメモです。</p>
  </div>

  <button class="btn ghost" onclick="go('log')">記録を見る・直す</button>
  <button class="btn link" onclick="cancelActive()">この記録をやめる（残さない）</button>
  ${CARE}`;
}

/* --- 記録一覧 --- */
function viewLog(){
  const rs=DB.records.map((r,i)=>({r,i})).reverse();
  return `
  <h1>記録</h1>
  <p class="sub">新しい順。<strong>並べ替えや強調はしていません。</strong></p>

  <div class="card">
    ${rs.length ? rs.map(function(o){
      const r=o.r;
      const cond=[].concat(r.c1||[],r.c2||[]).filter(c=>c&&c!=="なし");
      return `<div class="rec">
        <div class="l">${mdw(r.start)} ${hhmm(r.start)} → ${r.end?hhmm(r.end):"—"}
          <small>${cond.length?"体調メモ: "+[...new Set(cond)].join("・"):"&nbsp;"}</small></div>
        <div class="r ${r.ms==null?"unk":""}">${r.ms==null?"時間不明":dur(r.ms)}</div>
        <button class="editb" onclick="go('edit');editIdx=${o.i};render()">直す</button>
      </div>`;
    }).join("") : '<p class="note">まだ記録はありません。</p>'}
  </div>

  <button class="btn ghost" onclick="addPast()">終わった分をあとから足す</button>
  <button class="btn ghost" onclick="go('home')">戻る</button>

  <div class="hr"></div>
  <div class="sec">データ書き出し</div>
  <textarea readonly onclick="this.select()">${JSON.stringify(DB)}</textarea>
  <p class="note">記録はこの端末のブラウザ内にだけ保存されています。ときどきコピーして保管してください。</p>`;
}

/* --- 1件を直す --- */
function viewEdit(){
  const r=DB.records[editIdx];
  if(!r) return (view="log", viewLog());
  return `
  <h1>記録を直す</h1>
  <p class="sub">押し忘れ・押し間違いはそのまま直してください。<br>終了を空のままにすると「時間不明」になり、<strong>平均からは外れます</strong>。</p>
  <div class="card">
    <label>開始</label>
    <input type="datetime-local" id="e1" value="${toLocalInput(r.start)}">
    <label>終了（空でも構いません）</label>
    <input type="datetime-local" id="e2" value="${r.end?toLocalInput(r.end):""}">
    <button class="btn" onclick="saveEdit()">保存</button>
    <button class="btn link" onclick="delRec()">この記録を消す</button>
  </div>
  <button class="btn ghost" onclick="go('log')">戻る</button>`;
}

/* ===================== 操作 ===================== */
function start(){
  if(DB.active) return render();
  DB.active={start:Date.now(),c1:[]};
  save(); render();
}

function fixStart(){
  const v=prompt("開始時刻を直します。24時間表記で入力してください（例 18:30）。\n今日の時刻として扱います。",hhmm(DB.active.start));
  if(v===null) return;
  const m=/^(\d{1,2})\s*[:：]?\s*(\d{2})$/.exec(v.trim());
  if(!m){ alert("18:30 のような形で入れてください。"); return; }
  const h=+m[1], mi=+m[2];
  if(h>23||mi>59){ alert("18:30 のような形で入れてください。"); return; }
  const d=new Date(); d.setHours(h,mi,0,0);
  let t=d.getTime();
  if(t>Date.now()) t-=24*MS_H;          /* 未来になったら前日として扱う */
  DB.active.start=t; save(); render();
}

function stop(){
  const r=DB.active, now=Date.now();
  DB.records.push({start:r.start,end:now,ms:now-r.start,c1:r.c1||[],c2:endCond});
  DB.active=null; endCond=[]; save();
  view="log"; render();
}

function cancelActive(){
  if(!confirm("この記録を残さずにやめますか？")) return;
  DB.active=null; endCond=[]; save(); view="home"; render();
}

function addPast(){
  const now=Date.now();
  DB.records.push({start:now-12*MS_H,end:now,ms:12*MS_H,c1:[],c2:[]});
  editIdx=DB.records.length-1; save(); go("edit");
}

function saveEdit(){
  const r=DB.records[editIdx];
  const s=fromLocalInput(document.getElementById("e1").value);
  const eV=document.getElementById("e2").value;
  if(isNaN(s)){ alert("開始の日時を入れてください。"); return; }
  r.start=s;
  if(!eV){ r.end=null; r.ms=null; }
  else{
    const e=fromLocalInput(eV);
    if(e<=s){ alert("終了は開始よりあとの日時にしてください。"); return; }
    r.end=e; r.ms=e-s;
  }
  DB.records.sort((a,b)=>a.start-b.start);
  save(); go("log");
}

function delRec(){
  if(!confirm("この記録を消しますか？")) return;
  DB.records.splice(editIdx,1); save(); go("log");
}

/* 進行中は1分ごとに経過を描き直す（秒は出さない。秒まで出すと数字を見張る形になるため） */
setInterval(function(){ if(DB.active && view==="home") render(); },60000);
render();
</script>
</body>
</html>
