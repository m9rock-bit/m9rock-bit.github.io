<title>B.M.C. 筋トレ記録</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#12151c;color:#e8ecf2;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-user-select:none;user-select:none;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 44px}
h1{font-size:19px;margin:4px 0 2px;letter-spacing:.02em}
h2{font-size:15px;margin:0 0 3px}
.sub{color:#8a94a6;font-size:12.5px;margin:0 0 16px;line-height:1.65}
.card{background:#1a1f29;border:1px solid #262d3a;border-radius:14px;padding:15px 16px;margin-bottom:11px}
.sec{font-size:12px;color:#6f7a8c;margin:24px 0 9px;letter-spacing:.06em}
.btn{
  display:block;width:100%;padding:17px;border-radius:12px;border:none;
  background:#e0a86a;color:#20160c;font-size:17px;font-weight:700;
  font-family:inherit;cursor:pointer;margin-top:10px;
}
.btn.ghost{background:#232b38;color:#cbd5e3;font-weight:600;font-size:14px;padding:12px}
.btn.link{background:none;color:#8a94a6;font-size:13px;padding:9px;font-weight:500;text-decoration:underline}
.btn:disabled{opacity:.45}
.row{display:flex;gap:9px}
.row>*{flex:1}

.big{font-size:64px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 2px;letter-spacing:-.03em;line-height:1.1}
.bigsub{text-align:center;color:#8a94a6;font-size:13px;margin-bottom:6px}
/* v6 (2026-09-03): 休憩終わりの視覚の合図。音が鳴らない端末・状況のための保険。
   赤や警告色は使わない（急かす合図にしないため）。 */
.restdone{background:#243024;border-color:#4d6b4f;animation:rdpulse 1.1s ease-in-out 6}
.restdone .big{color:#9ec8a4}
@keyframes rdpulse{0%,100%{background:#243024}50%{background:#33472f}}

.pill{display:inline-block;background:#232b38;border:1px solid #303a4a;border-radius:999px;padding:3px 10px;font-size:12px;color:#cbd5e3;margin-right:6px}
.prev{color:#8a94a6;font-size:13px;margin-top:5px;line-height:1.6}
.prev b{color:#cbd5e3;font-weight:600}

.sets{display:flex;gap:7px;margin-top:11px}
.setb{
  flex:1;background:#232b38;border:1px solid #303a4a;color:#8a94a6;border-radius:10px;
  padding:11px 4px;font-size:12.5px;font-family:inherit;cursor:pointer;text-align:center;line-height:1.5;
}
.setb.done{background:#2a2418;border-color:#5a4526;color:#e8d9bf}
.setb b{display:block;font-size:15px;color:inherit;font-weight:700}

.stepper{display:flex;align-items:center;gap:9px;margin-top:8px}
.stepper button{
  width:46px;height:46px;border-radius:11px;border:1px solid #303a4a;background:#232b38;
  color:#cbd5e3;font-size:21px;font-family:inherit;cursor:pointer;flex:none;
}
.stepper .val{flex:1;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.stepper .val small{display:block;font-size:11px;color:#6f7a8c;margin-top:2px}

.ex{border-top:1px solid #232b38;padding:13px 2px}
.ex:first-of-type{border-top:none}
.ex .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hint{color:#cbd5e3;font-size:12.5px;line-height:1.7;background:#1f1c19;border:1px solid #2f2a24;border-radius:10px;padding:11px 13px;margin-top:11px}
.note{color:#6f7a8c;font-size:12px;line-height:1.75;margin:10px 0 0}
label{display:block;font-size:12.5px;color:#8a94a6;margin:12px 0 5px}
select,input[type=number],input[type=date],input[type=text]{
  width:100%;background:#12151c;border:1px solid #303a4a;color:#e8ecf2;
  border-radius:10px;padding:12px;font-size:15px;font-family:inherit;
}
textarea{width:100%;height:120px;background:#12151c;border:1px solid #303a4a;color:#8a94a6;border-radius:10px;padding:10px;font-size:11px;font-family:ui-monospace,monospace}
.hr{height:1px;background:#232b38;margin:22px 0}
.log{border-top:1px solid #232b38;padding:11px 2px;font-size:13.5px;line-height:1.6}
.log:first-of-type{border-top:none}
.log small{color:#8a94a6;display:block;font-size:12px;margin-top:3px}
/* v2: 経過時間の帯。15分で満たされ、そのあとも色は変えない（超過を赤で見せないため） */
.bar{height:4px;background:#232b38;border-radius:3px;margin:12px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:#7fd1c1;width:0;transition:width .9s linear}

<script>
/* =========================================================================
   B.M.C. 筋トレ記録（gym.html） v2 — 2026-08-09
   （v1: 2026-08-09）

   ■ v2 での変更（Manamiさんのご指示・チャット 2026-08-09）
     > アプリの休憩タイマーが1分に固定になっているが、デフォルト20秒にしてください。
     > また実行するを押してから、そのプログラム全体をどのくらいの時間で実行しているかを
     > 計測するタイマー機能を搭載してください。15分で終われるよう、ダラダラやらないため。

     1. 休憩タイマー 60秒固定 → **既定20秒＋その場で変更可**（REST_DEF / DB.settings.rest）。
        「固定を別の固定に置き換えない」ため、休憩中の画面と種目画面の両方に±ボタンを置き、
        変えた値がそのまま次回の既定になる。休憩中に変えると動いているカウントにも即反映。
     2. **全体経過時間タイマー**を追加（機能5）。「◯◯ を始める」を押した時刻から計測し、
        実施中は常時表示。目安は15分（TARGET_MIN）。所要時間はセッションに記録する。

   ■ 経過時間タイマーで「やらないこと」（fast.html の安全条件と同じ考え方）
     ・最短記録・自己ベスト・連続達成を作らない
     ・15分を超えても **色を変えない・バツを出さない・警告音を鳴らさない**
       （15分は目安であって、達成/未達を判定する基準ではない）
     ・記録一覧を所要時間で並べ替えない。速い回を強調しない
     ・**休憩を削って急ぐ動機を作らない。**帯の下に常時その旨を置く。
       15分をまたいだ瞬間だけ、やわらかい単発音を1回鳴らして終わり（以後は無音）
     ・フォームを崩して急ぐ理由を作らないため、回数が落ちたら
       「休憩を延ばす」提案を出す（dropHint。速さと逆方向へ働く安全弁）

   ■ 出所
     ・種目・重量・回数の初期値は 20_Projects/Private/B.M.C/筋トレプログラム_2026-08-08.md §1
     ・重さの上げ方（ダブル・プログレッション）は同 §2 変更①
     ・v1の機能は4つだけ（同 §2 変更② / ヒアリングQ7でご承認済み）
        1. マシン選択 → 重量・セット記録
        2. 今日どのルーティン（A/B/C）をやるべきかの表示
        3. 前回の重量・回数を表示 → 同じならタップ1回で記録
        4. セット間の休憩タイマー＋終了音
        5. （v2で追加）全体の経過時間タイマー
        6. （v3で追加）セット数を種目ごとに変えられる。既定は3のまま。
           目標を超えたセットも、そのまま記録できる（3で頭打ちにしない）

   ■ この画面が「やらないこと」（fast.html と同じ方針で揃えています）
     ・連続日数・自己ベスト・達成バッジを持たない。streak/best は実装しない
     ・できなかった日を赤やバツで見せない。記録一覧は時系列のみ
     ・8/31までは「重量を上げなくてよい」期間。上げるべきという催促を出さない
       （筋トレプログラム §3。減量中に重量が伸びないのは失敗ではない）

   ■ 8/31までの扱い
     ダブル・プログレッションの判定は内部では常に動かすが、画面に「上げましょう」と
     出すのは 2026-09-01 以降にする（PROG_FROM）。それまでは静かに数えておくだけ。

   ■ v4（2026-08-19、指示_2026-08-19_3・Quick Memoご依頼）: 自宅代替プログラム
     ジムに行けない日用に、環境（🏋️ジム／🏠自宅・ダンベルあり／🏠自宅・器具なし）
     ごとの代替種目を追加。ジム版のプログラムそのものは1文字も変えていない。

     【計画書_2026-07-30「重量は下げない・セット数を増やさない」との関係】
     この方針はジムのプログラム（マシンの重量）に対するもの。自宅代替は
     「同じ種目の重量を下げる」のではなく「別の種目（ダンベル／自重）に
     置き換える」ものなので、方針とは正面から衝突しない。ただし数字を
     混ぜると意味を失う（マシン28kgとダンベル6kgは比べられない）ため、
     セッションに env を持たせ、前回値・ダブルプログレッションの判定は
     必ず同じ env 同士でのみ比較する。総挙上量も env をまたいで合算・
     比較しない（種目が違えば負荷の性質が違うため）。
     催促は出さない（増やす／自宅版に切り替えるべきという案内は一切出さない。
     環境の選択はご本人の任意）。

   ■ v5（2026-08-19、チャットでのご指示）: 自宅の種目をご本人が入力できるようにする
     > 種目を代理でいれているが、種目内容をユーザー自身が入力できるようにしてほしい。
     > また負荷もダンベル以外にバンドを使うこともあるので、そのバンドが
     > Medium/Heavy などマニュアルの負荷がなんだったか入力できるようにしてほしい。

     1. **自宅2環境（home_db / home_none）の種目を、アプリ内で書き換えられる**ようにした。
        書き換えられるのは 種目名 / ひとこと / 負荷の種類 / 目安の負荷 / 目安回数 /
        上限回数 / 1段の刻み。**ジム版（gym）は編集できない**（ご選択どおり。
        計画書_2026-07-30「重量は下げない・セット数を増やさない」を画面上で守るため）。
     2. **負荷の種類に「バンド」を追加**（kg／自重／バンド の3種）。バンドの強さは
        kg のような数値ではないので、**ご本人が言葉を登録**し（既定は Light /
        Medium / Heavy）、記録時はそこから選ぶ。**配列の並び順＝弱い→強い**。
     3. 種目の枠（9種目・A/B/Cの割り当て）は変えていない。種目の追加・削除もしない。

     【上書き防止（memory.md の設計原則に従う）】
     ・ご本人の編集内容は DB.settings.alt[env][id] に**別建て**で持つ。
       コード側の既定値（ALT）は、ご本人が編集していない種目にだけ効く。
       → 今後この HTML を差し替えても、編集した種目は上書きされない。
     ・過去の記録（sets）は1文字も書き換えない。新しく記録する行にだけ
       ld（負荷の種類）・bd（バンドの言葉）が入る。古い行は従来どおり
       「その種目のいまの種類」として読む＝v4以前の記録もそのまま出る。
     ・バンドの言葉を後から改名しても、過去の記録は**押した当時の言葉のまま**残る
       （記録は事実なので、あとから書き換えない）。
   ========================================================================= */

const KEY="bmc_gym_v1";
const PROG_FROM=new Date(2026,8,1).getTime();   /* 2026-09-01 から重量アップの案内を出す */

/* ---------- プログラム定義（筋トレプログラム_2026-08-08 §1・§2） ---------- */
const PROGRAM=[
  {id:"tri", name:"トライセッププッシュダウン", r:"A", w:6.5,  reps:15, cap:18, step:1.0,  unit:"kg"},
  {id:"bul", name:"ブルガリアンスクワット",     r:"A", w:12,   reps:10, cap:13, step:2.0,  unit:"kg", memo:"片足ずつ"},
  {id:"lat", name:"ラットプルダウン",           r:"B", w:28,   reps:12, cap:15, step:2.5,  unit:"kg"},
  {id:"add", name:"ヒップアダクション",         r:"B", w:29,   reps:8,  cap:12, step:2.5,  unit:"kg",
   memo:"9月に上げるときはこの種目だけ急がない（12回まで伸びてから）"},
  {id:"abd", name:"ヒップアブダクション",       r:"B", w:36,   reps:12, cap:15, step:2.5,  unit:"kg"},
  {id:"crm", name:"クランチ（マシン）",         r:"B", w:18,   reps:10, cap:14, step:2.5,  unit:"kg"},
  {id:"che", name:"チェストプレス（マシン）",   r:"C", w:17.5, reps:8,  cap:12, step:2.5,  unit:"kg"},
  {id:"rdl", name:"ルーマニアンデッドリフト",   r:"C", w:24,   reps:12, cap:15, step:2.5,  unit:"kg"},
  {id:"bic", name:"バイシクルクランチ",         r:"C", w:0,    reps:15, cap:20, step:0,    unit:"自重"}
];

/* ---------- v4（2026-08-19）: 環境ごとの代替種目 ----------
   ジムに行けない日の代替。id は PROGRAM と共通（同じ種目枠の中身が入れ替わるだけ）。
   ALT[id][env] が無ければ、その種目はどの環境でも同じ（例: bic は元々自重）。
   数値（w/reps/cap/step/unit）は初回の目安。実測ではないため軽めに置いてある。 */
const ENVS = [
  {id:"gym",       label:"🏋️ ジム"},
  {id:"home_db",   label:"🏠 自宅（ダンベルあり）"},
  {id:"home_none", label:"🏠 自宅（器具なし）"}
];
const ALT = {
  tri:{
    home_db:  {name:"ダンベルトライセップエクステンション（片手ずつ）", w:3,  reps:12, cap:16, step:0.5, unit:"kg", memo:"肘を高く固定し、前腕だけを動かします"},
    home_none:{name:"ナロープッシュアップ（膝つき可）",                 w:0,  reps:10, cap:15, step:0,   unit:"自重", memo:"手は肩幅より少し狭く。きつい場合は膝をついて構いません"}
  },
  bul:{
    home_db:  {name:"ブルガリアンスクワット（ダンベル持ち）", w:8, reps:10, cap:13, step:1.0, unit:"kg", memo:"後ろ足を椅子やソファに乗せます。片足ずつ"},
    home_none:{name:"ブルガリアンスクワット（自重）",         w:0, reps:12, cap:20, step:0,   unit:"自重", memo:"後ろ足を椅子やソファに乗せます。きつければ浅めの可動域から"}
  },
  lat:{
    home_db:  {name:"ダンベルベントオーバーロウ（両手）", w:6, reps:12, cap:15, step:1.0, unit:"kg", memo:"背中を丸めず、肘を後ろに引きます"},
    home_none:{name:"タオルプルダウン／ドア枠での逆手懸垂",   w:0, reps:12, cap:15, step:0,   unit:"自重", memo:"タオルを頭上で両手に持ち、引き下げる動きで背中に効かせます"}
  },
  add:{
    home_db:  {name:"サイドライイング内転筋レイズ", w:0, reps:12, cap:18, step:0, unit:"自重", memo:"横向きに寝て下の脚をまっすぐ持ち上げます。重ければ足首に軽いダンベルを"},
    home_none:{name:"サイドライイング内転筋レイズ", w:0, reps:12, cap:18, step:0, unit:"自重", memo:"横向きに寝て下の脚をまっすぐ持ち上げます"}
  },
  abd:{
    home_db:  {name:"サイドライイング脚上げ（外転）", w:0, reps:15, cap:20, step:0, unit:"自重", memo:"横向きに寝て上の脚を天井方向に。重ければ足首に軽いダンベルを"},
    home_none:{name:"サイドライイング脚上げ（外転）", w:0, reps:15, cap:20, step:0, unit:"自重", memo:"横向きに寝て上の脚を天井方向に持ち上げます"}
  },
  crm:{
    home_db:  {name:"ダンベルクランチ（胸の前で保持）", w:3, reps:12, cap:16, step:0.5, unit:"kg", memo:"腰を反らさないよう注意します"},
    home_none:{name:"クランチ（自重）",                 w:0, reps:15, cap:20, step:0,   unit:"自重", memo:"腰を反らさないよう注意します"}
  },
  che:{
    home_db:  {name:"ダンベルチェストプレス（床・フロアプレス）", w:6, reps:10, cap:14, step:1.0, unit:"kg", memo:"床に仰向けになり、肘は床につくところで止めます"},
    home_none:{name:"プッシュアップ（膝つき可）",               w:0, reps:10, cap:15, step:0,   unit:"自重", memo:"きつい場合は膝をついて構いません"}
  },
  rdl:{
    home_db:  {name:"ダンベルルーマニアンデッドリフト", w:8, reps:12, cap:15, step:1.0, unit:"kg", memo:"膝は軽く曲げたまま、股関節を折りたたむように下ろします"},
    home_none:{name:"片脚デッドリフト（自重）",         w:0, reps:10, cap:14, step:0,   unit:"自重", memo:"バランスが難しければ壁や椅子に軽く触れて構いません。片足ずつ"}
  }
  /* bic は自重種目のため ALT を持たない（どの環境でも同じ＝PROGRAM の値をそのまま使う） */
};
/* ---------- v5（2026-08-19）: 負荷の種類 ----------
   kg（マシン・ダンベル）／ bw（自重）／ band（ゴムバンド）の3種。
   バンドは kg のような連続した数値ではないため、**言葉（Light/Medium/Heavy 等）**で持つ。
   古い定義には load が無いので、unit から読み替える（冪等・過去データを書き換えない）。 */
const LOADS=[{id:"kg",label:"重さ（kg）"},{id:"bw",label:"自重"},{id:"band",label:"バンド"}];
const BANDS_DEF=["Light","Medium","Heavy"];
function loadOf(e){ return e && e.load ? e.load : ((e && e.unit==="自重") ? "bw" : "kg"); }
function bands(){ return DB.settings.bands; }
function unitOf(ld){ return ld==="bw" ? "自重" : (ld==="band" ? "バンド" : "kg"); }

/* env の種目定義を返す。gym、またはALTが無い種目は PROGRAM の値そのまま。
   r（ルーティンA/B/C区分）と id は常にベース（PROGRAM）から引き継ぐ。
   v5: 最後に **ご本人の編集（DB.settings.alt[env][id]）** を重ねる。
   重ねる順は PROGRAM → ALT（コードの既定） → ご本人の編集。
   ジム（gym）はご本人の編集を受け付けない（編集画面から辿れないだけでなく、ここでも通さない）。 */
function userAlt(id, env){
  const m = DB.settings.alt[env];
  return (m && m[id]) ? m[id] : null;
}
function def(id, env){
  const base = ex(id); if(!base) return null;
  if(!env || env==="gym") return base;
  let e = base;
  if(ALT[id] && ALT[id][env]) e = Object.assign({}, e, ALT[id][env]);
  const u = userAlt(id, env);
  if(u) e = Object.assign({}, e, u);
  return e;
}
function isEditableEnv(env){ return env==="home_db" || env==="home_none"; }
function curEnv(){ return DB.settings.env || "gym"; }
function envLabel(env){ const e=ENVS.filter(function(x){return x.id===env})[0]; return e?e.label:env; }

/* ---------- v3（2026-08-16）: セット数を種目ごとに可変にする ----------
   【なぜ】3固定だったため、4セット目をやった日に、その事実を入れる場所が無かった。
   これは「器の制約」であって、プログラムとしてセット数を増やす話ではない。
   （指示_2026-08-16_1 §3 / 計画書_2026-07-30「〜8/31は重量を下げない・セット数を増やさない」）
   【線引き】
     ・既定は3のまま。変えられるのは **種目ごと**（全体を一律4や5にしない）
     ・「増やしましょう」という案内・催促は一切出さない。静かに数えるだけ。
       促す作りにするのは 9/1 以降（PROG_FROM と同じ扱い）
     ・過去の記録は1セット＝1行で入っているので、書き換えは一切しない
     ・総挙上量（重量×レップ×セットの合計）は行ごとの合計なので、式は変わらない  */
const SETS_DEF=3;                 /* 既定のセット数（従来の固定値と同じ） */
const SETS_MIN=1, SETS_MAX=8;     /* MAX は押しっぱなしの暴発を止めるためだけの天井 */
const ROUTINES=["A","B","C"];

/* ---------- v2: 休憩の長さ（既定値・その場で変更可） ----------
   「1分固定 → 既定20秒」。**固定を別の固定に置き換えない**のが要点なので、
   値は設定として持ち、休憩中の画面からも種目画面からもその場で動かせるようにする。
   変えた値はそのまま次回以降の既定になる（設定画面を探しに行かなくてよい）。      */
const REST_DEF=20, REST_MIN=10, REST_MAX=180, REST_STEP=10;

/* ---------- v2: 全体経過時間の目安 ----------
   15分は「ダラダラやらないための目安」であって、達成/未達を判定する基準ではない。
   超えても失敗ではないので、赤・バツ・警告音・記録への○×は一切作らない。       */
const TARGET_MIN=15;

/* ---------- 保存 ---------- */
let DB={sessions:[],active:null,settings:{}};
try{const r=localStorage.getItem(KEY); if(r) DB=JSON.parse(r);}catch(e){}
if(!DB.sessions) DB.sessions=[];
if(DB.active===undefined) DB.active=null;
if(!DB.settings) DB.settings={};
if(typeof DB.settings.rest!=="number") DB.settings.rest=REST_DEF;
/* v3: 種目ごとのセット数。既定（3）の種目はキーを持たない＝古い控えを貼り戻しても壊れない。
   この初期化は何度走らせても同じ結果になる（冪等）。 */
if(!DB.settings.sets || typeof DB.settings.sets!=="object") DB.settings.sets={};
/* v4: 選んでいる環境。既定はジム（従来どおり）。 */
if(!ENVS.some(function(x){return x.id===DB.settings.env})) DB.settings.env="gym";
/* v5: ご本人が書き換えた種目（環境ごと）。空なら従来どおりコード側の既定が出る。
   何度走らせても同じ結果になる（冪等）。古い控えを貼り戻しても壊れない。 */
if(!DB.settings.alt || typeof DB.settings.alt!=="object") DB.settings.alt={};
/* v5: バンドの言葉。**並び順が弱い→強い**を表す（この配列そのものが強さの順序）。 */
if(!Array.isArray(DB.settings.bands) || !DB.settings.bands.length) DB.settings.bands=BANDS_DEF.slice();
function restSec(){ return DB.settings.rest; }
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); }
  catch(e){ alert("端末に保存できませんでした。下の書き出し欄からコピーして保管してください。"); }
}

/* ---------- ユーティリティ ---------- */
function ex(id){ return PROGRAM.filter(function(e){return e.id===id})[0]; }
/* v3: この種目の目標セット数。設定が無ければ既定の3。 */
function setsOf(id){
  const n=DB.settings.sets[id];
  return (typeof n==="number" && n>=SETS_MIN && n<=SETS_MAX) ? n : SETS_DEF;
}
function bumpSets(id,d){
  const v=Math.min(SETS_MAX,Math.max(SETS_MIN,setsOf(id)+d));
  if(v===SETS_DEF) delete DB.settings.sets[id]; else DB.settings.sets[id]=v;
  save(); render();
}
function exOf(r){ return PROGRAM.filter(function(e){return e.r===r}); }
function ymd(ms){ const d=new Date(ms); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function mdw(ms){ const d=new Date(ms),w="日月火水木金土"[d.getDay()]; return (d.getMonth()+1)+"/"+d.getDate()+"("+w+")"; }
/* v5: 負荷の表示。kg / 自重 / バンド の3種に対応。
   bd（バンドの言葉）は band のときだけ見る。 */
function fmtW(e,w,bd){
  const ld=loadOf(e);
  if(ld==="bw")   return "自重";
  if(ld==="band") return "バンド "+(bd || e.band || bands()[0] || "—");
  return (Math.round(w*100)/100)+"kg";
}
/* 記録済みの1セットの表示。**その行に ld が入っていればそれを優先**する
   （あとから種目の負荷の種類を変えても、過去の記録は当時のまま出る）。 */
function fmtSet(e,s){
  const ld = s.ld || loadOf(e);
  if(ld==="bw")   return "自重";
  if(ld==="band") return "バンド "+(s.bd || "—");
  return (Math.round((s.w||0)*100)/100)+"kg";
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* 完了したセッションのみ（記録として確定したもの） */
function done(){ return DB.sessions.filter(function(s){return s.sets && s.sets.length}); }

/* --- 機能2: 今日どれをやるべきか ---
   直前にやったルーティンの次を出す。A→B→C→A。まだ記録がなければ A。
   ※「◯日空いた」といった催促は出さない。 */
function suggestRoutine(){
  const d=done();
  if(!d.length) return "A";
  const last=d[d.length-1].routine;
  const i=ROUTINES.indexOf(last);
  return ROUTINES[(i+1)%ROUTINES.length];
}

/* --- 機能3: 前回の重量・回数 ---
   v4: env を指定すると、その環境の記録だけを見る（ジムとダンベルの重さを混ぜない）。
   env未指定時は従来どおり（後方互換・呼び出し側で必ずenvを渡す運用にしている）。
   過去のセッション（v3以前）に env が無いものは "gym" として扱う。 */
function lastOf(id, env){
  const d=done();
  for(let i=d.length-1;i>=0;i--){
    if(env && (d[i].env||"gym")!==env) continue;
    const hit=d[i].sets.filter(function(s){return s.id===id});
    /* v5: ld（負荷の種類）・bd（バンドの言葉）も一緒に返す。古い記録には無いので undefined。 */
    if(hit.length){
      const last=hit[hit.length-1];
      return {w:last.w, bd:last.bd, ld:last.ld,
              reps:Math.min.apply(null,hit.map(function(s){return s.reps})),
              date:d[i].date, n:hit.length};
    }
  }
  return null;
}

/* --- ダブル・プログレッション（筋トレプログラム §2 変更①）---
   「決めた回数を3セットとも余裕をもってできた日が2回続いたら、次から1段上げる」
   ここでは「3セットすべてがレンジ上限(cap)に達した日」を1回と数え、
   同じ重量で2日続いたら案内を出す。9/1より前は数えるだけで表示しない。 */
/* v4: env指定でその環境のセッションだけを見る。cap/stepは def(id,env) の値を使う
   （自宅版は目安の数値が違うため、ジムのcapで自宅版を判定しない）。 */
/* v5: バンドにも対応。バンドは数値で足せないので、**登録した言葉の並び（弱い→強い）の
   1つ隣**を次の候補にする。いちばん強いバンドに達していたら、案内は出さない
   （持っていないバンドを買うよう促さないため）。自重（bw）は対象外。 */
function progressReady(id, env){
  const e=def(id,env); if(!e) return null;
  const ld=loadOf(e);
  if(ld==="bw") return null;
  if(ld==="kg" && !e.step) return null;
  const d=done(); let hits=0, key=null;
  for(let i=d.length-1;i>=0;i--){
    if(env && (d[i].env||"gym")!==env) continue;
    const s=d[i].sets.filter(function(x){return x.id===id});
    if(!s.length) continue;
    /* v3: 「3セットとも」ではなく「いま設定している目標セット数ぶんとも」で判定する。
       セット数を減らして条件を満たしやすくしない・増やして厳しくしすぎない、という意図。 */
    const allCap = s.length>=setsOf(id) && s.every(function(x){return x.reps>=e.cap});
    const k    = (ld==="band") ? (s[0].bd||"") : s[0].w;
    const same = (key===null) || (k===key);
    if(allCap && same){
      key=k; hits++;
      if(hits>=2){
        if(ld==="band"){
          const bi=bands().indexOf(key);
          if(bi<0 || bi>=bands().length-1) return null;
          return {band:key, nextBand:bands()[bi+1]};
        }
        return {w:key, next:Math.round((key+e.step)*100)/100};
      }
    }
    else break;
  }
  return null;
}
function showProgress(){ return Date.now()>=PROG_FROM; }

/* ---------- 音 ----------
   v6 (2026-09-03): 「セット実施中、休憩終わりの音が鳴らない（Spotify再生中）」への対応。
   ------------------------------------------------------------------
   現物を読んで分かった原因（推測ではなく、コードの形として確かなもの）:
   AudioContext を beep() の中で初めて作っており、その beep() を呼ぶのは
   休憩タイマーの setInterval（＝操作ではない）だった。iOSでは操作の外で
   作った AudioContext は suspended のまま始まり、resume() を呼ばない限り
   永久に無音になる。routine.html には unlockAudio()（操作の中で無音の1音を
   鳴らして開通させる）と beep() 内の resume() が入っているが、gym.html には
   どちらも入っていなかった。その差がそのまま出ている。

   ★Spotify再生中かどうかとは別の話である可能性が高い。ただし、
     「他アプリが音声セッションを握っているときiOSが鳴らさない」場合は
     Web側では直せない。そのため下の視覚の合図を保険として必ず併設する。
     （実機で鳴るかどうかは、こちらでは判定できない。） */
let ac=null;
/* 操作の中で呼ぶ。ほぼ無音の1音を鳴らして再生を許可させる。 */
function unlockAudio(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended" && ac.resume) ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.0001,ac.currentTime);
    o.start();o.stop(ac.currentTime+.03);
  }catch(e){}
}
function beep(f,d){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended" && ac.resume) ac.resume();   /* v6: これが無かった */
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.18,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
    o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
/* 休憩終わりの合図。stretch.html v4 と同じ上昇3音（設定に関係なく鳴る） */
function chimeDone(){
  [[784,.22,0],[988,.22,240],[1319,.55,480]].forEach(function(s){
    setTimeout(function(){ beep(s[0],s[1]); }, s[2]);
  });
}

/* 15分の目安に達したときの合図。休憩終わりの3音とは別物と分かるよう、
   単発のやわらかい1音にする。急かす音にしない（警告音にしない）。 */
function chimeMark(){ beep(587,.5); }

/* ---------- 休憩タイマー（機能4／v2で既定20秒・その場で変更可） ---------- */
let restEnd=0, restTimer=null;
/* v6 (2026-09-03): 音が鳴らない環境でも休憩の終わりが分かるようにする。
   音は「鳴れば助かる」もので、頼り切らない。終わった時刻を持っておき、
   次に何か操作するまで画面に大きく出し続ける（消えると気づけないため）。
   ★これは達成・未達の表示ではない。ただの合図なので、遅れても何も減らない。 */
let restDoneAt=0;
function restJustEnded(){ return restDoneAt>0; }
function clearRestDone(){ restDoneAt=0; }
function startRest(){
  restEnd=Date.now()+restSec()*1000;
  restDoneAt=0;                    /* 新しい休憩に入ったら前回の合図は消す */
  unlockAudio();                   /* v6: 記録ボタン（＝操作）の流れの中で音を開通させる */
  if(restTimer) clearInterval(restTimer);
  restTimer=setInterval(function(){
    if(Date.now()>=restEnd){
      clearInterval(restTimer); restTimer=null; restEnd=0;
      restDoneAt=Date.now();       /* v6: 音が鳴らなくても残る印 */
      chimeDone();
    }
    if(isTyping()) return;   /* v5: 入力中の画面は描き直さない */
    render();
  },1000);
  render();
}
function stopRest(){ if(restTimer) clearInterval(restTimer); restTimer=null; restEnd=0; restDoneAt=0; render(); }
function restLeft(){ return restEnd ? Math.max(0,Math.ceil((restEnd-Date.now())/1000)) : 0; }

/* 休憩の長さを変える。休憩中なら、いま動いているカウントダウンにも即反映する。
   変えた値は次回からの既定になる。 */
function bumpRest(d){
  const before=DB.settings.rest;
  /* 10秒刻みにそろえる。20→30→40… と切りのよい値だけを通す
     （ジムで片手で押すので、25秒・35秒のような半端な値に落ちないようにする） */
  let v=Math.round((before+d*REST_STEP)/REST_STEP)*REST_STEP;
  DB.settings.rest=Math.min(REST_MAX,Math.max(REST_MIN,v));
  save();
  if(restEnd) restEnd += (DB.settings.rest-before)*1000;
  if(restEnd && restEnd<=Date.now()) stopRest(); else render();
}

/* ---------- v2: 全体の経過時間（機能5） ----------
   startSession() で押した時刻からの経過。目的は「15分で終われるよう、ダラダラやらないため」。
   ・所要時間は記録として残すが、速さの順位づけ・最短の表示・連続達成は作らない
   ・15分を超えても色を変えない／記号を出さない／音で急かさない
   ・休憩を削って急ぐ動機を作らない（下の注記を画面に常時置く）               */
function elapsedSec(){ return DB.active ? Math.floor((Date.now()-DB.active.date)/1000) : 0; }
function mmss(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

let sessionTimer=null;
function startSessionClock(){
  if(sessionTimer) clearInterval(sessionTimer);
  sessionTimer=setInterval(function(){
    /* 15分をまたいだ瞬間に1回だけ、やわらかい合図を鳴らす。以後は鳴らさない。 */
    if(DB.active && !DB.active.marked && elapsedSec()>=TARGET_MIN*60){
      DB.active.marked=true; save(); chimeMark();
    }
    if(isTyping()) return;   /* v5: 入力中の画面は描き直さない（打った文字が消えるため） */
    render();
  },1000);
}
function stopSessionClock(){ if(sessionTimer) clearInterval(sessionTimer); sessionTimer=null; }

/* 経過時間の帯。15分で満たされ、そのあとは満たされたまま。色は変えない。 */
function clockCard(){
  const s=elapsedSec(), pct=Math.min(100, s/(TARGET_MIN*60)*100);
  return `<div class="card">
    <div class="big" style="font-size:40px;margin:0">${mmss(s)}</div>
    <div class="bigsub">開始からの経過 ／ 目安 ${TARGET_MIN}分</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p class="note">${s>=TARGET_MIN*60
      ? `${TARGET_MIN}分の目安を過ぎました。<strong>残りはご自分のペースで大丈夫です。</strong>`
      : `ダラダラ長くならないための目安です。`}
    <br><strong>休憩を削って急ぐ必要はありません。</strong>${TARGET_MIN}分は達成・未達を測る基準ではありません。</p>
  </div>`;
}

/* 休憩の長さを変えるUI（休憩中でなくても出す） */
function restStepper(){
  return `<label>セット間の休憩</label>
  <div class="stepper">
    <button onclick="bumpRest(-1)">−</button>
    <div class="val">${restSec()}秒<small>ここで変えると次回からもこの長さです</small></div>
    <button onclick="bumpRest(1)">＋</button>
  </div>`;
}

/* ---------- v2: 休憩が短すぎたときの受け皿 ----------
   【なぜ要るか】筋トレプログラム_2026-08-08 の目的は 8/31まで「いまの筋肉を減らさない」。
   維持に効くのは重さ（強度）で、休憩が短いと2・3セット目の重さ・回数が落ちやすい。
   既定20秒はご指示どおり必ず入れたうえで、落ちたときだけ「休憩を延ばす」選択肢を
   その場で出して吸収する。
   【言い方の条件】回数が落ちたことを本人の失敗として書かない。原因を休憩の長さの側に置き、
   タップ1つで直せる形にする。赤・バツ・「失敗」は使わない。無視しても何も起きない。   */
function dropHint(id){
  const s=DB.active; if(!s) return "";
  const mine=s.sets.filter(function(x){return x.id===id});
  if(mine.length<2) return "";
  const dropped = mine.some(function(x,i){ return i>0 && x.reps < mine[0].reps; });
  if(!dropped || restSec()>=60) return "";
  return `<div class="hint">
    2セット目以降の回数が1セット目より下がりました。<strong>休憩が短いときによく起きます。</strong>
    重さを保てるほうが「いまの筋肉を減らさない」という8月の目的には効きます。
    <br><button class="btn ghost" style="margin-top:9px" onclick="bumpRest(1)">休憩を ${restSec()+REST_STEP}秒 にする</button>
    <span class="note">このままでも構いません。次のセットから戻ることもあります。</span>
  </div>`;
}

/* ===================== 画面 ===================== */
let view="home", curId=null, tmpW=null, tmpR=null, tmpB=null;
function go(v){ view=v; render(); }
/* v5: 文字を打ち込む画面では、1秒ごとの自動再描画を止める（打っている途中で消えないように）。
   経過時間そのものは Date.now() から計算しているので、戻れば正しい値に追いつく。 */
function isTyping(){ return view==="backup" || view==="edlist" || view==="edex" || view==="bands"; }

/* ===== バックアップ（書き出し・読み込み）　2026-08-15追加 =====================
   記録はこの端末のブラウザの中だけにあります。ここのテキストを控えておけば、
   機種変更・データ削除のあとでも、貼り戻すだけで元に戻ります。
   ★保存の引き出しの名前（KEY）は絶対に変えないでください。変えると過去が見えなくなります。
   ★読み込みは localStorage に直接書いてから再読み込みするだけ。
     アプリ側の既定データと混ぜないこと（混ぜると編集済みの内容が上書きされます）。 */
var bkArmed=false, bkMsg="", bkIn="";
function bkEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function bkGrab(){ var e=document.getElementById("bk_in"); if(e) bkIn=e.value; }
function bkGo(){ bkArmed=false; bkMsg=""; bkIn=""; go("backup"); }
function bkDump(){
  var d=null;
  try{ d=localStorage.getItem(KEY); }catch(e){}
  if(!d){ try{ d=JSON.stringify(DB); }catch(e2){ d=""; } }
  return d||"";
}
function bkCopy(){
  bkGrab();
  var t=document.getElementById("bk_out"); if(!t) return;
  var ok=false;
  try{ t.focus(); t.select(); t.setSelectionRange(0,999999); ok=document.execCommand("copy"); }catch(e){}
  var yes="コピーしました。Obsidianなどに貼って、控えを残しておいてください。";
  var no ="コピーできませんでした。枠の中を長押し →「すべてを選択」→「コピー」でも同じことができます。";
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(
      function(){ bkArmed=false; bkMsg=yes; render(); },
      function(){ bkArmed=false; bkMsg=no;  render(); });
    return;
  }
  bkArmed=false; bkMsg = ok?yes:no; render();
}
function bkRestore(){
  bkGrab();
  var o=null;
  try{ o=JSON.parse(bkIn); }catch(e){}
  if(!bkValid(o)){
    bkArmed=false;
    bkMsg="読み取れませんでした。書き出したテキストを、途中で切らずにそのまま貼り付けてください。（いまの記録は何も変わっていません）";
    render(); return;
  }

}

/* ===== v5: 種目を自分で入力する画面 ==========================================
   【線引き】編集できるのは自宅2環境だけ。ジム版は読むだけ（isEditableEnv）。

     ・催促は出さない。空欄のまま保存しようとしたときだけ、そっと止める             */
var edEnv="home_db", edId=null, edBuf=null, edMsg="";

/* 入力欄の値をいったん手元に控える。押した拍子に打ちかけの文字が消えないように、
   ボタンを押す処理の先頭で必ず呼ぶ（backup画面の bkGrab と同じ考え方）。 */
function edGrab(){
  if(!edBuf) return;
  ["name","memo","w","band","reps","cap","step"].forEach(function(k){
    const el=document.getElementById("ed_"+k);
    if(el) edBuf[k]= (k==="name"||k==="memo"||k==="band") ? el.value : el.value;
  });
}
function edList(env){
  edEnv = env || curEnv();
  if(!isEditableEnv(edEnv)) edEnv="home_db";
  edId=null; edBuf=null; edMsg=""; edResetArmed=false; go("edlist");
}
function edOpen(id){
  const e=def(id,edEnv);
  edBuf={
    name: e.name,
    memo: e.memo||"",
    load: loadOf(e),
    w:    (e.w==null?0:e.w),
    band: e.band || bands()[0] || "",
    reps: e.reps, cap: e.cap, step: (e.step==null?0:e.step)
  };
  edId=id; edMsg=""; edResetArmed=false; go("edex");
}
function edSetLoad(ld){ edGrab(); edBuf.load=ld; render(); }
function edSave(){
  edGrab();
  const nm=String(edBuf.name||"").trim();
  if(!nm){ edMsg="種目名が空です。何をやるのか、ひとことで入れてください。"; return render(); }
  const num=function(v,fb){ const n=parseFloat(v); return isFinite(n)?n:fb; };
  const ld=edBuf.load;
  const o={
    name: nm,
    memo: String(edBuf.memo||"").trim(),
    load: ld,
    unit: unitOf(ld),
    w:    ld==="kg" ? Math.max(0,num(edBuf.w,0)) : 0,
    reps: Math.max(1,Math.round(num(edBuf.reps,10))),
    cap:  Math.max(1,Math.round(num(edBuf.cap,15))),
    step: ld==="kg" ? Math.max(0,num(edBuf.step,0)) : 0
  };
  if(o.cap<o.reps) o.cap=o.reps;                 /* 上限が目安を下回らないようにするだけ */
  if(ld==="band") o.band = String(edBuf.band||bands()[0]||"");
  if(!DB.settings.alt[edEnv]) DB.settings.alt[edEnv]={};
  DB.settings.alt[edEnv][edId]=o;
  save(); edId=null; edBuf=null; edMsg="保存しました。"; go("edlist");
}
var edResetArmed=false;
function edReset(){
  if(!edResetArmed){ edResetArmed=true; edMsg=""; return render(); }
  edResetArmed=false;
  if(DB.settings.alt[edEnv]) delete DB.settings.alt[edEnv][edId];
  save(); edId=null; edBuf=null; edMsg="最初の内容に戻しました。（記録は何も変わっていません）"; go("edlist");
}

   並び順そのものが「弱い→強い」。強さの数値は持たない（メーカーによって違うため、

var bnMsg="";
function bnGrab(){
  const out=[];
  for(let i=0;i<bands().length;i++){
    const el=document.getElementById("bn_"+i);
    out.push(el ? el.value : bands()[i]);
  }
  DB.settings.bands=out;
}
function bnSave(){
  bnGrab();
  const clean=DB.settings.bands.map(function(s){return String(s||"").trim()}).filter(function(s){return s.length});
  if(!clean.length){ DB.settings.bands=BANDS_DEF.slice(); bnMsg="すべて空欄だったので、最初の3つに戻しました。"; }
  else { DB.settings.bands=clean; bnMsg="保存しました。"; }
  save(); render();
}
function bnAdd(){ bnGrab(); DB.settings.bands.push(""); bnMsg=""; save(); render(); }
function bnDel(i){ bnGrab(); DB.settings.bands.splice(i,1); if(!DB.settings.bands.length) DB.settings.bands=BANDS_DEF.slice(); bnMsg=""; save(); render(); }
function bnMove(i,d){
  bnGrab();
  const a=DB.settings.bands, j=i+d;
  if(j<0||j>=a.length) return;
  const t=a[i]; a[i]=a[j]; a[j]=t; bnMsg=""; save(); render();
}

}

/* --- 種目ごとの記録画面 --- */
function viewEx(){
  const s=DB.active, env=s.env||"gym";
  const e=def(curId,env);
  const mine=s.sets.filter(function(x){return x.id===curId});
  const l=lastOf(curId,env);
  const ld=loadOf(e);
  /* v5: 前回値を引き継ぐのは「前回と負荷の種類が同じとき」だけ。
     途中で種類を変えた種目に、別の種類の数字を持ち込まないため。 */
  const sameKind = l ? ((l.ld||ld)===ld) : false;
  if(tmpW===null) tmpW = sameKind ? l.w : e.w;
  if(tmpR===null) tmpR = l ? l.reps : e.reps;
  if(tmpB===null) tmpB = (sameKind && l.bd) ? l.bd : (e.band || bands()[0] || "");

  const pg=progressReady(curId,env);
  const left=restLeft();

  return `
  <h1>${esc(e.name)}</h1>
  <p class="sub">${envLabel(env)}
  ${l ? `<br>前回 <strong>${fmtSet(e,l)} × ${l.reps}回 × ${l.n}セット</strong>（${mdw(l.date)}）`
      : `<br>はじめての記録です（この環境では）。目安は ${fmtW(e,e.w)} × ${e.reps}回。`}
  ${e.memo?`<br>${esc(e.memo)}`:""}</p>

  <div class="card" style="padding-bottom:6px">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="sec" style="margin:0">開始からの経過</span>
      <strong style="font-size:18px;font-variant-numeric:tabular-nums">${mmss(elapsedSec())}</strong>
    </div>
    <div class="bar"><i style="width:${Math.min(100,elapsedSec()/(TARGET_MIN*60)*100)}%"></i></div>
    <p class="note" style="margin-top:6px">目安 ${TARGET_MIN}分。<strong>超えても構いません。休憩を削って急がないでください。</strong></p>
  </div>

  ${left ? `<div class="card">
    <div class="big">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</div>
    <div class="bigsub">休憩</div>
    ${restStepper()}
    <button class="btn ghost" onclick="stopRest()">休憩を切り上げる</button>
  </div>`
  /* v6 (2026-09-03): 音が鳴らなかったときのための、目で分かる合図。
     押すまで消えない（音と違って、あとからでも気づける）。 */
  : restJustEnded() ? `<div class="card restdone">
    <div class="big">0:00</div>
    <div class="bigsub">休憩おわり</div>
    <p class="note" style="text-align:center;margin:2px 0 9px">音が鳴らない状態でも分かるように、この表示は押すまで消えません。<br><strong>急ぐ必要はありません。</strong>整ってから次のセットへ。</p>
    <button class="btn ghost" onclick="clearRestDone();render()">確認しました</button>
    ${restStepper()}
  </div>`
  : `<div class="card">${restStepper()}</div>`}

  ${dropHint(curId)}

  <div class="card">
    <div class="sets" style="flex-wrap:wrap">
      ${(function(){
        /* v3: 枠の数は「目標セット数」と「実際に入れた数」の多いほう。
           目標を超えて入れた分も、そのまま枠として出す（入らない・見えないを作らない）。 */
        const tgt=setsOf(curId), rows=Math.max(tgt,mine.length), out=[];
        for(let i=0;i<rows;i++){
          const d=mine[i];
          out.push(`<div class="setb${d?" done":""}" style="min-width:88px">${i+1}セット目<b>${d?fmtSet(e,d)+" × "+d.reps:"—"}</b></div>`);
        }
        return out.join("");
      })()}
    </div>

    <button class="btn" onclick="quickAdd()" ${mine.length>=SETS_MAX?"disabled":""}>
      ${mine.length>=SETS_MAX ? `${SETS_MAX}セット入っています`
        : mine.length>=setsOf(curId) ? `もう1セット記録する（${fmtW(e,tmpW,tmpB)} × ${tmpR}回）`
        : `${fmtW(e,tmpW,tmpB)} × ${tmpR}回 で記録`}
    </button>
    <p class="note">前回と同じならこのままタップ1回で記録できます。変えたいときだけ下で直してください。<br><strong>${setsOf(curId)}セットを終えたあとも、そのまま押せば記録できます。</strong></p>

    ${ld==="kg" ? `
    <label>重さ</label>
    <div class="stepper">
      <button onclick="bumpW(-1)">−</button>
      <div class="val">${fmtW(e,tmpW)}<small>1段 ${e.step}kg</small></div>
      <button onclick="bumpW(1)">＋</button>
    </div>` : ""}

    ${ld==="band" ? `
    <label>今日使ったバンド</label>
    <div class="stepper">
      <button onclick="bumpB(-1)">−</button>
      <div class="val">${esc(tmpB||"—")}<small>${(function(){
        const i=bands().indexOf(tmpB);
        return i<0 ? "登録にない呼び名です（そのまま記録できます）"
                   : "登録した"+bands().length+"本のうち "+(i+1)+"本目（弱い順）";
      })()}</small></div>
      <button onclick="bumpB(1)">＋</button>
    </div>
    <p class="note">その日に実際に使ったバンドを選んでください。<strong>選んだ言葉がそのまま記録に残ります。</strong></p>` : ""}

    <label>回数</label>
    <div class="stepper">
      <button onclick="bumpR(-1)">−</button>
      <div class="val">${tmpR}<small>上限の目安 ${e.cap}回</small></div>
      <button onclick="bumpR(1)">＋</button>
    </div>

    <label>この種目のセット数</label>
    <div class="stepper">
      <button onclick="bumpSets('${curId}',-1)">−</button>
      <div class="val">${setsOf(curId)}セット<small>この種目だけ・次回からもこの数です</small></div>
      <button onclick="bumpSets('${curId}',1)">＋</button>
    </div>
    <p class="note"><strong>やった分をそのまま入れるための欄です。増やすことを勧めるものではありません。</strong>3セットのままで構いません。ここを変えても、過去の記録は何も変わりません。</p>
  </div>

  ${(pg && showProgress()) ? `<div class="hint">
    ${pg.nextBand
      ? `<strong>バンド ${esc(pg.band)} で ${e.cap}回×${setsOf(curId)}セットが2回続きました。</strong>
         次から <strong>バンド ${esc(pg.nextBand)}</strong> にして、回数は ${e.reps}回まで戻して構いません。`
      : `<strong>${fmtW(e,pg.w)} で ${e.cap}回×${setsOf(curId)}セットが2回続きました。</strong>
         次から <strong>${fmtW(e,pg.next)}</strong> に上げて、回数は ${e.reps}回まで戻して構いません。`}
    <br>上げたくない日は上げなくて大丈夫です。この案内は消えません。
  </div>` : ""}

  ${mine.length ? `<button class="btn link" onclick="undoSet()">最後の1セットを取り消す</button>` : ""}
  <button class="btn ghost" onclick="tmpW=null;tmpR=null;tmpB=null;go('work')">種目一覧へ戻る</button>`;
}

/* --- 記録一覧 --- */
function viewLog(){
  const d=done().slice().reverse();
  return `
  <h1>これまでの記録</h1>
  <p class="sub">新しい順。<strong>並べ替えや強調はしていません。</strong></p>
  <div class="card">
    ${d.length ? d.map(function(s){
      const senv=s.env||"gym";
      const by={};
      s.sets.forEach(function(x){ (by[x.id]=by[x.id]||[]).push(x); });
      const inner=Object.keys(by).map(function(id){
        const e=def(id,senv), a=by[id];
        /* v5: 負荷はセットごとに記録した内容（ld/bd）から出す。
           セット間でバンドを変えた回は、そのまま「Medium/Heavy」のように並べる。 */
        const w0=fmtSet(e,a[0]);
        const same=a.every(function(x){ return fmtSet(e,x)===w0; });
        const head=same ? w0 : a.map(function(x){return fmtSet(e,x)}).join("/");
        return esc(e.name)+" "+esc(head)+" × "+a.map(function(x){return x.reps}).join("/")+"回";
      }).join("<br>");
      /* v2: 所要時間は事実として並べるだけ。速い順に並べ替えない・最短を出さない・
         15分を超えた回に印を付けない。すべて同じ字面。
         v4: 環境（ジム／自宅）も事実として添えるだけ。強調・並べ替えはしない。 */
      const head=mdw(s.date)+" ルーティン"+s.routine
        +(senv!=="gym" ? "・"+envLabel(senv) : "")
        +(typeof s.sec==="number" ? " ／ "+mmss(s.sec) : "")
        +(typeof s.rest==="number" ? "（休憩"+s.rest+"秒）" : "");
      return `<div class="log"><strong>${head}</strong><small>${inner}</small></div>`;
    }).join("") : '<p class="note">まだ記録はありません。</p>'}
  </div>
  <p class="note">所要時間は記録として並べているだけです。<strong>速さの順位づけ・最短の表示はしません。</strong>${TARGET_MIN}分を超えた回にも印は付きません。</p>
  <button class="btn ghost" onclick="go('home')">戻る</button>

  <div class="hr"></div>
  <button class="btn ghost" onclick="bkGo()">💾 バックアップ（書き出し・読み込み）</button>
  <p class="note">記録はこの端末のブラウザ内にだけ保存されています。ときどき書き出して、控えを取っておいてください。</p>`;
}

/* ===================== 操作 ===================== */
function startSession(r){
  /* v4: セッション開始時点の環境をそのまま記録に固定する（途中で環境設定を変えても、
     この回の記録・前回値の比較には影響しない）。 */
  unlockAudio();   /* v6 (2026-09-03): いちばん最初のタップで音を開通させる */
  DB.active={date:Date.now(),routine:r,sets:[],marked:false,env:curEnv()};
  save(); tmpW=null; tmpR=null; tmpB=null; startSessionClock(); go("work");
}
function setEnv(env){
  if(!ENVS.some(function(x){return x.id===env})) return;
  DB.settings.env=env; save(); render();
}
/* v6 (2026-09-03): 種目を開くのは必ずタップなので、ここでも音を開通させておく。
   休憩に入る前に1回通しておけば、あとで setInterval から鳴らしても止められない。 */
function openEx(id){ unlockAudio(); curId=id; tmpW=null; tmpR=null; tmpB=null; go("ex"); }
function bumpW(d){
  const e=def(curId,(DB.active&&DB.active.env)||"gym"); if(!e || !e.step) return;
  tmpW=Math.max(0, Math.round((tmpW + d*e.step)*100)/100); render();
}
/* v5: バンドは登録した並び（弱い→強い）の中を1つずつ動く。
   登録にない呼び名（改名・削除のあと）だったときは、いちばん弱いところから入り直す。 */
function bumpB(d){
  const a=bands(); if(!a.length) return;
  let i=a.indexOf(tmpB);
  if(i<0) i = d>0 ? -1 : a.length;
  tmpB = a[Math.min(a.length-1, Math.max(0, i+d))];
  render();
}
function bumpR(d){ tmpR=Math.max(1, tmpR+d); render(); }

function quickAdd(){
  const s=DB.active;
  const n0=s.sets.filter(function(x){return x.id===curId}).length;
  if(n0>=SETS_MAX) return;                    /* v3: 天井。押しっぱなしの暴発だけを止める */
  /* v5: 負荷の種類（ld）と、バンドなら使った言葉（bd）も一緒に残す。
     こうしておくと、あとで種目の設定を変えても、この行は当時のまま読める。 */
  const e5=def(curId,(s.env||"gym")), ld5=loadOf(e5);
  const rec={id:curId, w:(ld5==="kg"?tmpW:0), reps:tmpR, t:Date.now(), ld:ld5};
  if(ld5==="band") rec.bd=tmpB;
  s.sets.push(rec);
  save();
  const n=n0+1, tgt=setsOf(curId);
  /* v3: 目標ちょうどで終わりの合図。目標を超えて続けるときは休憩タイマーを出す
     （超えた回だけ休憩が出ない、という穴を作らない）。 */
  if(n===tgt){ stopRest(); chimeDone(); } else { startRest(); }
  render();
}
function undoSet(){
  const s=DB.active;
  for(let i=s.sets.length-1;i>=0;i--){ if(s.sets[i].id===curId){ s.sets.splice(i,1); break; } }
  save(); render();
}
function finishSession(){
  const s=DB.active;
  if(!s.sets.length){
    if(!confirm("1セットも記録されていません。この回を残さずに終わりますか？")) return;
    DB.active=null; save(); stopRest(); stopSessionClock(); return go("home");
  }
  s.date=s.date||Date.now();
  s.sec=elapsedSec();          /* v2: 所要時間を事実として残す（順位づけはしない） */
  s.rest=restSec();            /* そのとき使っていた休憩の長さ。あとで見比べるため */
  DB.sessions.push(s); DB.active=null; save(); stopRest(); stopSessionClock(); go("log");
}
function cancelSession(){
  if(!confirm("この回を残さずにやめますか？")) return;
  DB.active=null; save(); stopRest(); stopSessionClock(); go("home");
}

/* 再読み込みしても、実施中のセッションの経過時間は続きから動く */
if(DB.active) startSessionClock();
render();
</script>
</body>
