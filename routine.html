<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Switch">
<meta name="theme-color" content="#12151c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2312151c'/%3E%3Ccircle cx='90' cy='96' r='46' fill='none' stroke='%23e0a86a' stroke-width='14'/%3E%3Crect x='81' y='34' width='18' height='58' rx='9' fill='%23e0a86a'/%3E%3C/svg%3E">
<title>B.M.C. 切り替えルーティン</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#12151c;color:#e8ecf2;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-user-select:none;user-select:none;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 44px}
h1{font-size:19px;margin:4px 0 2px;letter-spacing:.02em}
.sub{color:#8a94a6;font-size:12.5px;margin:0 0 16px;line-height:1.65}
.card{background:#1a1f29;border:1px solid #262d3a;border-radius:14px;padding:15px 16px;margin-bottom:11px}
.card.del{border-color:#5c3138;background:#1f1618}
.sec{font-size:12px;color:#6f7a8c;margin:24px 0 9px;letter-spacing:.06em}
.btn{
  display:block;width:100%;padding:17px;border-radius:12px;border:none;
  background:#e0a86a;color:#20160c;font-size:17px;font-weight:700;
  font-family:inherit;cursor:pointer;margin-top:10px;
}
.btn.ghost{background:#232b38;color:#cbd5e3;font-weight:600;font-size:14px;padding:12px}
.btn.link{background:none;color:#8a94a6;font-size:13px;padding:9px;font-weight:500;text-decoration:underline}
.btn.save{background:#2a3a2c;color:#cfe6d2}
.btn.danger{background:#3a2427;color:#e8b3b8}
.btn.danger.armed{background:#7d2c35;color:#fff}
.row{display:flex;gap:9px}
.row>*{flex:1}

.big{font-size:64px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 2px;letter-spacing:-.03em;line-height:1.1}
.big.over{color:#8a94a6;font-size:52px}
.big.ok{color:#9ec8a4}
.bigsub{text-align:center;color:#8a94a6;font-size:13px;margin-bottom:6px}
.bar{height:5px;background:#232b38;border-radius:3px;overflow:hidden;margin:10px 0 2px}
.bar>i{display:block;height:100%;background:#e0a86a}

.setb{
  display:block;width:100%;text-align:left;background:#1a1f29;border:1px solid #262d3a;
  color:#e8ecf2;border-radius:13px;padding:15px 16px;font-size:15.5px;font-family:inherit;
  cursor:pointer;margin-bottom:10px;line-height:1.5;font-weight:600;
}
.setb small{display:block;color:#8a94a6;font-size:12.5px;font-weight:400;margin-top:4px;line-height:1.6}
.setb.rescue{background:#221a1a;border-color:#40292a}

.step{
  display:flex;gap:12px;align-items:flex-start;background:#1a1f29;border:1px solid #262d3a;
  border-radius:12px;padding:14px 15px;margin-bottom:9px;cursor:pointer;
}
.step.cur{border-color:#e0a86a;background:#211d18}
.step.done{opacity:.42}
.step .n{
  flex:none;width:26px;height:26px;border-radius:8px;background:#232b38;color:#8a94a6;
  font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:1px;
}
.step.cur .n{background:#e0a86a;color:#20160c}
.step.done .n{background:#2a3a2c;color:#9ec8a4}
.step .t{flex:1;font-size:15px;line-height:1.55}
.step .t em{display:block;font-style:normal;color:#8a94a6;font-size:12px;margin-top:3px}
.step .t s{color:#6f7a8c}

.hint{color:#cbd5e3;font-size:12.5px;line-height:1.7;background:#1f1c19;border:1px solid #2f2a24;border-radius:10px;padding:11px 13px;margin-top:11px}
.warn{color:#e8b3b8;font-size:12.5px;line-height:1.7;background:#1f1618;border:1px solid #4a2a2f;border-radius:10px;padding:11px 13px;margin-top:11px}
.note{color:#6f7a8c;font-size:12px;line-height:1.75;margin:10px 0 0}
textarea{
  width:100%;min-height:170px;background:#12151c;border:1px solid #303a4a;color:#e8ecf2;
  border-radius:10px;padding:12px;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  line-height:1.8;-webkit-user-select:text;user-select:text;
}
label{display:block;font-size:12.5px;color:#8a94a6;margin:12px 0 5px}
.inp{
  width:100%;background:#12151c;border:1px solid #303a4a;color:#e8ecf2;
  border-radius:10px;padding:12px;font-size:15px;font-family:inherit;
  -webkit-user-select:text;user-select:text;
}
.inp.icon{width:74px;text-align:center;font-size:21px;padding:10px;flex:none}
.iconrow{display:flex;gap:9px;align-items:center}
.tools{display:flex;gap:7px;margin-top:12px}
.tools button{
  flex:1;background:#232b38;border:1px solid #303a4a;color:#cbd5e3;border-radius:10px;
  padding:11px 4px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600;
}
.tools button:disabled{opacity:.32}
.tools button.rm{background:#3a2427;border-color:#5c3138;color:#e8b3b8}
.tools button.rm.armed{background:#7d2c35;border-color:#9c3a45;color:#fff}
.tag{display:inline-block;background:#232b38;border:1px solid #303a4a;border-radius:999px;padding:2px 9px;font-size:11px;color:#8a94a6;margin-left:6px;vertical-align:middle}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.toggle b{font-weight:600;font-size:14px}
.sw{width:52px;height:31px;border-radius:999px;background:#303a4a;border:none;position:relative;cursor:pointer;flex:none}
.sw.on{background:#e0a86a}
.sw i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#e8ecf2;transition:left .15s}
.sw.on i{left:24px}

/* v14: いまの項目を進める大きなボタン */
.btn.big{padding:26px 17px;font-size:21px;letter-spacing:.02em}

/* v13: 実行中にその場で開く入力欄 */
.iobox{background:#12151c;border:1px solid #e0a86a;border-radius:11px;padding:11px 12px;margin:-4px 0 11px}
.iobox label{margin-top:0}
.dnrow{background:#1a1f29;border:1px solid #262d3a;border-radius:11px;padding:11px 12px;margin-bottom:9px}
.dnrow .h{font-size:14.5px;line-height:1.5;margin-bottom:7px}
.dnrow .h s{color:#6f7a8c}
.nlist{margin:6px 0 0}
.nline{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#cbd5e3;line-height:1.6;padding:4px 0}
.nline .d{flex:none;color:#6f7a8c;font-size:11.5px;padding-top:1px}
.nline .x{flex:none;background:none;border:none;color:#6f7a8c;font-size:15px;cursor:pointer;padding:0 2px;font-family:inherit}

/* v11: 区切りの合図で画面全体を2回光らせる */
.lxb{flex:none;background:none;border:1px solid #3a4152;color:#8a94a6;border-radius:9px;
  font-size:13px;padding:5px 9px;margin-left:8px;font-family:inherit}
.lxb.armed{border-color:#c07a7a;color:#e8b4b4}
.flash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;pointer-events:none;background:#e0a86a;opacity:0;animation:fl 1.5s ease-out}
@keyframes fl{0%{opacity:0}6%{opacity:.8}22%{opacity:.08}40%{opacity:.75}60%{opacity:.06}80%{opacity:.5}100%{opacity:0}}

.past{
  background:#1a1f29;border:1px solid #262d3a;border-radius:12px;padding:11px 14px;
  margin:0 0 14px;color:#8a94a6;font-size:13px;line-height:1.7;text-align:center;
}
.past b{color:#e0a86a;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
/* v10: ステップを1行ずつ編集する行 */
.strow{background:#12151c;border:1px solid #262d3a;border-radius:11px;padding:10px 11px;margin-bottom:8px}
.stline{display:flex;gap:7px;align-items:center}
.stline .inp{padding:10px}
.stsec{width:72px;flex:none;text-align:center;padding:10px 4px}
.stunit{flex:none;color:#6f7a8c;font-size:12px;width:16px}
/* v20 (2026-09-03): 今週の実施状況の表（累計回数の表示のかわり） */
.wk{overflow-x:auto;margin:8px 0 0}
.wk table{width:100%;border-collapse:collapse;font-size:13px}
.wk th{color:#6f7a8c;font-weight:500;font-size:11.5px;padding:3px 2px;text-align:center}
.wk td{text-align:center;padding:6px 2px;border-top:1px solid #1c222c;color:#9ec8a4}
.wk td.nm{text-align:left;color:#c9d1de;padding-right:8px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .td{background:#1a1f28}
.wk .e{color:#39404d}
.stbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stbtns button{
  flex:1;background:#232b38;border:1px solid #303a4a;color:#cbd5e3;border-radius:9px;
  padding:9px 2px;font-size:12.5px;font-family:inherit;cursor:pointer;font-weight:600;
}
.stbtns button:disabled{opacity:.3}
.stbtns button.rm{background:#3a2427;border-color:#5c3138;color:#e8b3b8}

.lrow{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid #222833;font-size:14px}
.lrow:last-child{border-bottom:none}
.lt{flex:none;width:44px;color:#6f7a8c;font-size:12.5px;font-variant-numeric:tabular-nums}
.ln{flex:1;line-height:1.5}
.ld{flex:none;color:#8a94a6;font-size:12.5px;font-variant-numeric:tabular-nums}

/* ===== 「気になった」記録（2026-09-06追加）=================================
   ★このブロックと #fbBtn / #fbPanel は #app の外に置いています。
     実行中は render() が 250ms ごとに #app を作り直すため、中に入れると
     点滅し、入力中の文字も消えるためです。位置を変えるときも外のままで。
   ★コピー用の欄（.fbta）は必ず見える場所に置くこと。画面の外へ逃がすと、
     iOSでは選択もコピーもできません（2026-09-06の不具合の原因）。 */
#fbBtn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  width:44px;height:44px;border-radius:22px;border:1px solid #2f3947;background:#1a1f29;
  color:#cbd5e3;font-size:19px;line-height:42px;text-align:center;opacity:.6;
  z-index:9000;cursor:pointer;font-family:inherit;padding:0}
#fbBtn:active{opacity:1}
#fbWrap{position:fixed;left:0;right:0;top:0;bottom:0;z-index:9001;display:none}
#fbWrap.on{display:block}
#fbBack{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(6,8,12,.72)}
#fbPanel{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;
  background:#12151c;border-top:1px solid #2f3947;border-radius:16px 16px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
#fbPanel h1{margin:0 0 2px}
.fbchip{display:block;width:100%;text-align:left;padding:15px;margin-top:8px;
  border-radius:12px;border:1px solid #2f3947;background:#1a1f29;color:#e8ecf2;
  font-size:15.5px;font-weight:600;font-family:inherit;cursor:pointer}
.fbchip:active{background:#232b38}
.fbinp{width:100%;padding:13px;border-radius:11px;border:1px solid #2f3947;
  background:#171c25;color:#e8ecf2;font-size:16px;font-family:inherit}
.fbrow{font-size:13px;color:#cbd5e3;padding:4px 0;border-bottom:1px solid #232b38}
.fbta{width:100%;height:104px;font-size:11px;line-height:1.5;color:#8a94a6;
  background:#171c25;border:1px solid #262d3a;border-radius:10px;padding:9px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-user-select:text;user-select:text}
.fbsend{display:block;width:100%;padding:17px;border-radius:12px;background:#e0a86a;
  color:#20160c;font-size:17px;font-weight:700;text-align:center;text-decoration:none;
  margin-top:10px;font-family:inherit}
.fbsend.ghost{background:#232b38;color:#cbd5e3;font-weight:600;font-size:14px;padding:12px}
#fbToast{position:fixed;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));
  z-index:9002;background:#232b38;color:#e8ecf2;border:1px solid #2f3947;border-radius:11px;
  padding:12px 14px;font-size:13.5px;text-align:center;display:none;max-width:528px;margin:0 auto}
#fbToast.on{display:block}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ============================================================
   B.M.C. 切り替えルーティン (routine.html) ＝ Switchアプリ
   作成: B.M.C.(Claude) / 2026-08-14
   v2: セットの追加・削除・並べ替えに対応
   v3: 2026-08-15 実行の記録（履歴）を追加
   v4: 2026-08-19（指示_2026-08-19_2、Quick Memoご依頼）
     ご依頼3点: ①4-7-8呼吸法・3分ガイド ②音声で切り替えを案内
                ③起動時にSpotify瞑想プレイリストを開く ④各ステップに
                タイマーを持たせ、終わったら自動で次のタイマーが動く流れ

     【④が本体】従来のセットはすべて「タップで完了→次へ」（toggleStep）で、
     ステップの秒数は目安の文字表示だけでした。④はこれと別に「自動で進む」
     モード（set.auto=true）を新設。既存5セットは一切変えず（auto無し＝
     従来どおりタップ式）、新設の🫁セットだけ auto:true にしています。
     auto セットは「いま何ステップ目にいるべきか」を毎回 elapsed()（開始
     時刻からの経過）から計算し直します（autoTick）。setTimeoutの連鎖で
     進めると、iOSでバックグラウンドに回った瞬間に止まって二度と進まない
     ため採用していません。elapsed() は他の機能同様、画面に戻ったときに
     時刻から再計算されるので、バックグラウンドから戻っても正しい位置に
     復帰します（ズレるのは、飛ばされた間の音声・チャイムだけ）。

     ②音声案内は Web Speech API（speechSynthesis）。未対応環境では
     何も起きないだけで、タイマー自体は変わらず動きます。DB.voice で
     オンオフ（既定オン）。

     ③Spotifyは「起動時にURLを新規タブで開く」だけの実装です。プレイ
     リストのURL自体はご本人しか持っていないため、こちらでは決め打ち
     せず、設定欄（DB.spotifyUrl）に入れていただく形にしました。未入力
     なら何もしません。iOSでSpotifyアプリの前面に切り替わると、このペ
     ージ側のタイマーはバックグラウンド扱いになり一時停止しますが、
     ページに戻れば時刻から再計算されるので秒数はズレません（止まって
     見えるのは音声とチャイムだけ）。この制約は正直に画面内に書きました。

     【やらないこと】呼吸法セットも、他の5セットと同じ安全方針を継承
     しています。連続日数・達成率・「できなかった呼吸」は数えません。
     3分は目安であって、達成/未達の判定基準にはしません。

   v5: 2026-08-19（チャットでの追加ご要望）
     ご依頼: ①自動進行にするかタップ式にするかを「ルーティンごと」に選べる
             ②音声ガイドも自分で編集できる ③Spotifyのプレイリストも
             ルーティンごとに設定できる ④呼吸法を含む休憩ルーティンを
             自分で組めるようにする

     【v4の何を直したか】v4は「🫁セットだけが自動進行・音声・Spotify」と
     いう特別扱いでした。v5はその特別扱いを解体し、すべてを**セット単位の
     設定**に格下げしています。コード側に「呼吸法だけの分岐」は残っていま
     せん（breathSteps() は既定データを組み立てるためだけの関数です）。

     - set.auto      … 自動で進む（false/未設定＝従来どおりタップ式）
     - set.voice     … このセットで読み上げる
     - set.spotify   … 開始時にプレイリストを開く
     - set.spotifyUrl… このセット専用のURL。空ならホーム画面の既定URLを使う
     いずれも編集画面から切り替えられます。既存5セットの中身は1文字も
     変えていません（auto が無いセットは従来どおりタップ式のまま）。

     【ステップ書式の拡張】「秒|画面の文言|読み上げ」の3列目を追加しました。
     3列目を省略したときは、従来どおり画面の文言から（…）を除いたものを
     読みます。※副作用：文言そのものに「|」を含めていた場合、その後ろが
     読み上げ文として扱われます（画面表示は「|」の手前までになります）。

     【自動進行画面の汎用化】v4の実行画面は「3ステップ＝1サイクル」を決め
     打ちしており、呼吸法以外のセットでは表示が壊れました。v5はステップの
     繰り返し周期を自動検出し、繰り返しがあれば「サイクル m/n」、無ければ
     「ステップ m/n」と出します。次のステップも1行だけ添えます（休憩ルー
     ティンのように中身がばらばらのセットでは、次に何が来るかが要るため）。

     【自動進行セットの全体時間】ステップの合計から毎回計算します（制限
     時間の欄は出しません）。ステップを増減したときに総時間だけ古いまま
     残る事故を防ぐためです。

   v21: 2026-09-03（チャットでのご依頼・タップ式セットの時間の数え方）
     ご依頼は5点。「セット中でも順番を入れ替えたい／タップして実施した分も
     累計に入れたい／順番が前後して別のステップを押したら、そこまでを中断
     扱いにして、戻ったら中断したところから再開したい／そのステップに計
     どのくらいかかったかを記録に残したい／メモは実施中に書くので、セット
     完了後のメモ書きは不要」。

     【中断・再開できる時間の数え方】項目ごとに「これまでに使った合計秒数」
     を持たせた（stepAcc）。従来は「いまの項目を始めた時刻（stepAt）からの
     経過」だけを見ていたので、別の項目へ移った瞬間にそこまでの時間が消えて
     いた。いまは項目を移る・飛ばす・完了する・終える、どの経路でも必ず
     commitSeg() を通してそこまでの秒数を項目に足してから動く。戻ってくると
     その続きから数え直す。実行画面では、いまの項目に「（中断前の 1:20 を
     含む）」、他の行に「中断中 1:20 / 使用中 0:40 / 実際 2:10」と出る。
     【次に触る人向け】項目の位置を動かす処理（moveStep・runAdd）を足す
     ときは、doneSet だけでなく stepAcc・stepExtra・runTimes も一緒に
     動かすこと（添字で持っているため）。swapK / shiftK がその係。

     【実績の記録条件を変えた】従来は「順番どおりに進めた項目だけ（完了時に
     i===curStep だったときだけ）」DB.times に残していたので、順番を前後
     させると記録が残らなかった。いまは**その回にその項目へ使った合計時間**
     を残す（act＝stepAcc の合計）。飛ばした項目（–）は従来どおり記録
     しない。振り返り画面の文言もこれに合わせて直した。

     【実行中の並べ替え】いま見ている項目に「↑ 上へ / ↓ 下へ」を足した
     （moveStep）。**入れ替えた順番はセットにそのまま残る**（＝次回もこの
     順番で始まる）。既存の「＋ 次に足す」がセットに残るのと同じ扱いに
     揃えた。別の項目を動かしたいときは、その行をタップして移ってから押す。

     【完了画面のメモ入力欄を廃止】「やってみて、どう感じましたか」の入力欄
     （doneNote）を削除。メモは実行中の「💬 メモ」（runNote）から書く。

var KEY = "bmc_routine_v1";

/* --- v4: 4-7-8呼吸法のステップを組み立てる ----------------------
   吸う4秒・止める7秒・吐く8秒＝1サイクル19秒。9サイクルで171秒（2:51）。
   「3分」はぴったりではなく目安です。回数を変えたいときは、既存の
   セット編集画面（ステップのテキストエリア）でそのまま増減できます。 */
function breathSteps(n){
  var out = [];
  for(var i=0;i<n;i++){
    out.push("4|吸う（4秒）");
    out.push("7|止める（7秒）");
    out.push("8|吐く（8秒）");
  }
  return out;
}

     ①だけ止めると朝の仕事準備で②が鳴り続けて「切ったのに鳴る」状態になるため。
   ★ホーム画面の設定（DB.chime／DB.voice／DB.third／離席中の音）より、
     **セット側の「出さない」を優先する**（切るほうを強くする）。
   ★「開始時にiPhoneのタイマーへ渡す」（s.timer）は**触らない**。あれは以前から
     セットごとに選べる別のスイッチで、押した本人が明示的に入れたものだから。
   ★集中ブロックの音（beep の force=true）は別物なので止めない。 */
function quietOf(s){ return !!(s && s.quiet); }
/* ★ここは音を鳴らす手前で毎回通る。読み込みの途中（DB.sets がまだ無い）に
   呼ばれても音を止めてしまわないよう、失敗したら false を返す。 */
function quietNow(){ try{ return quietOf(setOf(curId)); }catch(e){ return false; } }
function beep(f,d,force){
  /* force=true は集中ブロック用。集中の音は DB.focus.sound で別に持っており、
     セットの「終了音を鳴らす」（DB.chime）とは独立させる。 */
  if(!DB.chime && !force) return;
  if(!force && quietNow()) return;   /* v36: 音を出さないセット */
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state === "suspended" && ac.resume) ac.resume();
    var o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = f; o.type = "sine";
    g.gain.setValueAtTime(.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.28, ac.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+d);
    o.start(); o.stop(ac.currentTime+d+.02);
  }catch(e){}
}
function chimeStep(){ beep(660,.18); }
function chimeDone(){ beep(587,.22); setTimeout(function(){beep(880,.45);},200); }
/* v16: 呼吸法の吸う・止める・吐くを音の形で区別する（8/23のご要望）。
   吸う＝上がる2音、止める＝1音だけ（動かない）、吐く＝下がる2音。
   該当しない文言（呼吸法以外の自動セット）は従来どおりのチャイム。 */
function phaseChime(text){
  var t = String(text||"");
  if(/吸う/.test(t)){ beep(520,.14); setTimeout(function(){beep(700,.16);},110); }
  else if(/止める/.test(t)){ beep(780,.22); }
  else if(/吐く/.test(t)){ beep(700,.14); setTimeout(function(){beep(520,.18);},110); }
  else chimeStep();
}
/* v16: 中途覚醒の3分タイマーが終わったときの合図。バイブレーションは
   iOS Safariが navigator.vibrate に対応していないため使えず、代わりに
   「気づきやすい音（上がる3音を2回）＋画面フラッシュ」にしてある

function chimeWake(){
  [0,170].forEach(function(base){
    beep(520,.13);
    setTimeout(function(){beep(660,.13);},base+90);
    setTimeout(function(){beep(880,.18);},base+180);
  });
  flashScreen();   /* v11で作った既存の関数をそのまま使う（.flashのCSSアニメーション） */
}

/* --- v4: 音声案内（Web Speech API） -----------------------------
   未対応環境・発話エンジン取得失敗時は、何もせず無音で終わる
   （タイマー自体の動作には影響しない）。 */
function speak(text){
  if(!DB.voice) return;
  if(quietNow()) return;   /* v36: 音を出さないセットでは読み上げない */
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();  /* 前の発話が残っていたら止めてから話す */
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ===== v30（2026-09-06 ご依頼）→ v39（2026-09-12 ご指示で位置を変更）=====
   項目の終わりが近づいたら、残り時間を声で知らせる。
   ★v39: 知らせる位置を **項目の設定時間の1/3を過ぎたとき → 残り30秒** に変えた
     （2026-09-12 チャットでのご指示「1/3で通知が出る仕様を残り30秒にすべて変更」）。
     v30〜v38 は 1/3 だった。**位置以外は何も変えていない**（チャイム2音 →
     画面が光る → 間をあけて読み上げ2回、という v32 の出し方はそのまま）。
   ★基準は**いま実行している1項目の設定時間**（2026-09-06 ご指示）。セット全体ではない。
   ★**延長（＋1分／＋5分）を押したら、知らせる位置も計算し直す**（同ご指示）。
     延長後の「残り30秒」にまだ届いていなければ、そこでもう一度知らせる。
   ★自動で進むセット（呼吸法など）には出さない。項目が数十秒しかなく、
     項目の読み上げと重なって、かえって邪魔になるため。
   ★短い項目にも出さない（THIRD_MIN 未満）。1分より短い項目で「のこり30秒」を
     言われても、始めた直後に鳴るだけで意味がない。ここは v30 のまま1分。

     開いた瞬間にいきなり喋ると、何の音か分からないため。 */
var THIRD_AT  = 30;      /* v39: 残りこの秒数で知らせる（旧＝設定時間の1/3） */
var THIRD_MIN = 60;      /* この秒数より短い項目では知らせない */
/* v32（2026-09-07 ご指示）: この秒数より長い項目では、その位置で鳴る
   iPhone標準タイマーを仕掛けるボタンを実行画面に出す（押したときだけ）。
   ご指示は「5分以下は音と画面で、それ以上の項目なら標準タイマーも取りたい」。 */

/* v39: 知らせる位置（その項目に入ってからの経過秒）。1か所に集めてある。
   ★増やさないこと。thirdCheck・延長の計算し直し・標準タイマーの3つが、
     必ずここを通るようにしてある（v34 の stepSec と同じ考え方）。 */

var thirdSaid = {};      /* この回、どの項目でもう知らせたか */
function thirdCheck(){
  if(!DB.voice || DB.third===false) return;
  /* v36: 音を出さないセットでは、画面のフラッシュごと出さない。
     音だけ止めて光だけ残すと「何の合図か分からない光」になるため。 */
  if(quietNow()) return;
  var s = setOf(curId); if(!s || s.auto || !s.voice) return;
  if(curStep==null || curStep<0) return;
  var st = stepsOf(s); if(!st[curStep]) return;
  var t = stepSec(curStep); if(t < THIRD_MIN) return;
  var used = stepUsed();
  if(used < thirdPoint(t)) return;   /* v39: 1/3 → 残り30秒 */
  if(thirdSaid[curStep]) return;
  thirdSaid[curStep] = true;
  if(used > thirdPoint(t) + 10) return;   /* 通り過ぎてから来た場合は黙る（印だけ立てる） */
  thirdAlert("のこり " + durLabel(Math.max(0, t - used)) + "です");
}
/* ===== v32（2026-09-07 ご指摘「読み上げが気づきにくい」）=====
   読み上げだけだと、他の音（YouTube・プレイリスト）を聞いているときに
   言葉が埋もれる。人は言葉より**短くて特徴のある音**に先に気づくので、
   ①チャイム2音（項目の切り替え音とも終了音とも違う高さ）→ ②画面全体を光らせる
   → ③少し置いてから読み上げ → ④間をあけてもう一度読み上げ、の順にする。
   ★チャイムは「終了音を鳴らす」（DB.chime）に従う。音を切ってある日にいきなり
     鳴らさない（画面と読み上げは残るので、合図が消えるわけではない）。
   ★2回目の読み上げは、まだ同じ項目にいるときだけ。speak は前の発話を止めるので、

function chimeThird(){
  beep(784,.16);
  setTimeout(function(){ beep(1046,.22); }, 170);
}
function thirdAlert(text){
  chimeThird();
  flashScreen();
  var id0 = curId, st0 = curStep;

  setTimeout(function(){

/* v32: その時点（v39からは残り30秒）で鳴る iPhone標準タイマーを仕掛ける
   （長い項目だけ・押したときだけ）。
   ページは裏に回ると時計ごと止まるため、**他のアプリを使っているあいだに鳴らせるのは
   標準タイマーだけ**。ただし仕掛ける瞬間にショートカットAppへ画面が飛ぶので、
   自動では絶対に走らせない（毎回画面を奪われるほうが害が大きい）。 */
function thirdLeft(){
  var s = setOf(curId); if(!s || s.auto) return -1;
  if(curStep==null || curStep<0) return -1;
  return Math.floor(thirdPoint(stepSec(curStep))) - stepUsed();   /* v39 */
}
function thirdTimer(){
  var t3 = thirdLeft();
  if(t3 < 1) return;
  nativeTimer(t3);

/* ============================================================================
   v35（2026-09-10 チャットでのご依頼 ＝ 指示_2026-09-10 R4）
   「項目ごとに進む」で画面を離れると、目安を過ぎたことに気づけない
   ----------------------------------------------------------------------------
   【何が起きているか】iOSは、Safariを裏に回した瞬間にこのページを止める。
   JSのタイマーも、Web Audioに予約した音も、まとめて止まる。だから
   ・thirdCheck の読み上げ（残り30秒の知らせ。v38まで1/3）
   ・chimeStep の切り替え音
   はどちらも、**前面にいるときにしか鳴らない**。8/19にお答えした
   「Webページから振動は出せない」も同じ壁で、実装では回避できない。

   【止まらないもの】2つだけある。
   ① iPhone標準のタイマー（ショートカット経由で予約する。v32で知らせの位置用に実装済み）
   ② **すでに再生が始まっている音声の再生そのもの**（音楽アプリと同じ扱いで、
      裏に回っても鳴り続ける）
   ②を使うと「◯分の無音 → チャイム」という1本の音声を先に流しておくだけで、
   ◯分後にチャイムだけが鳴る。ショートカットAppへ飛ばずに済む。

   【この版で入れたもの】
   1. 標準タイマーへ渡す対象を **知らせる位置（当時は1/3）→ その項目の残り全部** に広げ、
      **5分より長い項目だけ → すべての項目** にした（R4のご依頼そのもの）。
   2. 「✓ できた — 次へ」「↷ スキップ」「延長」「開始」のたびに**自動で仕掛ける**
      （2026-09-10 ご指示「常に自動でいい」「延長したら渡し直す」）。
   3. ②の背景音を実装し、**仕掛かったときは①へ飛ばさない**。画面を奪われる
      回数を0にするため。背景音が鳴らない端末・設定なら、設定で「離席中の音」を
      切れば①（標準タイマー）に自動で戻る。＝どちらかが効かなくても全滅しない。
   4. 戻ってきたときの受け止め（awayBackBox）。

   【正直に書いた制約】
   ・②が iPhone で確実に鳴るかは**こちらでは確かめていない**（実機がない）。
     鳴らなければ設定で切ってください。①に戻ります。
   ・②が鳴っているあいだ、Spotify・YouTubeの音は止まる。そのため
     **「開始時にプレイリストを開く」がオンのセットでは②を使わない**
     （awaySoundOK）。そこは①（標準タイマー）が受け持つ。
   ・自動で進むセット（呼吸法など）は対象外。自分で次へ進むため。
   ・**行をタップして項目を移るときは仕掛け直さない。**標準タイマー側のときに
     毎回ショートカットAppへ飛ばされると、並べ替えすらできなくなるため。
   ============================================================================ */
var AWAY_RATE   = 4000;      /* 背景音の標本化周波数。1秒あたり4KB（8bit・モノラル） */
var AWAY_MAXSEC = 40*60;     /* これより長い残りには背景音を仕掛けない（約9.6MBが上限） */
var AWAY_RING   = 9;         /* チャイムを鳴らす秒数 */
var awayAudio = null;        /* いま流している背景音 */
var awayUrl   = "";          /* その Blob の URL（片づけるために持つ） */
var awayKind  = "";          /* いま仕掛かっているもの: "sound" / "timer" / "both" / "" */
var awaySec   = 0;           /* 何秒後に鳴る予定か */
var awayAt    = 0;           /* 仕掛けた時刻 */
var awayStep  = -1;          /* どの項目に対して仕掛けたか */
var awayFail  = "";          /* 背景音を始められなかったときの理由（画面に出す） */
/* 片づけた古い <audio> の error / play() の失敗が、いま仕掛けたものの
   失敗として画面に出ないようにするための世代番号（awayHush で必ず進める）。 */
var awayGen   = 0;

/* 「◯秒の無音 → チャイム」の WAV を、その場で組み立てて Blob で返す。
   ★8bit・4000Hz なのは大きさのため（1秒=4KB）。この標本化周波数でも
     1000Hz と約667Hz の矩形波はちょうど4標本・6標本で表せるので濁らない。
   ★完全な無音（全部128）にすると、端末によっては「何も鳴っていない」と
     判断されて再生を止められることがあるため、ごく薄い揺らぎを入れてある
     （4000標本に1つだけ1目盛りずらす＝聞こえない大きさ）。 */
function awayWav(sec){
  var R = AWAY_RATE;
  var q = Math.max(0, Math.round(sec * R));
  var r = Math.round(AWAY_RING * R);
  var n = q + r;
  var b = new Uint8Array(44 + n);
  function s4(o, t){ for(var i=0;i<4;i++) b[o+i] = t.charCodeAt(i); }
  function u32(o, v){ b[o]=v&255; b[o+1]=(v>>8)&255; b[o+2]=(v>>16)&255; b[o+3]=(v>>24)&255; }
  function u16(o, v){ b[o]=v&255; b[o+1]=(v>>8)&255; }
  s4(0,"RIFF"); u32(4, 36+n); s4(8,"WAVE");
  s4(12,"fmt "); u32(16,16); u16(20,1); u16(22,1);
  u32(24,R); u32(28,R); u16(32,1); u16(34,8);
  s4(36,"data"); u32(40,n);
  b.fill(128, 44, 44+n);
  for(var i=0;i<q;i+=4000) b[44+i] = 129;      /* 聞こえない揺らぎ */
  /* チャイム: 高い音と低い音を交互に、短く区切って繰り返す。
     人は鳴りっぱなしの音より断続音に気づくので、連続では鳴らさない。 */
  var pat = Math.round(1.5*R);                 /* 1.5秒で1かたまり */
  var aOn = Math.round(.22*R), bOn0 = Math.round(.30*R), bOn1 = Math.round(.52*R);
  for(var k=0;k<r;k++){
    var pp = k % pat, half = 0;
    if(pp < aOn) half = 2;                     /* 1000Hz（4標本で1周期） */
    else if(pp >= bOn0 && pp < bOn1) half = 3; /* 約667Hz（6標本で1周期） */
    if(half) b[44+q+k] = ((Math.floor(pp/half) % 2) ? 46 : 210);
  }
  try{ return new Blob([b], {type:"audio/wav"}); }catch(e){ return null; }
}
/* 背景音を使ってよいセットか。プレイリストを流すセットでは使わない
   （鳴らしているあいだ Spotify の音が止まってしまうため）。 */
function awaySoundOK(s){
  if(!DB.awaySound) return false;
  if(!s || s.auto) return false;
  if(s.spotify) return false;
  return true;
}
/* 背景音を仕掛ける。**押した操作の中から呼ぶこと**
   （iOSは、指で押した操作の外からは音を出せない。v11と同じ理由）。 */
function awayPlay(sec, label){
  awayFail = "";
  try{
    var bl = awayWav(sec);
    if(!bl){ awayFail = "音声を作れませんでした"; return false; }
    awayHush();
    var gen = awayGen;
    awayUrl = URL.createObjectURL(bl);
    awayAudio = new Audio();
    awayAudio.src = awayUrl;
    awayAudio.preload = "auto";
    awayAudio.onerror = function(){ if(gen===awayGen) awayFail = "音声を再生できませんでした"; };
    var pr = awayAudio.play();
    if(pr && pr["catch"]) pr["catch"](function(){ if(gen===awayGen) awayFail = "この端末では自動で鳴らせませんでした"; });
    /* ロック画面・コントロールセンターに、いま何の項目かを出す。
       残り時間は裏に回ると更新できないので、名前と「◯分後に鳴ります」だけ。 */
    try{
      if(navigator.mediaSession && window.MediaMetadata){
        navigator.mediaSession.metadata = new MediaMetadata({
          title: String(label||"ルーティン"),
          artist: "B.M.C. 切り替えルーティン",
          album: durLabel(sec)+"後に鳴ります"
        });
      }
    }catch(e){}
    return true;
  }catch(e){ awayFail = "音声を再生できませんでした"; return false; }
}
function awayHush(){
  awayGen++;
  try{ if(awayAudio){ awayAudio.onerror = null; awayAudio.pause(); awayAudio.removeAttribute("src"); awayAudio.load(); } }catch(e){}
  awayAudio = null;
  try{ if(awayUrl) URL.revokeObjectURL(awayUrl); }catch(e){}
  awayUrl = "";
}
function awayClear(){ awayHush(); awayKind = ""; awaySec = 0; awayAt = 0; awayStep = -1; }
/* いまの項目に対して「離席中に鳴るもの」を仕掛け直す。 */
function awayArm(){
  var s = setOf(curId);
  awayClear();
  if(!s || s.auto) return;
  /* v36: 音を出さないセットでは、離席中の音も自動の標準タイマーも仕掛けない
     （どちらも「離席中に鳴らす」ためのものなので、消音の対象に含める）。
     実行中の画面から手で押す「⏱ iPhoneのタイマーにも渡す」は残る。 */
  if(quietOf(s)) return;
  /* v37: 後回しが効いているあいだは、何も仕掛け直さない。
     **標準タイマーは1本しか持てない**ので、ここで項目の残りを渡すと
     「◯分後に戻る」の呼び戻しが上書きされて消える。呼び戻しを優先する。 */
  if(snOn()) return;
  if(curStep==null || curStep<0) return;
  var st = stepsOf(s); if(!st[curStep]) return;
  var l = stepLeft();
  if(l < 1) return;
  awayStep = curStep; awaySec = l; awayAt = Date.now();
  if(awaySoundOK(s) && l <= AWAY_MAXSEC && awayPlay(l, st[curStep].text)){ awayKind = "sound"; return; }
  if(DB.awayTimer && l >= (DB.awayMin||0)){ awayKind = "timer"; nativeTimer(l); return; }
  awayKind = ""; awaySec = 0; awayStep = -1;

/* 手で押したとき用。背景音が仕掛かっていても、標準タイマーにも渡せる。 */
function awayTimerNow(){
  var l = stepLeft();
  if(l < 1) return;
  awayKind = (awayKind==="sound" || awayKind==="both") ? "both" : "timer";
  awaySec = l; awayAt = Date.now(); awayStep = curStep;

}
function awaySoundOff(){ DB.awaySound = false; save(); awayClear(); render(); }
/* 仕掛けたものが鳴るまでの残り（秒）。過ぎていればマイナス。 */
function awayRest(){ return awaySec - Math.floor((Date.now()-awayAt)/1000); }
/* 実行画面の「離席」ブロック。**いま何が仕掛かっているかを必ず出す。**
   仕掛かっていないのに仕掛かっていると思い込むのが、いちばん困るため。 */
function awayBlock(s){
  if(!s || s.auto) return "";
  var l = stepLeft(), rest = awayRest();
  var armed = (awayStep===curStep && !!awayKind && rest > -60);
  var h = "";
  if(armed && (awayKind==="sound" || awayKind==="both")){
    h += '<div class="hint" style="border-color:#7a9ec4;color:#bcd6ee">'
       + '<b>🔔 離席中に鳴る音を仕掛けました。</b>'
       + (rest>0 ? 'あと <b>'+mmss(rest)+'</b> で鳴ります。' : 'もう鳴ったはずの時刻です。')
       + '他のアプリを開いていても鳴ります（この画面を閉じない限り）。'
       + (awayKind==="both" ? '<br>iPhone標準のタイマーにも渡してあります。' : '')
       + '<br><b>鳴らしているあいだ、Spotify・YouTubeの音は止まります。</b></div>';

/* --- v4: いまの経過秒数（一時停止中は止めて見せる） --- */
function curElapsed(){ return autoPaused ? Math.floor((pauseAt-startAt)/1000) : elapsed(); }

/* --- v4: autoセットのステップ位置を elapsed() から逆算する ---
   render() のたびに呼ぶ。ステップが変わった瞬間だけチャイム・音声を鳴らす。
   一時停止中は何もしない（curElapsed が動かないため呼んでも実質同じだが、
   念のため早期リターンする）。 */
/* 注意: render() の中から呼ぶため、ここでは render() を呼び直さない
   （呼ぶと二重実行になり、あとに呼ばれた側の描画で上書きされて画面が
   壊れる）。完了時は view を書き換えるだけにして、続きの分岐は
   呼び出し元の render() に任せる。 */
function autoTick(s){
  if(!s || !s.auto || autoPaused || autoFinished) return;
  var st = stepsOf(s), cum = 0, idx = -1, e = curElapsed();
  for(var i=0;i<st.length;i++){
    cum += st[i].sec;
    if(e < cum){ idx = i; break; }
  }
  if(idx < 0){
    /* 最後まで来た。ここが「自然に終わる」経路。手動終了（enterDone）と
       必ず同じ分岐（fromPreSleep/fromWake）を通す。render()の中から
       呼ばれているため、ここではrender()を呼び直さない（呼び出し元が続きを描く）。 */
    for(var k=0;k<st.length;k++) doneSet[k] = "done";
    autoFinished = true;
    if(tick){ clearInterval(tick); tick = null; }
    chimeDone();
    logRun();
    if(fromPreSleep){ fromPreSleep=false; stop(); sleepEnterWatch(); view="sleepWatch"; }
    else if(fromWake){ fromWake=false; stop(); sleepBackToWatch(); view="sleepWatch"; }
    else { view = "done"; }
    return;
  }
  if(idx !== curStep){
    for(var j=curStep; j<idx && j<st.length; j++){ if(!doneSet[j]) doneSet[j] = "done"; }
    curStep = idx;
    phaseChime(st[idx].text);   /* v16: 呼吸法は吸う・止める・吐くで音を変える。それ以外は従来どおりの音 */
    if(s.voice) speak(sayOf(st[idx]));  /* 3列目があればそれを、無ければ（…）を外した文言を読む */
  }
}
/* v4: 手動で次のステップへ進める（合わないときのための逃げ道） */
function autoSkip(){
  var s = setOf(curId); if(!s || !s.auto) return;
  var st = stepsOf(s), cum = 0;
  for(var i=0;i<=curStep && i<st.length;i++){ cum += st[i].sec; }
  var base = autoPaused ? pauseAt : Date.now();
  startAt = base - (cum+0.05)*1000;
  if(autoPaused) pauseAt = base;
  render();
}
/* v4: 一時停止・再開 */
/* v20 (2026-09-03 ご依頼): 自動で進むセットの「＋1分／＋5分」。
   自動セットは経過秒から位置を逆算しているので、開始時刻を後ろへずらすと
   いまの項目がそのぶん延び、あとの項目は長さを変えずに後ろへずれる。
   autoSkip が開始時刻を前へ動かすのと、まったく同じ仕組みの逆向き。 */
var autoShift = 0;
function autoExtend(sec){
  if(autoFinished) return;

}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function mmss(s){ var m=Math.floor(Math.abs(s)/60), x=Math.abs(s)%60; return (s<0?"+":"")+m+":"+String(x).padStart(2,"0"); }
/* v5: ステップの書式は「秒|画面の文言|読み上げ（省略可）」。
   3列目が無いときは、画面の文言から（…）を外したものを読み上げます。 */
function parseStep(line){
  var p = String(line).split("|");
  if(p.length<2) return { sec:60, text:String(line).trim(), say:"", app:"" };
  return {
    sec: parseInt(p[0],10)||60,
    text: (p[1]||"").trim(),
    say: (p[2]||"").trim(),
    app: p.length>3 ? p.slice(3).join("|").trim() : ""   /* v14: 開くアプリ */
  };
}
/* v14: ステップの行を組み立て直す（末尾の空欄は付けない） */
function joinStep(sec, text, say, app){
  var out = sec + "|" + text;
  if(app) return out + "|" + (say||"") + "|" + app;
  if(say) return out + "|" + say;
  return out;
}

/* v5: 繰り返しの周期を見つける（4-7-8のように同じ並びが続くセット用）。
   見つかれば「サイクル m/n」、見つからなければ「ステップ m/n」と出す。 */
function cyclePeriod(st){
  var n = st.length;
  if(n < 4) return 0;
  for(var p=1; p<=n/2; p++){
    if(n % p) continue;
    var ok = true;
    for(var i=p;i<n;i++){
      if(st[i].text !== st[i%p].text || st[i].sec !== st[i%p].sec){ ok = false; break; }
    }
    if(ok) return p;
  }
  return 0;
}

function sumSec(s){ return stepsOf(s).reduce(function(a,b){return a+b.sec;},0); }
/* v9: 全体の時間は、タップ式・自動進行のどちらも**必ずステップの合計**から出す。
   v8までは、タップ式のセットだけ「全体の制限時間（秒）」を手入力できた。
   ステップを直したのに全体の秒数だけ古いまま残る、という食い違いが起きるため、
   入力欄そのものを廃止した。データ側の s.limit はもう読まない（消しもしない）。
   0秒のセットで進捗バーが壊れないよう、下限を1秒にしてある。 */
function limitOf(s){ return Math.max(1, sumSec(s)); }
/* v9: 秒数を「2時間30分」「15分」「2分51秒」の形にする。
   1時間以上のときは秒を出さない（読みたいのは桁であって精度ではないため）。 */
function durLabel(sec){
  sec = Math.max(0, Math.round(sec));
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s2 = sec%60, out = "";
  if(h) out += h+"時間";
  if(m) out += m+"分";
  if(s2 && !h) out += s2+"秒";
  return out || "0秒";
}
/* ============================================================
   v20 (2026-09-03 ご依頼・回答欄 Q1〜Q3 のご回答を受けて実装)

   ③集中ブロック・就寝でも、既定のURLか専用のURLかを選べるようにする
   ============================================================ */
function minOf(sec){ return Math.floor(Math.max(0, sec||0)/60); }
function secOf(sec){ return Math.max(0, sec||0)%60; }

       + '<span class="stunit">分</span>'

       + '<span class="stunit">秒</span>';

/* 2欄から秒数を読む。両方とも空・0・マイナスなら def を返す
   （＝「変更なし」。1欄だったころの決まりをそのまま引き継いでいる）。 */
function msRead(idm, ids, def){
  var em = document.getElementById(idm), es = document.getElementById(ids);
  if(!em && !es) return def;
  var m = em ? parseInt(em.value,10) : 0;
  var x = es ? parseInt(es.value,10) : 0;
  if(!(m>0)) m = 0;
  if(!(x>0)) x = 0;
  var t = m*60 + x;
  return t>0 ? t : def;
}
/* --- 今週の実施状況 -------------------------------------------
   出すのは「起きた事実」だけ。やらなかった日は「・」になるだけで、
   ×も赤字も付けない（v1からの線引きをそのまま守る）。
   連続日数・達成率は、ここでも数えない。 */
function weekStart(t){
  var d = new Date(t); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay()+6)%7));   /* 月曜へ寄せる */
  return d.getTime();
}
function weekGrid(){
  var ws = weekStart(Date.now()), days = [], i;
  for(i=0;i<7;i++) days.push(ws + i*86400000);
  var todayK = dayKey(Date.now());
  var rows = {}, order = [];
  DB.log.forEach(function(r){
    if(r.t < ws || r.t >= ws + 7*86400000) return;
    var k = r.id || r.name;
    if(!rows[k]){ rows[k] = { icon:r.icon, name:r.name, d:{} }; order.push(k); }

/* ===== v30（2026-09-06 ご報告）: 🛟 も「寄り道」として扱う =====
   ご報告は「表示される崩れたボタンを押してそのセットを完了したら、途中だった
   セットに戻りたいのに戻れない」。**崩れたボタン＝🛟 崩れたあとの復帰**。
   実行中の画面の 🛟 は start() を直に呼んでいたため、
     ①いまのセットの控え（DB.run）が 🛟 の控えで上書きされ、
     ②🛟 を終えた時点の clearRun() でその控えごと消えていた。
   その結果、ホームの「途中のセットがあります」も出ず、戻る道が無くなっていた。
   画面には「どちらも いまのセットはそのまま残り、終わるとこの続きに戻ります」と
   書いてあったのに、実際にそうなっていたのは 🧸 だけ（v25の作りのまま）。
   ★ここで 🛟 も 🧸 と同じ控え（DB.detour）を取る。
   ★戻し方は 🧸 と変える。🛟 は「今日をここで終わらせて、次の合図まで戻る」
     ためのものなので、**自動では戻さない**。完了画面とホームに「続きに戻る」を
     出し、押したときだけ戻す（2026-09-06 ご指示）。 */
function rescueGo(id){
  if(!id) return;
  if(curId === id) return;
  if(curId){
    commitSeg();                 /* いま数えている区間をそこまでで確定 */
    detour = runSnap();
    DB.detour = detour; save();
  }
  start(id);
}
/* 寄り道の戻り先のセット（完了画面・ホームのボタンに名前を出す） */
function detourSet(){ var b = detour || DB.detour; return b ? setOf(b.id) : null; }
function detourBack(){ if(!angerReturn()) go("home"); }
function detourDrop(){ detour = null; DB.detour = null; save(); render(); }

function leaveRun(){
  /* v25: 🧸 を途中でやめた場合も、元のセットへ戻す（記録は残さない）。 */
  if(curId==="anger" && inDetour()){ angerReturn(); return; }
  /* 途中でやめた回。1つでもやれていれば残し、0のままなら残さない
     （画面を開いただけ・押し間違いを増やさないため） */
  if(runIdx===null && doneCount()>0) logRun();
  var wasWake = fromWake;
  fromPreSleep = false; fromWake = false;
  stop();
  /* v16: 中途覚醒の3択・呼吸法を「やめて最初に戻る」で切り上げた場合は、
     就寝そのものはまだ続いているので見守り画面へ（ホームには出さない）。
     就寝前ストレッチ側で切り上げた場合は、まだ就寝が始まっていないので
     ふつうにホームへ戻る。 */
  if(wasWake && DB.sleepActive){ wake=null; view="sleepWatch"; render(); return; }
  go("home");
}

/* --- iPhone標準タイマーの起動 --------------------------------
   このページはバックグラウンドでは止まります（iOSの仕様）。
   残り時間を画面上部（ダイナミックアイランド／ロック画面）に出せるのは
   iOS標準のタイマーだけなので、ショートカット経由でそれを起動します。
   ショートカットの作り方は 行動計画_2026-08-14 §10 を参照。 */
function nativeTimer(sec){
  sec = Math.max(1, Math.round(sec || left()));
  location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(DB.scName)
                + "&input=text&text=" + sec;
}

/* ============================ 画面 ============================ */
function render(){
  var h = "";
  if(view==="sxlib") h = viewSxLib();
  else if(view==="sximp") h = viewSxImp();
  else if(view==="sximpc") h = viewSxImpC();
  else if(view==="sxtext") h = viewSxText();
  else if(view==="sxspec") h = viewSxSpec();
  else if(view==="sxattach") h = viewSxAttach();
  else if(view==="scenes") h = viewScenes();
  else if(view==="words") h = viewWords();
  else if(view==="home") h = viewHome();
  else if(view==="run"){
    var _s = setOf(curId);
    if(_s && _s.auto) autoTick(_s);   /* 完了すると内部で view が "done"/"sleepWatch" に変わることがある */
    if(view==="run") h = viewRun();
    else if(view==="sleepWatch") h = viewSleepWatch();
    else h = viewDone();
  }
  else if(view==="mode") h = viewMode();   /* v38 */
  else if(view==="done") h = viewDone();
  else if(view==="sleepWatch") h = viewSleepWatch();
  else if(view==="wakeChoice") h = viewWakeChoice();
  else if(view==="wakeRun") h = viewWakeRun();
  else if(view==="focusStart") h = viewFocusStart();
  else if(view==="focus"){
    focusTick();                       /* 完了すると内部で view="focusDone" に変わることがある */
    if(view==="focus") focusTitle();
    h = (view==="focus") ? viewFocus() : viewFocusDone();
  }
  else if(view==="focusDone") h = viewFocusDone();
  else if(view==="focusSet") h = viewFocusSet();
  else if(view==="edit") h = viewEdit();
  else if(view==="log") h = viewLog();
  else if(view==="review") h = viewReview();
  else if(view==="about") h = viewAbout();
  else if(view==="scale") h = viewScale();
  else if(view==="backup") h = viewBackup();
  document.getElementById("app").innerHTML = h;
}

/* v16: 🛌就寝の見守り画面。経過時間は DB.sleepStartAt からの時刻計算
   （elapsed()と同じ考え方）。ホームに戻っても見守りは続く。 */

  h += '<div class="card"><div class="big">'+durLabel(sleepElapsed())+'</div><div class="bigsub">経過時間</div></div>';
  h += '<button class="btn big" onclick="sleepWake()">🌃 途中で起きてしまった</button>';
  h += '<button class="btn ghost" style="margin-top:14px" onclick="sleepEnd()">🌅 起きた（ここで終える）</button>';
  h += '<p class="note">合図の音（上がる3音・2回）と画面のフラッシュで気づけるか、実際に試してみてください。気づきにくければ音の高さ・回数を調整します。<br>バイブレーションはiOS Safariでは技術的に使えません。</p>';
  /* v20 (2026-09-03 ご依頼): 就寝の見守り画面からプレイリストを開く */
  if(DB.sleepSpotify){
    h += '<button class="btn ghost" onclick="openUrl(sleepSpUrl())">🎵 プレイリストを開く'+(sleepSpUrl()?'':'（未設定）')+'</button>';
    if(!sleepSpUrl()) h += '<p class="note">ホーム画面の「設定」でURLを入れると、次回からここで開けます。</p>';
  }
  h += '<button class="btn link" onclick="go(\'home\')">ホームへ戻る（見守りはそのまま続きます）</button>';
  return h;
}

  h += '<button class="setb" onclick="sleepChoose(\'water\')">🥤 炭酸水（常温の水）を飲む</button>';
  h += '<button class="setb" onclick="sleepChoose(\'note\')">✏️ 気になることを書く</button>';
  h += '<button class="setb" onclick="sleepChoose(\'stretch\')">🧘 ストレッチ（あおむけ）</button>';
  h += '<button class="btn link" onclick="wakeCancel()">やめて見守り画面に戻る</button>';

}
var WAKE_TITLE = { water:"🥤 炭酸水を飲む", note:"✏️ 気になることを書く", stretch:"🧘 ストレッチ（あおむけ）" };
function viewWakeRun(){
  if(!wake){ view="sleepWatch"; return viewSleepWatch(); }
  var left = Math.max(0, WAKE_SEC - Math.floor((Date.now()-wake.startAt)/1000));
  var h = '<h1>'+(WAKE_TITLE[wake.choice]||"")+'</h1>';
  h += '<div class="card"><div class="big" id="wk_left">'+mmss(left)+'</div><div class="bigsub">残り時間</div></div>';
  if(wake.choice==="water"){
    h += '<p class="note">常温の水か炭酸水を、ゆっくり一口飲んでください。深呼吸を2〜3回。</p>';
  }else if(wake.choice==="note"){
    h += '<label>気になっていること（書くだけで大丈夫です）</label>'
       + '<textarea class="inp" id="wk_text" style="min-height:100px" oninput="wakeNoteInput()" placeholder="解決しなくて構いません。出すだけで十分です">'+esc(wake.text)+'</textarea>';
  }else if(wake.choice==="stretch"){
    h += '<p class="note">あおむけでできるものだけにしてあります。無理のない範囲で。</p>';
    WAKE_STRETCH.forEach(function(t){ h += '<div class="step"><div class="t">'+esc(t)+'</div></div>'; });
  }
  h += '<p class="note">3分たつと、自動で🫁4-7-8呼吸法に入ります。終わったらまた見守り画面に戻ります。</p>';
  h += '<button class="btn link" onclick="wakeCancel()">やめて見守り画面に戻る</button>';
  return h;
}

/* v5: 一覧に出す「9サイクル・自動進行」「5ステップ」などの短い説明 */
function countLabel(s){
  var st = stepsOf(s);
  if(!s.auto) return st.length+'ステップ';
  var p = cyclePeriod(st);
  return (p ? (st.length/p)+'サイクル' : st.length+'ステップ') + '・自動進行';
}

     勝手に再開しない。押したときだけ続きに戻る。離れていた時間は数えない。 */

    var ps = setOf(pr.id), pd = pendDone(pr), pn = ps ? ps.steps.length : 0;

       + esc(ps ? ps.icon+" "+ps.name : pr.id)+'）'
       + '<small>'+pd+' / '+pn+' 項目まで済み ・ そこまでの実施 '+durLabel(Math.max(0, pr.elapsed||0))

     押さないかぎり戻らない。「戻らずに閉じる」で消せる（消しても記録は消えない）。 */

/* ============================================================
   v31（2026-09-07 ご依頼）: その日の実績を、日次ノートに貼れる形で書き出す

     自己嫌悪を書いた欄のとなりに未実施の一覧が並ぶ形にしないため

   ★貼り先は日次ノートの「📍 そのときの状況・原因やきっかけ」の下。
     🫧・🤝（自己受容の2行）の近くには置かないこと。
   ★日付をまたいだ分（中途覚醒・夜間の記録）は、時刻どおり翌日側の日に入る。
     前夜のことを書くときは、2日ぶんコピーして続けて貼ってよい。
   ★コピー欄（textarea）は必ず画面の中に置くこと。画面の外へ逃がすと

var copyDay = null;
function logCopyGo(k){ copyDay = (copyDay===k ? null : k); render(); }
function sameDayK(t, k){ return dayKey(t)===k; }
function looseLabel(sid, text){
  /* ぶら下げ先の回が無いもの（就寝・中途覚醒など）の見出し。
     step の文言に「中途覚醒対応（書く）」のように名前が入っているので、
     セット名を前に足すと二重になる。絵文字だけ添える。 */
  var s = setOf(sid);
  if(s) return s.icon+" "+s.name+" ／ "+text;
  if(sid==="wake")  return "🌃 "+text;
  if(sid==="sleep") return "🛌 "+text;
  return text;
}
/* その日の記録を、Obsidianの折りたたみカラウト1個にまとめる。
   記録が1件も無い日は空文字を返す（空のカラウトを貼らせないため）。 */
function dayMd(k){
  var runs = DB.log.filter(function(r){ return r && sameDayK(r.t,k); })
                   .slice().sort(function(a,b){ return a.t-b.t; });
  var times = (DB.times||[]).filter(function(r){ return r && sameDayK(r.t,k); })
                   .slice().sort(function(a,b){ return a.t-b.t; });
  var notes = (DB.notes||[]).filter(function(r){ return r && sameDayK(r.t,k); })
                   .slice().sort(function(a,b){ return a.t-b.t; });
  var kids = [], i;
  for(i=0;i<runs.length;i++) kids.push([]);
  var loose = [];
  /* 項目の実測とメモは、その直前に始まった同じセットの回にぶら下げる。
     ぶら下げ先が無いもの（就寝・中途覚醒など）は、時刻の順にそのまま並べる。 */
  function attach(r, text){
    var at = -1;
    for(var j=0;j<runs.length;j++){ if(runs[j].id===r.sid && runs[j].t <= r.t+1000) at = j; }
    if(at<0) return false;
    kids[at].push({ t:r.t, s:text });
    return true;
  }
  times.forEach(function(r){
    var t = noteKey(r.step) + " … " + durLabel(r.act||0)
          + (r.plan ? "（予定 "+durLabel(r.plan)+"）" : "");
    if(!attach(r, t)) loose.push({ t:r.t, s:looseLabel(r.sid, t) });
  });
  notes.forEach(function(r){
    var t = "💬 " + noteKey(r.step) + ": " + noteKey(r.v);
    if(!attach(r, t)) loose.push({ t:r.t, s:t });
  });
  var rows = [];
  runs.forEach(function(r, idx){
    var head = hhmm(r.t)+" "+String(r.icon||"")+" "+String(r.name||"")
             + (r.sec ? " ／ "+durLabel(r.sec) : "");
    if(r.items && r.items.length) head += " ／ "+r.items.join(" → ");
    if(r.memo) head += " ／ "+r.memo;
    kids[idx].sort(function(a,b){ return a.t-b.t; });
    rows.push({ t:r.t, s:head, sub:kids[idx] });
  });
  loose.forEach(function(x){ rows.push({ t:x.t, s:hhmm(x.t)+" "+x.s, sub:[] }); });
  rows.sort(function(a,b){ return a.t-b.t; });
  if(!rows.length) return "";
  var out = "> [!abstract]- 🕒 ルーティン実績 "+dayLabel(rows[0].t)+"\n";
  rows.forEach(function(x){
    out += "> - "+x.s+"\n";
    x.sub.forEach(function(y){ out += ">     - "+hhmm(y.t)+" "+y.s+"\n"; });
  });
  return out;
}
function dayCopyPanel(k){
  var md = dayMd(k);
  return '<div class="card">'

    + '「📍 そのときの状況・原因やきっかけ」の下に貼ってください。<br>'
    + 'やらなかった項目・達成率は入れていません。<b>🫧・🤝（自己受容の2行）の近くには貼らないでください。</b><br>'
    + '夜中に日付をまたいだ分は<b>翌日の日</b>に入ります。前夜のことを書くときは、2日ぶん続けて貼ってください。</p>'

}

           + (r.memo ? '<em style="display:block;font-style:normal;color:#8a94a6;font-size:12.5px;margin-top:3px">'+esc(r.memo)+'</em>' : '')
           + '</span>'
           + '<span class="ld">'+what+'</span>'
           + '<button class="lxb'+(logDelArmed===gi?' armed':'')+'" onclick="delLog('+gi+')">'
           + (logDelArmed===gi?'消す？':'✕')+'</button></div>';
      });
      s += '</div>';
    });
    return s;
  }
  h += '<div class="sec" style="color:#e0a86a">この7日間</div>';
  h += recent.length ? block(recent)

  if(older.length){

  }
  h += '<p class="note">1件だけ消すときは、その行の <b>✕</b> を2回押してください（1回目で「消す？」に変わります）。'
     + '消した回は<b>上の「今週」の表からも消えます</b>。項目ごとの実施時間（📊 振り返り）は別に持っているので、そちらは残ります。</p>';
  h += '<button class="btn ghost" onclick="go(\'home\')">戻る</button>';
  h += '<button class="btn danger'+(clearArmed?' armed':'')+'" onclick="clearLog()">'
     + (clearArmed ? 'もう一度押すと記録をすべて消します' : '記録をすべて消す')+'</button>';
  if(clearArmed) h += '<div class="warn">回数も履歴も0に戻ります。<b>元に戻せません。</b>やめるときは「戻る」を押してください。</div>';
  return h;
}
/* v30: 1件だけ消す。2回押し。走っている最中でも矛盾しないよう、
   この回の記録の位置（runIdx / fIdx）もずらす。 */
function delLog(i){
  if(logDelArmed!==i){ logDelArmed = i; render(); return; }
  if(i>=0 && i<DB.log.length){
    DB.log.splice(i,1);
    if(DB.count>0) DB.count--;
    if(runIdx!==null){ if(i===runIdx) runIdx = null; else if(i<runIdx) runIdx--; }
    if(typeof fIdx!=="undefined" && fIdx!==null){ if(i===fIdx) fIdx = null; else if(i<fIdx) fIdx--; }
    save();
  }
  logDelArmed = null; render();
}
function clearLog(){
  if(!clearArmed){ clearArmed = true; render(); return; }
  DB.log = []; DB.count = 0; clearArmed = false; save(); render();
}

  var st = stepsOf(s), lim = foldSum(s), l = left();   /* v34: 畳んだ回は畳んだ合計 */
  /* v14: 数字はその項目の残り時間にする（全体は下に小さく添える）。
     全体の残りを大きく出しても、いま何分使っているかは分からないため。 */
  var cur = st[Math.min(curStep, st.length-1)];
  var sl = (curStep < st.length) ? stepLeft() : 0;
  var sSec = (curStep < st.length) ? stepSec(curStep) : 1;
  var spct = Math.max(0, Math.min(100, (stepUsed()/Math.max(1,sSec))*100));
  var h = '<h1>'+esc(s.icon)+' '+esc(s.name)+modeMark()+'</h1>'+(s.note ? '<p class="sub">'+esc(s.note)+'</p>' : '');   /* v38 */
  /* v34: 畳んでいる回は、いちばん上でそう言い切る。基準が変わっていることを
     画面のどこかに常に出しておかないと、あとで記録を読み違える。 */
  if(foldOn && foldMode==="joy"){
    /* v38: 🎉 の帯。**選んだ楽しみを、衝動が来る時刻まで手元に残す**のがこの帯の役目。
       8/7の提案で「選ぶ時刻と要る時刻が2〜3時間ズレるから効かない」と判断した部分は、
       アプリ側のここで潰している。消さないこと。 */
    h += '<div class="hint" style="border-color:#c4a06a;color:#e8c99a">'
       + '<b>🎉 今夜の楽しみ：'+esc(joyName || "（選んでいません）")+'</b><br>'
       + 'ここまでは<b>手をつけたら済み</b>でかまいません。目安の時間は<b>いまの半分</b>です。'
       + '<b>短くしているのは、これをやるためです。</b></div>';
  }else if(foldOn){
    h += '<div class="hint" style="border-color:#7a9ec4;color:#bcd6ee">'
       + '<b>🔋 今日は休息にしています。</b>項目は減らしていません。<b>手をつけたら済み</b>でかまいません。'
       + '目安の時間は<b>いまの半分</b>にしてあります。</div>';
  }
  h += snBox(st);            /* v37: 後回しにしている項目があるときだけ出る */
  h += awayBackBox(s, st);   /* v35: 1分以上離れて戻ってきたときだけ出る */
  h += '<div class="card">';
  h += '<div class="bigsub" style="margin-bottom:2px">'+(curStep<st.length ? (curStep+1)+' / '+st.length+'　'+esc(cur?cur.text:"") : 'ぜんぶ終わりました')+'</div>';
  h += '<div class="big'+(sl<0?' over':'')+'">'+mmss(sl)+'</div>';
  h += '<div class="bigsub">'+(sl<0 ? 'この項目の予定を過ぎています。続けて大丈夫です' : 'この項目の残り時間')+'</div>';
  h += '<div class="bar"><i style="width:'+spct+'%"></i></div>';
  h += '<p class="note" style="text-align:center;margin-top:9px">この項目に使った時間 <b>'+mmss(stepUsed())+'</b>'
     + (accOf(curStep) ? '（中断前の '+mmss(accOf(curStep))+' を含む）' : '')
     + (stepExtra[curStep] ? '（延長 +'+durLabel(stepExtra[curStep])+'）' : '')
     + '<br>ルーティン全体： 経過 '+mmss(elapsed())+' ／ 目安 '+durLabel(lim)
     + '<br>このまま進むと <b>'+etaLabel()+'</b> ごろ終わります</p>';
  h += '</div>';
  /* いまの項目を、大きく押せる形で進める */
  if(curStep < st.length){
    /* v20: いま見ている項目が済みなら、主ボタンは取り消しに変わる
       （行のタップで済みの項目へ移れるようになったため） */
    if(doneSet[curStep]){
      h += '<button class="btn big" onclick="undoStep('+curStep+')">↩ この項目の「'
         + (doneSet[curStep]==="skip" ? 'スキップ' : 'できた') + '」を取り消す</button>';
    }else{
      h += '<button class="btn big" onclick="toggleStep('+curStep+')">✓ '+(foldOn?'手をつけた':'できた')+' — 次へ</button>';
    }
    h += '<div class="row" style="margin-top:9px">'
       + '<button class="btn ghost" style="margin-top:0" onclick="extendStep(60)">＋1分 延長</button>'
       + '<button class="btn ghost" style="margin-top:0" onclick="extendStep(300)">＋5分 延長</button>'
       + '</div>';
    /* v35（2026-09-10 ご依頼 ＝ 指示_2026-09-10 R4）: 離席中に鳴るものを
       ここに1か所へまとめた。v32の「残り30秒で鳴るタイマー」もこの中に畳んである。 */
    h += awayBlock(s);
    /* v37（2026-09-11 ご依頼）: ⏸ あとで戻る。**スキップの上**に置く。
       「いまはできない」ときに最初に目に入るのがスキップだと、あとでやる
       つもりのものが「やらなかった項目」として記録に残るため。 */
    if(!snOn()){
      h += '<button class="btn ghost" onclick="snAskOpen()">⏸ この項目は あとで戻る</button>';
    }
    if(snAsk){
      h += '<div class="iobox">'
         + '<label style="margin-top:0">⏸ 何分後に戻りますか</label>'
         + '<p class="note" style="margin-top:5px">'
         + '「<b>'+esc(cur?cur.text:"")+'</b>」をここで一旦とめて、<b>次の項目へ進みます</b>。<br>'
         + '・この項目は<b>スキップにはなりません</b>（あとでやるものとして残ります）<br>'
         + '・ここまでに使った <b>'+mmss(stepUsed())+'</b> はそのまま残り、戻ったときは<b>続きから</b>数えます<br>'
         + '・待っているあいだの時間は、この項目には入りません</p>'
         + '<div class="row" style="margin-top:8px">'
         + '<button class="btn ghost" style="margin-top:0" onclick="snGo(3)">3分後</button>'
         + '<button class="btn ghost" style="margin-top:0" onclick="snGo(5)">5分後</button>'
         + '<button class="btn ghost" style="margin-top:0" onclick="snGo(10)">10分後</button>'
         + '</div>'
         + '<div class="row" style="margin-top:8px">'
         + '<button class="btn ghost" style="margin-top:0" onclick="snGo(15)">15分後</button>'
         + '<button class="btn ghost" style="margin-top:0" onclick="snAskClose()">やめる</button>'
         + '</div>'
         + '<p class="note" style="margin-top:7px">⏰ 戻る合図は<b>iPhoneの標準タイマー</b>へ渡します'
         + '（ショートカット「'+esc(DB.scName)+'」。押すと一度ショートカットAppへ飛びます）。'
         + '<b>タイマーは1本しか持てない</b>ので、待っているあいだは<b>いまの項目の残り時間は渡しません</b>。</p>'
         + '</div>';
    }
    h += '<button class="btn ghost" onclick="skipStep()">↷ この項目をスキップ</button>';
    /* v26（2026-09-05 ご指摘）: 🧸 と 🛟 は画面のいちばん下にあり、
       **いちばん急いで押したいときに、いちばん遠かった。**スキップの直下へ移した。
       この2つは「いま出た衝動・いま出たイライラ」に対する入口なので、
       スクロールを挟ませない。並びは横2つで、指が届く位置に置く。 */
    var em = [];
    if(!s.rescue && rescues().length)
      em.push('<button class="btn ghost" style="margin-top:0;border-color:#c4a06a;color:#e8c99a" onclick="rescueGo(\''+rescues()[0].id+'\')">🛟 崩れた</button>');
    if(curId !== "anger" && angerSet())
      em.push('<button class="btn ghost" style="margin-top:0;border-color:#c98b8b;color:#e8b4b4" onclick="angerGo()">🧸 イライラした</button>');
    /* v34→v38: 🌗 今日の自分に。**どのセットでも押せる**（2026-09-08 ご指定）。
       🛟 と違って別のセットへは飛ばない。いまのセットをそのまま、基準だけゆるめる。
       ★v38 で 🔋 単独から 🌗（押したあとに 🔋休息 / 🎉楽しむ）へ差し替えた。
         ボタンの数は増えていない（🛟 🧸 🌗 の3つのまま）。 */
    if(!foldOn) em.push('<button class="btn ghost" style="margin-top:0;border-color:#7a9ec4;color:#bcd6ee" onclick="modeAsk(\''+curId+'\',\'run\')">🌗 今日の自分に</button>');
    else        em.push('<button class="btn ghost" style="margin-top:0;border-color:#7a9ec4;color:#bcd6ee" onclick="foldUndo()">🌗 やめる</button>');
    if(em.length){
      h += '<div class="row" style="margin-top:9px">'+em.join("")+'</div>';
      h += '<p class="note" style="margin-top:4px">'
         + (em.length>1 ? '<b>🛟</b>は復帰の1手へ、<b>🧸</b>は1分だけ離れる形へ。' : (curId!=="anger"&&angerSet() ? '<b>🧸</b>は1分だけ離れる形へ。' : '<b>🛟</b>は復帰の1手へ。'))
         + 'どちらも<b>いまのセットはそのまま残ります</b>。🧸 は終わるとそのまま続きに戻り、'
         + '🛟 は終わったあとに<b>「続きに戻る」</b>が出ます（押さなければ戻りません）。</p>';
    }
    /* v34の確認パネルは v38 で view="mode"（viewMode）へ移した。実行中から押しても
       ホームから押しても、確認の文言が1か所になるようにするため。ここには残さない。 */
    var ap = appOf(cur);
    if(ap) h += '<button class="btn ghost" onclick="openApp(\''+esc(cur.app)+'\')">'+ap.icon+' '+esc(ap.name)+'を開く</button>';
    h += '<p class="note">延長は<b>この回だけ</b>です。セットの秒数は変わりません（実際にかかった時間は、延長した分もそのまま記録されます）。</p>';
  }
  st.forEach(function(x,i){
    var cls = doneSet[i] ? "step done" : (i===curStep ? "step cur" : "step");
    var mark = doneSet[i]==="done" ? "✓" : (doneSet[i]==="skip" ? "–" : (i===snStep ? "⏸" : (i+1)));   /* v37 */
    var ap0 = appOf(x);
    h += '<div class="'+cls+'" onclick="gotoStep('+i+')"><div class="n">'+mark+'</div>'
       + '<div class="t">'+(doneSet[i]==="skip"?'<s>'+esc(x.text)+'</s>':esc(x.text))
       + (ap0 ? ' <span class="tag">'+ap0.icon+' '+esc(ap0.name)+'</span>' : '')
       + '<em>目安 '+durLabel(foldOn?foldSecOf(x.sec):x.sec)+(foldOn?'（畳み中）':'')+(stepExtra[i]?'（延長 +'+durLabel(stepExtra[i])+'）':'')
       + (usedOf(i) ? '　／　'+(doneSet[i] ? '実際 ' : (i===curStep ? '使用中 ' : (i===snStep ? '後回し ' : '中断中 ')))+mmss(usedOf(i)) : '')
       + (i===snStep ? '　／　<b>⏸ あと '+mmss(snLeft())+' で戻ります</b>' : '')   /* v37 */
       + '</em></div></div>';
    /* v13: いまの項目にだけ、メモと「次に足す」を出す。
       全部の行に出すと、行そのもののタップと取り合いになるため。
       v20: 行のタップは「移る」だけになったが、ボタンを全行に出すと
       画面が長くなるだけなので、いまの項目にだけ出す形は変えていない。 */
    if(i===curStep && !doneSet[i]){
      var prev = notesFor(s.id, x.text);
      if(inputOpen === "name:"+i){
        h += '<div class="iobox">'
           + '<label style="margin-top:0">この項目の名前を直す</label>'
           + '<input class="inp" type="text" id="io_text" value="'+esc(x.text)+'">'
           + '<p class="note" style="margin-top:5px">直した内容は<b>このセットにそのまま残ります</b>。'
           + '過去のメモと実績は、直す前の文言のほうに残ります（消えはしません）。</p>'
           + '<div class="row" style="margin-top:8px">'
           + '<button class="btn ghost" style="margin-top:0" onclick="closeInput()">やめる</button>'
           + '<button class="btn save" style="margin-top:0" onclick="runRename('+i+')">直す</button>'
           + '</div></div>';
      }else if(inputOpen === "note:"+i){
        h += '<div class="iobox">'
           + '<label style="margin-top:0">やってみて、どう感じましたか</label>'
           + '<input class="inp" type="text" id="io_text" placeholder="例）これは要らない気がする／もっと短くていい">'
           + '<div class="row" style="margin-top:8px">'
           + '<button class="btn ghost" style="margin-top:0" onclick="closeInput()">やめる</button>'
           + '<button class="btn save" style="margin-top:0" onclick="runNote('+i+')">残す</button>'
           + '</div></div>';
      }else if(inputOpen === "add:"+(i+1)){
        h += '<div class="iobox">'
           + '<label style="margin-top:0">ここに1つ足す（この項目の次）</label>'
           + '<div class="stline">' + msInputs("io_min","io_sec2",60)
           + '<input class="inp" type="text" id="io_text" placeholder="やること"></div>'
           + '<div class="row" style="margin-top:8px">'
           + '<button class="btn ghost" style="margin-top:0" onclick="closeInput()">やめる</button>'
           + '<button class="btn save" style="margin-top:0" onclick="runAdd('+(i+1)+')">足す</button>'
           + '</div></div>';
      }else{
        h += '<div class="stbtns" style="margin:-4px 0 10px">'
           /* v21 (2026-09-03 ご依頼): 実行中に順番を入れ替える。
              入れ替えた順番はセットにそのまま残る。 */
           + '<button onclick="moveStep('+i+',-1)"'+(i===0?' disabled':'')+'>↑ 上へ</button>'
           + '<button onclick="moveStep('+i+',1)"'+(i===st.length-1?' disabled':'')+'>↓ 下へ</button>'
           + '<button onclick="openInput(\'note:'+i+'\')">💬 メモ</button>'
           + '<button onclick="openInput(\'name:'+i+'\')">✏️ 名前を直す</button>'
           + '<button onclick="openInput(\'add:'+(i+1)+'\')">＋ 次に足す</button>'
           + '</div>';
      }
      if(prev.length){
        h += '<p class="note" style="margin:-4px 0 10px">前に書いたもの： '+esc(prev[0].r.v)
           + ' <span style="opacity:.7">（'+dayLabel(prev[0].r.t)+'）</span>'
           + (prev.length>1 ? ' ほか'+(prev.length-1)+'件' : '')+'</p>';
      }
    }
  });
  /* v20 (2026-09-03 ご依頼): 末尾ではなく「いま実行している項目の次」へ入れる。
     思いついたことをその場で足したとき、そのまま次にやれるようにするため。
     いちばん下に置きたいときは、編集画面の「＋ ステップを追加する」で足せる。 */
  if(inputOpen === "add:end"){
    h += '<div class="iobox">'
       + '<label style="margin-top:0">いまの項目の次に1つ足す</label>'
       + '<div class="stline">' + msInputs("io_min","io_sec2",60)
       + '<input class="inp" type="text" id="io_text" placeholder="やること"></div>'
       + '<div class="row" style="margin-top:8px">'
       + '<button class="btn ghost" style="margin-top:0" onclick="closeInput()">やめる</button>'
       + '<button class="btn save" style="margin-top:0" onclick="runAdd('+(curStep+1)+')">足す</button>'
       + '</div></div>';
  }else{
    h += '<button class="btn ghost" onclick="openInput(\'add:end\')">＋ いまの項目の次に1つ足す</button>';
  }
  h += '<p class="note"><b>行をタップすると、その項目へ移ります（完了にはなりません）。</b>完了は上の「✓ できた — 次へ」です。<br>'
     + '<b>移ると、それまでの項目は「中断中」になり、そこまでに使った時間はその項目に残ります。</b>戻ってくれば、その続きから数え直します。順番が前後しても、かかった時間は項目ごとに合計で記録されます。<br>'
     + '下の行から始めても構いません（上は「–」になるだけで、失敗にはなりません）。<br>'
     + '<b>足したもの・入れ替えた順番は、このセットにそのまま残ります。</b>やりながら形を作っていって構いません。</p>';
  /* v35: こちらは**セット全体**の残り。項目ごとのタイマーは上の awayBlock にある。
     どちらも同じ標準タイマーを使うので、押すと上の項目ごとの分は上書きされる。 */
  h += '<button class="btn ghost" onclick="nativeTimer()">⏱ かわりに<b>セット全体</b>の残り'+Math.max(1,Math.round(left()/60))+'分をタイマーへ渡す</button>';
  h += '<p class="note">この画面は他のアプリを開くと止まります（戻れば時刻から計算し直すのでズレません）。'
     + '<br><b>ふだんは上の「この項目の残り」で足ります。</b>こちらは「終わりの時刻だけ知りたい」ときに使ってください。'
     + '<b>標準タイマーは1つしか動かないので、押すと項目ごとの分は上書きされます。</b></p>';
  if(s.spotify){
    h += '<button class="btn ghost" onclick="openSpotify()">🎵 プレイリストを開く'+(spUrl(s)?'':'（未設定）')+'</button>';
  }
  h += '<button class="btn" onclick="finishNow()">ここまでで終える</button>';
  /* v26: 🛟・🧸 は上（スキップの直下）へ移した。ここには出さない。
     ただし**全項目を終えたあと**（curStep が範囲外）は上のブロックが出ないので、
     そのときだけ下に出す（終わってから「崩れた」になることがあるため）。 */
  if(curStep >= st.length){
    if(!s.rescue && rescues().length) h += '<button class="btn ghost" onclick="start(\''+rescues()[0].id+'\')">🛟 崩れた — 復帰の1手へ</button>';
    h += angerBtn();
  }
  h += backToFocus();
  h += '<button class="btn link" onclick="leaveRun()">'+(inDetour()&&curId==="anger" ? 'やめて、さっきの続きに戻る' : 'やめて最初に戻る')+'</button>';
  return h;
}
/* v25: 実行中に出る「🧸 イライラした」。押すと寄り道して、終わったらここへ戻る。
   ★🧸 自身の実行中には出さない（二重に飛ばない）
   ★寄り道であることを画面に書く。押しても、いまのセットは消えない */
function angerBtn(){
  if(curId === "anger") return '';
  if(!angerSet()) return '';
  return '<button class="btn ghost" style="border-color:#c98b8b;color:#e8b4b4" onclick="angerGo()">🧸 イライラした — 1分だけ離れる</button>'
       + '<p class="note" style="margin-top:4px"><b>いまのセットはそのまま残ります。</b>終わると、この続きに戻ります。</p>';
}
/* v7: 集中からの寄り道中だけ出る「集中に戻る」。それ以外では空文字。 */
function backToFocus(){
  if(!fromFocus || !fStart) return '';
  return '<button class="btn ghost" style="border:1px solid #e0a86a;color:#e0a86a" onclick="focusResume()">'
       + '▶ 集中に戻る（休憩まで '+mmss(fLeftAll())+'）</button>';
}

/* --- v5: 自動で進むセットの実行画面 ---------------------------
   タップで進める一覧ではなく、いまのステップだけを大きく出す。
   残り秒数は「このステップの残り」。全体の経過は下に小さく添える。
   v4では「3ステップ＝1サイクル」を決め打ちしていたが、呼吸法以外の
   セット（休憩ルーティン等）では意味を成さないため、繰り返しの周期を
   自動検出する形にした（cyclePeriod）。繰り返しが無いセットでは
   「ステップ m/n」と出し、次に来るステップを1行だけ添える。 */
function viewRunAuto(s){
  var st = stepsOf(s), e = curElapsed();
  var cum = 0, stepEnd = 0, cur = st[Math.min(curStep,st.length-1)];
  var curText = cur ? cur.text : "";
  for(var i=0;i<st.length;i++){
    cum += st[i].sec; stepEnd = cum;
    if(i===curStep) break;
  }
  var remainInStep = Math.max(0, stepEnd - e);
  var p = cyclePeriod(st), head;
  if(p){
    head = 'サイクル '+Math.min(Math.floor(curStep/p)+1, st.length/p)+' / '+(st.length/p);
  }else{
    head = 'ステップ '+Math.min(curStep+1, st.length)+' / '+st.length;
  }
  var nx = st[curStep+1];
  var h = '<h1>'+esc(s.icon)+' '+esc(s.name)+'</h1>'+(s.note ? '<p class="sub">'+esc(s.note)+'</p>' : '');
  /* v25: 寄り道であることを、戻り先の名前つきで出す */
  if(curId==="anger" && inDetour()){
    var bk = setOf((detour||DB.detour||{}).id);
    if(bk) h += '<div class="hint">終わると <b>'+esc(bk.icon)+' '+esc(bk.name)+'</b> の続きに戻ります。<br>そちらの済みの印も、使った時間も、そのまま残っています。</div>';
  }
  h += '<div class="card">';
  h += '<div class="bigsub">'+head+'</div>';
  /* 文言が長いセット（休憩ルーティン等）でも1〜2行に収まるよう字を小さくする */
  var fs = curText.length>26 ? 20 : (curText.length>13 ? 26 : 34);
  h += '<div class="big" style="font-size:'+fs+'px;line-height:1.4;margin:2px 0 8px">'+esc(curText)+'</div>';
  h += '<div class="big'+(autoPaused?' over':'')+'">'+remainInStep+'</div>';
  h += '<div class="bigsub">'+(autoPaused ? '一時停止中' : 'このステップの残り秒数')+'</div>';
  h += '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,(e/limitOf(s))*100))+'%"></i></div>';
  h += '<p class="note" style="text-align:center;margin-top:8px">'
     + (nx ? '次： '+esc(nx.text)+'<br>' : '次でおしまいです<br>')
     + '全体の経過 '+mmss(e)+' ／ 目安 '+durLabel(limitOf(s))
     + '<br>このまま進むと '+etaLabel()+' ごろ終わります</p>';
  h += '</div>';
  h += '<p class="note">タップして進める必要はありません。'+(s.voice?'合図（音・声）':'合図（音）')+'に合わせて進めてください。<br>合わない長さのときは、下の「次へ」で先に進めます。</p>';
  /* v18: 「次へ▶」を操作しやすくした（2026-09-01ご依頼）。
     従来は「一時停止」と横並びの.btn.ghost（幅50%・小さめ）で、暗い部屋・
     眠い状態での操作には狙いにくかった。タップ式実行画面の主ボタン
     （「✓ できた — 次へ」＝.btn.big）と同じ見た目・同じ幅いっぱいの
     ボタンに格上げし、押し間違えにくい一時停止/再開は下の小さめのボタンへ
     退けた。押す機能そのもの（autoSkip）は変えていない。 */
  h += '<button class="btn big" onclick="autoSkip()">次へ ▶</button>';
  h += '<button class="btn ghost" style="margin-top:9px" onclick="autoPauseToggle()">'+(autoPaused?'▶ 再開する':'⏸ 一時停止する')+'</button>';
  /* v20 (2026-09-03 ご依頼): 自動で進むセットにも延長を付けた
     （タップ式には v14 から入っていたが、こちらには無かった） */
  /* v26（2026-09-05 ご指摘）: 自動で進むセットでも、🧸 を下まで探しに行かせない。
     「次へ ▶」「一時停止」のすぐ下に置く。 */
  if(curId !== "anger" && angerSet()){
    h += '<button class="btn ghost" style="margin-top:9px;border-color:#c98b8b;color:#e8b4b4" onclick="angerGo()">🧸 イライラした — 1分だけ離れる</button>';
    h += '<p class="note" style="margin-top:4px"><b>いまのセットはそのまま残ります。</b>終わると、この続きに戻ります。</p>';
  }
  h += '<div class="row" style="margin-top:9px">'
     + '<button class="btn ghost" style="margin-top:0" onclick="autoExtend(60)">＋1分 延長</button>'
     + '<button class="btn ghost" style="margin-top:0" onclick="autoExtend(300)">＋5分 延長</button>'
     + '</div>';
  h += '<p class="note">延長するのは<b>いまのステップだけ</b>です。あとのステップの長さは変わらず、終わる時刻がそのぶん後ろへずれます。'
     + (autoShift ? '<br>この回はここまでに <b>'+durLabel(autoShift)+'</b> 延ばしています。' : '')
     + '</p>';
  /* v13: 自動で進むセットは、いちばん下にだけ足せる
     （途中に差し込むと、経過秒から逆算しているいまの位置が巻き戻るため） */
  if(inputOpen === "add:end"){
    h += '<div class="iobox">'
       + '<label style="margin-top:0">いちばん下に1つ足す</label>'
       + '<div class="stline">' + msInputs("io_min","io_sec2",60)
       + '<input class="inp" type="text" id="io_text" placeholder="やること"></div>'
       + '<div class="row" style="margin-top:8px">'
       + '<button class="btn ghost" style="margin-top:0" onclick="closeInput()">やめる</button>'
       + '<button class="btn save" style="margin-top:0" onclick="runAdd(null)">足す</button>'
       + '</div></div>';
  }else{
    h += '<button class="btn ghost" onclick="openInput(\'add:end\')">＋ いちばん下に1つ足す</button>';
  }
  /* v8: 自動で進むセットにも、iPhone標準タイマーへの手渡しを付けた（従来はタップ式だけだった） */
  var autoLeft = Math.max(1, limitOf(s) - e);
  h += '<button class="btn ghost" onclick="nativeTimer('+autoLeft+')">⏱ iPhoneのタイマーにも残り'+Math.max(1,Math.round(autoLeft/60))+'分を渡す</button>';
  if(s.spotify){
    h += '<button class="btn ghost" onclick="openSpotify()">🎵 プレイリストを開く'+(spUrl(s)?'':'（未設定）')+'</button>';
    if(!spUrl(s)) h += '<p class="note">このセットの編集画面か、ホーム画面の「設定」にプレイリストのURLを入れると、次回からここで開けます。</p>';
  }
  h += '<button class="btn" onclick="finishNow()">'+(curId==="anger"&&inDetour() ? 'ここまでにして、さっきの続きに戻る' : 'ここまでで終える')+'</button>';
  /* v26: 🧸 は上（「次へ ▶」の下）へ移した。ここには出さない。 */
  h += backToFocus();
  h += '<button class="btn link" onclick="leaveRun()">'+(inDetour()&&curId==="anger" ? 'やめて、さっきの続きに戻る' : 'やめて最初に戻る')+'</button>';
  return h;
}

/* ===== v38: 🌗 今日の自分に の画面 ==================================
   ホームからも実行中からも、ここ1か所に来る。確認の文言を2か所に持たない。
   3段：①休息/楽しむ ②（楽しむのとき）楽しみを1つ ③確認して始める。 */
function viewMode(){
  var s = setOf(modeSetId) || setOf(curId);
  var h = '<h1>🌗 今日の自分に</h1>';
  if(s) h += '<p class="sub">'+esc(s.icon)+' '+esc(s.name)+'</p>';
  if(!modePick){
    h += '<p class="note" style="margin-top:0">どちらを選んでも、<b>項目は1つも減りません。順番も変わりません。</b>'
       + '変わるのは「済み」の基準と目安の時間だけで、<b>明日は元どおりに始まります。</b></p>';
    h += '<button class="setb" style="border-color:#7a9ec4" onclick="modePickMode(\'rest\')">🔋 休息'
       + '<small>疲れた・しんどい日に。終わったあとに「これをやって休む」を1つ選びます</small></button>';
    h += '<button class="setb" style="border-color:#c4a06a" onclick="modePickMode(\'joy\')">🎉 楽しむ'
       + '<small>気持ちを緩めたい日・お祝いの日に。<b>先に楽しみを決めて</b>、そのぶん手前を短くします</small></button>';
    h += '<button class="btn link" onclick="modeCancel()">やめる</button>';
    return h;
  }
  if(modePick==="joy" && !joyPend){
    h += '<div class="sec">🎉 今夜の楽しみを1つ</div>';
    h += '<p class="note" style="margin-top:0"><b>残った時間でやることではありません。</b>先に決めて、そのために手前を短くします。</p>';
    h += '<div class="dnrow">';
    restList().forEach(function(r,i){
      h += '<button class="btn ghost" style="margin-top:6px" onclick="modePickJoy('+i+')">'+esc(r)+'</button>';
    });
    h += '</div>';
    h += '<button class="btn link" onclick="modePickMode(\'\')">戻る</button>';
    return h;
  }
  h += '<div class="iobox" style="border-color:'+(modePick==="joy"?"#c4a06a":"#7a9ec4")+'">';
  h += (modePick==="joy")
     ? '<label style="margin-top:0">🎉 今夜は「'+esc(joyPend)+'」</label>'
     : '<label style="margin-top:0">🔋 今日は休息にしますか</label>';
  h += '<p class="note" style="margin-top:5px">'
     + (modePick==="rest" ? '<b>やめることを、いま決めてください。</b>作り置き／書類／片づけ／自己研鑽 — 声に出すか、指で数えるだけでかまいません。<br>' : '')
     + 'この回だけこうなります。<b>明日は元どおりに始まります。</b><br>'
     + '・項目は<b>1つも減りません。順番も変わりません</b><br>'
     + '・「できた」の意味が <b>やり切ったら済み → 手をつけたら済み</b> に変わります<br>'
     + '・目安の時間が<b>いまの半分</b>になります（下限30秒）<br>'
     + (modePick==="joy"
        ? '・実行中は、いちばん上に<b>「今夜の楽しみ」</b>が出続けます<br>'
          + '・終わったあとに<b>「'+esc(joyPend)+'」</b>とタイマー、そのあと<b>どう感じたか</b>を残せます'
        : '・終わったあとに<b>「今日はこれをやって休む」</b>を選びます')
     + '</p>';
  h += '<div class="row" style="margin-top:8px">'
     + '<button class="btn ghost" style="margin-top:0" onclick="modeCancel()">やめる</button>'
     + '<button class="btn save" style="margin-top:0" onclick="modeGo()">'
     + (modeFrom==="run" ? "決めた — 切り替える" : "決めた — 始める")+'</button>'
     + '</div></div>';
  h += (modePick==="joy")
     ? '<button class="btn link" onclick="modePickJoy(-1)">楽しみを選び直す</button>'
     : '<button class="btn link" onclick="modePickMode(\'\')">戻る</button>';
  return h;
}

function viewDone(){
  var s = setOf(curId), n = s.steps.length, d = 0;
  for(var i=0;i<n;i++){ if(doneSet[i]==="done") d++; }
  var within = left() >= 0;
  var h = '<h1>'+(d===n ? '完了' : 'ここまで')+'</h1>';
  h += '<div class="card"><div class="big ok">'+d+' / '+n+'</div>';
  h += '<div class="bigsub">'+esc(s.name)+modeMark()+' ・ '+mmss(Math.abs(elapsed()))+'</div></div>';   /* v38 */
  if(d===n && within) h += '<div class="hint">タイマーの中でやり切れました。</div>';
  else if(d===n) h += '<div class="hint">全部やれました。時間は超えましたが、見ているのは順番ではなく「やったかどうか」です。</div>';
  else if(d>0) h += '<div class="hint">'+d+'つやれました。<b>0か1かではありません。</b>次の合図でまた押せます。</div>';
  else h += '<div class="hint">今日はここまで。押したこと自体は残っています。次の合図でまた押してください。</div>';
  /* ===== v34（2026-09-08 ご依頼）: 畳んだ回の「積極的な休養」 =====================
     参考資料の3ステップ目「受動的な暇つぶし（無限スクロール）ではなく、自分で決めた
     休み方」をここに置く。**畳んだあとを空けたままにすると、そこが無限スクロールに
     吸われる。**だから第1回から入れてある（後回しにしない）。
     ★項目としては差し込んでいない（s.steps は1文字も変えない）。完了画面の1ブロック。 */
  if(foldOn && foldMode!=="joy"){
    h += '<div class="sec">🔋 今日はこれをやって休む</div>';
    if(!foldRest){
      h += '<p class="note" style="margin-top:0">1つ選んでください。<b>決めてから休むこと</b>が、この機能の中身です。</p>';
      h += '<div class="dnrow">';
      restList().forEach(function(r,i){
        h += '<button class="btn ghost" style="margin-top:6px" onclick="foldPickRest('+i+')">'+esc(r)+'</button>';
      });
      h += '</div>';
    }else{
      h += '<div class="hint" style="border-color:#7a9ec4;color:#bcd6ee"><b>'+esc(foldRest)+'</b><br>これをやって休むと決めました。</div>';
      h += '<button class="btn ghost" onclick="foldRestTimer()">⏰ 15分のタイマーを仕掛ける</button>';
      h += '<p class="note" style="margin-top:4px">押すと<b>iPhoneの標準タイマー</b>を15分で仕掛けます（ショートカットAppへ一度飛びます）。'
         + '<b>タイマーは終わりの合図で、やめる合図ではありません。</b>まだ続けたければ続けてください。</p>';
      h += '<button class="btn ghost" onclick="foldPickRest(-1)">選び直す</button>';
    }
  }
  /* ===== v38: 🎉 楽しむ の回 =========================================
     ★ここは「残った時間でやること」ではない。**開始前に決めたものを、
       決めたとおりにやるための画面**。だから選び直しではなく、まず実行の後押し
       （タイマー）を先に出し、そのあとに感想を置いている。
     ★感想は3択だけで終われる形にする。一言は任意。書けない日に手を増やさない。
     ★回数・達成率は出さない（v20・v31 と同じ方針）。 */
  if(foldMode==="joy"){
    h += '<div class="sec">🎉 今日はこれを楽しむと決めました</div>';
    h += '<div class="hint" style="border-color:#c4a06a;color:#e8c99a"><b>'+esc(joyName || "（選んでいません）")+'</b><br>'
       + '決めたのは<b>始める前</b>です。ここまでを短くしたのは、これをやるためです。</div>';
    h += '<div class="row" style="margin-top:0">'
       + '<button class="btn ghost" style="margin-top:0" onclick="joyMinAdd(-5)">− 5分</button>'
       + '<button class="btn save" style="margin-top:0" onclick="joyTimer()">⏰ '+joyMin+'分のタイマー</button>'
       + '<button class="btn ghost" style="margin-top:0" onclick="joyMinAdd(5)">＋ 5分</button>'
       + '</div>';
    h += '<p class="note" style="margin-top:4px">押すと<b>iPhoneの標準タイマー</b>を仕掛けます（ショートカットAppへ一度飛びます）。'
       + '<b>タイマーは終わりの合図で、やめる合図ではありません。</b>まだ続けたければ続けてください。</p>';
    h += '<div class="sec">やってみて、どうでしたか</div>';
    var JF = [["again","またやりたい"],["ok","ふつう"],["no","そうでもない"]];
    h += '<div class="row" style="margin-top:0">';
    JF.forEach(function(pf){
      h += '<button class="btn '+(joyFeel===pf[0]?"save":"ghost")+'" style="margin-top:0" onclick="joySetFeel(\''+pf[0]+'\')">'+pf[1]+'</button>';
    });
    h += '</div>';
    h += '<div class="dnrow" style="margin-top:9px">'
       + '<textarea class="inp" id="joynote" style="min-height:64px" placeholder="一言（任意）">'+esc(joyNote)+'</textarea>'
       + '<button class="btn ghost" onclick="joySetNote()">この一言を残す</button></div>';
    h += '<p class="note">3つのうち1つを押すだけで残ります（もう一度押すと取り消せます）。<b>一言は任意です。</b>'
       + 'ここに貯まったものが、次にどれを選ぶかの材料になります。<b>回数は数えていません。</b></p>';
  }
  /* v20 (2026-09-03 ご依頼): 「これで N 回目です」の累計表示は取りやめ。 */
  /* v21 (2026-09-03 ご依頼): 完了後のメモ入力欄は廃止した。
     「メモは実施中に書くことがほとんどなので、セット完了後のメモ書きは不要」
     とのご指摘による。実行画面の「💬 メモ」はそのまま残してある。
     空いたところには、この回に項目ごとどれだけかかったかを並べる
     （順番を前後させても合計で数えている＝中断して戻った分も足してある）。 */
  if(!s.auto){
    h += '<div class="sec">この回、項目ごとにかかった時間</div>';
    h += '<div class="dnrow">';
    stepsOf(s).forEach(function(x,i){
      var u = usedOf(i);
      h += '<div class="nline"><span style="flex:1">'
         + (doneSet[i]==="done" ? '✓ ' : (doneSet[i]==="skip" ? '– ' : '・'))
         + (doneSet[i]==="skip" ? '<s>'+esc(x.text)+'</s>' : esc(x.text))+'</span>'
         + '<b style="flex:none;color:'+(u ? '#9ec8a4' : '#6f7a8c')+'">'+(u ? mmss(u) : '—')+'</b>'
         + '<span class="d">目安 '+durLabel(stepSec(i))+'</span></div>';
    });
    h += '</div>';
    h += '<p class="note">触った項目は、順番が前後していても<b>合計時間</b>で残しています（中断して戻った分も足しています）。飛ばした項目（–）は記録しません。<br>この時間は「📊 このルーティンの振り返り」で平均になり、予定の秒数を合わせ直す材料になります。</p>';
  }
  /* v33: 「Obsidianには入りません」は、記録ハブ（log.html）ができた時点で
     事実ではなくなった。送るのは実施の一覧だけで、Points Tracker には
     いまも入らない（点数はあちらが正）。 */
  h += '<p class="note">この記録はこの端末の中に残ります。<b>Points Tracker には入りません</b>（点数はあちらが正です）。<br>連続日数と達成率は数えていません。</p>';
  /* v34: 畳んだ回は「済み」の意味が違うので、記録の読み方をここにも書いておく。 */
  if(foldOn) h += '<p class="note">'+(foldMode==="joy"?"🎉":"🔋")+' <b>この回は「今日の自分に」で始めています。</b>「済み」は<b>手をつけた</b>という意味で残ります（やり切った、ではありません）。記録の一覧にも '+(foldMode==="joy"?"🎉":"🔋")+' が付きます。</p>';   /* v38 */
  h += '<button class="btn ghost" onclick="location.href=\'log.html\'">📤 記録を送る（記録ハブ）</button>';
  h += '<p class="note">この回を、Obsidianの実施ログ（<b>20_Projects/Private/B.M.C/logs/</b>）へ追記できます。'
     + '<b>送っても記録はこのアプリから消えません。</b>あとでまとめて送っても同じです。</p>';
  /* v30（2026-09-06 ご指示）: 🛟 を終えたあと、元のセットの続きへ戻る口。
     自動では戻さない（🛟 は「今日をここで終わらせる」ためのものなので、
     押した人が選べる形にする）。押さずに「最初に戻る」を押しても、
     ホームに同じ戻り口が残る。 */
  var _bk = (curId!=="anger") ? detourSet() : null;
  if(_bk){
    h += '<button class="btn" onclick="detourBack()">▶ 続きに戻る（'+esc(_bk.icon)+' '+esc(_bk.name)+'）</button>';
    h += '<p class="note">🛟 の前にやっていたセットです。済んだ項目と、項目ごとにかかった時間はそのまま残っています。<b>離れていた時間は数えません。</b><br>いま戻らなくても、ホームに同じボタンが出ます。</p>';
  }
  if(!s.rescue && d<n) h += '<button class="btn ghost" onclick="go(\'run\');tick=setInterval(tickRender,250)">続きに戻る</button>';
  if(fromFocus && fStart){
    h += '<button class="btn" onclick="focusResume()">▶ 集中に戻る（休憩まで '+mmss(fLeftAll())+'）</button>';
    h += '<p class="note">呼吸のあいだ、集中の時計は止まっていました。押すとそこから続きます。</p>';
    h += '<button class="btn ghost" onclick="stop();go(\'home\')">最初に戻る</button>';
  }else if(fromBreak){
    /* v12: 休憩から始めたルーティンが終わったら、そのまま次の集中へ入れるようにする */
    h += '<button class="btn" onclick="stop();fromBreak=false;focusGo()">🎯 次の集中ブロックへ</button>';
    h += '<p class="note">時間帯は押した時刻から選び直します。行き先もそこで書けます。</p>';
    h += '<button class="btn ghost" onclick="stop();fromBreak=false;go(\'home\')">最初に戻る</button>';
  }else{
    h += '<button class="btn" onclick="stop();go(\'home\')">最初に戻る</button>';
  }
  h += '<button class="btn link" onclick="stop();revGo(s.id)">📊 このルーティンの振り返りを見る</button>';
  h += '<button class="btn link" onclick="stop();go(\'log\')">📖 これまでの記録を見る</button>';
  return h;
}

/* ============================================================
   v6: 仕事の集中ブロック（2026-08-19 ご依頼）
   ------------------------------------------------------------
   ご依頼: 午前2時間・午後90分・夕方50分で休憩の合図。いきなり2時間を
   やろうとせず、まずは短いところから15分ごとに切り替える。

   【目的（ご本人の言葉）】休憩・回復のためではなく、**複数プロジェクトを
   同時に走らせているときに、ひとつの作業へ没頭（作業興奮）して他が止まる
   のを防ぐため**。この時間内・今日中に成果を出すための締め切り効果。
   → したがって「区切り」は休みではなく**別の行き先へ移る合図**であり、
      画面の主役は「休憩までの残り時間」（＝締め切り）にしてある。
   → ブロックを始める前に行き先を書いておける。書かなくても始められる
      （入力を必須にすると、押すこと自体をやめてしまうため）。

   【正直に書く制約】このページからは通知を出せない（iOSにはWebページから
   通知を予約する手段がない。navigator.vibrate もiOS Safariは非対応）。
   閉じていても鳴らせるのはiPhone標準タイマーだけなので、開始時にショート
   カット経由で「休憩まで」の1本を渡す。iOSのタイマーは1本しか持てないため、
   途中の区切りは**アプリを開いているときだけの合図**になる（区切りごとに
   自動でショートカットへ飛ばすことはしない。ユーザー操作なしの遷移はiOSが
   止めるうえ、作業中に画面を奪うため）。必要なときのために、実行画面に
   「次の区切りをタイマーに渡す」ボタンを手動用に置いてある。

   【音】既定はオフ（オフィス・会議のため）。設定でいつでも戻せる。
   ※没頭を切るのが目的の道具で音を消すのは弱い合図になる、という指摘は
     画面内にも書いてある。判断はご本人。

/* ブロックを区切りに割る。seg の並びを順に使い、最後の値はそれ以降ずっと続く。
   端数（最後の区切りの半分未満）は1つ前に足して、細切れを作らない。 */
function segsFor(slot){
  var total = Math.max(60, (DB.focus.len[slot]||60)*60);
  /* v23: 子供と一緒モードだけは5分刻みの並びを使う（仕事用の 15/25/40 を持ち込まない） */
  var src = (slot==="kids") ? DB.focus.segKids : DB.focus.seg;
  var arr = (src && src.length) ? src : [25];
  var out = [], rest = total, i = 0;
  while(rest > 0 && out.length < 60){
    var s = Math.max(60, (arr[Math.min(i,arr.length-1)]||25)*60);
    if(s >= rest){ out.push(rest); rest = 0; break; }
    out.push(s); rest -= s; i++;
  }
  /* 最後が1つ前より短くなったら1つ前に足す＝「短くなって終わる」形を作らない
     （徐々に伸ばす、という並びの意図に反するため。90分なら 15/25/40/10 ではなく 15/25/50） */
  if(out.length > 1 && out[out.length-1] < out[out.length-2]){
    out[out.length-2] += out.pop();
  }
  return out;
}
function segLabel(slot){
  return segsFor(slot).map(function(s){ return Math.round(s/60)+'分'; }).join(' → ');
}

function fChime(end){

function notifyOK(){

  catch(e){ return false; }

function sxSec(t){

  if(!t) return null;
  var m=t.match(/^(?:(\d+)\s*(?:分|min|m))?\s*(?:(\d+)\s*(?:秒|sec|s))?$/i);
  if(m&&(m[1]||m[2])) return (+(m[1]||0))*60+(+(m[2]||0));

   入っていても読める（AIがまとめて出したときのため）。 */
function sxParse(text){
  var progs=[], errs=[], skips=[];
  var lines=String(text||"").replace(/\r/g,"").split("\n");
  var p=null;
  lines.forEach(function(raw,i){
    var ln=i+1;
    var s2=raw.replace(/　/g," ").trim();
    if(!s2) return;
    if(s2.slice(0,3)==="```") return;
    if(/^[-=—ー─＝]{3,}$/.test(s2)) return;
    if(s2.charAt(0)==="#") return;
    s2=s2.replace(/^[・･]\s*/,"").replace(/^[-*]\s+/,"").replace(/^\d+[.)]\s+/,"");
    var t=s2.replace(/｜/g,"|");
    var k=s2.match(/^([^:：|｜]{1,8})\s*[:：]\s*(.*)$/);
    if(k && SXKEY[k[1].trim()]!==undefined && t.indexOf("|")<0){
      var f=SXKEY[k[1].trim()], v=k[2].trim();
      if(f==="_") return;
      if(f==="name"){
        if(!v){ errs.push(ln+"行目：プログラム名が空です"); return; }
        p={name:v,tag:"",desc:"",warn:"",items:[],line:ln}; progs.push(p); return;
      }
      if(!p){ errs.push(ln+"行目：「プログラム名:」より前に「"+k[1]+"」があります"); return; }
      p[f]=v; return;
    }
    if(t.indexOf("|")>=0){
      var c=t.split("|").map(function(x){return x.trim();});
      if(/^(種目名?|名前|ポーズ名?)$/.test(c[0])&&/^(秒数?|時間)$/.test(c[1]||"")) return;
      if(/^[-–—:：\s]*$/.test(c.join(""))) return;
      if(!p){ errs.push(ln+"行目：「プログラム名:」がまだ書かれていません"); return; }
      if(!c[0]){ errs.push(ln+"行目：種目名が空です"); return; }
      var sec=sxSec(c[1]||"");
      if(sec===null||sec<=0){ errs.push(ln+"行目：秒数が読み取れません（"+(c[1]?c[1]:"空欄")+"）"); return; }
      if(sec>1800){ errs.push(ln+"行目：秒数が長すぎます（"+sec+"秒）"); return; }
      var side=(c[2]||"").trim();
      if(/^([-–—ー]|なし|無し|none)$/i.test(side)) side="";
      p.items.push({n:c[0], s:sec, side:side||"", how:(c[3]||"").trim(), ease:(c[4]||"").trim()});
      return;
    }
    skips.push(ln+"行目：" + (s2.length>26?s2.slice(0,26)+"…":s2));
  });
  progs.forEach(function(q){ if(!q.items.length) errs.push(q.line+"行目：「"+q.name+"」に種目が1つもありません"); });
  if(!progs.length) errs.push("プログラムが見つかりません。「プログラム名: 〜」の行が必要です。");
  return {progs:progs, errs:errs, skips:skips};
}

  if(g.warn) L.push("注意: "+g.warn);

function sxCopy(id){
  var t=document.getElementById(id); if(!t) return;
  t.removeAttribute("readonly");
  try{ t.select(); t.setSelectionRange(0,999999); }catch(e){}
  var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  t.setAttribute("readonly","");
  var done=function(r){ alert(r?"コピーしました":"コピーできませんでした。長押しで選択してコピーしてください"); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(function(){done(true)},function(){done(ok)});
  }else done(ok);
}

/* ---- セットへ組み込む ---- */
function sxAttachGo(setId){
  var s=setOf(setId); if(!s) return;
  collect();
  sxTarget=setId; sxPick=null;
  var sx=s.sx;
  if(sx && typeof sx.from==="number"){ sxHead=sx.from; sxTail=Math.max(0, s.steps.length-(sx.from+sx.len)); }
  else { sxHead=0; sxTail=0; }
  go("sxattach");
}
function sxPickProg(id){ sxPick=(sxPick===id?null:id); render(); }
function sxSetHead(v){ sxHead=Math.max(0, Math.min(20, sxHead+v)); render(); }
function sxSetTail(v){ sxTail=Math.max(0, Math.min(20, sxTail+v)); render(); }
function sxDoAttach(){
  var s=setOf(sxTarget), g=sxProgs().filter(function(x){return x.id===sxPick;})[0];
  if(!s||!g) return;
  var head=Math.min(sxHead, s.steps.length);
  var tail=Math.min(sxTail, Math.max(0, s.steps.length-head));
  var body=sxToSteps(g);
  var before=s.steps.slice(0, head);
  var after=tail? s.steps.slice(s.steps.length-tail) : [];
  s.steps=before.concat(body, after);
  s.sx={id:g.id, name:g.name, from:head, len:body.length};
  save();
  alert("「"+g.name+"」を組み込みました。\n\n"+s.icon+" "+s.name+" は "+s.steps.length+"項目・"+durLabel(limitOf(s))+" になりました。");
  sxTarget=null; sxPick=null;
  go("edit");
}

     + '<button class="btn ghost" style="margin-top:0;width:auto;padding:6px 12px" onclick="sxSetHead(1)">＋</button></span></div>';
  h += '<div class="toggle" style="margin-top:8px"><b>おわりに残す</b><span>'

    });
  }else{
    h += '<div class="prev" style="opacity:.6">（上でプログラムを選んでください）</div>';
  }
  if(tail) st.slice(st.length-tail).forEach(function(x){ h += '<div class="prev">そのまま　'+esc(x.text)+'</div>'; });
  var removed=Math.max(0, st.length-head-tail);

  h += '<button class="btn link" onclick="sxTarget=null;go(\'edit\')">やめる</button>';
  return h;
}

function focusBegin(mode){
  focusGrab();
  /* v11: 音の開通と通知の許可は「押した操作の中」でしかできない。必ずここで。 */
  unlockAudio();

    fSegs = [];

  }else{

  fDone = false; fIdx = null; fMemo = ""; fFlash = Date.now();

  if(mode === "ask"){ fAsking = true; fPauseAt = Date.now(); fPaused = true; }
  if(tick) clearInterval(tick);
  tick = setInterval(tickRender, 250);
