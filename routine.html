<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Switch">
<meta name="theme-color" content="#12151c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2312151c'/%3E%3Ccircle cx='90' cy='96' r='46' fill='none' stroke='%23e0a86a' stroke-width='14'/%3E%3Crect x='81' y='34' width='18' height='58' rx='9' fill='%23e0a86a'/%3E%3C/svg%3E">
<title>B.M.C. 切り替えルーティン</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#12151c;color:#e8ecf2;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-user-select:none;user-select:none;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 44px}
h1{font-size:19px;margin:4px 0 2px;letter-spacing:.02em}
.sub{color:#8a94a6;font-size:12.5px;margin:0 0 16px;line-height:1.65}
.card{background:#1a1f29;border:1px solid #262d3a;border-radius:14px;padding:15px 16px;margin-bottom:11px}
.card.del{border-color:#5c3138;background:#1f1618}
.sec{font-size:12px;color:#6f7a8c;margin:24px 0 9px;letter-spacing:.06em}
.btn{
  display:block;width:100%;padding:17px;border-radius:12px;border:none;
  background:#e0a86a;color:#20160c;font-size:17px;font-weight:700;
  font-family:inherit;cursor:pointer;margin-top:10px;
}
.btn.ghost{background:#232b38;color:#cbd5e3;font-weight:600;font-size:14px;padding:12px}
.btn.link{background:none;color:#8a94a6;font-size:13px;padding:9px;font-weight:500;text-decoration:underline}
.btn.save{background:#2a3a2c;color:#cfe6d2}
.btn.danger{background:#3a2427;color:#e8b3b8}
.btn.danger.armed{background:#7d2c35;color:#fff}
.row{display:flex;gap:9px}
.row>*{flex:1}

.big{font-size:64px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 2px;letter-spacing:-.03em;line-height:1.1}
.big.over{color:#8a94a6;font-size:52px}
.big.ok{color:#9ec8a4}
.bigsub{text-align:center;color:#8a94a6;font-size:13px;margin-bottom:6px}
.bar{height:5px;background:#232b38;border-radius:3px;overflow:hidden;margin:10px 0 2px}
.bar>i{display:block;height:100%;background:#e0a86a}

.setb{
  display:block;width:100%;text-align:left;background:#1a1f29;border:1px solid #262d3a;
  color:#e8ecf2;border-radius:13px;padding:15px 16px;font-size:15.5px;font-family:inherit;
  cursor:pointer;margin-bottom:10px;line-height:1.5;font-weight:600;
}
.setb small{display:block;color:#8a94a6;font-size:12.5px;font-weight:400;margin-top:4px;line-height:1.6}
.setb.rescue{background:#221a1a;border-color:#40292a}

.step{
  display:flex;gap:12px;align-items:flex-start;background:#1a1f29;border:1px solid #262d3a;
  border-radius:12px;padding:14px 15px;margin-bottom:9px;cursor:pointer;
}
.step.cur{border-color:#e0a86a;background:#211d18}
.step.done{opacity:.42}
.step .n{
  flex:none;width:26px;height:26px;border-radius:8px;background:#232b38;color:#8a94a6;
  font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:1px;
}
.step.cur .n{background:#e0a86a;color:#20160c}
.step.done .n{background:#2a3a2c;color:#9ec8a4}
.step .t{flex:1;font-size:15px;line-height:1.55}
.step .t em{display:block;font-style:normal;color:#8a94a6;font-size:12px;margin-top:3px}
.step .t s{color:#6f7a8c}

.hint{color:#cbd5e3;font-size:12.5px;line-height:1.7;background:#1f1c19;border:1px solid #2f2a24;border-radius:10px;padding:11px 13px;margin-top:11px}
.warn{color:#e8b3b8;font-size:12.5px;line-height:1.7;background:#1f1618;border:1px solid #4a2a2f;border-radius:10px;padding:11px 13px;margin-top:11px}
.note{color:#6f7a8c;font-size:12px;line-height:1.75;margin:10px 0 0}
textarea{
  width:100%;min-height:170px;background:#12151c;border:1px solid #303a4a;color:#e8ecf2;
  border-radius:10px;padding:12px;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  line-height:1.8;-webkit-user-select:text;user-select:text;
}
label{display:block;font-size:12.5px;color:#8a94a6;margin:12px 0 5px}
.inp{
  width:100%;background:#12151c;border:1px solid #303a4a;color:#e8ecf2;
  border-radius:10px;padding:12px;font-size:15px;font-family:inherit;
  -webkit-user-select:text;user-select:text;
}
.inp.icon{width:74px;text-align:center;font-size:21px;padding:10px;flex:none}
.iconrow{display:flex;gap:9px;align-items:center}
.tools{display:flex;gap:7px;margin-top:12px}
.tools button{
  flex:1;background:#232b38;border:1px solid #303a4a;color:#cbd5e3;border-radius:10px;
  padding:11px 4px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600;
}
.tools button:disabled{opacity:.32}
.tools button.rm{background:#3a2427;border-color:#5c3138;color:#e8b3b8}
.tools button.rm.armed{background:#7d2c35;border-color:#9c3a45;color:#fff}
.tag{display:inline-block;background:#232b38;border:1px solid #303a4a;border-radius:999px;padding:2px 9px;font-size:11px;color:#8a94a6;margin-left:6px;vertical-align:middle}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.toggle b{font-weight:600;font-size:14px}
.sw{width:52px;height:31px;border-radius:999px;background:#303a4a;border:none;position:relative;cursor:pointer;flex:none}
.sw.on{background:#e0a86a}
.sw i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#e8ecf2;transition:left .15s}
.sw.on i{left:24px}

/* v14: いまの項目を進める大きなボタン */
.btn.big{padding:26px 17px;font-size:21px;letter-spacing:.02em}

/* v13: 実行中にその場で開く入力欄 */
.iobox{background:#12151c;border:1px solid #e0a86a;border-radius:11px;padding:11px 12px;margin:-4px 0 11px}
.iobox label{margin-top:0}
.dnrow{background:#1a1f29;border:1px solid #262d3a;border-radius:11px;padding:11px 12px;margin-bottom:9px}
.dnrow .h{font-size:14.5px;line-height:1.5;margin-bottom:7px}
.dnrow .h s{color:#6f7a8c}
.nlist{margin:6px 0 0}
.nline{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#cbd5e3;line-height:1.6;padding:4px 0}
.nline .d{flex:none;color:#6f7a8c;font-size:11.5px;padding-top:1px}
.nline .x{flex:none;background:none;border:none;color:#6f7a8c;font-size:15px;cursor:pointer;padding:0 2px;font-family:inherit}

/* v11: 区切りの合図で画面全体を2回光らせる */
.flash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;pointer-events:none;background:#e0a86a;opacity:0;animation:fl 1.5s ease-out}
@keyframes fl{0%{opacity:0}6%{opacity:.8}22%{opacity:.08}40%{opacity:.75}60%{opacity:.06}80%{opacity:.5}100%{opacity:0}}

.past{
  background:#1a1f29;border:1px solid #262d3a;border-radius:12px;padding:11px 14px;
  margin:0 0 14px;color:#8a94a6;font-size:13px;line-height:1.7;text-align:center;
}
.past b{color:#e0a86a;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
/* v10: ステップを1行ずつ編集する行 */
.strow{background:#12151c;border:1px solid #262d3a;border-radius:11px;padding:10px 11px;margin-bottom:8px}
.stline{display:flex;gap:7px;align-items:center}
.stline .inp{padding:10px}
.stsec{width:72px;flex:none;text-align:center;padding:10px 4px}
.stunit{flex:none;color:#6f7a8c;font-size:12px;width:16px}
/* v20 (2026-09-03): 今週の実施状況の表（累計回数の表示のかわり） */
.wk{overflow-x:auto;margin:8px 0 0}
.wk table{width:100%;border-collapse:collapse;font-size:13px}
.wk th{color:#6f7a8c;font-weight:500;font-size:11.5px;padding:3px 2px;text-align:center}
.wk td{text-align:center;padding:6px 2px;border-top:1px solid #1c222c;color:#9ec8a4}
.wk td.nm{text-align:left;color:#c9d1de;padding-right:8px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .td{background:#1a1f28}
.wk .e{color:#39404d}
.stbtns{display:flex;gap:6px;margin-top:8px}
.stbtns button{
  flex:1;background:#232b38;border:1px solid #303a4a;color:#cbd5e3;border-radius:9px;
  padding:9px 2px;font-size:12.5px;font-family:inherit;cursor:pointer;font-weight:600;
}
.stbtns button:disabled{opacity:.3}
.stbtns button.rm{background:#3a2427;border-color:#5c3138;color:#e8b3b8}

.lrow{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid #222833;font-size:14px}
.lrow:last-child{border-bottom:none}
.lt{flex:none;width:44px;color:#6f7a8c;font-size:12.5px;font-variant-numeric:tabular-nums}
.ln{flex:1;line-height:1.5}
.ld{flex:none;color:#8a94a6;font-size:12.5px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ============================================================
   B.M.C. 切り替えルーティン (routine.html) ＝ Switchアプリ
   作成: B.M.C.(Claude) / 2026-08-14
   v2: セットの追加・削除・並べ替えに対応
   v3: 2026-08-15 実行の記録（履歴）を追加
   v4: 2026-08-19（指示_2026-08-19_2、Quick Memoご依頼）
     ご依頼3点: ①4-7-8呼吸法・3分ガイド ②音声で切り替えを案内
                ③起動時にSpotify瞑想プレイリストを開く ④各ステップに
                タイマーを持たせ、終わったら自動で次のタイマーが動く流れ

     【④が本体】従来のセットはすべて「タップで完了→次へ」（toggleStep）で、
     ステップの秒数は目安の文字表示だけでした。④はこれと別に「自動で進む」
     モード（set.auto=true）を新設。既存5セットは一切変えず（auto無し＝
     従来どおりタップ式）、新設の🫁セットだけ auto:true にしています。
     auto セットは「いま何ステップ目にいるべきか」を毎回 elapsed()（開始
     時刻からの経過）から計算し直します（autoTick）。setTimeoutの連鎖で
     進めると、iOSでバックグラウンドに回った瞬間に止まって二度と進まない
     ため採用していません。elapsed() は他の機能同様、画面に戻ったときに
     時刻から再計算されるので、バックグラウンドから戻っても正しい位置に
     復帰します（ズレるのは、飛ばされた間の音声・チャイムだけ）。

     ②音声案内は Web Speech API（speechSynthesis）。未対応環境では
     何も起きないだけで、タイマー自体は変わらず動きます。DB.voice で
     オンオフ（既定オン）。

     ③Spotifyは「起動時にURLを新規タブで開く」だけの実装です。プレイ
     リストのURL自体はご本人しか持っていないため、こちらでは決め打ち
     せず、設定欄（DB.spotifyUrl）に入れていただく形にしました。未入力
     なら何もしません。iOSでSpotifyアプリの前面に切り替わると、このペ
     ージ側のタイマーはバックグラウンド扱いになり一時停止しますが、
     ページに戻れば時刻から再計算されるので秒数はズレません（止まって
     見えるのは音声とチャイムだけ）。この制約は正直に画面内に書きました。

     【やらないこと】呼吸法セットも、他の5セットと同じ安全方針を継承
     しています。連続日数・達成率・「できなかった呼吸」は数えません。
     3分は目安であって、達成/未達の判定基準にはしません。

   v5: 2026-08-19（チャットでの追加ご要望）
     ご依頼: ①自動進行にするかタップ式にするかを「ルーティンごと」に選べる
             ②音声ガイドも自分で編集できる ③Spotifyのプレイリストも
             ルーティンごとに設定できる ④呼吸法を含む休憩ルーティンを
             自分で組めるようにする

     【v4の何を直したか】v4は「🫁セットだけが自動進行・音声・Spotify」と
     いう特別扱いでした。v5はその特別扱いを解体し、すべてを**セット単位の
     設定**に格下げしています。コード側に「呼吸法だけの分岐」は残っていま
     せん（breathSteps() は既定データを組み立てるためだけの関数です）。

     - set.auto      … 自動で進む（false/未設定＝従来どおりタップ式）
     - set.voice     … このセットで読み上げる
     - set.spotify   … 開始時にプレイリストを開く
     - set.spotifyUrl… このセット専用のURL。空ならホーム画面の既定URLを使う
     いずれも編集画面から切り替えられます。既存5セットの中身は1文字も
     変えていません（auto が無いセットは従来どおりタップ式のまま）。

     【ステップ書式の拡張】「秒|画面の文言|読み上げ」の3列目を追加しました。
     3列目を省略したときは、従来どおり画面の文言から（…）を除いたものを
     読みます。※副作用：文言そのものに「|」を含めていた場合、その後ろが
     読み上げ文として扱われます（画面表示は「|」の手前までになります）。

     【自動進行画面の汎用化】v4の実行画面は「3ステップ＝1サイクル」を決め
     打ちしており、呼吸法以外のセットでは表示が壊れました。v5はステップの
     繰り返し周期を自動検出し、繰り返しがあれば「サイクル m/n」、無ければ
     「ステップ m/n」と出します。次のステップも1行だけ添えます（休憩ルー
     ティンのように中身がばらばらのセットでは、次に何が来るかが要るため）。

     【自動進行セットの全体時間】ステップの合計から毎回計算します（制限
     時間の欄は出しません）。ステップを増減したときに総時間だけ古いまま
     残る事故を防ぐためです。

   v18: 2026-09-01（チャットでのご依頼・自動進行の「次へ▶」を操作しやすく）
     「あるルーティンをスキップして次に進むボタンを操作しやすい形にしてほしい」
     への対応。指しているのは自動進行セット（🌙就寝前ストレッチ・🫁呼吸法など）
     の実行画面にある「次へ▶」（autoSkip）だった。従来は「一時停止」と横並びの
     小さめのボタン（.btn.ghost、幅50%）で、暗い部屋・眠い状態では狙いにくい
     形だった。タップ式実行画面の主ボタンと同じ**.btn.big（幅いっぱい・大きい
     文字）に格上げし、一時停止/再開のほうを下の小さいボタンへ退けた**。
     押す機能（autoSkip）そのものは変えていない、見た目だけの変更。

   v17: 2026-09-01（チャットでのご依頼・セットのアーカイブ）
     「セット自体をアーカイブする機能がほしい。習慣化するまで少しずつ増やし
       ていきたいが、前に作ったセットも消さずに残しておきたい」への対応。
     - set.archived を新設。オンのセットは、ホーム一覧・休憩に移る候補・
       集中ブロックの選択肢からは外れるが、**編集画面からは「アーカイブ済み」
       として引き続き見え、いつでも復元できる**（削除とは別の、可逆な操作）。
     - 削除と違って中身（ステップ・メモ・実績）は一切消えない。振り返り
       画面（viewReview）は従来どおり全セットを対象にしており、アーカイブ
       後も過去の実績・メモはそのまま見られる。
     - 🛟（崩れたとき用）も、最後の1つでなければアーカイブできる（削除と
       同じ「最後の1つは残す」制約を流用）。

   v16: 2026-09-01（🛌就寝＋🌃中途覚醒対応・改めて実装）
     [経緯] 2026-08-23のチャットで一度実装し、memory.md には「v16/v17として
     実装完了・node上で40項目のテスト合格」と記録していたが、2026-09-01に
     セットのアーカイブ機能のご依頼を受けてファイルの中身を確認したところ、
     該当のコードが1行も存在しない
     ことが判明した（バージョンコメントもv15止まり）。記録だけが残り、実際
     の保存が抜けていたとみられる。今回、8/23の計画書とご回答の内容に基づき
     改めて実装した。

     [実装した流れ]
     1. ホーム画面の「🛌 就寝」を押す→非表示セット presleep（auto:true）が
        自動で進む：イヤホン切替(30s)→ストレッチ開始合図(30s)→ストレッチ
        アプリ「夜の基本」プログラムをそのまま7項目(計5分)→プレイリスト
        切替(30s)。
     2. 終わると見守り画面（sleepWatch）に入り、経過時間を表示し続ける
        （DB.sleepStartAt を localStorage に保存し、時刻から計算し直すので
        アプリを閉じても消えない）。
     3. 「🌃 途中で起きてしまった」→3択（🥤炭酸水／✏️気になることを書く／
        🧘ストレッチ〈あおむけのみ〉）→どれを選んでも3分固定のタイマー。
        「気になることを書く」は入力中だけ全体の再描画を止め、残り時間の
        数字だけ直接書き換える（v13の inputOpen と同じ考え方）。
     4. 3分たつと合図（上がる3音を2回＋画面フラッシュ。navigator.vibrate
        はiOS Safari非対応のため使わない）→自動で🫁4-7-8呼吸法（既存の
        breath478をそのまま流用）→終わったらまた見守り画面（sleepWatch）
        に戻る。
     5. 「🌅 起きた（ここで終える）」で終了。就寝からの合計経過時間だけを
        DB.times に1件残す（成功・失敗の判定は持たない）。

     [自動完了の合流点を1本化] presleepストレッチ・呼吸法のような auto
     セットが「時間切れで自然に終わる」経路（autoTick）と、「ここまでで
     終える」で手動に終わる経路（enterDone）が別々の処理になっていたため、
     どちらも同じ分岐（fromPreSleep / fromWake フラグ）を通るようにした。
     ここを1本化していないと、自然終了のときだけ就寝画面へ戻らずに通常の
     完了画面へ出てしまう、という8/23に一度見つかった不具合を再現しかね
     ないため、今回は最初からここを合わせて作った。
     【次に触る人向け】自動進行セットの完了処理を新しく足すときは、必ず
     autoTick の自然終了と enterDone の手動終了の両方を通しでテストする
     こと。片方だけ直すと同じ不具合が再発する。

     [呼吸法の音をフェーズで区別]（8/23のご要望より）吸う＝上がる2音、
     止める＝1音、吐く＝下がる2音（phaseChime）。読み上げ（TTS）は従来
     どおり残す。

     [持たせなかったもの] 画面ロック中の自動起動（iOS Safariの仕様で不可）、
     音声プレイリストの自動再生（アプリ外の操作のため対象外）、就寝・
     中途覚醒対応の成否記録（安全4条件により「実施したか」のみ）。

   v15: 2026-08-19（チャットでの追加ご依頼）

/* --- v4: 4-7-8呼吸法のステップを組み立てる ----------------------
   吸う4秒・止める7秒・吐く8秒＝1サイクル19秒。9サイクルで171秒（2:51）。
   「3分」はぴったりではなく目安です。回数を変えたいときは、既存の
   セット編集画面（ステップのテキストエリア）でそのまま増減できます。 */
function breathSteps(n){
  var out = [];
  for(var i=0;i<n;i++){
    out.push("4|吸う（4秒）");
    out.push("7|止める（7秒）");
    out.push("8|吐く（8秒）");
  }
  return out;
}

/* --- v4: いまの経過秒数（一時停止中は止めて見せる） --- */
function curElapsed(){ return autoPaused ? Math.floor((pauseAt-startAt)/1000) : elapsed(); }

/* --- v4: autoセットのステップ位置を elapsed() から逆算する ---
   render() のたびに呼ぶ。ステップが変わった瞬間だけチャイム・音声を鳴らす。
   一時停止中は何もしない（curElapsed が動かないため呼んでも実質同じだが、
   念のため早期リターンする）。 */
/* 注意: render() の中から呼ぶため、ここでは render() を呼び直さない
   （呼ぶと二重実行になり、あとに呼ばれた側の描画で上書きされて画面が
   壊れる）。完了時は view を書き換えるだけにして、続きの分岐は
   呼び出し元の render() に任せる。 */
function autoTick(s){
  if(!s || !s.auto || autoPaused || autoFinished) return;
  var st = stepsOf(s), cum = 0, idx = -1, e = curElapsed();
  for(var i=0;i<st.length;i++){
    cum += st[i].sec;
    if(e < cum){ idx = i; break; }
  }
  if(idx < 0){
    /* 最後まで来た。ここが「自然に終わる」経路。手動終了（enterDone）と
       必ず同じ分岐（fromPreSleep/fromWake）を通す。render()の中から
       呼ばれているため、ここではrender()を呼び直さない（呼び出し元が続きを描く）。 */
    for(var k=0;k<st.length;k++) doneSet[k] = "done";
    autoFinished = true;
    if(tick){ clearInterval(tick); tick = null; }
    chimeDone();
    logRun();
    if(fromPreSleep){ fromPreSleep=false; stop(); sleepEnterWatch(); view="sleepWatch"; }
    else if(fromWake){ fromWake=false; stop(); sleepBackToWatch(); view="sleepWatch"; }
    else { view = "done"; }
    return;
  }
  if(idx !== curStep){
    for(var j=curStep; j<idx && j<st.length; j++){ if(!doneSet[j]) doneSet[j] = "done"; }
    curStep = idx;
    phaseChime(st[idx].text);   /* v16: 呼吸法は吸う・止める・吐くで音を変える。それ以外は従来どおりの音 */
    if(s.voice) speak(sayOf(st[idx]));  /* 3列目があればそれを、無ければ（…）を外した文言を読む */
  }
}
/* v4: 手動で次のステップへ進める（合わないときのための逃げ道） */
function autoSkip(){
  var s = setOf(curId); if(!s || !s.auto) return;
  var st = stepsOf(s), cum = 0;
  for(var i=0;i<=curStep && i<st.length;i++){ cum += st[i].sec; }
  var base = autoPaused ? pauseAt : Date.now();
  startAt = base - (cum+0.05)*1000;
  if(autoPaused) pauseAt = base;
  render();
}
/* v4: 一時停止・再開 */
/* v20 (2026-09-03 ご依頼): 自動で進むセットの「＋1分／＋5分」。
   自動セットは経過秒から位置を逆算しているので、開始時刻を後ろへずらすと
   いまの項目がそのぶん延び、あとの項目は長さを変えずに後ろへずれる。
   autoSkip が開始時刻を前へ動かすのと、まったく同じ仕組みの逆向き。 */
var autoShift = 0;
function autoExtend(sec){
  if(autoFinished) return;
  startAt += sec*1000;
  autoShift += sec;
  render();
}
/* v4: 一時停止・再開 */
function autoPauseToggle(){
  if(autoPaused){ startAt += (Date.now()-pauseAt); autoPaused = false; }
  else { pauseAt = Date.now(); autoPaused = true; }
  render();
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function mmss(s){ var m=Math.floor(Math.abs(s)/60), x=Math.abs(s)%60; return (s<0?"+":"")+m+":"+String(x).padStart(2,"0"); }
/* v5: ステップの書式は「秒|画面の文言|読み上げ（省略可）」。
   3列目が無いときは、画面の文言から（…）を外したものを読み上げます。 */
function parseStep(line){
  var p = String(line).split("|");
  if(p.length<2) return { sec:60, text:String(line).trim(), say:"", app:"" };
  return {
    sec: parseInt(p[0],10)||60,
    text: (p[1]||"").trim(),
    say: (p[2]||"").trim(),
    app: p.length>3 ? p.slice(3).join("|").trim() : ""   /* v14: 開くアプリ */
  };
}
/* v14: ステップの行を組み立て直す（末尾の空欄は付けない） */
function joinStep(sec, text, say, app){
  var out = sec + "|" + text;
  if(app) return out + "|" + (say||"") + "|" + app;
  if(say) return out + "|" + say;
  return out;
}

function sayOf(x){
  if(x && x.say) return x.say;
  return String(x&&x.text||"").replace(/（[^）]*）/g,"").replace(/\([^)]*\)/g,"").trim();
}
/* v5: 繰り返しの周期を見つける（4-7-8のように同じ並びが続くセット用）。
   見つかれば「サイクル m/n」、見つからなければ「ステップ m/n」と出す。 */
function cyclePeriod(st){
  var n = st.length;
  if(n < 4) return 0;
  for(var p=1; p<=n/2; p++){
    if(n % p) continue;
    var ok = true;
    for(var i=p;i<n;i++){
      if(st[i].text !== st[i%p].text || st[i].sec !== st[i%p].sec){ ok = false; break; }
    }
    if(ok) return p;
  }
  return 0;
}
function setOf(id){ for(var i=0;i<DB.sets.length;i++){ if(DB.sets[i].id===id) return DB.sets[i]; } return null; }
function idxOf(id){ for(var i=0;i<DB.sets.length;i++){ if(DB.sets[i].id===id) return i; } return -1; }
/* v17: アーカイブ済み・非表示（presleep等）は、ホーム一覧・休憩の候補・
   集中ブロックの選択肢からは外す。振り返り（viewReview）は別枠で全セット
   を対象にしているので、ここでは触っていない。 */
function normals(){ return DB.sets.filter(function(s){return !s.rescue && !s.hidden && !s.archived;}); }
function rescues(){ return DB.sets.filter(function(s){return s.rescue && !s.archived;}); }
function stepsOf(s){ return s.steps.map(parseStep); }
function sumSec(s){ return stepsOf(s).reduce(function(a,b){return a+b.sec;},0); }
/* v9: 全体の時間は、タップ式・自動進行のどちらも**必ずステップの合計**から出す。
   v8までは、タップ式のセットだけ「全体の制限時間（秒）」を手入力できた。
   ステップを直したのに全体の秒数だけ古いまま残る、という食い違いが起きるため、
   入力欄そのものを廃止した。データ側の s.limit はもう読まない（消しもしない）。
   0秒のセットで進捗バーが壊れないよう、下限を1秒にしてある。 */
function limitOf(s){ return Math.max(1, sumSec(s)); }
/* v9: 秒数を「2時間30分」「15分」「2分51秒」の形にする。
   1時間以上のときは秒を出さない（読みたいのは桁であって精度ではないため）。 */
function durLabel(sec){
  sec = Math.max(0, Math.round(sec));
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s2 = sec%60, out = "";
  if(h) out += h+"時間";
  if(m) out += m+"分";
  if(s2 && !h) out += s2+"秒";
  return out || "0秒";
}

function msRead(idm, ids, def){

/* --- 今週の実施状況 -------------------------------------------
   出すのは「起きた事実」だけ。やらなかった日は「・」になるだけで、
   ×も赤字も付けない（v1からの線引きをそのまま守る）。
   連続日数・達成率は、ここでも数えない。 */
function weekStart(t){
  var d = new Date(t); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay()+6)%7));   /* 月曜へ寄せる */
  return d.getTime();
}
function weekGrid(){
  var ws = weekStart(Date.now()), days = [], i;
  for(i=0;i<7;i++) days.push(ws + i*86400000);
  var todayK = dayKey(Date.now());
  var rows = {}, order = [];
  DB.log.forEach(function(r){
    if(r.t < ws || r.t >= ws + 7*86400000) return;
    var k = r.id || r.name;
    if(!rows[k]){ rows[k] = { icon:r.icon, name:r.name, d:{} }; order.push(k); }
    rows[k].icon = r.icon; rows[k].name = r.name;
    var dk = dayKey(r.t);
    rows[k].d[dk] = (rows[k].d[dk]||0) + 1;
  });
  var h = '<div class="wk"><table><tr><th></th>';
  days.forEach(function(t){
    h += '<th'+(dayKey(t)===todayK?' class="td"':'')+'>'+WD[new Date(t).getDay()]+'</th>';
  });
  h += '</tr>';
  if(!order.length){
    h += '<tr><td class="nm" colspan="8" style="color:#6f7a8c">今週はまだ押していません。押すと、ここに印が付きます。</td></tr>';
  }else{
    order.forEach(function(k){
      var r = rows[k];
      h += '<tr><td class="nm">'+esc(r.icon)+' '+esc(r.name)+'</td>';
      days.forEach(function(t){
        var n = r.d[dayKey(t)] || 0;
        h += '<td'+(dayKey(t)===todayK?' class="td"':'')+'>'
           + (n ? '<b>'+(n>1 ? n : '✓')+'</b>' : '<span class="e">・</span>')+'</td>';
      });
      h += '</tr>';
    });
  }
  h += '</table></div>';
  return h;
}

  h += '<button class="btn ghost" onclick="go(\'home\')">戻る</button>';

}
function bkValid(o){ return o && typeof o==="object" && (Array.isArray(o.sets)||Array.isArray(o.log)); }

/* --- 実行 --- */
function start(id, fromIndex){
  unlockAudio();   /* v11: 押した操作の中で音を開通させる（自動進行のチャイム対策） */
  fromBreak = false;   /* v12: 休憩から始めた場合は breakStart() が押し直す */
  curId = id; doneSet = {}; curStep = fromIndex||0;
  for(var i=0;i<curStep;i++) doneSet[i] = "skip";
  startAt = Date.now();
  stepAt = startAt; stepExtra = {}; runTimes = {};
  runIdx = null;
  autoPaused = false; pauseAt = 0; autoFinished = false;
  var s = setOf(id);
  if(s && s.voice){ var st0 = stepsOf(s)[curStep]; if(st0) speak(sayOf(st0)); }
  if(tick) clearInterval(tick);
  tick = setInterval(tickRender, 250);
  view = "run"; render();
  /* v8: 開始時の外向きの動作は1つだけ。
     iPhoneのタイマーへ渡す（location.href）とSpotifyを開く（window.open）は、
     どちらも前面のアプリを切り替えるので、同時に両方はできない。
     タイマーを優先し、プレイリストは実行中の画面のボタンから開く形にした
     （どちらを優先するかは編集画面にも書いてある）。 */
  if(s && s.timer && limitOf(s)>0) nativeTimer(limitOf(s));
  else openSpotify(s);   /* set.spotify が入っているセットだけ開く（中で判定） */
}
function stop(){ if(tick) clearInterval(tick); tick=null; startAt=0; curId=null; doneSet={}; curStep=0; runIdx=null; autoPaused=false; pauseAt=0; autoFinished=false; stepAt=0; stepExtra={}; runTimes={}; inputOpen=null; autoShift=0; }

/* ============================================================
   v16: 🛌就寝＋🌃中途覚醒対応
   ------------------------------------------------------------
   presleep・breath478 は既存の auto セット実行エンジン（start/autoTick/
   enterDone）をそのまま使う。見守り画面（sleepWatch）・3択（wakeChoice）・
   3分の対処（wakeRun）はセットではなく、この4つの独自の view で作る。 */
function sleepStart(){
  unlockAudio();
  var ps = setOf("presleep");
  if(!ps){ sleepEnterWatch(); view="sleepWatch"; render(); return; }
  fromPreSleep = true;
  start("presleep");
}
function sleepEnterWatch(){
  DB.sleepActive = true;
  DB.sleepStartAt = Date.now();
  save();
  wake = null;
  sleepTickStart();
}
function sleepBackToWatch(){
  wake = null;
  sleepTickStart();
}
function sleepElapsed(){ return DB.sleepStartAt ? Math.max(0, Math.floor((Date.now()-DB.sleepStartAt)/1000)) : 0; }
function sleepTickStart(){
  sleepTickStop();
  wtick = setInterval(function(){
    if(!DB.sleepActive){ sleepTickStop(); return; }
    if(view==="wakeRun" && wake){
      if(Date.now()-wake.startAt >= WAKE_SEC*1000){ wakeTimeUp(); return; }
      if(wake.choice==="note"){
        /* 入力中は画面を描き直さない（打ち込んだ文字が消えるため）。
           残り時間の数字だけ、その場所を直接書き換える（v13の inputOpen と同じ考え方）。 */
        var el = document.getElementById("wk_left");
        if(el) el.textContent = mmss(WAKE_SEC - Math.floor((Date.now()-wake.startAt)/1000));
        return;
      }
      render();
      return;
    }
    if(view==="sleepWatch"){ render(); return; }
    /* wakeChoice はただの選択肢画面なので、時計を進める必要はない */
  }, 250);
}
function sleepTickStop(){ if(wtick){ clearInterval(wtick); wtick=null; } }
function sleepWake(){ view="wakeChoice"; render(); }
function wakeCancel(){ wake=null; view="sleepWatch"; render(); }
function sleepChoose(choice){

  wake = { choice:choice, startAt:Date.now(), text:"" };
  view = "wakeRun"; render();
  sleepTickStart();
}
function wakeNoteInput(){

}
function wakeTimeUp(){
  sleepTickStop();
  var w = wake; wake = null;
  if(w){
    var actSec = Math.max(0, Math.round((Date.now()-w.startAt)/1000));
    var label = WAKE_LABEL[w.choice] || w.choice;
    DB.times.push({ t:w.startAt, sid:"wake", step:"中途覚醒対応（"+label+"）", plan:WAKE_SEC, act:actSec });
    if(DB.times.length > TIMEMAX) DB.times = DB.times.slice(DB.times.length-TIMEMAX);
    if(w.choice==="note"){
      var el = document.getElementById("wk_text");
      var text = el ? el.value : w.text;
      if(String(text||"").trim()) addNote("wake", "気になることを書く", text);
    }
  }

  chimeWake();

  start("breath478");
}
function sleepEnd(){
  sleepTickStop();
  var totalSec = sleepElapsed();
  DB.times.push({ t:DB.sleepStartAt||Date.now(), sid:"sleep", step:"就寝", plan:0, act:totalSec });
  if(DB.times.length > TIMEMAX) DB.times = DB.times.slice(DB.times.length-TIMEMAX);
  DB.sleepActive = false; DB.sleepStartAt = 0;
  wake = null;
  save();
  go("home");
}
/* v14: いまの項目に許された秒数（この回の延長を足したもの）と、その残り */
function stepSec(i){
  var s = setOf(curId); if(!s) return 60;
  var st = stepsOf(s);
  if(!st[i]) return 60;
  return st[i].sec + (stepExtra[i]||0);
}
function stepUsed(){ return stepAt ? Math.floor((Date.now()-stepAt)/1000) : 0; }
function stepLeft(){ return stepSec(curStep) - stepUsed(); }
/* v19: 完了予定時刻（2026-09-02追加）。
   8/22にv15として「実装した」と記録していたが、実際のファイルには保存されて
   いなかった（9/2の巡回で発覚。9/1に見つかった同種の取りこぼしと同じ形）。
   残り＝いまの項目の残り（予定を過ぎている分は0とみなす）＋まだ終わっていない
   後続の項目の目安。自動進行のセットは全体の目安から経過を引くだけでよい。 */
function etaSec(){
  var s = setOf(curId); if(!s) return 0;
  if(s.auto) return Math.max(0, limitOf(s) - curElapsed());
  var st = stepsOf(s);
  var r = (curStep < st.length) ? Math.max(0, stepLeft()) : 0;
  for(var i=curStep+1;i<st.length;i++){ if(!doneSet[i]) r += stepSec(i); }
  return r;
}
function etaLabel(){ return hhmm(Date.now() + etaSec()*1000); }
/* v14: その場で延長する。**この回だけ**の延長で、セットの秒数は変えない
   （セット側を直すのは編集画面と、振り返りの「平均に合わせる」の役目）。
   実績には延長した分もそのまま入る。 */
function extendStep(sec){
  if(curStep==null) return;
  stepExtra[curStep] = (stepExtra[curStep]||0) + sec;
  render();
}
/* v20 (2026-09-03 ご依頼): 行のタップは「そのステップへ移る」だけにした。
   完了は「✓ できた — 次へ」の1本に絞る。従来はタップ＝即完了で、
   切り替え・完了・スキップ（↷）の3つが1つの操作に混ざっていた。
   移るだけなので、済み・未済の印は一切変えない（実績も足さない）。 */
function gotoStep(i){
  var s = setOf(curId); if(!s) return;
  if(i<0 || i>=s.steps.length) return;
  curStep = i;
  stepAt = Date.now();
  render();
}
/* v20: 済みにした項目を元に戻す。中身は従来 toggleStep の中にあった
   取り消しの処理をそのまま出したもの（この回に足した実績も一緒に消す）。 */
function undoStep(i){
  var s = setOf(curId); if(!s) return;
  if(!doneSet[i]) return;
  if(runTimes[i]){
    var k = DB.times.indexOf(runTimes[i]);
    if(k>=0) DB.times.splice(k,1);
    delete runTimes[i];
    save();
  }
  delete doneSet[i];
  curStep = i;
  stepAt = Date.now();
  render();
}
/* v20: 主ボタン（✓ できた — 次へ）専用になった。行のタップからは呼ばれない。
   取り消しの分岐は undoStep へ出したが、念のためここにも残してある。 */
function toggleStep(i){
  var s = setOf(curId);
  if(doneSet[i]){
    /* 取り消し：この回に足した実績も一緒に取り消す（間違って押した分を残さない） */
    if(runTimes[i]){
      var k = DB.times.indexOf(runTimes[i]);
      if(k>=0) DB.times.splice(k,1);
      delete runTimes[i];
      save();
    }
    delete doneSet[i];
    curStep = i;            /* 取り消した項目に戻る（やり直す、という意味なので） */
    stepAt = Date.now();
    render(); return;
  }
  doneSet[i] = "done";
  /* 順番どおりに進めたときだけ、実際にかかった時間を残す */
  if(i===curStep && stepAt){
    var xx = stepsOf(s)[i];
    if(xx){
      var rec = { t:stepAt, sid:s.id, step:noteKey(xx.text),
                  plan:stepSec(i), act:Math.max(0, Math.round((Date.now()-stepAt)/1000)) };
      DB.times.push(rec);
      if(DB.times.length > TIMEMAX) DB.times = DB.times.slice(DB.times.length - TIMEMAX);
      runTimes[i] = rec;
      save();
    }
  }
  stepAt = Date.now();
  var next = -1;
  for(var j=0;j<s.steps.length;j++){ if(!doneSet[j]){ next=j; break; } }
  curStep = next<0 ? s.steps.length : next;
  if(allDone()){ chimeDone(); enterDone(); }
  else {
    chimeStep();
    /* v5: タップ式のセットでも、音声がオンなら次のステップを読み上げる */
    if(s.voice){ var nx = stepsOf(s)[curStep]; if(nx) speak(sayOf(nx)); }
    render();
  }
}
/* v19: タップ式のセットで、いまの項目を飛ばして次へ進む（2026-09-02追加）。
   これも8/22にv15として記録だけが残っていた分の入れ直し。自動進行には
   もともと「次へ ▶」（autoSkip）があるが、タップ式には無かった。
   飛ばした項目は実行時間を記録しない（「順番どおりに進めた項目だけ記録する」
   という既存の線を崩さないため）。押し間違えたら、その行をもう一度タップ
   すれば元に戻る（既存の toggleStep の取り消しがそのまま効く）。 */
function skipStep(){
  var s = setOf(curId); if(!s) return;
  var st = stepsOf(s);
  if(curStep >= st.length) return;
  doneSet[curStep] = "skip";
  stepAt = Date.now();
  var next = -1;
  for(var j=0;j<s.steps.length;j++){ if(!doneSet[j]){ next=j; break; } }
  curStep = next<0 ? s.steps.length : next;
  if(allDone()){ chimeDone(); enterDone(); }
  else {
    chimeStep();
    if(s.voice){ var nx = stepsOf(s)[curStep]; if(nx) speak(sayOf(nx)); }
    render();
  }
}
function enterDone(){
  if(tick) clearInterval(tick); tick=null;
  logRun();          /* 終わりまで来た回は、0ステップでも「押した」事実として残す */
  /* v16: 手動終了（「ここまでで終える」）も、自然終了（autoTick）と必ず同じ
     分岐を通す。ここだけ直して autoTick 側を直し忘れると、8/23と同じ
     「自動終了のときだけ就寝画面に戻らない」不具合が再発する。 */
  if(fromPreSleep){ fromPreSleep=false; stop(); sleepEnterWatch(); view="sleepWatch"; render(); return; }
  if(fromWake){ fromWake=false; stop(); sleepBackToWatch(); view="sleepWatch"; render(); return; }
  view="done"; render();
}
function finishNow(){ enterDone(); }
function leaveRun(){
  /* 途中でやめた回。1つでもやれていれば残し、0のままなら残さない
     （画面を開いただけ・押し間違いを増やさないため） */
  if(runIdx===null && doneCount()>0) logRun();
  var wasWake = fromWake;
  fromPreSleep = false; fromWake = false;
  stop();
  /* v16: 中途覚醒の3択・呼吸法を「やめて最初に戻る」で切り上げた場合は、
     就寝そのものはまだ続いているので見守り画面へ（ホームには出さない）。
     就寝前ストレッチ側で切り上げた場合は、まだ就寝が始まっていないので
     ふつうにホームへ戻る。 */
  if(wasWake && DB.sleepActive){ wake=null; view="sleepWatch"; render(); return; }
  go("home");
}

/* --- iPhone標準タイマーの起動 --------------------------------
   このページはバックグラウンドでは止まります（iOSの仕様）。
   残り時間を画面上部（ダイナミックアイランド／ロック画面）に出せるのは
   iOS標準のタイマーだけなので、ショートカット経由でそれを起動します。
   ショートカットの作り方は 行動計画_2026-08-14 §10 を参照。 */
function nativeTimer(sec){
  sec = Math.max(1, Math.round(sec || left()));
  location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(DB.scName)
                + "&input=text&text=" + sec;
}

function render(){
  var h = "";

    var _s = setOf(curId);
    if(_s && _s.auto) autoTick(_s);   /* 完了すると内部で view が "done"/"sleepWatch" に変わることがある */
    if(view==="run") h = viewRun();
    else if(view==="sleepWatch") h = viewSleepWatch();
    else h = viewDone();
  }
  else if(view==="done") h = viewDone();
  else if(view==="sleepWatch") h = viewSleepWatch();
  else if(view==="wakeChoice") h = viewWakeChoice();
  else if(view==="wakeRun") h = viewWakeRun();
  else if(view==="focusStart") h = viewFocusStart();
  else if(view==="focus"){
    focusTick();                       /* 完了すると内部で view="focusDone" に変わることがある */
    if(view==="focus") focusTitle();
    h = (view==="focus") ? viewFocus() : viewFocusDone();
  }
  else if(view==="focusDone") h = viewFocusDone();
  else if(view==="focusSet") h = viewFocusSet();
  else if(view==="edit") h = viewEdit();
  else if(view==="log") h = viewLog();

  else if(view==="about") h = viewAbout();

  var recent = order.filter(function(k){ return k >= wk; });

  function block(keys){
    var s = "";
    keys.forEach(function(k){

           + '</span>'

  if(older.length){

/* --- v5: 自動で進むセットの実行画面 ---------------------------
   タップで進める一覧ではなく、いまのステップだけを大きく出す。
   残り秒数は「このステップの残り」。全体の経過は下に小さく添える。
   v4では「3ステップ＝1サイクル」を決め打ちしていたが、呼吸法以外の
   セット（休憩ルーティン等）では意味を成さないため、繰り返しの周期を
   自動検出する形にした（cyclePeriod）。繰り返しが無いセットでは
   「ステップ m/n」と出し、次に来るステップを1行だけ添える。 */
function viewRunAuto(s){
  var st = stepsOf(s), e = curElapsed();
  var cum = 0, stepEnd = 0, cur = st[Math.min(curStep,st.length-1)];
  var curText = cur ? cur.text : "";
  for(var i=0;i<st.length;i++){
    cum += st[i].sec; stepEnd = cum;
    if(i===curStep) break;
  }
  var remainInStep = Math.max(0, stepEnd - e);
  var p = cyclePeriod(st), head;
  if(p){
    head = 'サイクル '+Math.min(Math.floor(curStep/p)+1, st.length/p)+' / '+(st.length/p);
  }else{
    head = 'ステップ '+Math.min(curStep+1, st.length)+' / '+st.length;
  }
  var nx = st[curStep+1];
  var h = '<h1>'+esc(s.icon)+' '+esc(s.name)+'</h1>'+(s.note ? '<p class="sub">'+esc(s.note)+'</p>' : '');
  h += '<div class="card">';
  h += '<div class="bigsub">'+head+'</div>';
  /* 文言が長いセット（休憩ルーティン等）でも1〜2行に収まるよう字を小さくする */
  var fs = curText.length>26 ? 20 : (curText.length>13 ? 26 : 34);
  h += '<div class="big" style="font-size:'+fs+'px;line-height:1.4;margin:2px 0 8px">'+esc(curText)+'</div>';
  h += '<div class="big'+(autoPaused?' over':'')+'">'+remainInStep+'</div>';
  h += '<div class="bigsub">'+(autoPaused ? '一時停止中' : 'このステップの残り秒数')+'</div>';
  h += '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,(e/limitOf(s))*100))+'%"></i></div>';
  h += '<p class="note" style="text-align:center;margin-top:8px">'
     + (nx ? '次： '+esc(nx.text)+'<br>' : '次でおしまいです<br>')
     + '全体の経過 '+mmss(e)+' ／ 目安 '+durLabel(limitOf(s))
     + '<br>このまま進むと '+etaLabel()+' ごろ終わります</p>';
  h += '</div>';
  h += '<p class="note">タップして進める必要はありません。'+(s.voice?'合図（音・声）':'合図（音）')+'に合わせて進めてください。<br>合わない長さのときは、下の「次へ」で先に進めます。</p>';
  /* v18: 「次へ▶」を操作しやすくした（2026-09-01ご依頼）。
     従来は「一時停止」と横並びの.btn.ghost（幅50%・小さめ）で、暗い部屋・
     眠い状態での操作には狙いにくかった。タップ式実行画面の主ボタン
     （「✓ できた — 次へ」＝.btn.big）と同じ見た目・同じ幅いっぱいの
     ボタンに格上げし、押し間違えにくい一時停止/再開は下の小さめのボタンへ
     退けた。押す機能そのもの（autoSkip）は変えていない。 */
  h += '<button class="btn big" onclick="autoSkip()">次へ ▶</button>';
  h += '<button class="btn ghost" style="margin-top:9px" onclick="autoPauseToggle()">'+(autoPaused?'▶ 再開する':'⏸ 一時停止する')+'</button>';
  /* v20 (2026-09-03 ご依頼): 自動で進むセットにも延長を付けた
     （タップ式には v14 から入っていたが、こちらには無かった） */
  h += '<div class="row" style="margin-top:9px">'
     + '<button class="btn ghost" style="margin-top:0" onclick="autoExtend(60)">＋1分 延長</button>'
     + '<button class="btn ghost" style="margin-top:0" onclick="autoExtend(300)">＋5分 延長</button>'
     + '</div>';
  h += '<p class="note">延長するのは<b>いまのステップだけ</b>です。あとのステップの長さは変わらず、終わる時刻がそのぶん後ろへずれます。'
     + (autoShift ? '<br>この回はここまでに <b>'+durLabel(autoShift)+'</b> 延ばしています。' : '')
     + '</p>';
  /* v13: 自動で進むセットは、いちばん下にだけ足せる
     （途中に差し込むと、経過秒から逆算しているいまの位置が巻き戻るため） */
  if(inputOpen === "add:end"){
    h += '<div class="iobox">'
       + '<label style="margin-top:0">いちばん下に1つ足す</label>'
       + '<div class="stline">' + msInputs("io_min","io_sec2",60)
       + '<input class="inp" type="text" id="io_text" placeholder="やること"></div>'
       + '<div class="row" style="margin-top:8px">'
       + '<button class="btn ghost" style="margin-top:0" onclick="closeInput()">やめる</button>'
       + '<button class="btn save" style="margin-top:0" onclick="runAdd(null)">足す</button>'
       + '</div></div>';
  }else{
    h += '<button class="btn ghost" onclick="openInput(\'add:end\')">＋ いちばん下に1つ足す</button>';
  }
  /* v8: 自動で進むセットにも、iPhone標準タイマーへの手渡しを付けた（従来はタップ式だけだった） */
  var autoLeft = Math.max(1, limitOf(s) - e);
  h += '<button class="btn ghost" onclick="nativeTimer('+autoLeft+')">⏱ iPhoneのタイマーにも残り'+Math.max(1,Math.round(autoLeft/60))+'分を渡す</button>';
  if(s.spotify){
    h += '<button class="btn ghost" onclick="openSpotify()">🎵 プレイリストを開く'+(spUrl(s)?'':'（未設定）')+'</button>';
    if(!spUrl(s)) h += '<p class="note">このセットの編集画面か、ホーム画面の「設定」にプレイリストのURLを入れると、次回からここで開けます。</p>';
  }
  h += '<button class="btn" onclick="finishNow()">ここまでで終える</button>';
  h += backToFocus();
  h += '<button class="btn link" onclick="leaveRun()">やめて最初に戻る</button>';
  return h;
}

function viewDone(){
  var s = setOf(curId), n = s.steps.length, d = 0;
  for(var i=0;i<n;i++){ if(doneSet[i]==="done") d++; }
  var within = left() >= 0;
  var h = '<h1>'+(d===n ? '完了' : 'ここまで')+'</h1>';
  h += '<div class="card"><div class="big ok">'+d+' / '+n+'</div>';
  h += '<div class="bigsub">'+esc(s.name)+' ・ '+mmss(Math.abs(elapsed()))+'</div></div>';
  if(d===n && within) h += '<div class="hint">タイマーの中でやり切れました。</div>';
  else if(d===n) h += '<div class="hint">全部やれました。時間は超えましたが、見ているのは順番ではなく「やったかどうか」です。</div>';
  else if(d>0) h += '<div class="hint">'+d+'つやれました。<b>0か1かではありません。</b>次の合図でまた押せます。</div>';
  else h += '<div class="hint">今日はここまで。押したこと自体は残っています。次の合図でまた押してください。</div>';
  /* v20 (2026-09-03 ご依頼): 「これで N 回目です」の累計表示は取りやめ。 */
  /* v13: 落ち着いて振り返れるのはここ。項目ごとに感じたことを残せる。 */
  h += '<div class="sec">やってみて、どう感じましたか（任意）</div>';
  stepsOf(s).forEach(function(x,i){
    var prev = notesFor(s.id, x.text);
    h += '<div class="dnrow">'
       + '<div class="h">'+(doneSet[i]==="done"?'✓ ':(doneSet[i]==="skip"?'– ':''))
       + (doneSet[i]==="skip" ? '<s>'+esc(x.text)+'</s>' : esc(x.text))+'</div>'
       + '<input class="inp" type="text" id="dn_'+i+'" placeholder="例）これは要らない気がする／もっと短くていい" onchange="doneNote('+i+')">';
    if(prev.length){
      h += '<div class="nlist">';
      prev.slice(0,3).forEach(function(o){
        h += '<div class="nline"><span class="d">'+dayLabel(o.r.t)+'</span>'
           + '<span style="flex:1">'+esc(o.r.v)+'</span>'

      });
      if(prev.length>3) h += '<p class="note" style="margin:2px 0 0">ほか'+(prev.length-3)+'件は「セットを編集」で見られます。</p>';
      h += '</div>';
    }
    h += '</div>';
  });
  h += '<p class="note">書かなくて構いません。書いたものは<b>この端末の中だけ</b>に残り、次に同じ項目をやるときと、「セットを編集」の画面に出ます。<br>いま形を探している最中なら、ここのメモがそのまま材料になります。</p>';
  h += '<p class="note">この記録はこの端末の中だけに残ります。Obsidian・Points Tracker には入りません。<br>連続日数と達成率は数えていません。</p>';
  if(!s.rescue && d<n) h += '<button class="btn ghost" onclick="go(\'run\');tick=setInterval(tickRender,250)">続きに戻る</button>';
  if(fromFocus && fStart){
    h += '<button class="btn" onclick="focusResume()">▶ 集中に戻る（休憩まで '+mmss(fLeftAll())+'）</button>';
    h += '<p class="note">呼吸のあいだ、集中の時計は止まっていました。押すとそこから続きます。</p>';
    h += '<button class="btn ghost" onclick="stop();go(\'home\')">最初に戻る</button>';
  }else if(fromBreak){
    /* v12: 休憩から始めたルーティンが終わったら、そのまま次の集中へ入れるようにする */
    h += '<button class="btn" onclick="stop();fromBreak=false;focusGo()">🎯 次の集中ブロックへ</button>';
    h += '<p class="note">時間帯は押した時刻から選び直します。行き先もそこで書けます。</p>';
    h += '<button class="btn ghost" onclick="stop();fromBreak=false;go(\'home\')">最初に戻る</button>';
  }else{
    h += '<button class="btn" onclick="stop();go(\'home\')">最初に戻る</button>';
  }
  h += '<button class="btn link" onclick="stop();revGo(s.id)">📊 このルーティンの振り返りを見る</button>';
  h += '<button class="btn link" onclick="stop();go(\'log\')">📖 これまでの記録を見る</button>';
  return h;
}

/* ============================================================
   v6: 仕事の集中ブロック（2026-08-19 ご依頼）
   ------------------------------------------------------------
   ご依頼: 午前2時間・午後90分・夕方50分で休憩の合図。いきなり2時間を
   やろうとせず、まずは短いところから15分ごとに切り替える。

   【目的（ご本人の言葉）】休憩・回復のためではなく、**複数プロジェクトを
   同時に走らせているときに、ひとつの作業へ没頭（作業興奮）して他が止まる
   のを防ぐため**。この時間内・今日中に成果を出すための締め切り効果。
   → したがって「区切り」は休みではなく**別の行き先へ移る合図**であり、
      画面の主役は「休憩までの残り時間」（＝締め切り）にしてある。
   → ブロックを始める前に行き先を書いておける。書かなくても始められる
      （入力を必須にすると、押すこと自体をやめてしまうため）。

   【正直に書く制約】このページからは通知を出せない（iOSにはWebページから
   通知を予約する手段がない。navigator.vibrate もiOS Safariは非対応）。
   閉じていても鳴らせるのはiPhone標準タイマーだけなので、開始時にショート
   カット経由で「休憩まで」の1本を渡す。iOSのタイマーは1本しか持てないため、
   途中の区切りは**アプリを開いているときだけの合図**になる（区切りごとに
   自動でショートカットへ飛ばすことはしない。ユーザー操作なしの遷移はiOSが
   止めるうえ、作業中に画面を奪うため）。必要なときのために、実行画面に
   「次の区切りをタイマーに渡す」ボタンを手動用に置いてある。

   【音】既定はオフ（オフィス・会議のため）。設定でいつでも戻せる。
   ※没頭を切るのが目的の道具で音を消すのは弱い合図になる、という指摘は
     画面内にも書いてある。判断はご本人。

   【記録】既存3アプリと同じ線引き。押した時刻・時間帯・いくつ区切りを
   越えたか・出せたもの（任意の1行）だけ。集中時間の合計・連続日数・
   達成率は持たない。
   ============================================================ */
var SLOTN = { am:"午前", pm:"午後", ev:"夕方" };
function slotAt(t){
  var h = new Date(t).getHours();
  if(h < DB.focus.from.pm) return "am";
  if(h < DB.focus.from.ev) return "pm";
  return "ev";
}
/* ブロックを区切りに割る。seg の並びを順に使い、最後の値はそれ以降ずっと続く。
   端数（最後の区切りの半分未満）は1つ前に足して、細切れを作らない。 */
function segsFor(slot){
  var total = Math.max(60, (DB.focus.len[slot]||60)*60);
  var arr = (DB.focus.seg && DB.focus.seg.length) ? DB.focus.seg : [25];
  var out = [], rest = total, i = 0;
  while(rest > 0 && out.length < 60){
    var s = Math.max(60, (arr[Math.min(i,arr.length-1)]||25)*60);
    if(s >= rest){ out.push(rest); rest = 0; break; }
    out.push(s); rest -= s; i++;
  }
  /* 最後が1つ前より短くなったら1つ前に足す＝「短くなって終わる」形を作らない
     （徐々に伸ばす、という並びの意図に反するため。90分なら 15/25/40/10 ではなく 15/25/50） */
  if(out.length > 1 && out[out.length-1] < out[out.length-2]){
    out[out.length-2] += out.pop();
  }
  return out;
}
function segLabel(slot){
  return segsFor(slot).map(function(s){ return Math.round(s/60)+'分'; }).join(' → ');
}

var fStart=0, fSlot=null, fSegs=[], fMode="one", fList=[], fSeg=0;
var fPaused=false, fPauseAt=0, fFlash=0, fDone=false, fIdx=null, fMemo="";
/* v7: 集中の途中から呼吸法へ寄り道したときの状態
   fromFocus … いま動いているセットは「集中からの寄り道」か（＝終わったら集中へ戻す）
   fShift    … 集中の時計を止めていた合計秒数。休憩の終わりが何秒うしろへずれたか。
               iPhone標準タイマーは止まらないので、このズレは画面に正直に出す。 */
var fromFocus=false, fShift=0;
/* v15: 「その都度決める」モード（休日の細切れ用）の状態
   fCap    … このブロックの上限（秒）。ふつうのモードでは fTotal() と同じ。
   fLabels … 区切りごとに、そのとき決めた「やること」
   fAsking … いま「次は何をしますか」の入力待ちか（このあいだ時計は止める） */
var fCap = 0, fLabels = [], fAsking = false;
/* v12: 休憩の画面から選んで始めたルーティンかどうか。
   これが立っているセットの完了画面には「次の集中ブロックへ」を出す。 */
var fromBreak=false;

/* 呼吸法のセットを探す。idが残っていればそれを、無ければ最初の自動進行セット。
   どちらも無ければ null（ボタン自体を出さない）。 */
function breathSet(){
  var b = setOf("breath478");
  if(b && !b.rescue) return b;
  return DB.sets.filter(function(s){ return s.auto && !s.rescue; })[0] || null;
}

function fElapsed(){ return fStart ? Math.floor(((fPaused?fPauseAt:Date.now())-fStart)/1000) : 0; }
function fTotal(){ return fSegs.reduce(function(a,b){return a+b;},0); }
function fSegEnd(i){ var e=0; for(var k=0;k<=i && k<fSegs.length;k++) e+=fSegs[k]; return e; }
function fSlotNow(){ return fSlot || slotAt(Date.now()); }
/* v11: 集中の合図。DB.focus.sound だけで決める（既定オフ）。
   「ポン」1回では没頭しているときに埋もれるため、上がっていく3音を2回。 */
function fChime(end){
  if(!DB.focus.sound) return;
  var tones = end ? [523,659,784,1047] : [660,880,1175];
  function play(off){
    tones.forEach(function(f,i){
      var d = off + i*170;
      if(d<=0) beep(f, .26, true);                                  /* 1音目はその場で */
      else setTimeout(function(){ beep(f, .26, true); }, d);
    });
  }
  play(0);
  play(end ? 900 : 750);
}
/* v11: 画面全体を2回光らせる。#app の中に入れるとタイマーの再描画で
   消えてしまうので、body直下に置いて時間で片づける（alertLessと同じ手）。 */
function flashScreen(){
  try{
    var d = document.createElement("div");
    d.className = "flash";
    document.body.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 1600);
  }catch(e){}
}
/* --- v11: PCのデスクトップ通知 ---------------------------------
   仕事中はPCの前にいるので、裏タブでも出せる通知がいちばん届く。
   iPhoneのSafariには Notification が無い（あっても許可されない）ので、
   その場合はこの関数は静かに何もしない＝従来どおりの動きになる。
   ※裏タブはブラウザがタイマーを間引くため、区切りの通知が最大1分ほど
     遅れることがある。経過は時刻から計算し直しているので、遅れても
     「何分たったか」はズレない。 */
function notifyOK(){
  try{ return (typeof Notification !== "undefined") && Notification.permission === "granted"; }
  catch(e){ return false; }
}
function notifyState(){
  try{
    if(typeof Notification === "undefined") return "none";
    return Notification.permission;   /* granted / denied / default */
  }catch(e){ return "none"; }
}
function askNotify(){
  try{
    if(typeof Notification === "undefined"){
      alertLess("このブラウザでは通知を出せません（iPhoneのSafariなど）。PCのChromeでお試しください。");
      return;
    }
    var r = Notification.requestPermission(function(){ render(); });
    if(r && r.then) r.then(function(){ render(); });
  }catch(e){}
}
function notifyNow(title, body){
  if(!DB.focus.notify || !notifyOK()) return;
  try{
    var n = new Notification(title, {
      body: body || "",
      tag: "bmc-focus",
      renotify: true,
      requireInteraction: true   /* 気づくまで消さない（没頭対策の要） */
    });
    n.onclick = function(){ try{ window.focus(); n.close(); }catch(e){} };
  }catch(e){}
}
function fItem(i){ return fList.length ? fList[i % fList.length] : ""; }

function focusGo(){
  fSlot = slotAt(Date.now()); fList = []; fMemo = "";
  go("focusStart");
}
function focusPick(sl){ focusGrab(); fSlot = sl; render(); }
function focusGrab(){
  var ta = document.getElementById("f_list");
  if(ta) fList = ta.value.split("\n").filter(function(x){ return x.trim()!==""; });
}
function focusBegin(mode){
  focusGrab();
  /* v11: 音の開通と通知の許可は「押した操作の中」でしかできない。必ずここで。 */
  unlockAudio();
  if(DB.focus.notify && notifyState()==="default") askNotify();
  fMode = mode;
  fSlot = fSlotNow();
  fLabels = []; fAsking = false;
  if(mode === "ask"){
    /* v15: 区切りは先に決めない。1つずつ、そのときに決める。
       上限（休憩まで）だけ時間帯から決めておく。 */
    fSegs = [];
    fCap = Math.max(60, (DB.focus.len[fSlot]||60)*60);
  }else{
    fSegs = segsFor(fSlot);
    fCap = fTotal();
  }
  fStart = Date.now(); fSeg = 0; fPaused = false; fPauseAt = 0;
  fDone = false; fIdx = null; fMemo = ""; fFlash = Date.now();
  fromFocus = false; fShift = 0;
  if(mode === "ask"){ fAsking = true; fPauseAt = Date.now(); fPaused = true; }
  if(tick) clearInterval(tick);
  tick = setInterval(tickRender, 250);
  view = "focus"; render();
  if(DB.focus.native) nativeTimer(fBlockSec());   /* 休憩までの1本だけ渡す（画面遷移を伴うので最後） */
  /* v20 (2026-09-03): タイマーを渡さないときだけ、プレイリストを自動で開く。
     どちらも前面のアプリを切り替えるので、同時にはできない（セットと同じ扱い）。 */
  else openUrl(focusSpUrl());
}
/* v15: 入力された「次にやること」と長さで、次の区切りを始める。 */
function askStart(){
  var t = "", m = 0;
  var e1 = document.getElementById("ask_text"), e2 = document.getElementById("ask_min");
  if(e1) t = String(e1.value||"").trim();
  if(e2) m = parseInt(e2.value,10);
  if(!(m>0)) m = 15;
  var sec = Math.min(m*60, Math.max(60, fCap - fElapsed()));   /* 休憩までを超えない */
  fSegs.push(sec);
  fLabels.push(t || "（決めずに始めた）");
  fSeg = fSegs.length - 1;
  fAsking = false;
  fUnpause(false);        /* 考えていた時間は「ずれ」に数えない */
  fFlash = Date.now();
  render();
}
/* いま何分にするかのボタン（入力欄に書き込むだけ） */
function askMin(m){ var e = document.getElementById("ask_min"); if(e){ e.value = m; } }
/* 自動セットと同じ考え方：経過秒から、いま何番目の区切りにいるべきかを毎回逆算する。
   setTimeoutの連鎖にすると、iOSでバックグラウンドに回った瞬間に止まって戻らない。 */
function focusTick(){
  if(fPaused || fDone || fAsking) return;
  var e = fElapsed(), cum = 0, idx = -1;
  for(var i=0;i<fSegs.length;i++){ cum += fSegs[i]; if(e < cum){ idx = i; break; } }
  /* v15: その都度モードは、区切りが終わるたびに止めて次を聞く。
     上限（休憩まで）に届いたときだけ、ふつうに終わる。 */
  if(fMode==="ask" && idx < 0 && e < fCap){
    fSeg = fSegs.length;
    fAsking = true; fPauseAt = Date.now(); fPaused = true;
    fFlash = Date.now();
    fChime(false); flashScreen();
    notifyNow("▶ ひと区切り",
      (fLabels.length ? "「"+fLabels[fLabels.length-1]+"」が終わりました。" : "") + "次に何をするか決めてください。");
    return;   /* 描き直しは呼び出し元の render() に任せる（二重に描かない） */
  }
  if(idx < 0){
    fSeg = fSegs.length; fDone = true;
    if(tick){ clearInterval(tick); tick = null; }
    fChime(true);
    flashScreen();
    notifyNow("休憩です（" + SLOTN[fSlotNow()] + "）",
              durLabel(fBlockSec()) + "たちました。ここで一度離れてください。");
    setTitle("");
    logFocus();
    view = "focusDone";
    return;
  }
  if(idx !== fSeg){
    fSeg = idx; fFlash = Date.now();
    fChime(false);
    flashScreen();
    notifyNow("▶ 切り替えの合図",
      (fMode==="rotate" && fList.length)
        ? "次は「" + fItem(idx) + "」へ"
        : durLabel(fSegEnd(idx-1)) + "たちました。続けるか移るか、ここで一度決めてください。");
  }
}
/* v11: PCではタブの見出しがいちばん目に入る場所なので、そこに残り時間を出す。
   区切りの直後だけ「▶ 切り替え！」に変える。裏タブでも見出しは更新される。 */
var TITLE0 = "B.M.C. 切り替えルーティン";
function setTitle(t){ try{ document.title = t ? t : TITLE0; }catch(e){} }
function focusTitle(){
  if(!fStart || fDone){ setTitle(""); return; }
  if(fAsking){ setTitle("▶ 次を決める — 集中ブロック"); return; }
  if((Date.now() - fFlash) < 8000){ setTitle("▶ 切り替え！ — 集中ブロック"); return; }
  setTitle(mmss(fLeftAll()) + (fPaused ? " ⏸" : "") + " — 休憩まで");
}
/* 止めていた分だけ開始時刻を後ろへずらす＝経過秒はそのまま、終わりが遅くなる。
   ずらした合計（fShift）を持っておき、画面に出す。 */
function fUnpause(count){
  if(!fPaused) return 0;
  var d = Date.now() - fPauseAt;
  fStart += d;
  /* v15: 「その都度決める」の入力待ちは、そもそも数えない前提の間なので
     「うしろへずれた分」には足さない（毎回警告が出ても意味がないため）。 */
  if(count !== false) fShift += Math.floor(d/1000);
  fPaused = false; fPauseAt = 0;
  return d;
}
function focusPause(){
  if(fPaused) fUnpause();
  else { fPauseAt = Date.now(); fPaused = true; }
  render();
}
/* --- v7: 集中の途中から呼吸法へ寄り道する -----------------------
   集中の時計は止める（呼吸は集中している時間ではないため）。
   終わりが3分うしろへずれることは画面に出す。iPhone標準タイマーは
   こちらからは止められないので、渡し直すボタンも出す。 */
function focusBreath(){
  var b = breathSet(); if(!b) return;
  if(!fPaused){ fPauseAt = Date.now(); fPaused = true; }
  fromFocus = true;
  start(b.id);
}
function focusResume(){
  /* 呼吸を途中でやめた回も、1つでも進んでいれば残す（leaveRunと同じ扱い） */
  if(curId && runIdx===null && doneCount()>0) logRun();
  stop();
  fromFocus = false;
  fUnpause();
  if(tick) clearInterval(tick);
  tick = setInterval(tickRender, 250);
  view = "focus"; render();
}
/* ホームから、続いている集中へ戻る（一時停止したままなら止めたまま戻す） */
function focusBack(){
  fromFocus = false;
  if(tick) clearInterval(tick);
  tick = setInterval(tickRender, 250);
  view = "focus"; render();
}
/* v15: ブロックの上限。ふつうのモードは区切りの合計、その都度モードは fCap。 */
function fBlockSec(){ return (fMode==="ask") ? fCap : fTotal(); }
function fLeftAll(){ return Math.max(0, fBlockSec() - fElapsed()); }
function focusSkip(){
  var base = fPaused ? fPauseAt : Date.now();
  fStart = base - (fSegEnd(fSeg)+0.05)*1000;
  if(fPaused) fPauseAt = base;
  render();
}
function focusSegLeft(){ return Math.max(0, fSegEnd(fSeg) - fElapsed()); }
function focusFinish(){
  fDone = true;
  if(tick){ clearInterval(tick); tick = null; }
  logFocus();
  view = "focusDone"; render();
}
function focusLeave(){
  /* 何も進まないうちにやめた回は残さない（開いただけ・押し間違いを増やさないため） */
  if(fIdx===null && fSeg>0) logFocus();
  focusReset(); go("home");
}
function focusReset(){
  if(tick){ clearInterval(tick); tick = null; }
  setTitle("");
  fStart=0; fSegs=[]; fSeg=0; fPaused=false; fPauseAt=0; fDone=false; fIdx=null; fList=[]; fMemo="";
  fromFocus=false; fShift=0; fCap=0; fLabels=[]; fAsking=false;
}
function logFocus(){
  var rec = { t:fStart, id:"focus", icon:"🎯",
              name:"集中ブロック（"+SLOTN[fSlotNow()]+(fMode==="ask"?"・その都度":"")+"）",
              d:Math.min(fSeg, fSegs.length), n:fSegs.length, sec:fElapsed(), memo:fMemo||"",
              items: fMode==="ask" ? fLabels.slice(0) : [] };   /* v15: その都度決めた中身を残す */
  if(fIdx===null){
    DB.log.push(rec); DB.count++;
    if(DB.log.length > LOGMAX) DB.log = DB.log.slice(DB.log.length - LOGMAX);
    fIdx = DB.log.length - 1;
  }else{
    rec.t = DB.log[fIdx].t;
    DB.log[fIdx] = rec;
  }
  save();
}
/* v12: 休憩の画面から、選んだルーティンを始める。
   集中ブロックはこの時点で終わって記録済みなので、片づけてから始める。 */
function breakStart(id){
  focusMemo();

  start(id);
  fromBreak = true;   /* start() が落とすので、そのあとで立て直す */
  render();

function focusMemo(){
  var el = document.getElementById("f_memo");
  if(!el) return;

  render();
}

}

/* --------- 編集（追加・削除・並べ替え） --------- */
function collect(){
  /* 画面に入力されている内容をDBへ取り込む。移動・削除・追加の前に必ず呼ぶ。 */
  DB.sets.forEach(function(s){
    var ic = document.getElementById("ic_"+s.id); if(ic && ic.value.trim()) s.icon = ic.value.trim();
    var nm = document.getElementById("nm_"+s.id); if(nm && nm.value.trim()) s.name = nm.value.trim();
    var nt = document.getElementById("nt_"+s.id); if(nt) s.note = nt.value.trim();
    /* v9: 全体の秒数の入力欄は廃止した（ステップの合計から自動計算する） */
    /* v5: URLは「空にする」操作も意味を持つので、空欄もそのまま取り込む */
    var sp = document.getElementById("sp_"+s.id);
    if(sp) s.spotifyUrl = sp.value.trim();
    collectSteps(s);
  });
}
/* --- v10: ステップの取り込み ---------------------------------
   1行ずつの編集（既定）と、まとめて編集（テキスト）の2つがある。
   いま画面に出ているほうから読む。 */
function collectSteps(s){
  if(bulk[s.id]){
    var tx = document.getElementById("tx_"+s.id);
    if(tx){
      var arr = tx.value.split("\n").filter(function(x){ return x.trim()!==""; });
      if(arr.length) s.steps = arr;
    }
    return;
  }
  var rows = [], i = 0, sc;
  while((sc = document.getElementById("scm_"+s.id+"_"+i))){
    var old = parseStep(s.steps[i]==null ? "" : s.steps[i]);
    var tt = document.getElementById("st_"+s.id+"_"+i);
    var yy = document.getElementById("sy_"+s.id+"_"+i);
    var aa = document.getElementById("ap_"+s.id+"_"+i);
    /* v20: 分・秒の2欄から読む。両方とも空・0なら「変更なし」として
       前の値を残す（1欄だったころの決まりをそのまま引き継いでいる）。 */
    var sec = msRead("scm_"+s.id+"_"+i, "scs_"+s.id+"_"+i, old.sec);
    var txt = (tt && tt.value.trim()) ? tt.value.trim() : old.text;
    var say = yy ? yy.value.trim() : old.say;
    var app = aa ? String(aa.value||"").trim() : old.app;   /* 「なし」を選べるので空欄も取り込む */
    rows.push(joinStep(sec, txt, say, app));
    i++;
  }
  if(rows.length) s.steps = rows;
}
/* v9: 編集画面の「全体の時間（自動計算）」の表示。
   ステップ欄に打ち込むたびに呼ばれる。画面全体を描き直すと入力中の位置が
   飛んでしまうので、この1か所の文字だけを差し替える。 */
function sumText(s){
  var n = s.steps.filter(function(x){ return String(x).trim()!==""; }).length;
  return durLabel(sumSec(s)) + ' ／ ' + n + 'ステップ';
}
function recalc(id){
  var el = document.getElementById("sum_"+id);
  if(!el) return;
  var t = 0, n = 0;
  if(bulk[id]){
    var tx = document.getElementById("tx_"+id);
    if(!tx) return;
    var arr = tx.value.split("\n").filter(function(x){ return x.trim()!==""; });
    arr.forEach(function(line){ t += parseStep(line).sec; });
    n = arr.length;
  }else{
    var i = 0, sc;
    while((sc = document.getElementById("scm_"+id+"_"+i))){
      t += msRead("scm_"+id+"_"+i, "scs_"+id+"_"+i, 0);
      n++; i++;
    }
  }
  el.textContent = durLabel(t) + ' ／ ' + n + 'ステップ';
}

/* ============================================================
   v10: ステップを1行ずつ編集する（2026-08-19 ご依頼）
   ------------------------------------------------------------
   「テキスト入力で編集しづらい」というご指摘。秒数と文言を別々の欄にし、
   ↑↓で入れ替え・🗑で削除・＋で追加できるようにした。

   まとめて編集（テキスト）も残してある。理由：こちらから「入力用」として
   お渡しした複数行をそのまま貼り付ける使い方（2026-08-15の運用）が
   あり、1行ずつの欄しかないと貼れなくなるため。既定は1行ずつ。

   移動・削除・追加のたびに画面を描き直すので、その前に必ず collect() で
   入力中の文字を取り込む（セットの移動・削除と同じ手順）。 */
var bulk = {};   /* セットidごと：まとめて編集（テキスト）を開いているか */

function bulkToggle(id){
  collect();
  bulk[id] = !bulk[id];
  armed = null; save(); render();
}
function stepMove(id, i, d){
  collect();
  var s = setOf(id); if(!s) return;
  var j = i + d;
  if(i<0 || j<0 || j>=s.steps.length) return;
  var t = s.steps[i]; s.steps[i] = s.steps[j]; s.steps[j] = t;
  armed = null; save(); render();
}
function stepDel(id, i){
  collect();
  var s = setOf(id); if(!s) return;
  if(s.steps.length<=1){
    alertLess("最後の1つは消せません。中身は自由に書き換えられます。");
    return;
  }
  s.steps.splice(i,1);
  armed = null; save(); render();
}
function stepAdd(id, at){
  collect();
  var s = setOf(id); if(!s) return;
  var pos = (at==null || at<0 || at>s.steps.length) ? s.steps.length : at;
  s.steps.splice(pos, 0, "60|新しいステップ");
  armed = null; save(); render();
  setTimeout(function(){
    var el = document.getElementById("st_"+id+"_"+pos);
    if(el){ el.focus(); el.select(); }
  }, 30);
}
/* v14: 「開くアプリ」の選択肢 */
function appOptions(cur){
  cur = String(cur||"").trim();
  var h = '<option value=""'+(cur?'':' selected')+'>なし</option>', known = false;
  for(var k in APPS){
    if(k===cur) known = true;
    h += '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+APPS[k].icon+' '+APPS[k].name+'</option>';
  }
  if(cur && !known) h += '<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>';
  return h;
}
/* v13: その項目に付いたメモを並べる（構成を見直すときの材料）。
   × で1件ずつ消せる。 */
function noteList(sid, stepText){
  var ns = notesFor(sid, stepText);
  if(!ns.length) return '';
  var h = '<div class="nlist" style="margin-top:8px;border-top:1px solid #262d3a;padding-top:7px">';
  ns.forEach(function(o){
    h += '<div class="nline"><span class="d">'+dayLabel(o.r.t)+'</span>'
       + '<span style="flex:1">'+esc(o.r.v)+'</span>'
       + '<button class="x" onclick="collect();delNote('+o.i+');render()">×</button></div>';
  });
  h += '</div>';
  return h;
}
/* 1行ずつの編集欄を組み立てる */
function stepRows(s){
  var st = stepsOf(s), h = '';
  st.forEach(function(x,i){
    var showSay = s.voice || !!x.say;
    h += '<div class="strow">'
       + '<div class="stline">'
       /* v20 (2026-09-03 ご依頼): 秒だけの1欄から、分・秒の2欄にした。
          保存の形は今までどおり「秒」1つのまま（データの形は変えていない）。 */
       + msInputs("scm_"+s.id+"_"+i, "scs_"+s.id+"_"+i, x.sec, "recalc('"+s.id+"')")
       + '<input class="inp" type="text" id="st_'+s.id+'_'+i+'" value="'+esc(x.text)+'">'
       + '</div>'
       + (showSay
          ? '<div class="stline" style="margin-top:6px">'
            + '<span class="stunit" style="width:52px;text-align:left">読み上げ</span>'
            + '<input class="inp" type="text" id="sy_'+s.id+'_'+i+'" value="'+esc(x.say)+'" placeholder="空欄なら上の文言を読みます">'
            + '</div>'
          : '')
       /* v14: この項目から他のアプリへ移れるようにする。
          自動で進むセットでは、すでに指定してあるとき以外は出さない
          （呼吸のような細かい刻みでアプリを開くことはないため）。 */
       + ((!s.auto || x.app)
          ? '<div class="stline" style="margin-top:6px">'
            + '<span class="stunit" style="width:66px;text-align:left">開くアプリ</span>'
            + '<select class="inp" id="ap_'+s.id+'_'+i+'">'+appOptions(x.app)+'</select>'
            + '</div>'
          : '')
       + noteList(s.id, x.text)
       + '<div class="stbtns">'
       + '<button onclick="stepMove(\''+s.id+'\','+i+',-1)"'+(i===0?' disabled':'')+'>↑</button>'
       + '<button onclick="stepMove(\''+s.id+'\','+i+',1)"'+(i===st.length-1?' disabled':'')+'>↓</button>'
       + '<button onclick="stepAdd(\''+s.id+'\','+(i+1)+')">＋下に</button>'
       + '<button class="rm" onclick="stepDel(\''+s.id+'\','+i+')">削除</button>'
       + '</div>'
       + '</div>';
  });
  return h;
}
/* v5: セットごとのオンオフ（進み方・音声・Spotify）。
   トグルは押すと再描画されるので、入力中の文字が消えないよう
   先に collect() で取り込んでから切り替える（move/del と同じ手順）。 */
function setFlag(id, key){
  collect();
  var s = setOf(id); if(!s) return;
  s[key] = !s[key];
  armed = null; save(); render();
}
/* v5: セットの複製。呼吸法のセットを土台に休憩ルーティンを組むための入口。 */
function dup(id){
  collect();
  var s = setOf(id); if(!s) return;
  var c;
  try{ c = JSON.parse(JSON.stringify(s)); }catch(e){ return; }
  c.id = newId();
  c.name = s.name + "（コピー）";
  c.rescue = false;   /* 🛟の複製は普通のセットとして増やす（飛び先は1つのままにする） */
  DB.sets.splice(idxOf(id)+1, 0, c);
  armed = null; save(); render();
  setTimeout(function(){ var el = document.getElementById("nm_"+c.id); if(el){ el.focus(); el.select(); } }, 30);
}
/* v17: カードの中身（アイコン〜全体の時間まで）は、通常・非表示・アーカイブ済み

function del(id){

  collect();
  var s = setOf(id);

    /* 🛟は「崩れた」ボタンの飛び先なので、最後の1つは消さない */
    armed = null; render();

/* ============================================================
   v14: 振り返り（2026-08-19 ご依頼）
   ------------------------------------------------------------
   過去2週間ぶんの「実際にかかった時間」の平均と、そのあいだに書いたメモを
   項目ごとに並べる。予定と平均がずれていたら、その場で予定のほうを平均に
   合わせられる（＝現実に合わせて形を直すための画面）。

   出す数は「起きた事実」だけにしてある。やらなかった日・守れなかった回数
   のような、できなかったことから計算する数は出さない（v1からの線引き）。
   ============================================================ */
var REVDAYS = 14;
var revId = null;
function revGo(id){ revId = id || null; go("review"); }
function applyAvg(sid, stepText){
  var s = setOf(sid); if(!s) return;
  var st = stepsOf(s), k = noteKey(stepText);
  for(var i=0;i<st.length;i++){
    if(noteKey(st[i].text)===k){
      var a = avgAct(sid, stepText, REVDAYS);
      if(!a.n) return;
      s.steps[i] = joinStep(roundSec(a.avg), st[i].text, st[i].say, st[i].app);
      save(); render(); return;
    }
  }
}
function applyAvgAll(sid){
  var s = setOf(sid); if(!s) return;
  var st = stepsOf(s), changed = 0;
  st.forEach(function(x,i){
    var a = avgAct(sid, x.text, REVDAYS);
    if(a.n){ s.steps[i] = joinStep(roundSec(a.avg), x.text, x.say, x.app); changed++; }
  });
  if(changed){ save(); }
  render();
  alertLess(changed ? changed+"個の項目を、実績の平均に合わせました。" : "合わせられる実績がまだありません。");
}

  }

    + '　連続日数は途切れると0に戻り、達成率は空いた日を分母に入れます。<br>'
    + '　どちらも「崩れた日が画面に残る」形そのものなので入れていません。<br><br>'
    + '・<b>Obsidianへの書き込み</b><br>'
    + '　日次ノート・Points Tracker には一切触れません。記録の正はObsidianのままです。<br><br>'
    + '・<b>順番どおりにしか進めない作り</b><br>'
    + '　途中から始められ、飛ばせて、崩れたあとに復帰できます。<br>'
    + '　1ステップ飛ばすと残りが全部崩れる形式が、「総くずれして戻れない」の正体だからです。<br><br>'
    + '・<b>バックグラウンドでの動作</b><br>'
    + '　他のアプリを開くとこの画面は止まります（iOSの仕様で、Webページには変えられません）。<br>'
    + '　ただし戻ったときは時刻から計算し直すので、<b>残り時間はズレません</b>。ズレるのは音だけです。<br><br>'
    + '・<b>画面上部（ダイナミックアイランド）への表示</b><br>'
    + '　Webページからは出せません。iOS標準のタイマーだけができることです。<br>'
    + '　実行中の「⏱ iPhoneのタイマーにも渡す」から標準タイマーを起動してください。'
    + '</p></div>';
  h += '<div class="hint">中身の設計（何を並べるか）は B.M.C. の担当ですが、<b>合わなければ全部書き換えて構いません。</b>セットの追加・削除・並べ替えもできます。<b>直したことを私に伝える義務はありません。</b></div>';
  h += '<div class="warn">中身は<b>この端末のブラウザの中だけ</b>に保存されます。履歴やサイトデータを消すと既定に戻ります。Obsidianには入りません。</div>';
  h += '<button class="btn ghost" onclick="go(\'home\')">戻る</button>';
  return h;
}

/* v11: 画面に戻ってきた瞬間に、時刻から計算し直して追いつく
   （裏に回っている間に間引かれていた分を、戻った瞬間に反映するため） */
try{
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) render();
  });
}catch(e){}

/* v16: 就寝の見守り中にアプリを閉じて開き直した場合、見守り画面に戻す
   （経過時間は DB.sleepStartAt から計算し直すので消えない）。
   3分の対処（wakeRun）の途中で閉じた場合は、そこまでの3分は諦めて
   見守り画面からやり直す（wake は保存していないため）。 */
if(DB.sleepActive){ view = "sleepWatch"; sleepTickStart(); }
render();
</script>
