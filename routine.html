/* v15: 入力された「次にやること」と長さで、次の区切りを始める。 */
function askStart(){
  var t = "", m = 0;
  var e1 = document.getElementById("ask_text"), e2 = document.getElementById("ask_min");
  if(e1) t = String(e1.value||"").trim();
  if(e2) m = parseInt(e2.value,10);
  if(!(m>0)) m = 15;
  var sec = Math.min(m*60, Math.max(60, fCap - fElapsed()));   /* 休憩までを超えない */
  fSegs.push(sec);
  fLabels.push(t || "（決めずに始めた）");
  fSeg = fSegs.length - 1;
  fAsking = false;
  fUnpause(false);        /* 考えていた時間は「ずれ」に数えない */
  fFlash = Date.now();
  render();
}
/* いま何分にするかのボタン（入力欄に書き込むだけ） */
function askMin(m){ var e = document.getElementById("ask_min"); if(e){ e.value = m; } }
/* 自動セットと同じ考え方：経過秒から、いま何番目の区切りにいるべきかを毎回逆算する。
   setTimeoutの連鎖にすると、iOSでバックグラウンドに回った瞬間に止まって戻らない。 */
function focusTick(){
  if(fPaused || fDone || fAsking) return;
  var e = fElapsed(), cum = 0, idx = -1;
  for(var i=0;i<fSegs.length;i++){ cum += fSegs[i]; if(e < cum){ idx = i; break; } }
  /* v15: その都度モードは、区切りが終わるたびに止めて次を聞く。
     上限（休憩まで）に届いたときだけ、ふつうに終わる。 */
  if(fMode==="ask" && idx < 0 && e < fCap){
    fSeg = fSegs.length;
    fAsking = true; fPauseAt = Date.now(); fPaused = true;
    fFlash = Date.now();
    fChime(false); flashScreen();
    notifyNow("▶ ひと区切り",
      (fLabels.length ? "「"+fLabels[fLabels.length-1]+"」が終わりました。" : "") + "次に何をするか決めてください。");
    return;   /* 描き直しは呼び出し元の render() に任せる（二重に描かない） */
  }
  if(idx < 0){
    fSeg = fSegs.length; fDone = true;
    if(tick){ clearInterval(tick); tick = null; }
    fChime(true);
    flashScreen();
    notifyNow("休憩です（" + SLOTN[fSlotNow()] + "）",
              durLabel(fBlockSec()) + "たちました。ここで一度離れてください。");
    setTitle("");
    logFocus();
    view = "focusDone";
    return;
  }
  if(idx !== fSeg){
    fSeg = idx; fFlash = Date.now();
    fChime(false);
    flashScreen();
    notifyNow("▶ 切り替えの合図",
      (fMode==="rotate" && fList.length)
        ? "次は「" + fItem(idx) + "」へ"
        : durLabel(fSegEnd(idx-1)) + "たちました。続けるか移るか、ここで一度決めてください。");
  }
}
/* v11: PCではタブの見出しがいちばん目に入る場所なので、そこに残り時間を出す。
   区切りの直後だけ「▶ 切り替え！」に変える。裏タブでも見出しは更新される。 */
var TITLE0 = "B.M.C. 切り替えルーティン";
function setTitle(t){ try{ document.title = t ? t : TITLE0; }catch(e){} }
function focusTitle(){
  if(!fStart || fDone){ setTitle(""); return; }
  if(fAsking){ setTitle("▶ 次を決める — 集中ブロック"); return; }
  if((Date.now() - fFlash) < 8000){ setTitle("▶ 切り替え！ — 集中ブロック"); return; }
  setTitle(mmss(fLeftAll()) + (fPaused ? " ⏸" : "") + " — 休憩まで");
}
/* 止めていた分だけ開始時刻を後ろへずらす＝経過秒はそのまま、終わりが遅くなる。
   ずらした合計（fShift）を持っておき、画面に出す。 */
function fUnpause(count){
  if(!fPaused) return 0;
  var d = Date.now() - fPauseAt;
  fStart += d;
  /* v15: 「その都度決める」の入力待ちは、そもそも数えない前提の間なので
     「うしろへずれた分」には足さない（毎回警告が出ても意味がないため）。 */
  if(count !== false) fShift += Math.floor(d/1000);
  fPaused = false; fPauseAt = 0;
  return d;
}
function focusPause(){
  if(fPaused) fUnpause();
  else { fPauseAt = Date.now(); fPaused = true; }
  render();
}
/* --- v7: 集中の途中から呼吸法へ寄り道する -----------------------
   集中の時計は止める（呼吸は集中している時間ではないため）。
   終わりが3分うしろへずれることは画面に出す。iPhone標準タイマーは
   こちらからは止められないので、渡し直すボタンも出す。 */
function focusBreath(){
  var b = breathSet(); if(!b) return;
  if(!fPaused){ fPauseAt = Date.now(); fPaused = true; }
  fromFocus = true;
  start(b.id);
}
/* v25: 集中ブロック（とくに🧸 子供と一緒モード）からも🧸へ寄り道できる。
   仕組みは focusBreath と同じ＝集中の時計を止めて飛ぶ。戻りは focusResume。
   ★セットからの寄り道（detour）とは別経路。集中側は fromFocus が戻り先を持っている。 */
function focusAnger(){
  var a = angerSet(); if(!a) return;
  if(!fPaused){ fPauseAt = Date.now(); fPaused = true; }
  fromFocus = true;
  start(a.id);
}
function focusResume(){
  /* 呼吸を途中でやめた回も、1つでも進んでいれば残す（leaveRunと同じ扱い） */
  if(curId && runIdx===null && doneCount()>0) logRun();
  stop();
  fromFocus = false;
  fUnpause();
  if(tick) clearInterval(tick);
  tick = setInterval(tickRender, 250);
  view = "focus"; render();
}
/* ホームから、続いている集中へ戻る（一時停止したままなら止めたまま戻す） */
function focusBack(){
  fromFocus = false;
  if(tick) clearInterval(tick);
  tick = setInterval(tickRender, 250);
  view = "focus"; render();
}
/* v15: ブロックの上限。ふつうのモードは区切りの合計、その都度モードは fCap。 */
function fBlockSec(){ return (fMode==="ask") ? fCap : fTotal(); }
function fLeftAll(){ return Math.max(0, fBlockSec() - fElapsed()); }
function focusSkip(){
  var base = fPaused ? fPauseAt : Date.now();
  fStart = base - (fSegEnd(fSeg)+0.05)*1000;
  if(fPaused) fPauseAt = base;
  render();
}
function focusSegLeft(){ return Math.max(0, fSegEnd(fSeg) - fElapsed()); }
function focusFinish(){
  fDone = true;
  if(tick){ clearInterval(tick); tick = null; }
  logFocus();
  view = "focusDone"; render();
}
function focusLeave(){
  /* 何も進まないうちにやめた回は残さない（開いただけ・押し間違いを増やさないため） */
  if(fIdx===null && fSeg>0) logFocus();
  focusReset(); go("home");
}
function focusReset(){
  if(tick){ clearInterval(tick); tick = null; }
  setTitle("");
  fStart=0; fSegs=[]; fSeg=0; fPaused=false; fPauseAt=0; fDone=false; fIdx=null; fList=[]; fMemo="";
  fromFocus=false; fShift=0; fCap=0; fLabels=[]; fAsking=false;
}
function logFocus(){
  var rec = { t:fStart, id:"focus", icon:"🎯",
              name:"集中ブロック（"+SLOTN[fSlotNow()]+(fMode==="ask"?"・その都度":"")+"）",
              d:Math.min(fSeg, fSegs.length), n:fSegs.length, sec:fElapsed(), memo:fMemo||"",
              items: fMode==="ask" ? fLabels.slice(0) : [] };   /* v15: その都度決めた中身を残す */
  if(fIdx===null){
    DB.log.push(rec); DB.count++;
    if(DB.log.length > LOGMAX) DB.log = DB.log.slice(DB.log.length - LOGMAX);
    fIdx = DB.log.length - 1;
  }else{
    rec.t = DB.log[fIdx].t;
    DB.log[fIdx] = rec;
  }
  save();
}
/* v12: 休憩の画面から、選んだルーティンを始める。
   集中ブロックはこの時点で終わって記録済みなので、片づけてから始める。 */

/* --------- 集中：始める前の画面 --------- */
function viewFocusStart(){

function viewFocusDone(){
  var full = fSeg >= fSegs.length;
  var h = '<h1>'+(full ? '休憩です' : 'ここまで')+'</h1>';
  h += '<div class="card"><div class="big ok">'+mmss(fElapsed())+'</div>'
     + '<div class="bigsub">'+SLOTN[fSlotNow()]+' ・ 区切り '+Math.min(fSeg,fSegs.length)+' / '+fSegs.length+'</div></div>';
  if(full) h += '<div class="hint">'+durLabel(fBlockSec())+'たちました。<b>ここで一度離れてください。</b>次のブロックは、戻ってきてからまた押せます。</div>';
  else h += '<div class="hint">途中で終えました。<b>0か1かではありません。</b>次の合図でまた押せます。</div>';
  h += '<label>このブロックで出せたもの（任意・1行）</label>'
     + '<input class="inp" type="text" id="f_memo" value="'+esc(fMemo)+'" placeholder="例）企画書の骨子まで" onchange="focusMemo()">'
     + '<p class="note">空のままで構いません。書いたものは記録の中にだけ残ります（Obsidianには入りません）。</p>';
  /* v12: 休憩に移るルーティンを、このアプリの中のセットから選ぶ。
     🛟（崩れたとき用）は「崩れた」ボタンの飛び先なので、ここには並べない。 */
  var cands = normals();
  if(cands.length){
    h += '<div class="sec">休憩に移る</div>';
    var lastId = DB.focus.lastBreak;
    var ordered = cands.filter(function(x){ return x.id===lastId; })
                       .concat(cands.filter(function(x){ return x.id!==lastId; }));
    ordered.forEach(function(x, i){
      var isLast = (x.id===lastId && i===0);
      h += '<button class="setb"'+(isLast?' style="border-color:#e0a86a;background:#211d18"':'')
         + ' onclick="breakStart(\''+x.id+'\')">'+esc(x.icon)+' '+esc(x.name)
         + '<small>'+durLabel(limitOf(x))+' ・ '+countLabel(x)+(isLast?' ・ 前回選んだもの':'')+'</small></button>';
    });
    h += '<p class="note">押すとそのルーティンが始まります。終わったら、そこから次の集中ブロックへ進めます。<br>中身は「セットを編集」でいつでも変えられます。</p>';
  }
  h += '<button class="btn" onclick="focusMemo();focusReset();go(\'home\')">何もせず最初に戻る</button>';
  h += '<button class="btn link" onclick="focusMemo();focusReset();go(\'log\')">📖 これまでの記録を見る</button>';
  return h;
}

/* --------- 集中：設定 --------- */
function focusSave(){
  var f = DB.focus;
  ["am","pm","ev"].forEach(function(k){
    var el = document.getElementById("fl_"+k);
    if(el){ var v = parseInt(el.value,10); if(v>0 && v<=600) f.len[k] = v; }
  });
  ["pm","ev"].forEach(function(k){
    var el = document.getElementById("ff_"+k);
    if(el){ var v = parseInt(el.value,10); if(v>=0 && v<=23) f.from[k] = v; }
  });
  /* v20 (2026-09-03): 集中ブロック専用のプレイリストURL */
  var su = document.getElementById("fsp_url");
  if(su) f.spotifyUrl = su.value.trim();
  var sg = document.getElementById("fseg");
  if(sg){
    var arr = sg.value.split(/[,、\s]+/).map(function(x){ return parseInt(x,10); })
                .filter(function(x){ return x>0 && x<=600; });
    if(arr.length) f.seg = arr;
  }
  save();
}

     + 'ブラウザのタブを見れば「休憩まで何分か」がいつでも分かります。<br><br>'
     + '<b>正直に書いておきます。</b>裏タブにするとブラウザがタイマーを間引くので、'
     + '区切りの通知が<b>最大1分ほど遅れる</b>ことがあります（経過は時刻から計算し直すので、何分たったかはズレません）。'
     + 'ぴったりに出したいときは、このタブを見える場所に置いておいてください。<br><br>'
     + '<b>iPhoneでは通知を出せません。</b>他のアプリを開くかロックすると、このページは止まります。'
     + 'iPhoneで確実に鳴らすには、上の「iPhoneのタイマーへ渡す」しかありません。</div>';
  h += '<div class="warn"><b>音を消したときの弱点も書いておきます。</b>没頭を切るのが目的の道具なので、無音にすると、いちばん気づきたいときに気づけません。'
     + 'オフィスでの事情と、どちらを取るかはご本人の判断です。</div>';
  h += '<button class="btn save" onclick="focusSave();go(\'focusStart\')">保存して戻る</button>';
  h += '<button class="btn link" onclick="focusSave();go(\'home\')">ホームへ</button>';

/* --------- 編集（追加・削除・並べ替え） --------- */
function collect(){
  /* 画面に入力されている内容をDBへ取り込む。移動・削除・追加の前に必ず呼ぶ。 */
  DB.sets.forEach(function(s){
    var ic = document.getElementById("ic_"+s.id); if(ic && ic.value.trim()) s.icon = ic.value.trim();
    var nm = document.getElementById("nm_"+s.id); if(nm && nm.value.trim()) s.name = nm.value.trim();
    var nt = document.getElementById("nt_"+s.id); if(nt) s.note = nt.value.trim();
    /* v23: タグも「空にする」操作に意味があるので、空欄もそのまま取り込む */
    var tg = document.getElementById("tg_"+s.id); if(tg) s.tags = tg.value.trim();
    /* v9: 全体の秒数の入力欄は廃止した（ステップの合計から自動計算する） */
    /* v5: URLは「空にする」操作も意味を持つので、空欄もそのまま取り込む */
    var sp = document.getElementById("sp_"+s.id);
    if(sp) s.spotifyUrl = sp.value.trim();
    collectSteps(s);
  });
}
/* --- v10: ステップの取り込み ---------------------------------
   1行ずつの編集（既定）と、まとめて編集（テキスト）の2つがある。
   いま画面に出ているほうから読む。 */
function collectSteps(s){
  if(bulk[s.id]){
    var tx = document.getElementById("tx_"+s.id);
    if(tx){
      var arr = tx.value.split("\n").filter(function(x){ return x.trim()!==""; });
      if(arr.length) s.steps = arr;
    }
    return;
  }
  var rows = [], i = 0, sc;
  while((sc = document.getElementById("scm_"+s.id+"_"+i))){
    var old = parseStep(s.steps[i]==null ? "" : s.steps[i]);
    var tt = document.getElementById("st_"+s.id+"_"+i);
    var yy = document.getElementById("sy_"+s.id+"_"+i);
    var aa = document.getElementById("ap_"+s.id+"_"+i);
    /* v20: 分・秒の2欄から読む。両方とも空・0なら「変更なし」として
       前の値を残す（1欄だったころの決まりをそのまま引き継いでいる）。 */
    var sec = msRead("scm_"+s.id+"_"+i, "scs_"+s.id+"_"+i, old.sec);
    var txt = (tt && tt.value.trim()) ? tt.value.trim() : old.text;
    var say = yy ? yy.value.trim() : old.say;
    var app = aa ? String(aa.value||"").trim() : old.app;   /* 「なし」を選べるので空欄も取り込む */
    rows.push(joinStep(sec, txt, say, app));
    i++;
  }
  if(rows.length) s.steps = rows;
}
/* v9: 編集画面の「全体の時間（自動計算）」の表示。
   ステップ欄に打ち込むたびに呼ばれる。画面全体を描き直すと入力中の位置が
   飛んでしまうので、この1か所の文字だけを差し替える。 */
function sumText(s){
  var n = s.steps.filter(function(x){ return String(x).trim()!==""; }).length;
  return durLabel(sumSec(s)) + ' ／ ' + n + 'ステップ';
}
function recalc(id){
  var el = document.getElementById("sum_"+id);
  if(!el) return;
  var t = 0, n = 0;
  if(bulk[id]){
    var tx = document.getElementById("tx_"+id);
    if(!tx) return;
    var arr = tx.value.split("\n").filter(function(x){ return x.trim()!==""; });
    arr.forEach(function(line){ t += parseStep(line).sec; });
    n = arr.length;
  }else{
    var i = 0, sc;
    while((sc = document.getElementById("scm_"+id+"_"+i))){
      t += msRead("scm_"+id+"_"+i, "scs_"+id+"_"+i, 0);
      n++; i++;
    }
  }
  el.textContent = durLabel(t) + ' ／ ' + n + 'ステップ';
}

/* ============================================================
   v10: ステップを1行ずつ編集する（2026-08-19 ご依頼）
   ------------------------------------------------------------
   「テキスト入力で編集しづらい」というご指摘。秒数と文言を別々の欄にし、
   ↑↓で入れ替え・🗑で削除・＋で追加できるようにした。

   まとめて編集（テキスト）も残してある。理由：こちらから「入力用」として
   お渡しした複数行をそのまま貼り付ける使い方（2026-08-15の運用）が
   あり、1行ずつの欄しかないと貼れなくなるため。既定は1行ずつ。

   移動・削除・追加のたびに画面を描き直すので、その前に必ず collect() で
   入力中の文字を取り込む（セットの移動・削除と同じ手順）。 */
var bulk = {};   /* セットidごと：まとめて編集（テキスト）を開いているか */

function bulkToggle(id){
  collect();
  bulk[id] = !bulk[id];
  armed = null; save(); render();
}
function stepMove(id, i, d){
  collect();
  var s = setOf(id); if(!s) return;
  var j = i + d;
  if(i<0 || j<0 || j>=s.steps.length) return;
  var t = s.steps[i]; s.steps[i] = s.steps[j]; s.steps[j] = t;
  armed = null; save(); render();
}
function stepDel(id, i){
  collect();
  var s = setOf(id); if(!s) return;
  if(s.steps.length<=1){
    alertLess("最後の1つは消せません。中身は自由に書き換えられます。");
    return;
  }
  s.steps.splice(i,1);
  armed = null; save(); render();
}
function stepAdd(id, at){
  collect();
  var s = setOf(id); if(!s) return;
  var pos = (at==null || at<0 || at>s.steps.length) ? s.steps.length : at;
  s.steps.splice(pos, 0, "60|新しいステップ");
  armed = null; save(); render();
  setTimeout(function(){
    var el = document.getElementById("st_"+id+"_"+pos);
    if(el){ el.focus(); el.select(); }
  }, 30);
}
/* v14: 「開くアプリ」の選択肢 */
function appOptions(cur){
  cur = String(cur||"").trim();
  var h = '<option value=""'+(cur?'':' selected')+'>なし</option>', known = false;
  for(var k in APPS){
    if(k===cur) known = true;
    h += '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+APPS[k].icon+' '+APPS[k].name+'</option>';
  }
  if(cur && !known) h += '<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>';
  return h;
}
/* v13: その項目に付いたメモを並べる（構成を見直すときの材料）。
   × で1件ずつ消せる。 */
function noteList(sid, stepText){
  var ns = notesFor(sid, stepText);
  if(!ns.length) return '';
  var h = '<div class="nlist" style="margin-top:8px;border-top:1px solid #262d3a;padding-top:7px">';
  ns.forEach(function(o){
    h += '<div class="nline"><span class="d">'+dayLabel(o.r.t)+'</span>'
       + '<span style="flex:1">'+esc(o.r.v)+'</span>'
       + '<button class="x" onclick="collect();delNote('+o.i+');render()">×</button></div>';
  });
  h += '</div>';
  return h;
}
/* 1行ずつの編集欄を組み立てる */
function stepRows(s){
  var st = stepsOf(s), h = '';
  st.forEach(function(x,i){
    var showSay = s.voice || !!x.say;
    h += '<div class="strow">'
       + '<div class="stline">'
       /* v20 (2026-09-03 ご依頼): 秒だけの1欄から、分・秒の2欄にした。
          保存の形は今までどおり「秒」1つのまま（データの形は変えていない）。 */
       + msInputs("scm_"+s.id+"_"+i, "scs_"+s.id+"_"+i, x.sec, "recalc('"+s.id+"')")
       + '<input class="inp" type="text" id="st_'+s.id+'_'+i+'" value="'+esc(x.text)+'">'
       + '</div>'
       + (showSay
          ? '<div class="stline" style="margin-top:6px">'
            + '<span class="stunit" style="width:52px;text-align:left">読み上げ</span>'
            + '<input class="inp" type="text" id="sy_'+s.id+'_'+i+'" value="'+esc(x.say)+'" placeholder="空欄なら上の文言を読みます">'
            + '</div>'
          : '')
       /* v14: この項目から他のアプリへ移れるようにする。
          自動で進むセットでは、すでに指定してあるとき以外は出さない
          （呼吸のような細かい刻みでアプリを開くことはないため）。 */
       + ((!s.auto || x.app)
          ? '<div class="stline" style="margin-top:6px">'
            + '<span class="stunit" style="width:66px;text-align:left">開くアプリ</span>'
            + '<select class="inp" id="ap_'+s.id+'_'+i+'">'+appOptions(x.app)+'</select>'
            + '</div>'
          : '')
       + noteList(s.id, x.text)
       + '<div class="stbtns">'
       + '<button onclick="stepMove(\''+s.id+'\','+i+',-1)"'+(i===0?' disabled':'')+'>↑</button>'
       + '<button onclick="stepMove(\''+s.id+'\','+i+',1)"'+(i===st.length-1?' disabled':'')+'>↓</button>'
       + '<button onclick="stepAdd(\''+s.id+'\','+(i+1)+')">＋下に</button>'
       + '<button class="rm" onclick="stepDel(\''+s.id+'\','+i+')">削除</button>'
       + '</div>'
       + '</div>';
  });
  return h;
}
/* v5: セットごとのオンオフ（進み方・音声・Spotify）。
   トグルは押すと再描画されるので、入力中の文字が消えないよう
   先に collect() で取り込んでから切り替える（move/del と同じ手順）。 */
function setFlag(id, key){
  collect();
  var s = setOf(id); if(!s) return;
  s[key] = !s[key];
  armed = null; save(); render();
}
/* v5: セットの複製。呼吸法のセットを土台に休憩ルーティンを組むための入口。 */
function dup(id){
  collect();
  var s = setOf(id); if(!s) return;
  var c;
  try{ c = JSON.parse(JSON.stringify(s)); }catch(e){ return; }
  c.id = newId();
  c.name = s.name + "（コピー）";
  c.rescue = false;   /* 🛟の複製は普通のセットとして増やす（飛び先は1つのままにする） */
  DB.sets.splice(idxOf(id)+1, 0, c);
  armed = null; save(); render();
  setTimeout(function(){ var el = document.getElementById("nm_"+c.id); if(el){ el.focus(); el.select(); } }, 30);
}
/* v17: カードの中身（アイコン〜全体の時間まで）は、通常・非表示・アーカイブ済み

function del(id){

    armed = null; render();

    return;
  }

}

   ------------------------------------------------------------

   項目ごとに並べる。予定と平均がずれていたら、その場で予定のほうを平均に
   合わせられる（＝現実に合わせて形を直すための画面）。

   出す数は「起きた事実」だけにしてある。やらなかった日・守れなかった回数
   のような、できなかったことから計算する数は出さない（v1からの線引き）。
   ============================================================ */
var REVDAYS = 14;

function revGo(id){ revId = id || null; go("review"); }
function applyAvg(sid, stepText){
  var s = setOf(sid); if(!s) return;
  var st = stepsOf(s), k = noteKey(stepText);
  for(var i=0;i<st.length;i++){
    if(noteKey(st[i].text)===k){
      var a = avgAct(sid, stepText, REVDAYS);
      if(!a.n) return;
      s.steps[i] = joinStep(roundSec(a.avg), st[i].text, st[i].say, st[i].app);
      save(); render(); return;
    }
  }
}
function applyAvgAll(sid){
  var s = setOf(sid); if(!s) return;
  var st = stepsOf(s), changed = 0;
  st.forEach(function(x,i){
    var a = avgAct(sid, x.text, REVDAYS);
    if(a.n){ s.steps[i] = joinStep(roundSec(a.avg), x.text, x.say, x.app); changed++; }
  });
  if(changed){ save(); }
  render();
  alertLess(changed ? changed+"個の項目を、実績の平均に合わせました。" : "合わせられる実績がまだありません。");
}

    + '</p></div>';
  h += '<div class="card"><p class="sub" style="margin:0">'
    + '<b>持たないもの</b><br><br>'
    + '・<b>連続日数・達成率・最長記録・目標値・バッジ</b><br>'
    + '　これらは<b>「やらなかった日」から計算する数</b>です。<br>'
    + '　連続日数は途切れると0に戻り、達成率は空いた日を分母に入れます。<br>'
    + '　どちらも「崩れた日が画面に残る」形そのものなので入れていません。<br><br>'
    + '・<b>Obsidianへの書き込み</b><br>'
    + '　日次ノート・Points Tracker には一切触れません。記録の正はObsidianのままです。<br><br>'
    + '・<b>順番どおりにしか進めない作り</b><br>'
    + '　途中から始められ、飛ばせて、崩れたあとに復帰できます。<br>'
    + '　1ステップ飛ばすと残りが全部崩れる形式が、「総くずれして戻れない」の正体だからです。<br><br>'
    + '・<b>バックグラウンドでの動作</b><br>'
    + '　他のアプリを開くとこの画面は止まります（iOSの仕様で、Webページには変えられません）。<br>'
    + '　ただし戻ったときは時刻から計算し直すので、<b>残り時間はズレません</b>。ズレるのは音だけです。<br><br>'
    + '・<b>画面上部（ダイナミックアイランド）への表示</b><br>'
    + '　Webページからは出せません。iOS標準のタイマーだけができることです。<br>'
    + '　実行中の「⏱ iPhoneのタイマーにも渡す」から標準タイマーを起動してください。'
    + '</p></div>';
  h += '<div class="hint">中身の設計（何を並べるか）は B.M.C. の担当ですが、<b>合わなければ全部書き換えて構いません。</b>セットの追加・削除・並べ替えもできます。<b>直したことを私に伝える義務はありません。</b></div>';
  h += '<div class="warn">中身は<b>この端末のブラウザの中だけ</b>に保存されます。履歴やサイトデータを消すと既定に戻ります。Obsidianには入りません。</div>';
  h += '<button class="btn ghost" onclick="go(\'home\')">戻る</button>';
  return h;
}

/* v11: 画面に戻ってきた瞬間に、時刻から計算し直して追いつく
   （裏に回っている間に間引かれていた分を、戻った瞬間に反映するため） */
try{
  document.addEventListener("visibilitychange", function(){
    /* v22 (2026-09-05): 裏に回る瞬間に必ず控える。iOSがこのタブを捨てるのは
       この後なので、ここで書いておけば、開き直したときに続きから戻れる。 */
    if(document.hidden){ awayHidAt = Date.now(); if(curId) saveRun(); return; }
    /* v35: 1分以上離れていたら、戻った実行画面に「おかえり」を出す。
       離れていた分は、これまでどおりこの項目の時間として数えている
       （数え方は変えていない。過ぎていることを見えるようにしただけ）。 */
    if(awayHidAt && curId && view==="run"){
      var gap = Math.floor((Date.now()-awayHidAt)/1000);
      if(gap >= 60) awayBack = gap;
    }
    awayHidAt = 0;
    render();
  });
}catch(e){}
/* v22: タブを閉じる・別ページへ移る直前も同じ（visibilitychange が
   来ない経路が端末によってあるため、二重に張ってある）。 */
try{
  window.addEventListener("pagehide", function(){ if(curId) saveRun(); });
}catch(e){}

/* v16: 就寝の見守り中にアプリを閉じて開き直した場合、見守り画面に戻す
   （経過時間は DB.sleepStartAt から計算し直すので消えない）。
   3分の対処（wakeRun）の途中で閉じた場合は、そこまでの3分は諦めて
   見守り画面からやり直す（wake は保存していないため）。 */
if(DB.sleepActive){ view = "sleepWatch"; sleepTickStart(); }

/* ===== 「気になった」記録　2026-09-06追加 ====================================
   目的: iPhoneで使っている最中に気づいたUI/UXの違和感を、文章を書かずに
         1タップで残し、あとでまとめてObsidianへ送る。
   背景: 気づいた場に受け口が無かったため、Quick Memoに文章で書く手間が高く、
         溜めてからまとめて出す → 3件以上になり事前確認の往復が増える、
         という連鎖が起きていた（提案_2026-09-06_HTMLアプリの改善サイクル設計）。

   ★設計の要点（変えるときは理由も一緒に残してください）
   1. 保存の引き出し（FBKEY）は、アプリ本体の KEY とは別にしてあります。
      バックアップの「読み込み」は KEY を丸ごと入れ替えるので、
      同じ引き出しに入れると、控えを戻した瞬間にフィードバックが消えます。
   2. ボタンとパネルは #app の外（body直下）に置いています。
      実行中は render() が 250ms ごとに #app を作り直すためです。
   3. 実行中（タイマーが動いている画面）は送信の導線を出しません。
      Obsidianを開くと前面のアプリが切り替わるためです。

   ★2026-09-06 その2（不具合2件の修正）で変えたところ
   (a) 一言を書いてから選択肢を押すと、記録も一言も残らないことがあった。
       原因は、キーボードが閉じるときに画面が動き、そのタップが選択肢に
       当たらないこと（iOSでよく起きる）。
       → 選択肢を押した時点で先に記録を作り、一言は「あとから足す」形に変えた。
         タップが1回空振りしても、記録そのものは失われません。
   (b) 「コピーする」でコピーできなかった。
       原因は、コピー元のテキスト欄を画面の外（left:-9999px）に隠していたこと。
       iOSは画面外の欄を選択できないため、選択もコピーも成立しない。
       → このアプリのバックアップ画面と同じく、見える欄に置いた。
         コピーが効かない端末でも、長押しして選べます。
   (c) Obsidianへ送っても転記されなかった。
       確定していないので、原因を1つに決めずに次の3つを同時に手当てした。
       ・vault名を既定で付ける（省略すると受け取れない場合がある）
       ・送信を JavaScript の location.href から、実際のリンク（<a href>）の
         タップに変えた（ホーム画面に追加したアプリからは、JSからの
         別アプリ起動が無視されることがある）
       ・見出しの下に入れる／ファイルの先頭に入れる を選べるようにした
         （見出しに絵文字が入っているため、照合に失敗する可能性がある）
       どれが効いたかを切り分けられるよう、設定の中に「テスト送信」を置いた。 */

var FBKEY = "bmc_fb_routine_v1";
var FBAPP = "routineアプリ";
var FBCATS = ["押しにくい","文字が読みにくい","表示が分かりにくい","音・振動","動きがおかしい","こうしたい"];
var FB = { items:[], vault:"My Valut", file:"10_Action/Quick Memo.md", heading:"🗂️ プロジェクトメモ", useHead:true, mode:"prepend" };
var fbMemo = "", fbCfg = false, fbStep = 1, fbLast = -1, fbNote = "";

function fbLoad(){
  try{
    var o = JSON.parse(localStorage.getItem(FBKEY));
    if(o && typeof o==="object"){
      if(Array.isArray(o.items)) FB.items = o.items;
      if(typeof o.vault==="string") FB.vault = o.vault;
      if(typeof o.file==="string" && o.file) FB.file = o.file;
      if(typeof o.heading==="string") FB.heading = o.heading;
      if(typeof o.useHead==="boolean") FB.useHead = o.useHead;
      if(o.mode==="prepend"||o.mode==="append") FB.mode = o.mode;
    }
  }catch(e){}
}
function fbSave(){ try{ localStorage.setItem(FBKEY, JSON.stringify(FB)); }catch(e){} }
function fbEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fb2(n){ return (n<10?"0":"")+n; }
function fbYmd(d){ return fb2(d.getFullYear()%100)+"-"+fb2(d.getMonth()+1)+"-"+fb2(d.getDate()); }
function fbHm(d){ return fb2(d.getHours())+":"+fb2(d.getMinutes()); }

/* いま開いている画面の名前。文章を書かなくても「どこの話か」が残るようにする。 */
function fbCtx(){
  var v = "home";
  try{ if(typeof view==="string") v = view; }catch(e){}
  var NM = {home:"ホーム", run:"実行中", done:"完了", log:"これまでの記録", review:"振り返り",
    edit:"セットの編集", backup:"バックアップ", about:"このアプリが持たないもの",
    scale:"満腹度のものさし", scenes:"シーン", words:"声かけ",
    focusStart:"集中ブロックの準備", focus:"集中ブロック中", focusDone:"集中ブロック完了",
    focusSet:"集中ブロックの設定", sleepWatch:"就寝の見守り",
    wakeChoice:"中途覚醒の3択", wakeRun:"中途覚醒の対処",
    sxlib:"ストレッチのプログラム", sximp:"ストレッチの取り込み", sxtext:"ストレッチの書式",
    sxspec:"ストレッチの仕様", sxattach:"ストレッチの割り当て"};
  var s = NM[v] || v;
  try{ if(curId){ var st = setOf(curId); if(st && st.name) s += "（"+st.name+"）"; } }catch(e){}
  return s;
}

/* 実行中は送らせない（前面のアプリが切り替わるため）。 */
function fbCanSend(){
  var busy = {run:1, sleepWatch:1, wakeChoice:1, wakeRun:1, focus:1};
  try{ return !busy[view]; }catch(e){ return true; }
}

function fbUnsent(){ return FB.items.filter(function(x){ return !x.sent; }); }

function fbOpen(){
  fbMemo = ""; fbCfg = false; fbStep = 1; fbLast = -1; fbNote = "";
  var w = document.getElementById("fbWrap"); if(!w) return;
  w.className = "on"; fbRender();
}
function fbClose(){
  var w = document.getElementById("fbWrap"); if(w) w.className = "";
}
/* 入力欄の中身は、打つそばから変数へ写しておく。
   タップが空振りしても、閉じても、書いた文字が消えないようにするため。 */
function fbTyping(v){ fbMemo = v; }
function fbGrabCfg(){
  var v = document.getElementById("fb_vault"); if(v) FB.vault = v.value.trim();
  var f = document.getElementById("fb_file");  if(f) FB.file  = f.value.trim();
  var g = document.getElementById("fb_head");  if(g) FB.heading = g.value.trim();
}
function fbToast(msg){
  var t = document.getElementById("fbToast"); if(!t) return;
  t.innerHTML = fbEsc(msg); t.className = "on";
  setTimeout(function(){ var x=document.getElementById("fbToast"); if(x) x.className=""; }, 2200);
}

/* 選択肢を押した時点で記録を作る。一言はこのあと足す。 */
function fbAdd(i){
  var d = new Date();
  FB.items.push({ t:d.getTime(), ctx:fbCtx(), cat:FBCATS[i]||"", memo:"", sent:false });
  if(FB.items.length > 60) FB.items = FB.items.slice(FB.items.length-60);
  fbLast = FB.items.length-1;
  fbMemo = ""; fbStep = 2;
  fbSave(); fbRender();
}
function fbAttach(){
  var e = document.getElementById("fb_memo"); if(e) fbMemo = e.value;
  if(fbLast>=0 && FB.items[fbLast]){ FB.items[fbLast].memo = fbMemo; fbSave(); }
  fbNote = fbMemo ? "一言を足しました。" : "一言なしで記録しました。";
  fbStep = 3; fbRender();
}
function fbDropLast(){
  if(fbLast>=0 && FB.items[fbLast]){ FB.items.splice(fbLast,1); fbLast=-1; fbSave(); }
  fbStep = 3; fbNote = "取り消しました。"; fbRender();
}
function fbText(list){
  var d = new Date();
  var s = "##### "+fbYmd(d)+" - "+FBAPP+"で気になったこと\n";
  list.forEach(function(x){
    var dt = new Date(x.t);
    s += "- "+fbHm(dt)+" ／ "+x.ctx+" ／ "+x.cat+(x.memo?" ／ "+x.memo:"")+"\n";
  });
  return s;
}
function fbUri(text){
  var u = "obsidian://advanced-uri?";
  if(FB.vault) u += "vault="+encodeURIComponent(FB.vault)+"&";
  u += "filepath="+encodeURIComponent(FB.file);
  if(FB.useHead && FB.heading) u += "&heading="+encodeURIComponent(FB.heading);
  u += "&mode="+FB.mode+"&data="+encodeURIComponent(text);
  return u;
}
/* 送信は <a href> のタップで行う。ここは「送ったことにする」印を付けるだけで、
   画面は作り直さない（作り直すと、開こうとしているリンクが消えてしまう）。 */
function fbMarkSent(){
  FB.items.forEach(function(x){ x.sent = true; });
  fbSave();
  return true;
}
function fbResend(){
  var n = 0;
  FB.items.forEach(function(x){ if(x.sent){ x.sent=false; n++; } });
  fbSave(); fbRender();
  fbToast(n?("送信済みの"+n+"件を未送信に戻しました。"):"戻すものがありません。");
}
function fbCopy(){
  var t = document.getElementById("fb_out"); if(!t) return;
  var ok = false;
  try{ t.focus(); t.select(); t.setSelectionRange(0,999999); ok = document.execCommand("copy"); }catch(e){}
  var yes = "コピーしました。Quick Memoの「🗂️ プロジェクトメモ」に貼ってください。";
  var no  = "コピーできませんでした。上の枠を長押し →「すべてを選択」→「コピー」でも同じことができます。";
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(
      function(){ fbToast(yes); }, function(){ fbToast(no); });
    return;
  }
  fbToast(ok?yes:no);
}
function fbCfgGo(){ if(fbCfg) fbGrabCfg(); fbCfg = !fbCfg; fbSave(); fbRender(); }
function fbHeadGo(){ fbGrabCfg(); FB.useHead = !FB.useHead; fbSave(); fbRender(); }
/* 見出しの下に入れるとき、上に足すか下に足すか。
   実績のある書き方（音声下書きのショートカット）は mode=append なので、
   prepend で届かないときの逃げ道として残してある。 */
function fbModeGo(){ fbGrabCfg(); FB.mode = (FB.mode==="prepend")?"append":"prepend"; fbSave(); fbRender(); }

function fbSendBlock(){
  var un = fbUnsent();
  if(!un.length) return '';
  if(!fbCanSend()){
    return '<p class="note">いまは実行中なので送りません。前面のアプリが切り替わって、'
         + 'タイマーが止まってしまうためです。<b>終わってから、またはホームに戻ってから</b>送ってください。</p>';
  }
  return '<a class="fbsend" href="'+fbEsc(fbUri(fbText(un)))+'" onclick="return fbMarkSent()">'
       + 'Obsidianへ送る（'+un.length+'件）</a>'
       + '<p class="note">Obsidianが開いて、Quick Memoの「'+fbEsc(FB.heading)+'」に入ります。'
       + '<b>開かない・入らないときは、下の「コピーする」で貼ってください。</b></p>';
}

function fbRender(){
  var p = document.getElementById("fbPanel"); if(!p) return;
  var un = fbUnsent();
  var h = "";

  if(fbStep === 1){
    h += '<h1>気になったことを記録</h1>'
      +  '<p class="sub">いま開いている画面：<b>'+fbEsc(fbCtx())+'</b><br>'
      +  '近いものを1つ押してください。<b>それだけで記録されます。</b>一言は、押したあとに足せます。</p>';
    FBCATS.forEach(function(c,i){
      h += '<button class="fbchip" onclick="fbAdd('+i+')">'+fbEsc(c)+'</button>';
    });
  }

  if(fbStep === 2){
    var it = FB.items[fbLast] || {cat:"",ctx:""};
    h += '<h1>記録しました</h1>'
      +  '<p class="sub"><b>'+fbEsc(it.cat)+'</b> ／ '+fbEsc(it.ctx)+'<br>'
      +  'このままでも構いません。足したいことがあれば、下にどうぞ。</p>'
      +  '<input class="fbinp" id="fb_memo" type="text" placeholder="一言そえる（任意）" '
      +  'value="'+fbEsc(fbMemo)+'" oninput="fbTyping(this.value)">'
      +  '<button class="btn" onclick="fbAttach()">これで記録する</button>'
      +  '<button class="btn ghost" onclick="fbDropLast()">いまの1件を取り消す</button>';
  }

  if(fbStep === 3){
    h += '<h1>'+fbEsc(fbNote||"記録しました")+'</h1>'
      +  '<p class="sub">未送信 '+un.length+'件。まとめて送れます。</p>'
      +  '<button class="btn ghost" onclick="fbStep=1;fbRender()">もう1件記録する</button>';
  }

  if(fbStep !== 2){
    h += '<div class="sec">たまっているもの</div>';
    if(!FB.items.length){
      h += '<div class="card"><p class="note">まだありません。</p></div>';
    }else{
      var recent = FB.items.slice(-6).reverse();
      var body = recent.map(function(x){
        var dt = new Date(x.t);
        return '<div class="fbrow">'+(x.sent?'<span style="color:#6f7a8c">送信済 </span>':'')
             + fbEsc(fbYmd(dt)+" "+fbHm(dt)+" ／ "+x.ctx+" ／ "+x.cat+(x.memo?" ／ "+x.memo:""))+'</div>';
      }).join("");
      h += '<div class="card">'+body+'<p class="note" style="margin-top:9px">未送信 '+un.length
         + '件 ／ 記録 '+FB.items.length+'件（直近6件）</p></div>';
    }
    h += fbSendBlock();
    h += '<div class="sec">手で貼る（送信がうまくいかないとき）</div>'
       + '<div class="card"><textarea id="fb_out" class="fbta" readonly onclick="this.select()">'
       + fbEsc(fbText(un.length?un:FB.items.slice(-10)))+'</textarea></div>'
       + '<button class="btn ghost" onclick="fbCopy()">コピーする</button>';
    h += '<button class="btn link" onclick="fbCfgGo()">送信先の設定'+(fbCfg?'を閉じる':'')+'</button>';
    if(fbCfg){
      h += '<div class="card">'
         + '<label>Vault名</label>'
         + '<input class="fbinp" id="fb_vault" type="text" value="'+fbEsc(FB.vault)+'">'
         + '<label style="display:block;margin-top:10px">書き込むファイル</label>'
         + '<input class="fbinp" id="fb_file" type="text" value="'+fbEsc(FB.file)+'">'
         + '<label style="display:block;margin-top:10px">見出し</label>'
         + '<input class="fbinp" id="fb_head" type="text" value="'+fbEsc(FB.heading)+'">'
         + '<button class="btn ghost" onclick="fbHeadGo()">'
         + (FB.useHead?'いま：見出しの下に入れる（押すとファイルの先頭に変更）'
                      :'いま：ファイルの先頭に入れる（押すと見出しの下に変更）')+'</button>'
         + '<button class="btn ghost" onclick="fbModeGo()">'
         + (FB.mode==="prepend"?'いま：見出しの直下に足す（押すと、その節の末尾に足すに変更）'
                                :'いま：その節の末尾に足す（押すと、見出しの直下に足すに変更）')+'</button>'
         + '<p class="note">見出しの照合に失敗しているときは、ファイルの先頭に切り替えると入ります。'
         + '入る場所は変わりますが、届くかどうかの切り分けになります。</p>'
         + '<a class="fbsend ghost" href="'+fbEsc(fbUri("- テスト送信 "+FBAPP+"\n"))+'">テスト送信（1行だけ送る）</a>'
         + '<p class="note">これが届けば、送信の仕組みは動いています。届かなければ、Vault名か'
         + 'Advanced URIの設定側の問題です。</p>'
         + '<button class="btn ghost" onclick="fbResend()">送信済みを未送信に戻す（届かなかったとき）</button>'
         + '</div>';
    }
  }
  h += '<button class="btn ghost" onclick="fbClose()">閉じる</button>';
  p.innerHTML = h;
}

function fbInit(){
  fbLoad();
  if(document.getElementById("fbBtn")) return;
  var b = document.createElement("button");
  b.id = "fbBtn"; b.type = "button"; b.innerHTML = "🗒";
  b.setAttribute("aria-label","気になったことを記録");
  b.onclick = fbOpen;
  document.body.appendChild(b);
  var w = document.createElement("div");
  w.id = "fbWrap";
  w.innerHTML = '<div id="fbBack" onclick="fbClose()"></div><div id="fbPanel"></div>';
  document.body.appendChild(w);
  var t = document.createElement("div");
  t.id = "fbToast";
  document.body.appendChild(t);
}

render();
fbInit();
</script>
</body>
</html>
