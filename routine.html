<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Switch">
<meta name="theme-color" content="#12151c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2312151c'/%3E%3Ccircle cx='90' cy='96' r='46' fill='none' stroke='%23e0a86a' stroke-width='14'/%3E%3Crect x='81' y='34' width='18' height='58' rx='9' fill='%23e0a86a'/%3E%3C/svg%3E">
<title>B.M.C. 切り替えルーティン</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#12151c;color:#e8ecf2;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-user-select:none;user-select:none;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 44px}
h1{font-size:19px;margin:4px 0 2px;letter-spacing:.02em}
.sub{color:#8a94a6;font-size:12.5px;margin:0 0 16px;line-height:1.65}
.card{background:#1a1f29;border:1px solid #262d3a;border-radius:14px;padding:15px 16px;margin-bottom:11px}
.card.del{border-color:#5c3138;background:#1f1618}
.sec{font-size:12px;color:#6f7a8c;margin:24px 0 9px;letter-spacing:.06em}
.btn{
  display:block;width:100%;padding:17px;border-radius:12px;border:none;
  background:#e0a86a;color:#20160c;font-size:17px;font-weight:700;
  font-family:inherit;cursor:pointer;margin-top:10px;
}
.btn.ghost{background:#232b38;color:#cbd5e3;font-weight:600;font-size:14px;padding:12px}
.btn.link{background:none;color:#8a94a6;font-size:13px;padding:9px;font-weight:500;text-decoration:underline}
.btn.save{background:#2a3a2c;color:#cfe6d2}
.btn.danger{background:#3a2427;color:#e8b3b8}
.btn.danger.armed{background:#7d2c35;color:#fff}
.row{display:flex;gap:9px}
.row>*{flex:1}

.big{font-size:64px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 2px;letter-spacing:-.03em;line-height:1.1}
.big.over{color:#8a94a6;font-size:52px}
.big.ok{color:#9ec8a4}
.bigsub{text-align:center;color:#8a94a6;font-size:13px;margin-bottom:6px}
.bar{height:5px;background:#232b38;border-radius:3px;overflow:hidden;margin:10px 0 2px}
.bar>i{display:block;height:100%;background:#e0a86a}

.setb{
  display:block;width:100%;text-align:left;background:#1a1f29;border:1px solid #262d3a;
  color:#e8ecf2;border-radius:13px;padding:15px 16px;font-size:15.5px;font-family:inherit;
  cursor:pointer;margin-bottom:10px;line-height:1.5;font-weight:600;
}
.setb small{display:block;color:#8a94a6;font-size:12.5px;font-weight:400;margin-top:4px;line-height:1.6}
.setb.rescue{background:#221a1a;border-color:#40292a}

.step{
  display:flex;gap:12px;align-items:flex-start;background:#1a1f29;border:1px solid #262d3a;
  border-radius:12px;padding:14px 15px;margin-bottom:9px;cursor:pointer;
}
.step.cur{border-color:#e0a86a;background:#211d18}
.step.done{opacity:.42}
.step .n{
  flex:none;width:26px;height:26px;border-radius:8px;background:#232b38;color:#8a94a6;
  font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:1px;
}
.step.cur .n{background:#e0a86a;color:#20160c}
.step.done .n{background:#2a3a2c;color:#9ec8a4}
.step .t{flex:1;font-size:15px;line-height:1.55}
.step .t em{display:block;font-style:normal;color:#8a94a6;font-size:12px;margin-top:3px}
.step .t s{color:#6f7a8c}

.hint{color:#cbd5e3;font-size:12.5px;line-height:1.7;background:#1f1c19;border:1px solid #2f2a24;border-radius:10px;padding:11px 13px;margin-top:11px}
.warn{color:#e8b3b8;font-size:12.5px;line-height:1.7;background:#1f1618;border:1px solid #4a2a2f;border-radius:10px;padding:11px 13px;margin-top:11px}
.note{color:#6f7a8c;font-size:12px;line-height:1.75;margin:10px 0 0}
textarea{
  width:100%;min-height:170px;background:#12151c;border:1px solid #303a4a;color:#e8ecf2;
  border-radius:10px;padding:12px;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  line-height:1.8;-webkit-user-select:text;user-select:text;
}
label{display:block;font-size:12.5px;color:#8a94a6;margin:12px 0 5px}
.inp{
  width:100%;background:#12151c;border:1px solid #303a4a;color:#e8ecf2;
  border-radius:10px;padding:12px;font-size:15px;font-family:inherit;
  -webkit-user-select:text;user-select:text;
}
.inp.icon{width:74px;text-align:center;font-size:21px;padding:10px;flex:none}
.iconrow{display:flex;gap:9px;align-items:center}
.tools{display:flex;gap:7px;margin-top:12px}
.tools button{
  flex:1;background:#232b38;border:1px solid #303a4a;color:#cbd5e3;border-radius:10px;
  padding:11px 4px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600;
}
.tools button:disabled{opacity:.32}
.tools button.rm{background:#3a2427;border-color:#5c3138;color:#e8b3b8}
.tools button.rm.armed{background:#7d2c35;border-color:#9c3a45;color:#fff}
.tag{display:inline-block;background:#232b38;border:1px solid #303a4a;border-radius:999px;padding:2px 9px;font-size:11px;color:#8a94a6;margin-left:6px;vertical-align:middle}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.toggle b{font-weight:600;font-size:14px}
.sw{width:52px;height:31px;border-radius:999px;background:#303a4a;border:none;position:relative;cursor:pointer;flex:none}
.sw.on{background:#e0a86a}
.sw i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#e8ecf2;transition:left .15s}
.sw.on i{left:24px}

.past{
  background:#1a1f29;border:1px solid #262d3a;border-radius:12px;padding:11px 14px;
  margin:0 0 14px;color:#8a94a6;font-size:13px;line-height:1.7;text-align:center;
}
.past b{color:#e0a86a;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.lrow{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid #222833;font-size:14px}
.lrow:last-child{border-bottom:none}
.lt{flex:none;width:44px;color:#6f7a8c;font-size:12.5px;font-variant-numeric:tabular-nums}
.ln{flex:1;line-height:1.5}
.ld{flex:none;color:#8a94a6;font-size:12.5px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ============================================================
   B.M.C. 切り替えルーティン (routine.html) ＝ Switchアプリ
   作成: B.M.C.(Claude) / 2026-08-14
   v2: セットの追加・削除・並べ替えに対応
   v3: 2026-08-15 実行の記録（履歴）を追加
   v4: 2026-08-19（指示_2026-08-19_2、Quick Memoご依頼）
     ご依頼3点: ①4-7-8呼吸法・3分ガイド ②音声で切り替えを案内
                ③起動時にSpotify瞑想プレイリストを開く ④各ステップに
                タイマーを持たせ、終わったら自動で次のタイマーが動く流れ

     【④が本体】従来のセットはすべて「タップで完了→次へ」（toggleStep）で、
     ステップの秒数は目安の文字表示だけでした。④はこれと別に「自動で進む」
     モード（set.auto=true）を新設。既存5セットは一切変えず（auto無し＝
     従来どおりタップ式）、新設の🫁セットだけ auto:true にしています。
     auto セットは「いま何ステップ目にいるべきか」を毎回 elapsed()（開始
     時刻からの経過）から計算し直します（autoTick）。setTimeoutの連鎖で
     進めると、iOSでバックグラウンドに回った瞬間に止まって二度と進まない
     ため採用していません。elapsed() は他の機能同様、画面に戻ったときに
     時刻から再計算されるので、バックグラウンドから戻っても正しい位置に
     復帰します（ズレるのは、飛ばされた間の音声・チャイムだけ）。

     ②音声案内は Web Speech API（speechSynthesis）。未対応環境では
     何も起きないだけで、タイマー自体は変わらず動きます。DB.voice で
     オンオフ（既定オン）。

     ③Spotifyは「起動時にURLを新規タブで開く」だけの実装です。プレイ
     リストのURL自体はご本人しか持っていないため、こちらでは決め打ち
     せず、設定欄（DB.spotifyUrl）に入れていただく形にしました。未入力
     なら何もしません。iOSでSpotifyアプリの前面に切り替わると、このペ
     ージ側のタイマーはバックグラウンド扱いになり一時停止しますが、
     ページに戻れば時刻から再計算されるので秒数はズレません（止まって
     見えるのは音声とチャイムだけ）。この制約は正直に画面内に書きました。

     【やらないこと】呼吸法セットも、他の5セットと同じ安全方針を継承
     しています。連続日数・達成率・「できなかった呼吸」は数えません。
     3分は目安であって、達成/未達の判定基準にはしません。

   v5: 2026-08-19（チャットでの追加ご要望）
     ご依頼: ①自動進行にするかタップ式にするかを「ルーティンごと」に選べる
             ②音声ガイドも自分で編集できる ③Spotifyのプレイリストも
             ルーティンごとに設定できる ④呼吸法を含む休憩ルーティンを
             自分で組めるようにする

     【v4の何を直したか】v4は「🫁セットだけが自動進行・音声・Spotify」と
     いう特別扱いでした。v5はその特別扱いを解体し、すべてを**セット単位の
     設定**に格下げしています。コード側に「呼吸法だけの分岐」は残っていま
     せん（breathSteps() は既定データを組み立てるためだけの関数です）。

     - set.auto      … 自動で進む（false/未設定＝従来どおりタップ式）
     - set.voice     … このセットで読み上げる
     - set.spotify   … 開始時にプレイリストを開く
     - set.spotifyUrl… このセット専用のURL。空ならホーム画面の既定URLを使う
     いずれも編集画面から切り替えられます。既存5セットの中身は1文字も
     変えていません（auto が無いセットは従来どおりタップ式のまま）。

     【ステップ書式の拡張】「秒|画面の文言|読み上げ」の3列目を追加しました。
     3列目を省略したときは、従来どおり画面の文言から（…）を除いたものを
     読みます。※副作用：文言そのものに「|」を含めていた場合、その後ろが
     読み上げ文として扱われます（画面表示は「|」の手前までになります）。

     【自動進行画面の汎用化】v4の実行画面は「3ステップ＝1サイクル」を決め
     打ちしており、呼吸法以外のセットでは表示が壊れました。v5はステップの
     繰り返し周期を自動検出し、繰り返しがあれば「サイクル m/n」、無ければ
     「ステップ m/n」と出します。次のステップも1行だけ添えます（休憩ルー
     ティンのように中身がばらばらのセットでは、次に何が来るかが要るため）。

     【自動進行セットの全体時間】ステップの合計から毎回計算します（制限
     時間の欄は出しません）。ステップを増減したときに総時間だけ古いまま
     残る事故を防ぐためです。

   === v3で置いた線引き（fast.html・gym.html にも同じものが効きます） ===
   出す  : 起きた事実だけ。   実行の累計回数／実行した日と時刻／前回やったセット
   出さない: 起きなかった事実から計算した数。
           連続日数（途切れると0に戻る）／達成率（分母に「やらなかった日」が入る）
           ／最長記録／目標値／バッジ／平均
   理由: 前者は崩れても減りません。後者は必ず「できなかった日」を画面に出します。

   設計の前提（変えないでください）:
   - このアプリは「その場の道具」です。記録の正は Obsidian のままで、
     ここから日次ノート・Points Tracker へは一切書きません。
     履歴もこの端末の localStorage の中だけに置きます。
   - 連続日数・達成率・できなかった日の記録は持ちません。
     「崩れた日が画面に残る」形を作らないためです。
   - 0ステップで終えた回も「押した」事実としては残しますが、
     画面には 0/4 のような数字ではなく「押しました」とだけ出します。
   - 途中参加・飛ばし・崩れたあとの再開を、いつでもできるようにしてあります
     （順番どおりにしか進めない作りが「総くずれして戻れない」の正体のため）。
   - セットは配列です。追加・削除・並べ替えは自由。ただし🛟（rescue:true）は
     「崩れた」ボタンの飛び先なので、必ず1つ残る作りにしてあります。
   ============================================================ */

var KEY = "bmc_routine_v1";

/* --- v4: 4-7-8呼吸法のステップを組み立てる ----------------------
   吸う4秒・止める7秒・吐く8秒＝1サイクル19秒。9サイクルで171秒（2:51）。
   「3分」はぴったりではなく目安です。回数を変えたいときは、既存の
   セット編集画面（ステップのテキストエリア）でそのまま増減できます。 */
function breathSteps(n){
  var out = [];
  for(var i=0;i<n;i++){
    out.push("4|吸う（4秒）");
    out.push("7|止める（7秒）");
    out.push("8|吐く（8秒）");
  }
  return out;
}

/* --- 既定のルーティン ---------------------------------------
   すべて既存の記録から採っています（新しく思いついた行動は入れていません）。
   steps は「秒|文言」の形式。すべてアプリ内で編集できます。 */
function defaults(){ return [
  { id:"home", icon:"🏠", name:"在宅勤務・夕方の切り替え", limit:900,
    note:"仕事を終える瞬間に押します。在宅は「帰る」動作がないので、これが唯一の切れ目です。",
    steps:[
      "60|PCを閉じて、視界の外へ置く（別室・引き出し・カバンの中）",
      "60|洗面所へ行ってマウスウォッシュ",
      "300|温かい飲み物を1杯いれて、キッチンの外で飲み切る",
      "480|両手がふさがることを1つ始める（子どもとゲーム／お風呂の準備）"
    ]},
  { id:"commute", icon:"🚃", name:"帰路（職場を出たら）", limit:600,
    note:"駅の店より手前で押します。8/13はスーパーが電車より先でした。",
    steps:[
      "30|イヤホンを付ける",
      "30|ゲームを起動する（両手がふさがるもの。音声だけにしない）",
      "480|夢中になったまま改札を通る／店の前を通過する",
      "60|家に着いたら、キッチンではなく洗面所へ入る"
    ]},
  { id:"oneope", icon:"👶", name:"ワンオペの夜", limit:900,
    note:"Routine_Master の Night_Work_oneope は18:50始まりです。8/13の崩れはその前でした。",
    steps:[
      "60|マウスウォッシュ",
      "300|温かい飲み物を1杯、洗面所・脱衣所で飲み切る",
      "300|終わらないと思っているタスクを分解 → 今日やる分だけ決める",
      "240|残りは明日に回すと決めて、画面を閉じる"
    ]},
  { id:"overtime", icon:"🌙", name:"残業日の夜", limit:600,
    note:"17:45の行は既に機能しています（8/12はここだけチェックが付き、間食も最少でした）。",
    steps:[
      "60|飲み物を用意して一度席を立つ",
      "60|PCを閉じてカバンに入れる",
      "300|乗車15分、明日やることを書き切る",
      "180|書き切ったらゲームか音声に切り替える"
    ]},
  { id:"dinner", icon:"🍽", name:"夕食の準備前（盛り付けの手順）", limit:180,
    note:"手ばかり｜主食＝こぶし1個 ／ 主菜＝手のひら1枚（厚みも同じ） ／ 野菜・海藻・きのこ＝両手に山盛り1杯（加熱なら片手山盛り）。※これは確認作業ではなく、盛り付けの手順そのものです。読みながら手を動かしてください。食後は「パンパンになったか」の1問だけで、ここでは何も記録しません。",
    steps:[
      "20|お皿を1枚出す。今日はこの中で完成",
      "40|先に汁物を1杯（野菜・わかめ・きのこ）",
      "40|皿の半分に、野菜・きのこ・海藻",
      "40|残り半分に、手のひら1枚の主菜 と こぶし1個のごはん",
      "40|タレ・ドレッシングは小皿へ。今日は焼く・蒸す・煮る・レンジ"
    ]},
  { id:"breath478", icon:"🫁", name:"4-7-8呼吸法（ストレス解消・約3分）", limit:171,
    auto:true, voice:true, spotify:true,
    note:"吸う4秒・止める7秒・吐く8秒 × 9回。タップして進める必要はありません。合図（音・声）に合わせて呼吸するだけです。",
    steps: breathSteps(9) },
  { id:"rescue", icon:"🛟", name:"崩れたあとの復帰（1手だけ）", limit:180, rescue:true,
    note:"やり直しではありません。今日をここで終わらせて、次の合図まで戻るためのものです。",
    steps:[
      "60|口をゆすぐ（または歯を磨く）＝今日の食事はここで終わり",
      "120|座って、水か炭酸水を1杯飲み切る"
    ]}
]; }

var DB = { v:5, sets:null, chime:true, voice:true, spotifyUrl:"", scName:"ルーティンタイマー", log:[], count:0 };
try{
  var raw = localStorage.getItem(KEY);
  if(raw){
    var p = JSON.parse(raw);
    if(typeof p.chime==="boolean") DB.chime = p.chime;
    if(typeof p.voice==="boolean") DB.voice = p.voice;
    if(typeof p.spotifyUrl==="string") DB.spotifyUrl = p.spotifyUrl;
    if(p.scName) DB.scName = p.scName;
    if(Array.isArray(p.log)) DB.log = p.log;
    if(typeof p.count==="number" && p.count>=0) DB.count = p.count;
    if(p.mig_dinner===true) DB.mig_dinner = true;
    if(p.mig_breath478===true) DB.mig_breath478 = true;
    if(DB.count < DB.log.length) DB.count = DB.log.length;
    if(Array.isArray(p.sets)) DB.sets = p.sets;
    else if(p.sets && typeof p.sets==="object"){
      /* v1（キー付きオブジェクト）からの移行。編集済みの内容は保持する。 */
      var order = ["home","commute","oneope","overtime","dinner","rescue"], out = [];
      order.forEach(function(k){ if(p.sets[k]){ var s = p.sets[k]; s.id = k; out.push(s); } });
      for(var k2 in p.sets){ if(order.indexOf(k2)<0){ p.sets[k2].id = k2; out.push(p.sets[k2]); } }
      DB.sets = out;
    }
  }
}catch(e){}
if(!DB.sets || !DB.sets.length) DB.sets = defaults();
if(!DB.sets.some(function(s){return s.rescue})) DB.sets.push(defaults().filter(function(s){return s.rescue})[0]);
/* 2026-08-15追加：🍽 夕食の準備前。★一度だけ入れる。
   mig_dinner を立てるので、削除されたら二度と戻らない（毎回マージしない）。
   packing.html の SEED と同じ原則＝正本はご本人が編集したデータの側。 */
if(!DB.mig_dinner){
  DB.mig_dinner = true;
  if(!DB.sets.some(function(s){return s.id==="dinner"})){
    var dn = defaults().filter(function(s){return s.id==="dinner"})[0];
    var at = DB.sets.length;
    DB.sets.forEach(function(s,i){ if(s.rescue && i<at) at = i; });
    DB.sets.splice(at, 0, dn);
  }
  save();

/* --- v4: auto セット（4-7-8呼吸法）の状態 ---------------------
   setTimeoutを連鎖させず、常に「いま何ステップ目にいるべきか」を
   elapsed() から逆算する（バックグラウンド復帰後も自己修復するため）。 */

   1回の実行につき1件。押した時刻・セット・やれたステップ数だけを持ちます。
   「やらなかった日」は行を作りません（無い日は履歴に出てきません）。 */
var LOGMAX = 400;
function logRun(){
  var s = setOf(curId); if(!s) return;
  var n = s.steps.length, d = 0;
  for(var i=0;i<n;i++){ if(doneSet[i]==="done") d++; }
  var rec = { t:Date.now(), id:s.id, icon:s.icon, name:s.name, d:d, n:n, sec:Math.abs(elapsed()) };
  if(runIdx===null){
    DB.log.push(rec);
    DB.count++;
    if(DB.log.length > LOGMAX) DB.log = DB.log.slice(DB.log.length - LOGMAX);
    runIdx = DB.log.length - 1;
  }else{
    /* 「続きに戻る」で続けた場合は、同じ回を上書きする（2件に増やさない） */
    rec.t = DB.log[runIdx].t;
    DB.log[runIdx] = rec;
  }
  save();
}
function doneCount(){
  var s = setOf(curId); if(!s) return 0;

var ac = null;
function beep(f,d){
  if(!DB.chime) return;
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    var o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = f; o.type = "sine";
    g.gain.setValueAtTime(.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.28, ac.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+d);
    o.start(); o.stop(ac.currentTime+d+.02);
  }catch(e){}
}

/* --- v4: 音声案内（Web Speech API） -----------------------------
   未対応環境・発話エンジン取得失敗時は、何もせず無音で終わる
   （タイマー自体の動作には影響しない）。 */
function speak(text){
  if(!DB.voice) return;
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();  /* 前の発話が残っていたら止めてから話す */
    var u = new SpeechSynthesisUtterance(text);

}

/* --- v4: いまの経過秒数（一時停止中は止めて見せる） --- */
function curElapsed(){ return autoPaused ? Math.floor((pauseAt-startAt)/1000) : elapsed(); }

/* --- v4: autoセットのステップ位置を elapsed() から逆算する ---
   render() のたびに呼ぶ。ステップが変わった瞬間だけチャイム・音声を鳴らす。
   一時停止中は何もしない（curElapsed が動かないため呼んでも実質同じだが、
   念のため早期リターンする）。 */
/* 注意: render() の中から呼ぶため、ここでは render() を呼び直さない
   （呼ぶと二重実行になり、あとに呼ばれた側の描画で上書きされて画面が
   壊れる）。完了時は view を書き換えるだけにして、続きの分岐は
   呼び出し元の render() に任せる。 */
function autoTick(s){
  if(!s || !s.auto || autoPaused || autoFinished) return;
  var st = stepsOf(s), cum = 0, idx = -1, e = curElapsed();
  for(var i=0;i<st.length;i++){
    cum += st[i].sec;
    if(e < cum){ idx = i; break; }
  }
  if(idx < 0){
    /* 最後まで来た */
    for(var k=0;k<st.length;k++) doneSet[k] = "done";
    autoFinished = true;
    if(tick){ clearInterval(tick); tick = null; }
    chimeDone();
    logRun();
    view = "done";
    return;
  }
  if(idx !== curStep){
    for(var j=curStep; j<idx && j<st.length; j++){ if(!doneSet[j]) doneSet[j] = "done"; }
    curStep = idx;
    chimeStep();
    if(s.voice) speak(sayOf(st[idx]));  /* 3列目があればそれを、無ければ（…）を外した文言を読む */
  }
}
/* v4: 手動で次のステップへ進める（合わないときのための逃げ道） */
function autoSkip(){
  var s = setOf(curId); if(!s || !s.auto) return;
  var st = stepsOf(s), cum = 0;
  for(var i=0;i<=curStep && i<st.length;i++){ cum += st[i].sec; }
  var base = autoPaused ? pauseAt : Date.now();
  startAt = base - (cum+0.05)*1000;
  if(autoPaused) pauseAt = base;
  render();
}
/* v4: 一時停止・再開 */
function autoPauseToggle(){
  if(autoPaused){ startAt += (Date.now()-pauseAt); autoPaused = false; }
  else { pauseAt = Date.now(); autoPaused = true; }
  render();
}

/* --- 補助 --- */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function mmss(s){ var m=Math.floor(Math.abs(s)/60), x=Math.abs(s)%60; return (s<0?"+":"")+m+":"+String(x).padStart(2,"0"); }
/* v5: ステップの書式は「秒|画面の文言|読み上げ（省略可）」。
   3列目が無いときは、画面の文言から（…）を外したものを読み上げます。 */
function parseStep(line){
  var p = String(line).split("|");
  if(p.length<2) return { sec:60, text:String(line).trim(), say:"" };
  return {
    sec: parseInt(p[0],10)||60,
    text: (p[1]||"").trim(),
    say: p.length>2 ? p.slice(2).join("|").trim() : ""
  };
}
function sayOf(x){
  if(x && x.say) return x.say;
  return String(x&&x.text||"").replace(/（[^）]*）/g,"").replace(/\([^)]*\)/g,"").trim();
}
/* v5: 繰り返しの周期を見つける（4-7-8のように同じ並びが続くセット用）。
   見つかれば「サイクル m/n」、見つからなければ「ステップ m/n」と出す。 */
function cyclePeriod(st){
  var n = st.length;
  if(n < 4) return 0;
  for(var p=1; p<=n/2; p++){
    if(n % p) continue;
    var ok = true;
    for(var i=p;i<n;i++){
      if(st[i].text !== st[i%p].text || st[i].sec !== st[i%p].sec){ ok = false; break; }
    }
    if(ok) return p;
  }
  return 0;
}
function setOf(id){ for(var i=0;i<DB.sets.length;i++){ if(DB.sets[i].id===id) return DB.sets[i]; } return null; }
function idxOf(id){ for(var i=0;i<DB.sets.length;i++){ if(DB.sets[i].id===id) return i; } return -1; }
function normals(){ return DB.sets.filter(function(s){return !s.rescue}); }
function rescues(){ return DB.sets.filter(function(s){return s.rescue}); }
function stepsOf(s){ return s.steps.map(parseStep); }
function sumSec(s){ return stepsOf(s).reduce(function(a,b){return a+b.sec;},0); }
/* v5: 自動進行のセットは、全体時間を必ずステップの合計から出す。
   （ステップを増減したのに制限時間だけ古い数字が残る事故を防ぐため） */
function limitOf(s){ if(s.auto) return sumSec(s); return s.limit ? s.limit : sumSec(s); }
function elapsed(){ return startAt ? Math.floor((Date.now()-startAt)/1000) : 0; }
function left(){ var s = setOf(curId); return s ? limitOf(s) - elapsed() : 0; }
function allDone(){ var s=setOf(curId); for(var i=0;i<s.steps.length;i++){ if(!doneSet[i]) return false; } return true; }

/* --- 実行 --- */
function start(id, fromIndex){
  curId = id; doneSet = {}; curStep = fromIndex||0;
  for(var i=0;i<curStep;i++) doneSet[i] = "skip";
  startAt = Date.now();
  runIdx = null;
  autoPaused = false; pauseAt = 0; autoFinished = false;
  var s = setOf(id);
  if(s && s.voice){ var st0 = stepsOf(s)[curStep]; if(st0) speak(sayOf(st0)); }
  openSpotify(s);   /* set.spotify が入っているセットだけ開く（中で判定） */
  if(tick) clearInterval(tick);
  tick = setInterval(render, 250);
  view = "run"; render();
}
function stop(){ if(tick) clearInterval(tick); tick=null; startAt=0; curId=null; doneSet={}; curStep=0; runIdx=null; autoPaused=false; pauseAt=0; autoFinished=false; }
function toggleStep(i){
  if(doneSet[i]){ delete doneSet[i]; render(); return; }
  doneSet[i] = "done";
  var s = setOf(curId), next = -1;
  for(var j=0;j<s.steps.length;j++){ if(!doneSet[j]){ next=j; break; } }
  curStep = next<0 ? s.steps.length : next;
  if(allDone()){ chimeDone(); enterDone(); }
  else {
    chimeStep();
    /* v5: タップ式のセットでも、音声がオンなら次のステップを読み上げる */
    if(s.voice){ var nx = stepsOf(s)[curStep]; if(nx) speak(sayOf(nx)); }
    render();
  }
}
function enterDone(){
  if(tick) clearInterval(tick); tick=null;
  logRun();          /* 終わりまで来た回は、0ステップでも「押した」事実として残す */
  view="done"; render();
}
function finishNow(){ enterDone(); }
function leaveRun(){
  /* 途中でやめた回。1つでもやれていれば残し、0のままなら残さない
     （画面を開いただけ・押し間違いを履歴に増やさないため） */
  if(runIdx===null && doneCount()>0) logRun();
  stop(); go("home");
}

                + "&input=text&text=" + sec;

  else if(view==="done") h = viewDone();

  else if(view==="log") h = viewLog();

/* --------- これまでの記録 --------- */
function viewLog(){
  var h = '<h1>これまでの記録</h1>';
  if(!DB.log.length){
    h += '<p class="sub">まだ1件もありません。ひとつ押すと、ここに残ります。</p>';
    h += '<button class="btn ghost" onclick="go(\'home\')">戻る</button>';
    return h;
  }
  h += '<div class="card"><div class="big ok">'+DB.count+'</div>'
     + '<div class="bigsub">これまでに押した回数</div></div>';
  h += '<p class="note">この数は減りません。空いた日は行が出ないだけで、'
     + '×も赤字も付きません。<b>連続日数と達成率は数えていません。</b></p>';

  /* 新しい順に、日ごとにまとめる */
  var byDay = {}, order = [];
  for(var i=DB.log.length-1;i>=0;i--){
    var r = DB.log[i], k = dayKey(r.t);
    if(!byDay[k]){ byDay[k] = []; order.push(k); }
    byDay[k].push(r);
  }
  var wk = dayKey(Date.now() - 6*86400000);
  var recent = order.filter(function(k){ return k >= wk; });
  var older  = order.filter(function(k){ return k <  wk; });

  function block(keys){
    var s = "";
    keys.forEach(function(k){
      var rs = byDay[k];
      s += '<div class="sec">'+dayLabel(rs[0].t)+'　<span class="tag">'+rs.length+'回</span></div>';
      s += '<div class="card" style="padding:6px 14px">';
      rs.forEach(function(r){
        /* 0ステップの回は数字を出さない（「押した」という事実だけを残す） */
        var what = r.d>0 ? (r.d+' / '+r.n) : '押しました';
        s += '<div class="lrow"><span class="lt">'+hhmm(r.t)+'</span>'
           + '<span class="ln">'+esc(r.icon)+' '+esc(r.name)+'</span>'
           + '<span class="ld">'+what+'</span></div>';
      });
      s += '</div>';
    });
    return s;
  }
  h += '<div class="sec" style="color:#e0a86a">この7日間</div>';
  h += recent.length ? block(recent)
     : '<div class="card"><p class="note" style="margin:0">この7日間の記録はまだありません。次に押したぶんから、ここに並びます。</p></div>';
  if(older.length){
    h += '<div class="sec" style="color:#e0a86a">それより前</div>' + block(older);
  }
  h += '<button class="btn ghost" onclick="go(\'home\')">戻る</button>';
  h += '<button class="btn danger'+(clearArmed?' armed':'')+'" onclick="clearLog()">'
     + (clearArmed ? 'もう一度押すと記録をすべて消します' : '記録をすべて消す')+'</button>';
  if(clearArmed) h += '<div class="warn">回数も履歴も0に戻ります。<b>元に戻せません。</b>やめるときは「戻る」を押してください。</div>';
  return h;
}
function clearLog(){

  DB.log = []; DB.count = 0; clearArmed = false; save(); render();
}

function viewRun(){
  var s = setOf(curId);
  if(s && s.auto) return viewRunAuto(s);
  var st = stepsOf(s), lim = limitOf(s), l = left();
  var pct = Math.max(0, Math.min(100, (elapsed()/lim)*100));
  var h = '<h1>'+esc(s.icon)+' '+esc(s.name)+'</h1>'+(s.note ? '<p class="sub">'+esc(s.note)+'</p>' : '');
  h += '<div class="card">';
  h += '<div class="big'+(l<0?' over':'')+'">'+mmss(l)+'</div>';
  h += '<div class="bigsub">'+(l<0 ? '時間は超えました。続けて大丈夫です' : '残り時間')+'</div>';
  h += '<div class="bar"><i style="width:'+pct+'%"></i></div>';
  h += '</div>';
  st.forEach(function(x,i){
    var cls = doneSet[i] ? "step done" : (i===curStep ? "step cur" : "step");
    var mark = doneSet[i]==="done" ? "✓" : (doneSet[i]==="skip" ? "–" : (i+1));
    h += '<div class="'+cls+'" onclick="toggleStep('+i+')"><div class="n">'+mark+'</div>'
       + '<div class="t">'+(doneSet[i]==="skip"?'<s>'+esc(x.text)+'</s>':esc(x.text))
       + '<em>目安 '+(x.sec>=60 ? Math.round(x.sec/60)+'分' : x.sec+'秒')+'</em></div></div>';
  });
  h += '<p class="note">タップで完了。もう一度タップで戻せます。<br>下の行から始めても構いません（上は「–」になるだけで、失敗にはなりません）。</p>';
  h += '<button class="btn ghost" onclick="nativeTimer()">⏱ iPhoneのタイマーにも残り'+Math.max(1,Math.round(left()/60))+'分を渡す</button>';
  h += '<p class="note">この画面は他のアプリを開くと止まります（戻れば時刻から計算し直すのでズレません）。<br><b>画面の上に残り時間を出したいときは、上のボタンでiPhone標準のタイマーへ渡してください。</b></p>';
  if(s.spotify){
    h += '<button class="btn ghost" onclick="openSpotify()">🎵 プレイリストを開く'+(spUrl(s)?'':'（未設定）')+'</button>';

  h += '<button class="btn link" onclick="leaveRun()">やめて最初に戻る</button>';
  return h;
}

/* --- v5: 自動で進むセットの実行画面 ---------------------------
   タップで進める一覧ではなく、いまのステップだけを大きく出す。
   残り秒数は「このステップの残り」。全体の経過は下に小さく添える。
   v4では「3ステップ＝1サイクル」を決め打ちしていたが、呼吸法以外の
   セット（休憩ルーティン等）では意味を成さないため、繰り返しの周期を
   自動検出する形にした（cyclePeriod）。繰り返しが無いセットでは
   「ステップ m/n」と出し、次に来るステップを1行だけ添える。 */
function viewRunAuto(s){
  var st = stepsOf(s), e = curElapsed();
  var cum = 0, stepEnd = 0, cur = st[Math.min(curStep,st.length-1)];
  var curText = cur ? cur.text : "";
  for(var i=0;i<st.length;i++){
    cum += st[i].sec; stepEnd = cum;
    if(i===curStep) break;
  }
  var remainInStep = Math.max(0, stepEnd - e);
  var p = cyclePeriod(st), head;
  if(p){
    head = 'サイクル '+Math.min(Math.floor(curStep/p)+1, st.length/p)+' / '+(st.length/p);
  }else{
    head = 'ステップ '+Math.min(curStep+1, st.length)+' / '+st.length;
  }
  var nx = st[curStep+1];
  var h = '<h1>'+esc(s.icon)+' '+esc(s.name)+'</h1>'+(s.note ? '<p class="sub">'+esc(s.note)+'</p>' : '');
  h += '<div class="card">';
  h += '<div class="bigsub">'+head+'</div>';
  /* 文言が長いセット（休憩ルーティン等）でも1〜2行に収まるよう字を小さくする */
  var fs = curText.length>26 ? 20 : (curText.length>13 ? 26 : 34);
  h += '<div class="big" style="font-size:'+fs+'px;line-height:1.4;margin:2px 0 8px">'+esc(curText)+'</div>';
  h += '<div class="big'+(autoPaused?' over':'')+'">'+remainInStep+'</div>';
  h += '<div class="bigsub">'+(autoPaused ? '一時停止中' : 'このステップの残り秒数')+'</div>';
  h += '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,(e/limitOf(s))*100))+'%"></i></div>';
  h += '<p class="note" style="text-align:center;margin-top:8px">'
     + (nx ? '次： '+esc(nx.text)+'<br>' : '次でおしまいです<br>')
     + '全体の経過 '+mmss(e)+' ／ 目安 '+Math.round(limitOf(s)/60)+'分</p>';
  h += '</div>';
  h += '<p class="note">タップして進める必要はありません。'+(s.voice?'合図（音・声）':'合図（音）')+'に合わせて進めてください。<br>合わない長さのときは「次へ」で先に進めます。</p>';
  h += '<div class="row">';
  h += '<button class="btn ghost" onclick="autoPauseToggle()">'+(autoPaused?'再開':'一時停止')+'</button>';
  h += '<button class="btn ghost" onclick="autoSkip()">次へ ▶</button>';
  h += '</div>';
  if(s.spotify){
    h += '<button class="btn ghost" onclick="openSpotify()">🎵 プレイリストを開く'+(spUrl(s)?'':'（未設定）')+'</button>';
    if(!spUrl(s)) h += '<p class="note">このセットの編集画面か、ホーム画面の「設定」にプレイリストのURLを入れると、次回からここで開けます。</p>';
  }
  h += '<button class="btn" onclick="finishNow()">ここまでで終える</button>';
  h += '<button class="btn link" onclick="leaveRun()">やめて最初に戻る</button>';
  return h;
}

function viewDone(){
  var s = setOf(curId), n = s.steps.length, d = 0;
  for(var i=0;i<n;i++){ if(doneSet[i]==="done") d++; }
  var within = left() >= 0;
  var h = '<h1>'+(d===n ? '完了' : 'ここまで')+'</h1>';
  h += '<div class="card"><div class="big ok">'+d+' / '+n+'</div>';
  h += '<div class="bigsub">'+esc(s.name)+' ・ '+mmss(Math.abs(elapsed()))+'</div></div>';
  if(d===n && within) h += '<div class="hint">タイマーの中でやり切れました。</div>';
  else if(d===n) h += '<div class="hint">全部やれました。時間は超えましたが、見ているのは順番ではなく「やったかどうか」です。</div>';
  else if(d>0) h += '<div class="hint">'+d+'つやれました。<b>0か1かではありません。</b>次の合図でまた押せます。</div>';
  else h += '<div class="hint">今日はここまで。押したこと自体は残っています。次の合図でまた押してください。</div>';
  h += '<div class="past">これで <b>'+DB.count+'</b> 回目です</div>';
  h += '<p class="note">この記録はこの端末の中だけに残ります。Obsidian・Points Tracker には入りません。<br>連続日数と達成率は数えていません。</p>';
  if(!s.rescue && d<n) h += '<button class="btn ghost" onclick="go(\'run\');tick=setInterval(render,250)">続きに戻る</button>';
  h += '<button class="btn" onclick="stop();go(\'home\')">最初に戻る</button>';
  h += '<button class="btn link" onclick="stop();go(\'log\')">📖 これまでの記録を見る</button>';
  return h;
}

/* --------- 編集（追加・削除・並べ替え） --------- */
function collect(){
  /* 画面に入力されている内容をDBへ取り込む。移動・削除・追加の前に必ず呼ぶ。 */
  DB.sets.forEach(function(s){
    var ic = document.getElementById("ic_"+s.id); if(ic && ic.value.trim()) s.icon = ic.value.trim();
    var nm = document.getElementById("nm_"+s.id); if(nm && nm.value.trim()) s.name = nm.value.trim();
    var nt = document.getElementById("nt_"+s.id); if(nt) s.note = nt.value.trim();
    var lm = document.getElementById("lim_"+s.id);
    if(lm){ var lv = parseInt(lm.value,10); if(lv>0) s.limit = lv; }
    /* v5: URLは「空にする」操作も意味を持つので、空欄もそのまま取り込む */
    var sp = document.getElementById("sp_"+s.id);
    if(sp) s.spotifyUrl = sp.value.trim();
    var tx = document.getElementById("tx_"+s.id);
    if(tx){ var arr = tx.value.split("\n").filter(function(x){return x.trim()!==""}); if(arr.length) s.steps = arr; }
  });
}
/* v5: セットごとのオンオフ（進み方・音声・Spotify）。
   トグルは押すと再描画されるので、入力中の文字が消えないよう
   先に collect() で取り込んでから切り替える（move/del と同じ手順）。 */
function setFlag(id, key){
  collect();
  var s = setOf(id); if(!s) return;
  s[key] = !s[key];
  armed = null; save(); render();
}
/* v5: セットの複製。呼吸法のセットを土台に休憩ルーティンを組むための入口。 */
function dup(id){
  collect();
  var s = setOf(id); if(!s) return;
  var c;
  try{ c = JSON.parse(JSON.stringify(s)); }catch(e){ return; }
  c.id = newId();
  c.name = s.name + "（コピー）";
  c.rescue = false;   /* 🛟の複製は普通のセットとして増やす（飛び先は1つのままにする） */
  DB.sets.splice(idxOf(id)+1, 0, c);
  armed = null; save(); render();
  setTimeout(function(){ var el = document.getElementById("nm_"+c.id); if(el){ el.focus(); el.select(); } }, 30);
}

          ? '<p class="note" style="margin-top:9px">秒数どおりに数えて次へ進みます。全体の時間は<b>ステップの合計（'+mmss(sumSec(s))+'）</b>で、ここでは入力しません。</p>'
          : '<label>全体の制限時間（秒）</label><input class="inp" type="number" id="lim_'+s.id+'" value="'+limitOf(s)+'">')
       + '<label>ステップ<span class="tag">秒数|文言|読み上げ</span></label>'
       + '<textarea id="tx_'+s.id+'">'+esc(s.steps.join("\n"))+'</textarea>'
       + '<div class="tools">'
       + '<button onclick="move(\''+s.id+'\',-1)"'+(i===0?' disabled':'')+'>↑ 上へ</button>'
       + '<button onclick="move(\''+s.id+'\',1)"'+(i===DB.sets.length-1?' disabled':'')+'>↓ 下へ</button>'
       + '<button onclick="dup(\''+s.id+'\')">複製</button>'
       + '<button class="rm'+(isArmed?' armed':'')+'" onclick="del(\''+s.id+'\')">'
       + (isArmed?'もう一度押すと削除':'削除')+'</button>'
       + '</div>'
       + (isArmed ? '<div class="warn">このセットを削除します。<b>元に戻せません。</b>やめるときは、上へ・下へか「保存する」を押してください。</div>' : '')
       + '</div>';
  });
  h += '<button class="btn ghost" onclick="addSet()">＋ セットを追加する</button>';
  h += '<button class="btn save" onclick="collect();save();go(\'home\')">保存する</button>';
  h += '<p class="note">空にした欄は、変更なしとして扱います（うっかり消えないようにするためです）。説明文とプレイリストURLだけは空にできます。<br>並べ替え・複製・削除・追加・トグルの切り替えは、押した時点でその場で保存されます。</p>';
  h += '<button class="btn link" onclick="resetAll()">既定のセットに戻す</button>';
  h += '<button class="btn ghost" onclick="collect();save();go(\'home\')">戻る</button>';
  return h;
}
function move(id,d){
  collect();
  var i = idxOf(id), j = i+d;
  if(i<0 || j<0 || j>=DB.sets.length) return;
  var t = DB.sets[i]; DB.sets[i] = DB.sets[j]; DB.sets[j] = t;
  armed = null; save(); render();
}
function del(id){
  if(armed!==id){ collect(); armed = id; render(); return; }
  collect();
  var s = setOf(id);
  if(s && s.rescue && rescues().length<=1){
    /* 🛟は「崩れた」ボタンの飛び先なので、最後の1つは消さない */
    armed = null; render();
    alertLess("崩れたとき用のセットは、最後の1つは削除できません。中身は自由に書き換えられます。");
    return;
  }
  DB.sets.splice(idxOf(id),1);
  armed = null; save(); render();
}
function alertLess(msg){
  /* ダイアログを出さずにメッセージを見せる（iOSでダイアログが画面を塞ぐのを避ける） */
  var d = document.createElement("div");
  d.className = "warn"; d.style.position = "fixed"; d.style.left = "12px"; d.style.right = "12px";
  d.style.bottom = "20px"; d.style.zIndex = "9"; d.style.maxWidth = "536px"; d.style.margin = "0 auto";
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 4000);
}
function addSet(){
  collect();
  var s = { id:newId(), icon:"⏱", name:"新しいセット", note:"", limit:600,
            steps:["60|やること1","300|やること2"] };
  var last = -1;
  DB.sets.forEach(function(x,i){ if(!x.rescue) last = i; });
  DB.sets.splice(last+1, 0, s);   /* 🛟より前に入れる */
  armed = null; save(); render();
  setTimeout(function(){ var el = document.getElementById("nm_"+s.id); if(el){ el.focus(); el.select(); } }, 30);
}
function resetAll(){ DB.sets = defaults(); armed = null; save(); go("home"); }

    + '・押した回数の累計<br>'

    + '</p></div>';

    + '<b>持たないもの</b><br><br>'
    + '・<b>連続日数・達成率・最長記録・目標値・バッジ</b><br>'
    + '　これらは<b>「やらなかった日」から計算する数</b>です。<br>'
    + '　連続日数は途切れると0に戻り、達成率は空いた日を分母に入れます。<br>'
    + '　どちらも「崩れた日が画面に残る」形そのものなので入れていません。<br><br>'
    + '・<b>Obsidianへの書き込み</b><br>'
    + '　日次ノート・Points Tracker には一切触れません。記録の正はObsidianのままです。<br><br>'
    + '・<b>順番どおりにしか進めない作り</b><br>'
    + '　途中から始められ、飛ばせて、崩れたあとに復帰できます。<br>'
    + '　1ステップ飛ばすと残りが全部崩れる形式が、「総くずれして戻れない」の正体だからです。<br><br>'
    + '・<b>バックグラウンドでの動作</b><br>'
    + '　他のアプリを開くとこの画面は止まります（iOSの仕様で、Webページには変えられません）。<br>'
    + '　ただし戻ったときは時刻から計算し直すので、<b>残り時間はズレません</b>。ズレるのは音だけです。<br><br>'
    + '・<b>画面上部（ダイナミックアイランド）への表示</b><br>'
    + '　Webページからは出せません。iOS標準のタイマーだけができることです。<br>'
    + '　実行中の「⏱ iPhoneのタイマーにも渡す」から標準タイマーを起動してください。'
    + '</p></div>';
  h += '<div class="hint">中身の設計（何を並べるか）は B.M.C. の担当ですが、<b>合わなければ全部書き換えて構いません。</b>セットの追加・削除・並べ替えもできます。<b>直したことを私に伝える義務はありません。</b></div>';
  h += '<div class="warn">中身は<b>この端末のブラウザの中だけ</b>に保存されます。履歴やサイトデータを消すと既定に戻ります。Obsidianには入りません。</div>';
  h += '<button class="btn ghost" onclick="go(\'home\')">戻る</button>';
  return h;
}

render();
</script>
