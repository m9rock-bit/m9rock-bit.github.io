<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Switch">
<meta name="theme-color" content="#12151c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2312151c'/%3E%3Ccircle cx='90' cy='96' r='46' fill='none' stroke='%23e0a86a' stroke-width='14'/%3E%3Crect x='81' y='34' width='18' height='58' rx='9' fill='%23e0a86a'/%3E%3C/svg%3E">
<title>B.M.C. 切り替えルーティン</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#12151c;color:#e8ecf2;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-user-select:none;user-select:none;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 44px}
h1{font-size:19px;margin:4px 0 2px;letter-spacing:.02em}
.sub{color:#8a94a6;font-size:12.5px;margin:0 0 16px;line-height:1.65}
.card{background:#1a1f29;border:1px solid #262d3a;border-radius:14px;padding:15px 16px;margin-bottom:11px}
.card.del{border-color:#5c3138;background:#1f1618}
.sec{font-size:12px;color:#6f7a8c;margin:24px 0 9px;letter-spacing:.06em}
.btn{
  display:block;width:100%;padding:17px;border-radius:12px;border:none;
  background:#e0a86a;color:#20160c;font-size:17px;font-weight:700;
  font-family:inherit;cursor:pointer;margin-top:10px;
}
.btn.ghost{background:#232b38;color:#cbd5e3;font-weight:600;font-size:14px;padding:12px}
.btn.link{background:none;color:#8a94a6;font-size:13px;padding:9px;font-weight:500;text-decoration:underline}
.btn.save{background:#2a3a2c;color:#cfe6d2}
.btn.danger{background:#3a2427;color:#e8b3b8}
.btn.danger.armed{background:#7d2c35;color:#fff}
.row{display:flex;gap:9px}
/* ===== v70（2026-10-21 ご依頼）: 実行画面の上を固定する =====
   「上の現在の画面を固定し、画面の下の部分でセットのそれぞれの流れが見えるように。
     終わったものは閉じる形に。食べたい、一息、記録するは上部の画面に固定」
   ★position:sticky は .wrap の中で効く（body 側に overflow を付けていないため）。
   ★固定するぶん背景を body と同じ色で塗る（下の行が透けると読めなくなる）。 */
/* v71（2026-10-21 ご指定「上の四つが縦長すぎるので修正して」）
   4枚を横一列に並べたため1枚が細くなり、文字が縦に折り返して縦長になっていた。
   → **2列のグリッド**にして、説明の <small> を外す（説明はすぐ下の注記にある）。 */
.emgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.emgrid .setb{margin-bottom:0;padding:13px 10px;font-size:15px;text-align:center;
  display:flex;align-items:center;justify-content:center;min-height:50px;line-height:1.35}
.emgrid a.setb{text-decoration:none}
.runtop{position:sticky;top:0;z-index:30;background:#12151c;
  padding:6px 0 8px;margin:0 0 4px;border-bottom:1px solid #222a36}
.runtop .card{margin-bottom:8px;padding:11px 13px}
.runtop .big{font-size:40px;margin:2px 0 0}          /* 固定するので小さくする */
.runtop .bar{margin:7px 0 0}
.runtop .btn{margin-top:7px}
.runtop .emrow .btn,.runtop .emrow a{margin-top:0;padding:9px 5px;font-size:13px}
.runttl{color:#8a94a6;font-size:12px;margin:0 0 5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.donefold{display:flex;align-items:center;gap:8px;width:100%;
  background:#171c25;border:1px dashed #2b3444;color:#8ea3b8;
  border-radius:11px;padding:9px 12px;font-size:13px;margin-bottom:8px;text-align:left}
.row>*{flex:1}

.big{font-size:64px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 2px;letter-spacing:-.03em;line-height:1.1}
.big.over{color:#8a94a6;font-size:52px}
.big.ok{color:#9ec8a4}
.bigsub{text-align:center;color:#8a94a6;font-size:13px;margin-bottom:6px}
.bar{height:5px;background:#232b38;border-radius:3px;overflow:hidden;margin:10px 0 2px}
.bar>i{display:block;height:100%;background:#e0a86a}

.setb{
  display:block;width:100%;text-align:left;background:#1a1f29;border:1px solid #262d3a;
  color:#e8ecf2;border-radius:13px;padding:15px 16px;font-size:15.5px;font-family:inherit;
  cursor:pointer;margin-bottom:10px;line-height:1.5;font-weight:600;
}
.setb small{display:block;color:#8a94a6;font-size:12.5px;font-weight:400;margin-top:4px;line-height:1.6}
.setb.rescue{background:#221a1a;border-color:#40292a}

.step{
  display:flex;gap:12px;align-items:flex-start;background:#1a1f29;border:1px solid #262d3a;
  border-radius:12px;padding:14px 15px;margin-bottom:9px;cursor:pointer;
}
.step.cur{border-color:#e0a86a;background:#211d18}
.step.done{opacity:.42}
.step .n{
  flex:none;width:26px;height:26px;border-radius:8px;background:#232b38;color:#8a94a6;
  font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:1px;
}
.step.cur .n{background:#e0a86a;color:#20160c}
.step.done .n{background:#2a3a2c;color:#9ec8a4}
.step .t{flex:1;font-size:15px;line-height:1.55}
.step .t em{display:block;font-style:normal;color:#8a94a6;font-size:12px;margin-top:3px}
.step .t s{color:#6f7a8c}

.hint{color:#cbd5e3;font-size:12.5px;line-height:1.7;background:#1f1c19;border:1px solid #2f2a24;border-radius:10px;padding:11px 13px;margin-top:11px}
.warn{color:#e8b3b8;font-size:12.5px;line-height:1.7;background:#1f1618;border:1px solid #4a2a2f;border-radius:10px;padding:11px 13px;margin-top:11px}
.note{color:#6f7a8c;font-size:12px;line-height:1.75;margin:10px 0 0}
textarea{
  width:100%;min-height:170px;background:#12151c;border:1px solid #303a4a;color:#e8ecf2;
  border-radius:10px;padding:12px;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  line-height:1.8;-webkit-user-select:text;user-select:text;
}
label{display:block;font-size:12.5px;color:#8a94a6;margin:12px 0 5px}
.inp{
  width:100%;background:#12151c;border:1px solid #303a4a;color:#e8ecf2;
  border-radius:10px;padding:12px;font-size:15px;font-family:inherit;
  -webkit-user-select:text;user-select:text;
}
.inp.icon{width:74px;text-align:center;font-size:21px;padding:10px;flex:none}
.iconrow{display:flex;gap:9px;align-items:center}
.tools{display:flex;gap:7px;margin-top:12px}
.tools button{
  flex:1;background:#232b38;border:1px solid #303a4a;color:#cbd5e3;border-radius:10px;
  padding:11px 4px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600;
}
.tools button:disabled{opacity:.32}
.tools button.rm{background:#3a2427;border-color:#5c3138;color:#e8b3b8}
.tools button.rm.armed{background:#7d2c35;border-color:#9c3a45;color:#fff}
.tag{display:inline-block;background:#232b38;border:1px solid #303a4a;border-radius:999px;padding:2px 9px;font-size:11px;color:#8a94a6;margin-left:6px;vertical-align:middle}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.toggle b{font-weight:600;font-size:14px}
.sw{width:52px;height:31px;border-radius:999px;background:#303a4a;border:none;position:relative;cursor:pointer;flex:none}
.sw.on{background:#e0a86a}
.sw i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#e8ecf2;transition:left .15s}
.sw.on i{left:24px}

/* v14: いまの項目を進める大きなボタン */
.btn.big{padding:26px 17px;font-size:21px;letter-spacing:.02em}

/* v13: 実行中にその場で開く入力欄 */
.iobox{background:#12151c;border:1px solid #e0a86a;border-radius:11px;padding:11px 12px;margin:-4px 0 11px}
.iobox label{margin-top:0}
.dnrow{background:#1a1f29;border:1px solid #262d3a;border-radius:11px;padding:11px 12px;margin-bottom:9px}
.dnrow .h{font-size:14.5px;line-height:1.5;margin-bottom:7px}
.dnrow .h s{color:#6f7a8c}
/* v40（2026-09-12 ご指示「全体的に文字が多い」）: 説明文（.note）は
   既定でたたむ。**消してはいない**——どの一文も理由があって書かれていて、
   消すと同じ質問がもう一度出る。開けば全部読める形にしてある。
   ホーム設定の「説明文をいつも開いておく」で、たたむのをやめられる。 */
details.nt{margin:-2px 0 9px}
details.nt>summary{list-style:none;cursor:pointer;font-size:11.5px;color:#7b879a;padding:4px 0;user-select:none}
details.nt>summary::-webkit-details-marker{display:none}
details.nt>summary::before{content:"▸ "}
details.nt[open]>summary::before{content:"▾ "}
details.nt>.note:first-of-type{margin-top:3px}
/* v40: 完了画面の「今日はこれを楽しむ」。帯の中の本文サイズでは小さすぎた
   （2026-09-12 ご指摘）。画面の主役として大きく出す。 */
.joycard{background:#221d16;border:1px solid #c4a06a;border-radius:14px;padding:16px 15px;margin-bottom:10px;text-align:center}
.joycard .lab{font-size:11.5px;color:#c9a97b;letter-spacing:.08em;margin-bottom:7px}
.joycard .nm{font-size:23px;font-weight:700;line-height:1.35;color:#f0d9ae}
.joyrow{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.joyrow .g{flex:1;min-width:0}
.nlist{margin:6px 0 0}
.nline{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#cbd5e3;line-height:1.6;padding:4px 0}
.nline .d{flex:none;color:#6f7a8c;font-size:11.5px;padding-top:1px}
.nline .x{flex:none;background:none;border:none;color:#6f7a8c;font-size:15px;cursor:pointer;padding:0 2px;font-family:inherit}

/* v11: 区切りの合図で画面全体を2回光らせる */
.lxb{flex:none;background:none;border:1px solid #3a4152;color:#8a94a6;border-radius:9px;
  font-size:13px;padding:5px 9px;margin-left:8px;font-family:inherit}
.lxb.armed{border-color:#c07a7a;color:#e8b4b4}
.flash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;pointer-events:none;background:#e0a86a;opacity:0;animation:fl 1.5s ease-out}
@keyframes fl{0%{opacity:0}6%{opacity:.8}22%{opacity:.08}40%{opacity:.75}60%{opacity:.06}80%{opacity:.5}100%{opacity:0}}

.past{
  background:#1a1f29;border:1px solid #262d3a;border-radius:12px;padding:11px 14px;
  margin:0 0 14px;color:#8a94a6;font-size:13px;line-height:1.7;text-align:center;
}
.past b{color:#e0a86a;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
/* v10: ステップを1行ずつ編集する行 */
.strow{background:#12151c;border:1px solid #262d3a;border-radius:11px;padding:10px 11px;margin-bottom:8px}
.stline{display:flex;gap:7px;align-items:center}
.stline .inp{padding:10px}
.stsec{width:72px;flex:none;text-align:center;padding:10px 4px}
.stunit{flex:none;color:#6f7a8c;font-size:12px;width:16px}
/* v20 (2026-09-03): 今週の実施状況の表（累計回数の表示のかわり） */
.wk{overflow-x:auto;margin:8px 0 0}
.wk table{width:100%;border-collapse:collapse;font-size:13px}
.wk th{color:#6f7a8c;font-weight:500;font-size:11.5px;padding:3px 2px;text-align:center}
.wk td{text-align:center;padding:6px 2px;border-top:1px solid #1c222c;color:#9ec8a4}
.wk td.nm{text-align:left;color:#c9d1de;padding-right:8px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .td{background:#1a1f28}
.wk .e{color:#39404d}
.stbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stbtns button{
  flex:1;background:#232b38;border:1px solid #303a4a;color:#cbd5e3;border-radius:9px;
  padding:9px 2px;font-size:12.5px;font-family:inherit;cursor:pointer;font-weight:600;
}
.stbtns button:disabled{opacity:.3}
.stbtns button.rm{background:#3a2427;border-color:#5c3138;color:#e8b3b8}

.lrow{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid #222833;font-size:14px}
.lrow:last-child{border-bottom:none}
.lt{flex:none;width:44px;color:#6f7a8c;font-size:12.5px;font-variant-numeric:tabular-nums}
.ln{flex:1;line-height:1.5}
.ld{flex:none;color:#8a94a6;font-size:12.5px;font-variant-numeric:tabular-nums}

/* ===== 「気になった」記録（2026-09-06追加）=================================
   ★このブロックと #fbBtn / #fbPanel は #app の外に置いています。
     実行中は render() が 250ms ごとに #app を作り直すため、中に入れると
     点滅し、入力中の文字も消えるためです。位置を変えるときも外のままで。
   ★コピー用の欄（.fbta）は必ず見える場所に置くこと。画面の外へ逃がすと、
     iOSでは選択もコピーもできません（2026-09-06の不具合の原因）。 */
#fbBtn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  width:44px;height:44px;border-radius:22px;border:1px solid #2f3947;background:#1a1f29;
  color:#cbd5e3;font-size:19px;line-height:42px;text-align:center;opacity:.6;
  z-index:9000;cursor:pointer;font-family:inherit;padding:0}
#fbBtn:active{opacity:1}
#fbWrap{position:fixed;left:0;right:0;top:0;bottom:0;z-index:9001;display:none}
#fbWrap.on{display:block}
#fbBack{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(6,8,12,.72)}
#fbPanel{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;
  background:#12151c;border-top:1px solid #2f3947;border-radius:16px 16px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
#fbPanel h1{margin:0 0 2px}
.fbchip{display:block;width:100%;text-align:left;padding:15px;margin-top:8px;
  border-radius:12px;border:1px solid #2f3947;background:#1a1f29;color:#e8ecf2;
  font-size:15.5px;font-weight:600;font-family:inherit;cursor:pointer}
.fbchip:active{background:#232b38}
.fbinp{width:100%;padding:13px;border-radius:11px;border:1px solid #2f3947;
  background:#171c25;color:#e8ecf2;font-size:16px;font-family:inherit}
.fbrow{font-size:13px;color:#cbd5e3;padding:4px 0;border-bottom:1px solid #232b38}
.fbta{width:100%;height:104px;font-size:11px;line-height:1.5;color:#8a94a6;
  background:#171c25;border:1px solid #262d3a;border-radius:10px;padding:9px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-user-select:text;user-select:text}
.fbsend{display:block;width:100%;padding:17px;border-radius:12px;background:#e0a86a;
  color:#20160c;font-size:17px;font-weight:700;text-align:center;text-decoration:none;
  margin-top:10px;font-family:inherit}
.fbsend.ghost{background:#232b38;color:#cbd5e3;font-weight:600;font-size:14px;padding:12px}
#fbToast{position:fixed;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));
  z-index:9002;background:#232b38;color:#e8ecf2;border:1px solid #2f3947;border-radius:11px;
  padding:12px 14px;font-size:13.5px;text-align:center;display:none;max-width:528px;margin:0 auto}
#fbToast.on{display:block}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>

var KEY = "bmc_routine_v1";

function breathSteps(n){
  var out = [];
  for(var i=0;i<n;i++){
    out.push("4|吸う（4秒）");
    out.push("7|止める（7秒）");
    out.push("8|吐く（8秒）");
  }
  return out;
}
function sighSteps(n){
  var out = [];
  for(var i=0;i<n;i++){
    out.push("3|鼻から吸う|吸って");
    out.push("1|もう少しだけ吸う（吸い足す）|もう少し");
    out.push("6|ゆっくり長く吐く（口から。職場・電車では鼻からでよい）|長く吐いて");
  }
  return out;
}
var BR_PURPOSES = ["脳がつかれた","イライラ","落ち着く","眠る"];
var brPick = {}, brAsk = -1, brTab = "", brLastPh = "";
var BR_PH = [["in","吸う"],["top","吸い足す"],["hold","止める"],["out","吐く"],["hold2","止める"]];
function brDefaults(){ return [
  { id:"br_sigh5", name:"ため息呼吸 5分", purpose:"脳がつかれた", desc:"鼻から吸って、少し吸い足して、長く吐く。職場・電車では鼻から吐いてよい。",
    pat:{in:3,top:1,hold:0,out:6,hold2:0}, n:30 },
  { id:"br_sigh2", name:"ため息呼吸 2分", purpose:"脳がつかれた", desc:"5分がとれないときの短い版。",
    pat:{in:3,top:1,hold:0,out:6,hold2:0}, n:12 },
  { id:"br_478x1", name:"4-7-8 を1回", purpose:"イライラ", desc:"子供の前でもできる長さ。",
    pat:{in:4,top:0,hold:7,out:8,hold2:0}, n:1 },
  { id:"br_box3", name:"ボックス呼吸 3分", purpose:"落ち着く", desc:"吸う・止める・吐く・止めるを同じ長さで。",
    pat:{in:4,top:0,hold:4,out:4,hold2:4}, n:11 },
  { id:"br_478x9", name:"4-7-8 を9回", purpose:"眠る", desc:"寝る前・夜中に目が覚めたとき。",
    pat:{in:4,top:0,hold:7,out:8,hold2:0}, n:9 }
]; }
function brProgs(){ if(!Array.isArray(DB.brProgs)) DB.brProgs = brDefaults(); return DB.brProgs; }
function brGet(id){ var a = brProgs(); for(var i=0;i<a.length;i++){ if(a[i].id===id) return a[i]; } return null; }
function brPhases(g){
  var p = (g && g.pat) || {};
  return BR_PH.filter(function(x){ return (+p[x[0]]||0) > 0; })
              .map(function(x){ return { k:x[0], label:x[1], sec:+p[x[0]] }; });
}
function brCycle(g){ return brPhases(g).reduce(function(a,b){ return a+b.sec; },0); }
function brTotal(g){ return Math.max(1, brCycle(g) * Math.max(1, Math.round(+g.n||1))); }
function brPatLabel(g){ return brPhases(g).map(function(x){ return x.label+x.sec; }).join("・"); }
function brPurposes(){
  var a = BR_PURPOSES.slice();
  brProgs().forEach(function(g){ var q = String(g.purpose||"").trim(); if(q && a.indexOf(q)<0) a.push(q); });
  return a;
}
function brOfPurpose(q){ return brProgs().filter(function(g){ return String(g.purpose||"")===q; }); }
function isBreath(x){ return !!(x && /^breath(:|$)/.test(String(x.app||""))); }
function brPurposeOf(x){ var m = String(x&&x.app||"").match(/^breath:(.*)$/); return m ? m[1].trim() : ""; }
function brEstimate(x){ var g = brOfPurpose(brPurposeOf(x))[0]; return g ? brTotal(g) : x.sec; }

function defaults(){ return [
  { id:"home", icon:"🏠", name:"在宅勤務・夕方の切り替え", limit:900,
    note:"仕事を終える瞬間に押します。在宅は「帰る」動作がないので、これが唯一の切れ目です。",
    steps:[
      "60|PCを閉じて、視界の外へ置く（別室・引き出し・カバンの中）",
      "60|洗面所へ行ってマウスウォッシュ",
      "300|温かい飲み物を1杯いれて、キッチンの外で飲み切る",
      "480|両手がふさがることを1つ始める（子どもとゲーム／お風呂の準備）"
    ]},
  { id:"commute", icon:"🚃", name:"帰路（職場を出たら）", limit:600,
    note:"駅の店より手前で押します。8/13はスーパーが電車より先でした。",

function timesFor(sid, stepText, days){
  var k = noteKey(stepText), lim = days ? (Date.now() - days*86400000) : 0, out = [];
  for(var i=DB.times.length-1;i>=0;i--){
    var r = DB.times[i];
    if(r && r.sid===sid && noteKey(r.step)===k && r.t>=lim) out.push(r);
  }
  return out;
}
function avgAct(sid, stepText, days){
  var rs = timesFor(sid, stepText, days);
  if(!rs.length) return { n:0, avg:0 };
  var sum = 0;
  rs.forEach(function(r){ sum += (r.act||0); });
  return { n:rs.length, avg: Math.round(sum/rs.length) };
}
function roundSec(n){
  n = Math.max(5, Math.round(n));
  if(n < 60)  return Math.round(n/5)*5;
  if(n < 300) return Math.round(n/10)*10;
  return Math.round(n/30)*30;
}
function goneSteps(sid, days){
  var s = setOf(sid); if(!s) return [];
  var now = {}, lim = days ? (Date.now() - days*86400000) : 0, seen = {}, out = [];
  stepsOf(s).forEach(function(x){ now[noteKey(x.text)] = true; });
  for(var i=DB.times.length-1;i>=0;i--){
    var r = DB.times[i];
    if(!r || r.sid!==sid || r.t<lim) continue;
    var k = noteKey(r.step);
    if(now[k] || seen[k]) continue;
    seen[k] = true; out.push(r.step);
  }
  DB.notes.forEach(function(r){
    if(!r || r.sid!==sid || r.t<lim) return;
    var k = noteKey(r.step);
    if(now[k] || seen[k]) return;
    seen[k] = true; out.push(r.step);
  });
  return out;
}

  return n;
}

var ac = null;
function unlockAudio(){
  audioMix();
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state === "suspended" && ac.resume) ac.resume();
    var o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(.0001, ac.currentTime);
    o.start(); o.stop(ac.currentTime + .03);
  }catch(e){}
}
function quietOf(s){ return !!(s && s.quiet); }

function beep(f,d,force,vol,wave){
  if(!DB.chime && !force) return;
  if(!force && quietNow()) return;
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state === "suspended" && ac.resume) ac.resume();
    var o = ac.createOscillator(), g = ac.createGain();
    var pk = (typeof vol === "number" && vol > 0) ? Math.min(.95, vol) : .28;
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = f; o.type = wave || "sine";
    g.gain.setValueAtTime(.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(pk, ac.currentTime+.02);
    if(typeof vol === "number" && vol > 0) g.gain.setValueAtTime(pk, ac.currentTime+Math.max(.03, d*.5));
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+d);
    o.start(); o.stop(ac.currentTime+d+.02);
  }catch(e){}
}

var padNodes = null;
var PAD_VOL = .11;
var PAD_DUCK = .025;
var PAD_DUCK_SEC = 1.8;
function padWant(){
  try{
    if(DB.breathPad === false) return false;
    if(DB.musicOn) return false;
    if(view !== "run" || curId !== "breath478") return false;
    if(autoPaused || autoFinished) return false;
    var s = setOf(curId); if(!s || !s.auto) return false;
    if(quietOf(s)) return false;
    var st = stepsOf(s), cum = 0, idx = -1, e = curElapsed();
    for(var i=0;i<st.length;i++){ cum += st[i].sec; if(e < cum){ idx = i; break; } }
    if(idx < 0) return false;
    return isBreath(st[idx]) && !!brPick[idx];
  }catch(e){ return false; }
}
function padStart(){
  if(padNodes) return;
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state === "suspended" && ac.resume) ac.resume();
    var g = ac.createGain(), lp = ac.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 1400;
    var o1 = ac.createOscillator(), o2 = ac.createOscillator(), o3 = ac.createOscillator(), g3 = ac.createGain();
    o1.type = "sine"; o2.type = "sine"; o3.type = "sine";
    o1.frequency.value = 220; o2.frequency.value = 220.7;
    o3.frequency.value = 330; g3.gain.value = .45;
    o1.connect(lp); o2.connect(lp); o3.connect(g3); g3.connect(lp); lp.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(PAD_VOL, ac.currentTime + 2.5);
    o1.start(); o2.start(); o3.start();
    padNodes = { o1:o1, o2:o2, o3:o3, g:g };
  }catch(e){ padNodes = null; }
}
function padStop(){
  var pn = padNodes; padNodes = null;
  if(!pn) return;
  try{
    var t = ac.currentTime;
    pn.g.gain.cancelScheduledValues(t);
    pn.g.gain.setValueAtTime(Math.max(.0001, pn.g.gain.value), t);
    pn.g.gain.exponentialRampToValueAtTime(.0001, t + 1.2);
    pn.o1.stop(t + 1.4); pn.o2.stop(t + 1.4); if(pn.o3) pn.o3.stop(t + 1.4);
  }catch(e){}
}
function padTick(){ if(padWant()) padStart(); else padStop(); }
function padDuck(){
  if(!padNodes) return;
  try{
    var t = ac.currentTime, g = padNodes.g;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(Math.max(.0001, g.gain.value), t);
    g.gain.exponentialRampToValueAtTime(PAD_DUCK, t + .25);
    g.gain.setValueAtTime(PAD_DUCK, t + PAD_DUCK_SEC);
    g.gain.exponentialRampToValueAtTime(PAD_VOL, t + PAD_DUCK_SEC + .8);
  }catch(e){}
}

var AWAY_RATE   = 4000;
var AWAY_MAXSEC = 40*60;
var AWAY_RING   = 9;

var awayKind  = "";
var awaySec   = 0;
var awayAt    = 0;
var awayStep  = -1;
var awayFail  = "";
var awayGen   = 0;

function awayWav(sec){
  var R = AWAY_RATE;
  var q = Math.max(0, Math.round(sec * R));
  var r = Math.round(AWAY_RING * R);
  var n = q + r;
  var b = new Uint8Array(44 + n);
  function s4(o, t){ for(var i=0;i<4;i++) b[o+i] = t.charCodeAt(i); }
  function u32(o, v){ b[o]=v&255; b[o+1]=(v>>8)&255; b[o+2]=(v>>16)&255; b[o+3]=(v>>24)&255; }
  function u16(o, v){ b[o]=v&255; b[o+1]=(v>>8)&255; }
  s4(0,"RIFF"); u32(4, 36+n); s4(8,"WAVE");
  s4(12,"fmt "); u32(16,16); u16(20,1); u16(22,1);
  u32(24,R); u32(28,R); u16(32,1); u16(34,8);
  s4(36,"data"); u32(40,n);
  b.fill(128, 44, 44+n);
  for(var i=0;i<q;i+=4000) b[44+i] = 129;
  var pat = Math.round(1.5*R);
  var aOn = Math.round(.22*R), bOn0 = Math.round(.30*R), bOn1 = Math.round(.52*R);
  for(var k=0;k<r;k++){
    var pp = k % pat, half = 0;
    if(pp < aOn) half = 2;
    else if(pp >= bOn0 && pp < bOn1) half = 3;
    if(half) b[44+q+k] = ((Math.floor(pp/half) % 2) ? 46 : 210);
  }
  try{ return new Blob([b], {type:"audio/wav"}); }catch(e){ return null; }
}
function awaySoundOK(s){
  if(!DB.awaySound) return false;
  if(DB.musicOn) return false;
  if(!s || s.auto) return false;
  if(s.spotify) return false;
  return true;
}
function awayPlay(sec, label){
  awayFail = "";
  try{
    var bl = awayWav(sec);
    if(!bl){ awayFail = "音声を作れませんでした"; return false; }
    awayHush();
    var gen = awayGen;
    awayUrl = URL.createObjectURL(bl);
    try{ if(navigator.audioSession && navigator.audioSession.type === "ambient") navigator.audioSession.type = "auto"; }catch(e){}
    awayAudio = new Audio();
    awayAudio.src = awayUrl;
    awayAudio.preload = "auto";
    awayAudio.onerror = function(){ if(gen===awayGen) awayFail = "音声を再生できませんでした"; };
    var pr = awayAudio.play();
    if(pr && pr["catch"]) pr["catch"](function(){ if(gen===awayGen) awayFail = "この端末では自動で鳴らせませんでした"; });
    try{
      if(navigator.mediaSession && window.MediaMetadata){
        navigator.mediaSession.metadata = new MediaMetadata({
          title: String(label||"ルーティン"),
          artist: "B.M.C. 切り替えルーティン",
          album: durLabel(sec)+"後に鳴ります"
        });
      }
    }catch(e){}
    return true;
  }catch(e){ awayFail = "音声を再生できませんでした"; return false; }
}
function awayHush(){
  awayGen++;
  try{ if(awayAudio){ awayAudio.onerror = null; awayAudio.pause(); awayAudio.removeAttribute("src"); awayAudio.load(); } }catch(e){}
  awayAudio = null;
  try{ if(awayUrl) URL.revokeObjectURL(awayUrl); }catch(e){}
  awayUrl = "";
}
function awayClear(){ awayHush(); awayKind = ""; awaySec = 0; awayAt = 0; awayStep = -1; }
function awayArm(){
  var s = setOf(curId);

    if(snOn()) return;
    if(curStep==null || curStep<0) return;
    var st0 = stepsOf(s); if(!st0[curStep]) return;
    if(!stepTimerOK(st0[curStep])) return;
    var l0 = stepLeft(); if(l0 < 1) return;
    awayStep = curStep; awaySec = l0; awayAt = Date.now(); awayKind = "timer";
    nativeTimer(l0);

  }
  if(quietOf(s)) return;
  if(snOn()) return;
  if(curStep==null || curStep<0) return;
  var st = stepsOf(s); if(!st[curStep]) return;
  var l = stepLeft();
  if(l < 1) return;
  awayStep = curStep; awaySec = l; awayAt = Date.now();
  if(awaySoundOK(s) && l <= AWAY_MAXSEC && awayPlay(l, st[curStep].text)){ awayKind = "sound"; return; }

var noteOpenSet = {};
function foldNotes(){
  if(DB.noteOpen) return;
  var root = document.getElementById("app");
  if(!root || !root.querySelectorAll) return;
  var all;
  try{ all = root.querySelectorAll(".note"); }catch(e){ return; }
  if(!all || !all.length) return;
  var groups = [], cur = null, i, el;
  for(i=0;i<all.length;i++){
    el = all[i];
    if(el.closest && el.closest(".iobox")) continue;
    if(cur && cur[cur.length-1].nextElementSibling === el) cur.push(el);
    else { cur = [el]; groups.push(cur); }
  }
  groups.forEach(function(g, gi){
    var key = view + ":" + gi;
    var d = document.createElement("details");
    d.className = "nt";
    if(noteOpenSet[key]) d.open = true;
    var sm = document.createElement("summary");

  });

var copyDay = null;

function sameDayK(t, k){ return dayKey(t)===k; }
function looseLabel(sid, text){
  var s = setOf(sid);
  if(s) return s.icon+" "+s.name+" ／ "+text;
  if(sid==="wake")  return "🌃 "+text;
  if(sid==="sleep") return "🛌 "+text;
  return text;
}
function dayMd(k){
  var runs = DB.log.filter(function(r){ return r && sameDayK(r.t,k); })
                   .slice().sort(function(a,b){ return a.t-b.t; });
  var times = (DB.times||[]).filter(function(r){ return r && sameDayK(r.t,k); })
                   .slice().sort(function(a,b){ return a.t-b.t; });
  var notes = (DB.notes||[]).filter(function(r){ return r && sameDayK(r.t,k); })
                   .slice().sort(function(a,b){ return a.t-b.t; });
  var kids = [], i;
  for(i=0;i<runs.length;i++) kids.push([]);
  var loose = [];
  function attach(r, text){
    var at = -1;
    for(var j=0;j<runs.length;j++){ if(runs[j].id===r.sid && runs[j].t <= r.t+1000) at = j; }
    if(at<0) return false;
    kids[at].push({ t:r.t, s:text });
    return true;
  }
  times.forEach(function(r){
    if(r.sid === "sleep") return;   /* v92: 就寝の計測は睡眠時間にならないのでこのコピー欄には出さない */
    var t = noteKey(r.step) + " … " + durLabel(r.act||0)
          + (r.plan ? "（予定 "+durLabel(r.plan)+"）" : "");
    if(!attach(r, t)) loose.push({ t:r.t, s:looseLabel(r.sid, t) });
  });
  notes.forEach(function(r){
    var t = "💬 " + noteKey(r.step) + ": " + noteKey(r.v);
    if(!attach(r, t)) loose.push({ t:r.t, s:t });
  });
  var rows = [];
  runs.forEach(function(r, idx){
    var head = hhmm(r.t)+" "+String(r.icon||"")+" "+String(r.name||"")
             + (r.sec ? " ／ "+durLabel(r.sec) : "");
    if(r.items && r.items.length) head += " ／ "+r.items.join(" → ");
    if(r.memo) head += " ／ "+r.memo;
    kids[idx].sort(function(a,b){ return a.t-b.t; });
    rows.push({ t:r.t, s:head, sub:kids[idx] });
  });
  loose.forEach(function(x){ rows.push({ t:x.t, s:hhmm(x.t)+" "+x.s, sub:[] }); });
  rows.sort(function(a,b){ return a.t-b.t; });
  if(!rows.length) return "";
  var out = "> [!abstract]- 🕒 ルーティン実績 "+dayLabel(rows[0].t)+"\n";
  rows.forEach(function(x){
    out += "> - "+x.s+"\n";
    x.sub.forEach(function(y){ out += ">     - "+hhmm(y.t)+" "+y.s+"\n"; });
  });
  return out;
}

function brParse(txt){
  var out = [], cur = null;
  String(txt||"").split(/\r?\n/).forEach(function(line){
    var t = line.trim(); if(!t) return;
    var m;
    if((m = t.match(/^#+\s*(.+)$/))){ cur = { name:m[1].trim(), purpose:"", desc:"", pat:{in:0,top:0,hold:0,out:0,hold2:0}, n:1 }; out.push(cur); return; }
    if(!cur) return;
    if((m = t.match(/^目的\s*[:：]\s*(.*)$/))){ cur.purpose = m[1].trim(); return; }
    if((m = t.match(/^説明\s*[:：]\s*(.*)$/))){ cur.desc = m[1].trim(); return; }
    if((m = t.match(/^回数\s*[:：]\s*(\d+)/))){ cur.n = Math.max(1, parseInt(m[1],10)); return; }
    if((m = t.match(/^形\s*[:：]\s*(.*)$/))){
      var re = /(吸い足す|吸う|止める|吐く)\s*(\d+)/g, x, afterOut = false;
      while((x = re.exec(m[1]))){
        var v = parseInt(x[2],10);
        if(x[1]==="吸う") cur.pat.in = v;
        else if(x[1]==="吸い足す") cur.pat.top = v;
        else if(x[1]==="吐く"){ cur.pat.out = v; afterOut = true; }
        else if(x[1]==="止める"){ if(afterOut) cur.pat.hold2 = v; else cur.pat.hold = v; }
      }
    }
  });
  return out.filter(function(g){ return g.name && brCycle(g)>0; });
}

  got.forEach(function(q){
    if(!q.purpose) q.purpose = BR_PURPOSES[0];

    if(ex){ ex.purpose = q.purpose; ex.desc = q.desc; ex.pat = q.pat; ex.n = q.n; up++; }
    else { q.id = brUid(); brProgs().push(q); add++; }

function viewRunAuto(s){
  var st = stepsOf(s), e = curElapsed();
  var cum = 0, stepEnd = 0, cur = st[Math.min(curStep,st.length-1)];
  var curText = cur ? cur.text : "";
  if(cur && isBreath(cur) && brAsk===curStep) return viewBrPick(s);
  for(var i=0;i<st.length;i++){
    cum += st[i].sec; stepEnd = cum;
    if(i===curStep) break;
  }
  var remainInStep = Math.max(0, stepEnd - e);
  var p = cyclePeriod(st), head;
  if(p){
    head = 'サイクル '+Math.min(Math.floor(curStep/p)+1, st.length/p)+' / '+(st.length/p);
  }else{
    head = 'ステップ '+Math.min(curStep+1, st.length)+' / '+st.length;
  }
  var bi = (cur && isBreath(cur) && brPick[curStep]) ? brInfo(s, curStep, e) : null;
  if(bi){
    curText = bi.ph.label;
    head = '🌬️ '+esc(bi.g.name)+' ・ '+(bi.c+1)+' / '+bi.n+' 回目 ・ ステップ '+(curStep+1)+' / '+st.length;
  }
  var nx = st[curStep+1];
  var h = '<h1>'+esc(s.icon)+' '+esc(s.name)+'</h1>'+(s.note ? '<p class="sub">'+esc(s.note)+'</p>' : '');
  if(autoBack()){
    var bk = setOf((detour||DB.detour||{}).id);
    if(bk) h += '<div class="hint">終わると <b>'+esc(bk.icon)+' '+esc(bk.name)+'</b> の続きに戻ります。<br>そちらの済みの印も、使った時間も、そのまま残っています。</div>';
  }
  h += '<div class="card">';
  h += '<div class="bigsub">'+head+'</div>';
  var fs = curText.length>26 ? 20 : (curText.length>13 ? 26 : 34);
  h += '<div class="big" style="font-size:'+fs+'px;line-height:1.4;margin:2px 0 8px">'+esc(curText)+'</div>';
  var brMS = !!(cur && cur.sec >= 60);
  h += '<div class="big'+(autoPaused?' over':'')+'">'+(brMS ? mmss(remainInStep) : remainInStep)+'</div>';
  h += '<div class="bigsub">'+(autoPaused ? '一時停止中' : (brMS ? 'このステップの残り（分：秒）' : 'このステップの残り秒数'))
     + '　・　全体は <b style="color:#e0a86a">'+etaLabel()+'</b> ごろ終わり</div>';
  h += '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,(e/limitOf(s))*100))+'%"></i></div>';
  h += '<p class="note" style="text-align:center;margin-top:8px">'
     + (nx ? '次： '+esc(nx.text)+'<br>' : '次でおしまいです<br>')
     + '全体の経過 '+mmss(e)+' ／ 目安 '+durLabel(limitOf(s))+'</p>';
  h += '</div>';
  h += guideNote();
  h += '<p class="note">タップして進める必要はありません。'+(s.voice?'合図（音・声）':'合図（音）')+'に合わせて進めてください。<br>合わない長さのときは、下の「次へ」で先に進めます。</p>';
  h += '<button class="btn big" onclick="autoSkip()">次へ ▶</button>';
  h += '<div class="row" style="margin-top:9px">'
     + '<button class="btn ghost" style="margin-top:0" onclick="autoPrev()">◀ 前へ'+((autoUndo && autoUndo.id===curId && autoUndo.step===curStep-1)?'（押す前に戻す）':'')+'</button>'
     + '<button class="btn ghost" style="margin-top:0" onclick="autoPauseToggle()">'+(autoPaused?'▶ 再開する':'⏸ 一時停止する')+'</button>'
     + '</div>';
  h += emUI();

     + '<button class="btn ghost" style="margin-top:0" onclick="autoExtend(60)">＋1分 延長</button>'
     + '<button class="btn ghost" style="margin-top:0" onclick="autoExtend(300)">＋5分 延長</button>'
     + '</div>';
  h += '<p class="note">延長するのは<b>いまのステップだけ</b>です。あとのステップの長さは変わらず、終わる時刻がそのぶん後ろへずれます。'
     + (autoShift ? '<br>この回はここまでに <b>'+durLabel(autoShift)+'</b> 延ばしています。' : '')
     + '</p>';

  if(s==="あさって" || s==="明後日"){ d.setDate(d.getDate()+2); return ftYmd(d); }
  if(s==="来週" || s==="来週月曜" || s==="来週の月曜"){ d.setDate(d.getDate() + (((8 - d.getDay()) % 7) || 7)); return ftYmd(d); }

function fPadTo(n){ while(fLabels.length < n) fLabels.push(""); while(fTasks.length < n) fTasks.push(null); while(fClosed.length < n) fClosed.push(false); }
function fFitCap(keepTo){
  var ex = fSegEnd(fSegs.length-1) - fCap;
  for(var k = fSegs.length-1; k > keepTo && ex > 0; k--){ var can = Math.max(0, (fSegs[k]||0) - 60), d = Math.min(can, ex); fSegs[k] -= d; ex -= d; }
  for(var j = keepTo; j > fSeg && ex > 0; j--){ var can2 = Math.max(0, (fSegs[j]||0) - 60), d2 = Math.min(can2, ex); fSegs[j] -= d2; ex -= d2; }
}
function aiSwitchGo(i){
  ftInit();
  var x = DB.focus.tasks[i], cur = ftCur();
  if(!x || x.done || !cur || x === cur || fMode !== "ask" || fAsking) return;
  if(fPaused) fUnpause(true);
  var prev = fSeg > 0 ? fSegEnd(fSeg-1) : 0, planned = fSegs[fSeg] || 0;
  var used = Math.max(0, Math.floor(fElapsed() - prev)), left = Math.max(0, planned - used);
  var ret = left >= 120 ? left : 600;
  var dl = Math.max(60, Math.ceil(Math.max(0, aiEnd - Date.now())/1000)) + 60;
  var lab = fLabels[fSeg] || cur.t;
  fPadTo(fSegs.length);
  fSegs[fSeg] = used; fClosed[fSeg] = true; fOver = false;
  fSegs.splice(fSeg+1, 0, dl, ret);
  fLabels.splice(fSeg+1, 0, x.t, lab);
  fTasks.splice(fSeg+1, 0, x, cur);
  fClosed.splice(fSeg+1, 0, false, false);
  fSeg = fSeg + 1;
  aiAway = { d:fSeg, r:fSeg+1, t:lab };
  if(!aiTask) aiTask = lab;
  aiOffer = false;
  fFitCap(fSeg+1);
  fFlash = Date.now();
  ftMsg = "🔀 「"+x.t+"」へ移りました。AIの返事の時間が来たら「"+lab+"」に戻ります（戻ってから "+Math.max(1, Math.round((fSegs[fSeg+1]||0)/60))+"分）";
  ftMsgAt = Date.now();
  render();
}

function aiReturn(){
  if(!aiAway || fSeg !== aiAway.d){ aiAway = null; aiStop(); return; }
  if(fPaused) fUnpause(true);
  var prev = fSeg > 0 ? fSegEnd(fSeg-1) : 0, planned = fSegs[fSeg] || 0;
  var used = Math.max(0, Math.floor(fElapsed() - prev)), saved = Math.max(0, planned - used);
  fSegs[fSeg] = used; fClosed[fSeg] = true; fOver = false;
  if(fPlanned && saved >= 30) fSegs[aiAway.r] += saved;
  fFitCap(aiAway.r);
  fSeg = aiAway.r; fFlash = Date.now();
  ftMsg = "↩ 「"+aiAway.t+"」に戻りました。AIの返事を確かめてください。"; ftMsgAt = Date.now();
  aiAway = null;
  aiStop();
}

function fChime(end){
  if(!DB.focus.sound) return;
  var tones = end ? [523,659,784,1047] : [660,880,1175];
  function play(off){
    tones.forEach(function(f,i){
      var d = off + i*170;
      if(d<=0) beep(f, .26, true);

  }
  play(0);

}

function sxUid(){ return "sx"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function sxSec(t){
  t=String(t==null?"":t).trim().replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
  if(!t) return null;
  var m=t.match(/^(?:(\d+)\s*(?:分|min|m))?\s*(?:(\d+)\s*(?:秒|sec|s))?$/i);
  if(m&&(m[1]||m[2])) return (+(m[1]||0))*60+(+(m[2]||0));
  m=t.match(/^(\d+(?:\.\d+)?)$/);
  if(m) return Math.round(+m[1]);
  return null;
}
var SXKEY={"プログラム名":"name","名前":"name","プログラム":"name","タイトル":"name","program":"name",
  "タグ":"tag","場面":"tag","いつ":"tag",
  "説明":"desc","概要":"desc","ねらい":"desc","目的":"desc",
  "注意":"warn","警告":"warn",
  "時間":"_","所要時間":"_","合計":"_","合計時間":"_","目安":"_"};
function sxParse(text){
  var progs=[], errs=[], skips=[];
  var lines=String(text||"").replace(/\r/g,"").split("\n");
  var p=null;
  lines.forEach(function(raw,i){
    var ln=i+1;
    var s2=raw.replace(/　/g," ").trim();
    if(!s2) return;
    if(s2.slice(0,3)==="```") return;
    if(/^[-=—ー─＝]{3,}$/.test(s2)) return;
    if(s2.charAt(0)==="#") return;
    s2=s2.replace(/^[・･]\s*/,"").replace(/^[-*]\s+/,"").replace(/^\d+[.)]\s+/,"");
    var t=s2.replace(/｜/g,"|");
    var k=s2.match(/^([^:：|｜]{1,8})\s*[:：]\s*(.*)$/);
    if(k && SXKEY[k[1].trim()]!==undefined && t.indexOf("|")<0){
      var f=SXKEY[k[1].trim()], v=k[2].trim();
      if(f==="_") return;
      if(f==="name"){
        if(!v){ errs.push(ln+"行目：プログラム名が空です"); return; }
        p={name:v,tag:"",desc:"",warn:"",items:[],line:ln}; progs.push(p); return;
      }
      if(!p){ errs.push(ln+"行目：「プログラム名:」より前に「"+k[1]+"」があります"); return; }
      p[f]=v; return;
    }
    if(t.indexOf("|")>=0){
      var c=t.split("|").map(function(x){return x.trim();});
      if(/^(種目名?|名前|ポーズ名?)$/.test(c[0])&&/^(秒数?|時間)$/.test(c[1]||"")) return;
      if(/^[-–—:：\s]*$/.test(c.join(""))) return;
      if(!p){ errs.push(ln+"行目：「プログラム名:」がまだ書かれていません"); return; }
      if(!c[0]){ errs.push(ln+"行目：種目名が空です"); return; }
      var sec=sxSec(c[1]||"");
      if(sec===null||sec<=0){ errs.push(ln+"行目：秒数が読み取れません（"+(c[1]?c[1]:"空欄")+"）"); return; }
      if(sec>1800){ errs.push(ln+"行目：秒数が長すぎます（"+sec+"秒）"); return; }
      var side=(c[2]||"").trim();
      if(/^([-–—ー]|なし|無し|none)$/i.test(side)) side="";
      p.items.push({n:c[0], s:sec, side:side||"", how:(c[3]||"").trim(), ease:(c[4]||"").trim()});
      return;
    }
    skips.push(ln+"行目：" + (s2.length>26?s2.slice(0,26)+"…":s2));
  });
  progs.forEach(function(q){ if(!q.items.length) errs.push(q.line+"行目：「"+q.name+"」に種目が1つもありません"); });
  if(!progs.length) errs.push("プログラムが見つかりません。「プログラム名: 〜」の行が必要です。");
  return {progs:progs, errs:errs, skips:skips};
}
function sxToText(g){
  var L=["#BMC-STRETCH v1","プログラム名: "+g.name];
  if(g.tag) L.push("タグ: "+g.tag);
  if(g.desc) L.push("説明: "+g.desc);
  if(g.warn) L.push("注意: "+g.warn);
  L.push("---","種目名 | 秒数 | 左右 | やり方 | できないときは");
  (g.items||[]).forEach(function(x){
    L.push([x.n, x.s+"秒", x.side||"", x.how||"", x.ease||""].join(" | "));
  });
  return L.join("\n");
}
function sxTotal(g){ return (g.items||[]).reduce(function(a,x){return a+(+x.s||0)},0); }
function sxToSteps(g){
  return (g.items||[]).map(function(x){
    var nm = x.n + (x.side ? "（"+x.side+"）" : "");
    var txt = nm + (x.how ? "・"+x.how : "");
    var say = x.n + (x.side ? "、"+x.side : "");
    return x.s + "|" + txt.replace(/\|/g,"／") + "|" + say.replace(/\|/g,"／");
  });
}

function sxCopy(id){
  var t=document.getElementById(id); if(!t) return;
  t.removeAttribute("readonly");
  try{ t.select(); t.setSelectionRange(0,999999); }catch(e){}
  var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  t.setAttribute("readonly","");
  var done=function(r){ alert(r?"コピーしました":"コピーできませんでした。長押しで選択してコピーしてください"); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(function(){done(true)},function(){done(ok)});
  }else done(ok);
}

function sxAttachGo(setId){
  var s=setOf(setId); if(!s) return;
  collect();
  sxTarget=setId; sxPick=null;
  var sx=s.sx;
  if(sx && typeof sx.from==="number"){ sxHead=sx.from; sxTail=Math.max(0, s.steps.length-(sx.from+sx.len)); }
  else { sxHead=0; sxTail=0; }
  go("sxattach");
}
function sxPickProg(id){ sxPick=(sxPick===id?null:id); render(); }
function sxSetHead(v){ sxHead=Math.max(0, Math.min(20, sxHead+v)); render(); }
function sxSetTail(v){ sxTail=Math.max(0, Math.min(20, sxTail+v)); render(); }
function sxDoAttach(){
  var s=setOf(sxTarget), g=sxProgs().filter(function(x){return x.id===sxPick;})[0];
  if(!s||!g) return;
  var head=Math.min(sxHead, s.steps.length);
  var tail=Math.min(sxTail, Math.max(0, s.steps.length-head));
  var body=sxToSteps(g);
  var before=s.steps.slice(0, head);
  var after=tail? s.steps.slice(s.steps.length-tail) : [];
  s.steps=before.concat(body, after);
  s.sx={id:g.id, name:g.name, from:head, len:body.length};
  save();
  alert("「"+g.name+"」を組み込みました。\n\n"+s.icon+" "+s.name+" は "+s.steps.length+"項目・"+durLabel(limitOf(s))+" になりました。");
  sxTarget=null; sxPick=null;
  go("edit");
}

function askGo(m){

  ftInit();
  var x = (fAskSel >= 0 && DB.focus.tasks[fAskSel] && !DB.focus.tasks[fAskSel].done) ? DB.focus.tasks[fAskSel] : null;
  if(!(m > 0)) m = 15;

function focusTick(){
  if(fPaused || fDone || fAsking) return;
  var e = fElapsed(), cum = 0, idx = -1;
  if(fMode==="ask" && fSeg < fSegs.length && !fClosed[fSeg] && e >= fSegEnd(fSeg) && e < fCap){
    if(!fOver){
      fOver = true; fFlash = Date.now();
      fChime(false); flashScreen();
      notifyNow("⏰ 区切りの時間です",
        "「" + (fLabels[fSeg]||"いまの区切り") + "」を延長して続けるか、ここで切り分けるか決めてください（決めるまでは延長として数えます）");
    }
    return;
  }
  for(var i=0;i<fSegs.length;i++){ cum += fSegs[i]; if(e < cum){ idx = i; break; } }
  if(fMode==="ask" && idx < 0 && e < fCap){
    fSeg = fSegs.length;
    fAsking = true; fPauseAt = Date.now(); fPaused = true;
    fFlash = Date.now();
    fChime(false); flashScreen();
    notifyNow("▶ ひと区切り",
      (fLabels.length ? "「"+fLabels[fLabels.length-1]+"」が終わりました。" : "") + "次に何をするか決めてください。");
    return;
  }
  if(idx < 0){
    fSeg = fSegs.length; fDone = true;
    if(tick){ clearInterval(tick); tick = null; }
    fChime(true);
    flashScreen();
    notifyNow("休憩です（" + SLOTN[fSlotNow()] + "）",
              durLabel(fBlockSec()) + "たちました。ここで一度離れてください。");
    setTitle("");
    logFocus();
    view = "focusDone";
    return;
  }
  if(idx !== fSeg){
    fSeg = idx; fFlash = Date.now();
    fChime(false);
    flashScreen();
    notifyNow("▶ 切り替えの合図",
      (fMode==="ask" && fPlanned) ? "次は「" + (fLabels[idx]||"") + "」へ（"+Math.round((fSegs[idx]||0)/60)+"分）" :
      (fMode==="rotate" && fList.length)
        ? "次は「" + fItem(idx) + "」へ"
        : durLabel(fSegEnd(idx-1)) + "たちました。続けるか移るか、ここで一度決めてください。");
  }
}

  fPaused = false; fPauseAt = 0;

}

var planSetK = -1;

  h += L.map(function(s){

  }).join('');

function planSetAdd(id, all){

function planSetNote(it, k){

    h += '<div style="margin-top:6px">' + st.map(function(x,i){

}

function planInit(){ if(!DB.focus.plan) DB.focus.plan = { cap:0, until:"", items:[] }; return DB.focus.plan; }
function planCapSec(){
  var p = planInit();
  if(p.until){
    var m = /^(\d{1,2}):(\d{2})$/.exec(p.until);
    if(m){ var d = new Date(); d.setHours(+m[1], +m[2], 0, 0); return Math.max(0, Math.floor((d.getTime() - Date.now())/1000)); }
  }
  return Math.max(0, (p.cap||0)*60);
}
function planUsedSec(){ return planInit().items.reduce(function(a,x){ return a + (x.m||0)*60; }, 0); }
function planSetUntil(v){ var p = planInit(); p.until = String(v||""); if(p.until) p.cap = 0; save(); render(); }
function planSetCap(m){ var p = planInit(); p.cap = m; p.until = ""; save(); render(); }
function planCapAsk(){ var r = prompt("枠は何分ですか（数字だけ）", String(planInit().cap || 60)); if(r === null) return; var m = parseInt(String(r).replace(/[^\d]/g,""), 10); if(m > 0) planSetCap(m); }
function planTaskOf(t){ ftInit(); for(var i=0;i<DB.focus.tasks.length;i++){ var x = DB.focus.tasks[i]; if(x.t === t && !x.done) return x; } return null; }
function planAdd(i, m){ ftInit(); var x = DB.focus.tasks[i]; if(!x || x.done) return; planInit().items.push({ t:x.t, m:m }); save(); render(); }
function planDel(k){ planInit().items.splice(k, 1); save(); render(); }
function planUp(k){ var a = planInit().items; if(k <= 0 || k >= a.length) return; var t = a[k-1]; a[k-1] = a[k]; a[k] = t; save(); render(); }
function planMin(k){ var a = planInit().items, x = a[k]; if(!x) return; var r = prompt("「"+x.t+"」は何分？", String(x.m)); if(r === null) return; var m = parseInt(String(r).replace(/[^\d]/g,""), 10); if(m > 0){ x.m = m; save(); render(); } }
function planClear(){ if(!confirm("並べた計画を空にしますか？")) return; planInit().items = []; save(); render(); }
function planForget(t){ var p = planInit(); p.items = p.items.filter(function(x){ return x.t !== t; }); }
function planRename(a, b){ planInit().items.forEach(function(x){ if(x.t === a) x.t = b; }); }
function planNewTask(){
  ftInit();
  var nm = prompt("＋ 新しいタスクの名前", ""); if(nm === null) return;
  nm = ftClean(nm); if(!nm) return;
  if(planTaskOf(nm)){ alert("同じ名前のタスクが一覧にあります: " + nm); return; }
  var priv = confirm("「"+nm+"」は 🏠 Private のタスクですか？\n（OK＝Private／キャンセル＝仕事）");
  var d = ftDate("今日");
  DB.focus.tasks.push({ p:"", t:nm, d:d, k:(priv ? "P" : "W"), isNew:true });
  ftOp({ op:"add", t:nm, d:d, k:(priv ? "P" : "W") });
  save();
  ftMsg = "＋ 「"+nm+"」を足しました（Obsidian へは 📤 で。日付は今日・あとで 📅 で変えられます）"; ftMsgAt = Date.now(); render();
}
function planGo(){
  var p = planInit(), cap = planCapSec();
  if(cap < 60){ alert("先に枠を決めてください（「〜時まで」か分数）。"); return; }
  var segs = [], labels = [], tasks = [], used = 0, cut = 0;
  p.items.forEach(function(it){
    var x = it.set ? (setOf(it.set) ? { t:it.t, set:it.set, off:(it.off||[]).slice(0), k:"S" } : null) : planTaskOf(it.t); if(!x) return;
    var sec = Math.max(60, (it.m||0)*60);
    if(used + sec > cap){ sec = cap - used; cut++; }
    if(sec < 60) return;
    segs.push(sec); labels.push(x.t); tasks.push(x); used += sec;
  });
  if(!segs.length){ alert("計画にタスクがありません。一覧の分のボタンで、やるタスクを並べてください。"); return; }
  if(cut && !confirm("枠に入りきらない分は短くします（"+cut+"件）。このまま始めますか？")) return;
  focusBegin("ask", { cap:cap, segs:segs, labels:labels, tasks:tasks });
  p.items = []; save();
}

  var cands = normals();
  var quick = [breatherSet(), breathSet()].filter(function(x, i, a){ return x && !x.archived && a.indexOf(x)===i; });

    h += '<div class="sec">ひと息・呼吸で休む</div>';

      h += '<button class="setb" onclick="breakStart(\''+x.id+'\')">'+esc(x.icon)+' '+esc(x.name)
         + '<small>'+durLabel(limitOf(x))+' ・ 音と声で進みます</small></button>';
    });
    var qIds = quick.map(function(x){ return x.id; });
    cands = cands.filter(function(x){ return qIds.indexOf(x.id) < 0; });
  }
  brkTagsCur = [];
  cands.forEach(function(x){ tagsOf(x).forEach(function(t){ if(brkTagsCur.indexOf(t) < 0) brkTagsCur.push(t); }); });

    h += '<div class="sec">休憩に移る</div><div class="row" style="flex-wrap:wrap;gap:6px">'

       + '</div>';
    if(btag) cands = cands.filter(function(x){ return hasTag(x, btag); });
  }
  if(cands.length){
    if(!brkTagsCur.length) h += '<div class="sec">休憩に移る</div>';
    var lastId = DB.focus.lastBreak;
    var ordered = cands.filter(function(x){ return x.id===lastId; })
                       .concat(cands.filter(function(x){ return x.id!==lastId; }));
    ordered.forEach(function(x, i){
      var isLast = (x.id===lastId && i===0);
      h += '<button class="setb"'+(isLast?' style="border-color:#e0a86a;background:#211d18"':'')
         + ' onclick="breakStart(\''+x.id+'\')">'+esc(x.icon)+' '+esc(x.name)
         + '<small>'+durLabel(limitOf(x))+' ・ '+countLabel(x)+(isLast?' ・ 前回選んだもの':'')+'</small></button>';
    });
    h += '<p class="note">押すとそのルーティンが始まります。終わったら、そこから次の集中ブロックへ進めます。<br>中身は「セットを編集」でいつでも変えられます。</p>';
  }
  h += '<button class="btn" onclick="focusMemo();focusReset();go(\'home\')">何もせず最初に戻る</button>';
  h += '<button class="btn link" onclick="focusMemo();focusReset();go(\'log\')">📖 これまでの記録を見る</button>';
  return h;

function focusSave(){
  var f = DB.focus;
  ["am","pm","ev"].forEach(function(k){
    var el = document.getElementById("fl_"+k);
    if(el){ var v = parseInt(el.value,10); if(v>0 && v<=600) f.len[k] = v; }

    var el = document.getElementById("ff_"+k);
    if(el){ var v = parseInt(el.value,10); if(v>=0 && v<=23) f.from[k] = v; }
  });
  var su = document.getElementById("fsp_url");

                .filter(function(x){ return x>0 && x<=600; });
    if(arr.length) f.seg = arr;
  }
  save();
}

function collect(){
  DB.sets.forEach(function(s){
    var ic = document.getElementById("ic_"+s.id); if(ic && ic.value.trim()) s.icon = ic.value.trim();
    var nm = document.getElementById("nm_"+s.id); if(nm && nm.value.trim()) s.name = nm.value.trim();
    var nt = document.getElementById("nt_"+s.id); if(nt) s.note = nt.value.trim();
    var tg = document.getElementById("tg_"+s.id); if(tg) s.tags = tg.value.trim();
    var sp = document.getElementById("sp_"+s.id);
    if(sp) s.spotifyUrl = sp.value.trim();
    collectSteps(s);
  });
}
function collectSteps(s){
  if(bulk[s.id]){
    var tx = document.getElementById("tx_"+s.id);
    if(tx){
      var arr = tx.value.split("\n").filter(function(x){ return x.trim()!==""; });
      if(arr.length) s.steps = arr;
    }
    return;
  }
  var rows = [], i = 0, sc;
  while((sc = document.getElementById("scm_"+s.id+"_"+i))){
    var old = parseStep(s.steps[i]==null ? "" : s.steps[i]);
    var tt = document.getElementById("st_"+s.id+"_"+i);
    var yy = document.getElementById("sy_"+s.id+"_"+i);
    var aa = document.getElementById("ap_"+s.id+"_"+i);
    var sec = msRead("scm_"+s.id+"_"+i, "scs_"+s.id+"_"+i, old.sec);
    var txt = (tt && tt.value.trim()) ? tt.value.trim() : old.text;
    var say = yy ? yy.value.trim() : old.say;
    var app = aa ? String(aa.value||"").trim() : old.app;
    rows.push(joinStep(sec, txt, say, app));
    i++;
  }
  if(rows.length) s.steps = rows;
}
function sumText(s){
  var n = s.steps.filter(function(x){ return String(x).trim()!==""; }).length;
  return durLabel(sumSec(s)) + ' ／ ' + n + 'ステップ';
}
function recalc(id){
  var el = document.getElementById("sum_"+id);
  if(!el) return;
  var t = 0, n = 0;
  if(bulk[id]){

function stepMove(id, i, d){

  var j = i + d;
  if(i<0 || j<0 || j>=s.steps.length) return;
  var t = s.steps[i]; s.steps[i] = s.steps[j]; s.steps[j] = t;

function stepAdd(id, at){

function homeSelTag(sceneId){

  ids.forEach(function(id){
    var st = setOf(id); if(!st) return;
    var a = tagsOf(st), i = a.indexOf(sc.tag);
    if(all){ if(i>=0) a.splice(i,1); } else if(i<0){ a.push(sc.tag); }

function applyAvg(sid, stepText){
  var s = setOf(sid); if(!s) return;
  var st = stepsOf(s), k = noteKey(stepText);
  for(var i=0;i<st.length;i++){
    if(noteKey(st[i].text)===k){
      var a = avgAct(sid, stepText, REVDAYS);
      if(!a.n) return;
      s.steps[i] = joinStep(roundSec(a.avg), st[i].text, st[i].say, st[i].app);
      save(); render(); return;
    }
  }
}
function applyAvgAll(sid){
  var s = setOf(sid); if(!s) return;
  var st = stepsOf(s), changed = 0;
  st.forEach(function(x,i){
    var a = avgAct(sid, x.text, REVDAYS);
    if(a.n){ s.steps[i] = joinStep(roundSec(a.avg), x.text, x.say, x.app); changed++; }
  });
  if(changed){ save(); }
  render();
  alertLess(changed ? changed+"個の項目を、実績の平均に合わせました。" : "合わせられる実績がまだありません。");
}

  h += '<div class="warn">中身は<b>この端末のブラウザの中だけ</b>に保存されます。履歴やサイトデータを消すと既定に戻ります。Obsidianには入りません。</div>';
  h += '<button class="btn ghost" onclick="go(\'home\')">戻る</button>';
  return h;
}

}catch(e){}
try{

if(DB.sleepActive){ view = "sleepWatch"; sleepTickStart(); }

var MEALKEY = "bmc_meal_links_v1";

function mealSave(){ try{ localStorage.setItem(MEALKEY, JSON.stringify(MEAL)); }catch(e){} }
function mealUri(cmd){

}

var FBKEY = "bmc_fb_routine_v1";
var FBAPP = "routineアプリ";
var FBCATS = ["押しにくい","文字が読みにくい","表示が分かりにくい","音・振動","動きがおかしい","こうしたい"];
var FBDIR = "20_Projects/Private/B.M.C";
var FBWD  = ["日","月","火","水","木","金","土"];
var FB = { items:[], vault:"My Valut", file:"", heading:"🤖 AIへ", useHead:true, mode:"append", fbv:2 };
var fbMemo = "", fbCfg = false, fbStep = 1, fbLast = -1, fbNote = "";

function fbLoad(){
  try{
    var o = JSON.parse(localStorage.getItem(FBKEY));
    if(o && typeof o==="object"){
      if(Array.isArray(o.items)) FB.items = o.items;
      if(typeof o.vault==="string") FB.vault = o.vault;
      var fbOld = !(o.fbv >= 2);
      if(typeof o.file==="string" && o.file){
        if(!(fbOld && o.file.indexOf("Quick Memo") >= 0)) FB.file = o.file;
      }
      if(typeof o.heading==="string" && o.heading){
        if(!(fbOld && o.heading.indexOf("プロジェクトメモ") >= 0)) FB.heading = o.heading;
      }
      if(typeof o.useHead==="boolean") FB.useHead = o.useHead;
      if(o.mode==="prepend"||o.mode==="append"){ if(!fbOld) FB.mode = o.mode; }
    }
  }catch(e){}
}
function fbSave(){ try{ localStorage.setItem(FBKEY, JSON.stringify(FB)); }catch(e){} }
function fbEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fb2(n){ return (n<10?"0":"")+n; }
function fbYmd(d){ return fb2(d.getFullYear()%100)+"-"+fb2(d.getMonth()+1)+"-"+fb2(d.getDate()); }
function fbHm(d){ return fb2(d.getHours())+":"+fb2(d.getMinutes()); }

function fbCtx(){
  var v = "home";
  try{ if(typeof view==="string") v = view; }catch(e){}
  var NM = {home:"ホーム", run:"実行中", done:"完了", log:"これまでの記録", review:"振り返り",
    edit:"セットの編集", backup:"バックアップ", about:"このアプリが持たないもの",
    scale:"満腹度のものさし", scenes:"シーン", words:"声かけ",
    focusStart:"集中ブロックの準備", focus:"集中ブロック中", focusDone:"集中ブロック完了",
    focusSet:"集中ブロックの設定", sleepWatch:"就寝の見守り",
    wakeChoice:"中途覚醒の3択", wakeRun:"中途覚醒の対処",
    sxlib:"ストレッチのプログラム", sximp:"ストレッチの取り込み", sxtext:"ストレッチの書式",
    sxspec:"ストレッチの仕様", sxattach:"ストレッチの割り当て"};
  var s = NM[v] || v;
  try{ if(curId){ var st = setOf(curId); if(st && st.name) s += "（"+st.name+"）"; } }catch(e){}
  return s;
}

function fbCanSend(){
  var busy = {run:1, sleepWatch:1, wakeChoice:1, wakeRun:1, focus:1};
  try{ return !busy[view]; }catch(e){ return true; }
}

function fbUnsent(){ return FB.items.filter(function(x){ return !x.sent; }); }

function fbOpen(){
  fbMemo = ""; fbCfg = false; fbStep = 1; fbLast = -1; fbNote = "";
  var w = document.getElementById("fbWrap"); if(!w) return;
  w.className = "on"; fbRender();
}
function fbClose(){
  var w = document.getElementById("fbWrap"); if(w) w.className = "";
}
function fbTyping(v){ fbMemo = v; }
function fbGrabCfg(){
  var v = document.getElementById("fb_vault"); if(v) FB.vault = v.value.trim();
  var f = document.getElementById("fb_file");  if(f) FB.file  = f.value.trim();
  var g = document.getElementById("fb_head");  if(g) FB.heading = g.value.trim();
  var a = document.getElementById("ml_log");  if(a) MEAL.cmdLog  = a.value.trim();
  var b = document.getElementById("ml_book"); if(b) MEAL.cmdBook = b.value.trim();
  var c = document.getElementById("ml_close"); if(c) MEAL.cmdClose = c.value.trim();
  if(a || b) mealSave();
}
function fbToast(msg){
  var t = document.getElementById("fbToast"); if(!t) return;
  t.innerHTML = fbEsc(msg); t.className = "on";
  setTimeout(function(){ var x=document.getElementById("fbToast"); if(x) x.className=""; }, 2200);
}

function fbAdd(i){
  var d = new Date();
  FB.items.push({ t:d.getTime(), ctx:fbCtx(), cat:FBCATS[i]||"", memo:"", sent:false });
  if(FB.items.length > 60) FB.items = FB.items.slice(FB.items.length-60);
  fbLast = FB.items.length-1;
  fbMemo = ""; fbStep = 2;
  fbSave(); fbRender();
}
function fbAttach(){
  var e = document.getElementById("fb_memo"); if(e) fbMemo = e.value;
  if(fbLast>=0 && FB.items[fbLast]){ FB.items[fbLast].memo = fbMemo; fbSave(); }
  fbNote = fbMemo ? "一言を足しました。" : "一言なしで記録しました。";
  fbStep = 3; fbRender();
}
function fbDropLast(){
  if(fbLast>=0 && FB.items[fbLast]){ FB.items.splice(fbLast,1); fbLast=-1; fbSave(); }
  fbStep = 3; fbNote = "取り消しました。"; fbRender();
}
function fbNoteDate(t){
  var d = new Date(t);
  if(d.getHours() < 4) d.setDate(d.getDate()-1);
  return d;
}
function fbNoteName(t){ var d = fbNoteDate(t); return fbYmd(d)+"("+FBWD[d.getDay()]+")"; }
function fbNotePath(t){ return FB.file ? FB.file : FBDIR+"/"+fbNoteName(t)+".md"; }

function fbGroups(list){
  var map = {}, order = [];
  list.forEach(function(x){
    var k = FB.file ? FB.file : fbNoteName(x.t);
    if(!map[k]){ map[k] = []; order.push(k); }
    map[k].push(x);
  });
  return order.map(function(k){
    return { key:k, path:(FB.file ? FB.file : FBDIR+"/"+k+".md"), items:map[k] };
  });
}
function fbCopyWhere(){
  var g = fbGroups(fbUnsent());
  if(!g.length) return "その日の日次ノート";
  return g.map(function(z){ return z.key; }).join("・");
}

function fbText(list){
  var s = "";
  list.forEach(function(x){
    var dt = new Date(x.t);
    s += "##### "+fbYmd(dt)+" "+fbHm(dt)+"\n"
      +  "- "+FBAPP+" ／ "+fbHm(dt)+" ／ "+x.ctx+" ／ "+x.cat+(x.memo?" ／ "+x.memo:"")+"\n";
  });
  return s;
}
function fbUri(text, path){
  var u = "obsidian://advanced-uri?";
  if(FB.vault) u += "vault="+encodeURIComponent(FB.vault)+"&";
  u += "filepath="+encodeURIComponent(path || fbNotePath(Date.now()));
  if(FB.useHead && FB.heading) u += "&heading="+encodeURIComponent(FB.heading);
  u += "&mode="+FB.mode+"&data="+encodeURIComponent(text);
  return u;
}
function fbMarkSent(){
  FB.items.forEach(function(x){ x.sent = true; });
  fbSave();
  return true;
}
function fbMarkSentG(i){
  var g = fbGroups(fbUnsent());
  if(g[i]) g[i].items.forEach(function(x){ x.sent = true; });
  fbSave();
  return true;
}
function fbResend(){
  var n = 0;
  FB.items.forEach(function(x){ if(x.sent){ x.sent=false; n++; } });
  fbSave(); fbRender();
  fbToast(n?("送信済みの"+n+"件を未送信に戻しました。"):"戻すものがありません。");
}
function fbCopy(){
  var t = document.getElementById("fb_out"); if(!t) return;
  var ok = false;
  try{ t.focus(); t.select(); t.setSelectionRange(0,999999); ok = document.execCommand("copy"); }catch(e){}
  var yes = "コピーしました。"+fbCopyWhere()+"の「"+FB.heading+"」に貼ってください。";
  var no  = "コピーできませんでした。上の枠を長押し →「すべてを選択」→「コピー」でも同じことができます。";
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(
      function(){ fbToast(yes); }, function(){ fbToast(no); });
    return;
  }
  fbToast(ok?yes:no);
}
function fbCfgGo(){ if(fbCfg) fbGrabCfg(); fbCfg = !fbCfg; fbSave(); fbRender(); }
function fbHeadGo(){ fbGrabCfg(); FB.useHead = !FB.useHead; fbSave(); fbRender(); }
function fbModeGo(){ fbGrabCfg(); FB.mode = (FB.mode==="prepend")?"append":"prepend"; fbSave(); fbRender(); }

function fbSendBlock(){
  var un = fbUnsent();
  if(!un.length) return '';
  if(!fbCanSend()){
    return '<p class="note">いまは実行中なので送りません。前面のアプリが切り替わって、'
         + 'タイマーが止まってしまうためです。<b>終わってから、またはホームに戻ってから</b>送ってください。</p>';
  }
  var g = fbGroups(un), s = '';
  g.forEach(function(z,i){
    s += '<a class="fbsend" href="'+fbEsc(fbUri(fbText(z.items), z.path))+'" '
      +  'onclick="return fbMarkSentG('+i+')">'
      +  'Obsidianへ送る（'+fbEsc(z.key)+'・'+z.items.length+'件）</a>';
  });
  s += '<p class="note">Obsidianが開いて、<b>'+fbEsc(fbCopyWhere())+'</b>の「'
    +  fbEsc(FB.heading)+'」に入ります。'
    +  (g.length>1?'<br>入れる先のノートが分かれているので、<b>上から順に押してください。</b>':'')
    +  '<br><b>開かない・入らないときは、下の「コピーする」で貼ってください。</b></p>';
  return s;
}

function fbRender(){
  var p = document.getElementById("fbPanel"); if(!p) return;
  var un = fbUnsent();
  var h = "";

  if(fbStep === 1){
    h += '<h1>気になったことを記録</h1>'
      +  '<p class="sub">いま開いている画面：<b>'+fbEsc(fbCtx())+'</b><br>'
      +  '近いものを1つ押してください。<b>それだけで記録されます。</b>一言は、押したあとに足せます。</p>';
    FBCATS.forEach(function(c,i){
      h += '<button class="fbchip" onclick="fbAdd('+i+')">'+fbEsc(c)+'</button>';
    });
  }

  if(fbStep === 2){
    var it = FB.items[fbLast] || {cat:"",ctx:""};
    h += '<h1>記録しました</h1>'
      +  '<p class="sub"><b>'+fbEsc(it.cat)+'</b> ／ '+fbEsc(it.ctx)+'<br>'
      +  'このままでも構いません。足したいことがあれば、下にどうぞ。</p>'
      +  '<input class="fbinp" id="fb_memo" type="text" placeholder="一言そえる（任意）" '
      +  'value="'+fbEsc(fbMemo)+'" oninput="fbTyping(this.value)">'
      +  '<button class="btn" onclick="fbAttach()">これで記録する</button>'
      +  '<button class="btn ghost" onclick="fbDropLast()">いまの1件を取り消す</button>';
  }

  if(fbStep === 3){
    h += '<h1>'+fbEsc(fbNote||"記録しました")+'</h1>'
      +  '<p class="sub">未送信 '+un.length+'件。まとめて送れます。</p>'
      +  '<button class="btn ghost" onclick="fbStep=1;fbRender()">もう1件記録する</button>';
  }

  if(fbStep !== 2){
    h += '<div class="sec">たまっているもの</div>';
    if(!FB.items.length){
      h += '<div class="card"><p class="note">まだありません。</p></div>';
    }else{
      var recent = FB.items.slice(-6).reverse();
      var body = recent.map(function(x){
        var dt = new Date(x.t);
        return '<div class="fbrow">'+(x.sent?'<span style="color:#6f7a8c">送信済 </span>':'')
             + fbEsc(fbYmd(dt)+" "+fbHm(dt)+" ／ "+x.ctx+" ／ "+x.cat+(x.memo?" ／ "+x.memo:""))+'</div>';
      }).join("");
      h += '<div class="card">'+body+'<p class="note" style="margin-top:9px">未送信 '+un.length
         + '件 ／ 記録 '+FB.items.length+'件（直近6件）</p></div>';
    }
    h += fbSendBlock();
    h += '<div class="sec">手で貼る（送信がうまくいかないとき）</div>'
       + '<div class="card"><textarea id="fb_out" class="fbta" readonly onclick="this.select()">'
       + fbEsc(fbText(un.length?un:FB.items.slice(-10)))+'</textarea>'
       + '<p class="note" style="margin-top:9px">貼る先：<b>'+fbEsc(fbCopyWhere())
       + '</b>の「'+fbEsc(FB.heading)+'」</p></div>'
       + '<button class="btn ghost" onclick="fbCopy()">コピーする</button>';
    h += '<button class="btn link" onclick="fbCfgGo()">送信先の設定'+(fbCfg?'を閉じる':'')+'</button>';
    if(fbCfg){
      h += '<div class="card">'
         + '<label>Vault名</label>'
         + '<input class="fbinp" id="fb_vault" type="text" value="'+fbEsc(FB.vault)+'">'
         + '<label style="display:block;margin-top:10px">🍽️ 食事記録のコマンドID</label>'
         + '<input class="fbinp" id="ml_log" type="text" placeholder="templater-obsidian:00_System/Templates/Template_Meal_log.md" value="'+fbEsc(MEAL.cmdLog)+'">'
         + '<label style="display:block;margin-top:10px">🍰 予約のコマンドID</label>'
         + '<input class="fbinp" id="ml_book" type="text" placeholder="空のまま＝🍰のリンクを出さない" value="'+fbEsc(MEAL.cmdBook)+'">'
         + '<label style="display:block;margin-top:10px">📝 今日を閉じる のコマンドID</label>'
         + '<input class="fbinp" id="ml_close" type="text" placeholder="空のまま＝📝のボタンを出さない" value="'+fbEsc(MEAL.cmdClose)+'">'
         + '<p class="note">⏸ 呼ばれた中・⏸ 中断中（＝時計が止まっているところ）だけに出るリンクの行き先です。'
         + '空にするとそのリンクは出ません。押しても何も起きないときは、ObsidianのTemplaterで'
         + 'そのテンプレートがホットキーに登録されているか確かめてください。</p>'
         + '<label style="display:block;margin-top:10px">書き込むファイル</label>'
         + '<input class="fbinp" id="fb_file" type="text" placeholder="空のまま＝その日の日次ノート" value="'+fbEsc(FB.file)+'">'
         + '<p class="note">空のままにしておくと、送るそのときの日次ノート（いまなら '
         + fbEsc(fbNotePath(Date.now()))+'）を自動で決めます。</p>'
         + '<label style="display:block;margin-top:10px">見出し</label>'
         + '<input class="fbinp" id="fb_head" type="text" value="'+fbEsc(FB.heading)+'">'
         + '<button class="btn ghost" onclick="fbHeadGo()">'
         + (FB.useHead?'いま：見出しの下に入れる（押すとファイルの先頭に変更）'
                      :'いま：ファイルの先頭に入れる（押すと見出しの下に変更）')+'</button>'
         + '<button class="btn ghost" onclick="fbModeGo()">'
         + (FB.mode==="prepend"?'いま：見出しの直下に足す（押すと、その節の末尾に足すに変更）'
                                :'いま：その節の末尾に足す（押すと、見出しの直下に足すに変更）')+'</button>'
         + '<p class="note">見出しの照合に失敗しているときは、ファイルの先頭に切り替えると入ります。'
         + '入る場所は変わりますが、届くかどうかの切り分けになります。</p>'
         + '<a class="fbsend ghost" href="'+fbEsc(fbUri("- テスト送信 "+FBAPP+"\n"))+'">テスト送信（1行だけ送る）</a>'
         + '<p class="note">これが届けば、送信の仕組みは動いています。届かなければ、Vault名か'
         + 'Advanced URIの設定側の問題です。</p>'
         + '<button class="btn ghost" onclick="fbResend()">送信済みを未送信に戻す（届かなかったとき）</button>'
         + '</div>';
    }
  }
  h += '<button class="btn ghost" onclick="fbClose()">閉じる</button>';
  p.innerHTML = h;
}

function fbInit(){
  fbLoad();
  if(document.getElementById("fbBtn")) return;
  var b = document.createElement("button");
  b.id = "fbBtn"; b.type = "button"; b.innerHTML = "🗒";
  b.setAttribute("aria-label","気になったことを記録");
  b.onclick = fbOpen;
  document.body.appendChild(b);
  var w = document.createElement("div");
  w.id = "fbWrap";
  w.innerHTML = '<div id="fbBack" onclick="fbClose()"></div><div id="fbPanel"></div>';
  document.body.appendChild(w);
  var t = document.createElement("div");
  t.id = "fbToast";
  document.body.appendChild(t);
}

function blFromHash(){
  var m = /[#&]list=([\s\S]*)$/.exec(location.hash||"");
  if(!m) return;
  var txt = m[1];
  try{ txt = decodeURIComponent(txt.replace(/\+/g," ")); }catch(e){}
  var n = blImport(txt);
  blMsg = n ? (n+"件のリストを取り込みました") : "リストを読めませんでした";
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash = ""; }
  if(!curId){ view = "bl"; render(); }
}
window.addEventListener("hashchange", blFromHash);
var OPEN_COOL_MIN = 10;
var openMsg = "", openMsgAt = 0;
function openFromHash(){
  var m = /[#&]open=([A-Za-z]+)/.exec(location.hash||"");
  if(!m) return;
  var k = m[1].toLowerCase(); if(k==="breather") k = "rest";
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash = ""; }
  var now = Date.now();
  if(curId==="urge" || curId==="breather"){ render(); return; }
  var isRun = (k==="watch" || k==="eat" || k==="rest");
  var has = (k==="rest") ? !!breatherSet() : !!urgeSet();
  if(isRun && !has){ openMsg = (k==="rest" ? "🍵 ひと息" : "🌊 いま来た")+" のセットが見つかりませんでした（削除されているかもしれません）。"; openMsgAt = now; if(!curId) view = "home"; render(); return; }
  if(isRun && DB.openAt && now - DB.openAt < OPEN_COOL_MIN*60000){
    openMsg = "さっき始めたばかりなので、今回は新しく始めていません（"+OPEN_COOL_MIN+"分あけています）。使いたいときは下から押せます。";
    openMsgAt = now; if(!curId) view = "home"; render(); return;
  }
  if(isRun){
    DB.openAt = now; save();
    if(k==="rest") breatherGo(); else urgeGo(k);
    render(); return;
  }
  if(k==="book" || k==="log") openMsg = "🍰 予約・🍽️ 記録は、下のボタンから開いてください（ほかのアプリはタップでしか開けません）。";
  else openMsg = "";
  openMsgAt = now;
  if(!curId) view = "home";
  render();
}
window.addEventListener("hashchange", openFromHash);
blFromHash();
openFromHash();
render();
fbInit();
</script>
