<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script>
/* ============================================================
   B.M.C. 記録ハブ (log.html)
   作成: B.M.C.(Claude) / 2026-09-07
   版:   v3（2026-09-07）

   なにをするページか
     routine.html・gym.html と**同じドメインに置く**ことで、同じ保存領域
     （localStorage）を読める。各アプリに散らばっている実施記録を1枚に集め、
     まだ送っていない分だけを Obsidian へ追記する。

   送り先は2つある（v2で分けた）
     ① 実施ログ  … いつ何をやったか。1行1件。月別のファイルへ追記
     ② 設計       … そのとき各セットが何項目・各項目何秒だったか（routine）と、
                     有酸素プログラムのブロック構成（gym・速度と傾斜）。
                     **変わったときだけ**別ファイルへ追記
     ②が要る理由: 飛ばした項目はアプリ側に記録が残らない（触った項目だけが
     DB.times に入る）。定義と突き合わせて初めて「記録に無い＝やらなかった」
     と読める。①だけでは「やらなかった項目」が永久に見えない。

   設計上の約束（後から変える人へ）
     1. **アプリ本体の保存データ（bmc_routine_v1 / bmc_gym_v1）に書き込まない。**
        読むだけ。送信済みの印はこのページ自身の引き出し（HKEY）に持つ。
        理由: アプリが裏で開いたままだと、あちらの save() が丸ごと上書きする。
        本体に印を書くと、その瞬間に消える。バックアップの貼り戻しでも同じ。
     2. **送信は <a href> のタップで行う。**JSでの location.href は、ホーム画面
        から開いたアプリでは無視されることがある（2026-09-06に実機で確認）。
     3. **リンクを押した瞬間に画面を作り直さない。**開こうとしているリンクが
        消えるため。戻ってきた時（visibilitychange）に作り直す。
     4. vault名は必須。`My Valut`（Vaultの実名。綴りもこのまま）。
     5. 届いたかどうかは機械では分からない。送信後も記録は消さず、印だけ付ける。
     6. **開始日（H.since）より前の記録は「対象外」として数えない。**捨てては
        いない（アプリ側にはある）ので、日付を戻せばいつでも出てくる。
   ============================================================ */

var HKEY = "bmc_log_hub_v1";
var RKEY = "bmc_routine_v1";
var GKEY = "bmc_gym_v1";
var APPVER = "B.M.C. 記録ハブ v6 ・ 2026-09-12";

var H = {
  vault: "My Valut",
  file:  "20_Projects/Private/B.M.C/logs/実施ログ_{YYYY-MM}.md",
  defFile: "20_Projects/Private/B.M.C/logs/セット定義.md",
  mode:  "append",
  since: "",        /* YYYY-MM-DD。空なら初回に今日を入れる */
  maxRows: 15,      /* 1回の送信に入れる行数の上限 */
  maxLen: 6000,     /* 組み上がったURIの長さの上限（これを超える前に切る） */
  sent: []          /* 送信済みのID。古いものから捨てる */
};
var SENTMAX = 4000;
var cfg = false, justSent = 0, justWhat = "";

/* ---------- 保存 ---------- */
function hLoad(){
  try{
    var o = JSON.parse(localStorage.getItem(HKEY));
    if(o && typeof o==="object"){
      if(typeof o.vault==="string") H.vault = o.vault;
      if(typeof o.file==="string" && o.file) H.file = o.file;
      if(typeof o.defFile==="string" && o.defFile) H.defFile = o.defFile;
      if(o.mode==="append"||o.mode==="prepend") H.mode = o.mode;
      if(typeof o.since==="string") H.since = o.since;
      if(typeof o.maxRows==="number" && o.maxRows>0) H.maxRows = o.maxRows;
      if(Array.isArray(o.sent)) H.sent = o.sent;
    }
  }catch(e){}
  /* 初回だけ、開始日を今日にする。過去の記録は対象外として数えない
     （2026-09-07 ご選択）。設定でいつでも戻せる。 */
  if(!/^\d{4}-\d{2}-\d{2}$/.test(H.since)){ H.since = ymd(new Date()); hSave(); }
}
function hSave(){
  try{
    if(H.sent.length > SENTMAX) H.sent = H.sent.slice(H.sent.length - SENTMAX);
    localStorage.setItem(HKEY, JSON.stringify(H));
  }catch(e){ toast("この端末に保存できませんでした。送信済みの印が残りません。"); }
}
/* アプリ本体は**読むだけ**。ここで setItem は絶対に書かないこと。 */
function readApp(key){
  try{
    var o = JSON.parse(localStorage.getItem(key));
    return (o && typeof o==="object") ? o : null;
  }catch(e){ return null; }
}

/* ---------- 文字の道具 ---------- */
function p2(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function hm(d){ return p2(d.getHours())+":"+p2(d.getMinutes()); }
function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* 列がずれないよう、半角パイプと改行は置き換える */
function cell(s){ return String(s==null?"":s).replace(/\|/g,"｜").replace(/[\r\n]+/g," ").trim(); }
function mins(sec){
  sec = Math.max(0, Math.round(sec||0));
  if(!sec) return "";
  if(sec < 60) return "1分未満";
  return Math.round(sec/60)+"分";
}
/* 項目の秒数は丸めない。「4分12秒（目安5分）」の形で読みたいため。 */
function durLabel(sec){
  sec = Math.max(0, Math.round(sec||0));
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s2 = sec%60, o = "";
  if(h) o += h+"時間";
  if(m) o += m+"分";
  if(s2 && !h) o += s2+"秒";
  return o || "0秒";
}
function num(x){ var n = Number(x); return isFinite(n) ? n : 0; }
function cut(s, n){ s = String(s==null?"":s); return s.length>n ? s.slice(0,n)+"…" : s; }
/* 速度・傾斜・分は小数1桁まで（6.8km/h・傾斜3%）。gym側の n1 と同じ見せ方。 */
function n1(x){ return String(Math.round(num(x)*10)/10); }
var RATES = ["かるすぎる","ちょうどよい","きつすぎる"];
/* 定義が変わったかどうかを見るだけの短い印。暗号用途ではない。 */
function hash(s){
  var h = 5381, i;
  for(i=0;i<s.length;i++){ h = ((h*33) ^ s.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}
function sinceMs(){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(H.since||"");
  if(!m) return 0;
  return new Date(+m[1], +m[2]-1, +m[3], 0, 0, 0, 0).getTime();
}

/* ---------- 記録を1行に組む ---------- */
/* 8列: 日付 時刻 | アプリ | 種別 | 名前 | 結果 | 所要 | メモ | #ID  */
function line(t, app, kind, name, result, dur, memo, id){
  var d = new Date(t);
  return "- "+ymd(d)+" "+hm(d)
       + " | "+cell(app) + " | "+cell(kind) + " | "+cell(name)
       + " | "+cell(result) + " | "+cell(dur) + " | "+cell(memo)
       + " | #"+id;
}

var GYMNAME = {tri:"トライセッププッシュダウン", bul:"ブルガリアンスクワット",
  lat:"ラットプルダウン", add:"ヒップアダクション", abd:"ヒップアブダクション",
  crm:"クランチ（マシン）", che:"チェストプレス（マシン）",
  rdl:"ルーマニアンデッドリフト", bic:"バイシクルクランチ"};
/* ご本人が書き換えた種目名があればそちらを優先する（gym側 DB.settings.alt）。
   alt の形は環境ごと（alt[env][id]）だが、古い形（alt[id]）も念のため見る。 */
function gymName(g, id){
  try{
    var alt = g && g.settings && g.settings.alt;
    var env = (g && g.settings && g.settings.env) || "gym";
    if(alt){
      if(alt[env] && alt[env][id] && alt[env][id].name) return alt[env][id].name;
      if(alt[id] && alt[id].name) return alt[id].name;
    }
  }catch(e){}
  return GYMNAME[id] || id;
}
/* v3: 有酸素の「区間」を、続けて同じ設定のものはひとまとめにする。
   インターバルは同じ設定が回数ぶん並ぶだけなので、10ループを10行にすると読めない。
   逆に、走行中に速度・傾斜を変えた区間はそこで別の行に割れる＝**その日に上げた事実が残る。**
   （gym側は「いまの区間だけに効く」変更を記録の plan にそのまま書いている） */
function segRows(c){
  var pl = (c && c.plan) || [];
  if(!pl.length) return [];
  var out = [], by = {};
  /* インターバルの区間名は「速い 3/10」の形。番号を外したものが同じ区間。
     ★続けて並んでいるものだけをまとめる形にしてはいけない。速い→ゆるめ→速い…と
       交互に並ぶので、それでは1つもまとまらない（10ループが20行になる）。 */
  function base(lb){ return String(lb==null?"":lb).replace(/\s*\d+\s*\/\s*\d+\s*$/,"").trim(); }
  function loopNo(lb){ var m = /(\d+)\s*\/\s*\d+\s*$/.exec(String(lb==null?"":lb)); return m ? +m[1] : 0; }
  pl.forEach(function(x){
    var k = num(x.b)+"|"+base(x.lb)+"|"+num(x.sp)+"|"+num(x.inc)+"|"+num(x.min);
    if(!by[k]){
      by[k] = { lb:base(x.lb), sp:num(x.sp), inc:num(x.inc), min:num(x.min), b:num(x.b), n:0, lps:[] };
      out.push(by[k]);
    }
    by[k].n++;
    var lp = loopNo(x.lb);
    if(lp && by[k].lps.length < 12) by[k].lps.push(lp);
  });
  return out;
}

/* routine のセット id → 見出しの名前 */
function setMap(r){
  var m = {};
  (r && r.sets || []).forEach(function(s){
    if(s && s.id) m[s.id] = (s.icon ? s.icon+" " : "") + (s.name || s.id);
  });
  return m;
}
/* routine のステップ文字列 "秒|文言|読み上げ|開くアプリ" を分解する
   （routine.html の parseStep と同じ規則。あちらを変えたらここも変える） */
function parseStep(str){
  var p = String(str).split("|");
  if(p.length < 2) return { sec:60, text:String(str).trim(), say:"" };
  return { sec: parseInt(p[0],10)||60, text:(p[1]||"").trim(), say:(p[2]||"").trim() };
}

/* ---------- ① 実施ログ ---------- */
function collect(){
  var out = [], since = sinceMs();
  function add(id, t, s){ if(t >= since) out.push({ id:id, t:t, s:s }); }

  /* --- routine --- */
  var r = readApp(RKEY);
  if(r){
    var map = setMap(r);
    (r.log||[]).forEach(function(x){
      if(!x || !x.t) return;
      /* v4 (2026-09-08): 🔋 今日は畳んだ回は、名前の後ろに 🔋 を付ける。
         **付けないと「28/29できた日」と読み違える。**畳んだ回の「済み」は
         「手をつけた」であって、やり切ったではない（routine.html v34）。
         列は8列のまま増やしていない。
         v6 (2026-09-12): 🌗 今日の自分に の分岐に合わせ、休息は 🔋・楽しむは 🎉 を付ける。
         mode が無い古い記録（routine v37以前）は、これまでどおり 🔋。 */
      var mk = x.fold ? (x.mode==="joy" ? " 🎉" : " 🔋") : "";
      add("r"+x.t, x.t, line(x.t, "routine", "セット",
        (x.icon?x.icon+" ":"")+(x.name||"")+mk, num(x.d)+"/"+num(x.n), mins(x.sec), "", "r"+x.t));
      /* v6: 🎉 の回は、選んだ楽しみと感想を**そのセット行に続く1行**として送る。
         8列＋#ID の形は崩さない（列は増やさない）。#ID は "j"+t で重複しない。 */
      if(x.fold && x.mode==="joy" && x.joy){
        var FEEL = { again:"またやりたい", ok:"ふつう", no:"そうでもない" };
        add("j"+x.t, x.t, line(x.t, "routine", "楽しみ",
          x.joy, (FEEL[x.jfeel] || "未記入"), (x.jmin ? x.jmin+"分" : ""), (x.jnote||""), "j"+x.t));
      }
    });
    /* v2: 項目ごとの実測。ここが「何をやったか」の本体。
       アプリは**触った項目だけ**を DB.times に入れる（飛ばした項目は入らない）。
       したがって「セット定義にあるのに、この回の項目行が無い」＝やらなかった、
       と読む。就寝・中途覚醒は別の種別として下で拾う。 */
    (r.times||[]).forEach(function(x){
      if(!x || !x.t) return;
      if(x.sid === "sleep" || x.sid === "wake") return;
      var nm = (map[x.sid] || x.sid || "") + " › " + (x.step||"");
      var dur = durLabel(x.act) + (x.plan ? "（目安"+durLabel(x.plan)+"）" : "");
      add("x"+x.t, x.t, line(x.t, "routine", "項目", nm, "済", dur, "", "x"+x.t));
    });
    (r.notes||[]).forEach(function(x){
      if(!x || !x.t) return;
      add("n"+x.t, x.t, line(x.t, "routine", "メモ", x.step||"", "", "", x.v||"", "n"+x.t));
    });
    (r.times||[]).forEach(function(x){
      if(!x || !x.t) return;
      if(x.sid !== "sleep" && x.sid !== "wake") return;
      add("t"+x.t, x.t, line(x.t, "routine",
        (x.sid==="sleep" ? "就寝" : "中途覚醒"), x.step||"", "", mins(x.act), "", "t"+x.t));
    });
  }

  /* --- gym --- */
  var g = readApp(GKEY);
  if(g){
    (g.sessions||[]).forEach(function(s){
      if(!s || !s.date || !s.sets || !s.sets.length) return;
      var order = [], by = {};
      s.sets.forEach(function(st){
        if(!by[st.id]){ by[st.id] = []; order.push(st.id); }
        by[st.id].push(st);
      });
      var parts = order.map(function(id){
        var w = by[id][0] && by[id][0].w;
        var reps = by[id].map(function(st){ return num(st.reps); }).join("/");
        return gymName(g,id) + " " + (num(w) ? num(w)+"kg×" : "自重×") + reps;
      });
      add("g"+s.date, s.date, line(s.date, "gym", "筋トレ",
        "ルーティン"+(s.routine||""), parts.join(" ・ "), mins(s.sec), "", "g"+s.date));
    });
    (g.cardio||[]).forEach(function(c){
      if(!c || !c.date) return;
      var res = [];
      if(num(c.dist)) res.push(num(c.dist)+"km");
      if(num(c.hard)) res.push("きつさ"+num(c.hard));
      if(num(c.kcal)) res.push(num(c.kcal)+"kcal");
      add("c"+c.date, c.date, line(c.date, "gym", "有酸素",
        /* v5: gym v14 から所要時間に秒（c.sec）が入るようになった。
           古い記録には無いので、無ければ従来どおり分だけを出す。 */
        c.progName||"有酸素", res.join("・"),
        (num(c.min)||num(c.sec) ? num(c.min)+"分"+(num(c.sec)?num(c.sec)+"秒":"") : ""),
        c.memo||"", "c"+c.date));
      /* v3: その回に実際に走った速度・傾斜。記録の plan は**その回のコピー**なので、
         あとで既定を変えても過去は動かない（gym側の原則）。 */
      var rates = c.rates || {};
      segRows(c).forEach(function(x, i){
        var rt = RATES[num(rates[x.b])-1] || "";
        add("v"+c.date+"-"+i, c.date, line(c.date, "gym", "有酸素区間",
          (c.progName||"有酸素")+" › "+(x.lb||"区間"),
          n1(x.sp)+"km/h・傾斜"+n1(x.inc)+"%"+(x.n>1 ? " ×"+x.n : ""),
          (x.min ? n1(x.min)+"分"+(x.n>1 ? "×"+x.n+"＝"+n1(x.min*x.n)+"分" : "") : ""),
          (x.lps.length ? x.lps.join("・")+"回目" : "")
            + (x.lps.length && rt ? " ／ " : "") + (rt ? "手ごたえ: "+rt : ""),
          "v"+c.date+"-"+i));
      });
    });
  }

  out.sort(function(a,b){ return a.t - b.t; });
  return out;
}
/* 開始日より前にある件数（数えないだけで、捨ててはいない） */
function skippedCount(){
  var since = sinceMs(), n = 0;
  var r = readApp(RKEY), g = readApp(GKEY);
  function cnt(arr, key){ (arr||[]).forEach(function(x){ if(x && x[key] && x[key] < since) n++; }); }
  if(r){ cnt(r.log,"t"); cnt(r.times,"t"); cnt(r.notes,"t"); }
  if(g){ cnt(g.sessions,"date"); cnt(g.cardio,"date"); }
  return n;
}

/* ---------- ② セット定義 ---------- */
/* いま各セットが何項目・各項目が何秒か。変わったときだけ送る。
   IDに中身の印（hash）を入れてあるので、**中身が変わった瞬間だけ未送信になる。** */
function defLines(){
  var r = readApp(RKEY); if(!r) return [];
  var now = Date.now(), out = [];
  (r.sets||[]).forEach(function(s){
    if(!s || !s.id) return;
    var steps = (s.steps||[]).map(parseStep);
    var label = (s.icon ? s.icon+" " : "") + (s.name || s.id);
    var body = JSON.stringify([label, steps.map(function(x){ return [x.sec, x.text]; })]);
    var h = hash(body);
    var total = steps.reduce(function(a,b){ return a + (b.sec||0); }, 0);
    out.push({ id:"s"+h+"-0", t:now, s:line(now, "routine", "セット定義", label,
      steps.length+"項目・合計"+durLabel(total), "", cut(s.note||"", 80), "s"+h+"-0") });
    steps.forEach(function(x, i){
      out.push({ id:"s"+h+"-"+(i+1), t:now, s:line(now, "routine", "セット定義",
        label+" › "+(i+1)+"/"+steps.length, x.text, "目安"+durLabel(x.sec),
        x.say ? "読み上げ: "+cut(x.say,40) : "", "s"+h+"-"+(i+1)) });
    });
  });
  return out;
}

/* v3: 有酸素プログラムの設計（ブロック構成）。routineのセット定義と同じ扱いで、
   変わったときだけ送る。実績（有酸素区間）と突き合わせると、
   「設計は6.8km/hなのに、その日は7.0で走った」が読める。 */
function defLinesGym(){
  var g = readApp(GKEY); if(!g) return [];
  var progs = (g.settings && g.settings.cardio && g.settings.cardio.progs) || [];
  var now = Date.now(), out = [];
  progs.forEach(function(pg){
    var bl = pg.blocks || [], total = 0;
    bl.forEach(function(b){
      if(b.type==="interval"){
        var reps = Math.max(1, Math.round(num(b.reps)||1));
        (b.segs||[]).forEach(function(sg){ total += num(sg.min)*reps; });
      }else total += num(b.min);
    });
    var h = hash(JSON.stringify([pg.name||pg.id, bl]));
    var nm = pg.name || pg.id;
    out.push({ id:"p"+h+"-0", t:now, s:line(now, "gym", "有酸素プログラム", nm,
      bl.length+"ブロック・合計"+n1(total)+"分", "", cut(pg.note||"", 80), "p"+h+"-0") });
    bl.forEach(function(b, i){
      var res, dur;
      if(b.type==="interval"){
        var reps = Math.max(1, Math.round(num(b.reps)||1)), t2 = 0;
        var segs = (b.segs||[]).map(function(sg){
          t2 += num(sg.min)*reps;
          return (sg.lb||"")+" "+n1(sg.min)+"分 "+n1(sg.sp)+"km/h・傾斜"+n1(sg.inc)+"%";
        });
        res = "インターバル ×"+reps+"（"+segs.join(" → ")+"）";
        dur = n1(t2)+"分";
      }else{
        res = (b.lb||"")+" "+n1(b.sp)+"km/h・傾斜"+n1(b.inc)+"%";
        dur = n1(b.min)+"分";
      }
      out.push({ id:"p"+h+"-"+(i+1), t:now, s:line(now, "gym", "有酸素プログラム",
        nm+" › "+(i+1)+"/"+bl.length, res, dur, "", "p"+h+"-"+(i+1)) });
    });
  });
  return out;
}

function isSent(id){ return H.sent.indexOf(id) >= 0; }
function unsentLog(){ return collect().filter(function(x){ return !isSent(x.id); }); }
function unsentDef(){ return defLines().concat(defLinesGym()).filter(function(x){ return !isSent(x.id); }); }

/* ---------- 送信 ---------- */
function fileName(){
  var d = new Date();
  return String(H.file)
    .replace(/\{YYYY-MM\}/g, d.getFullYear()+"-"+p2(d.getMonth()+1))
    .replace(/\{YYYY\}/g, String(d.getFullYear()))
    .replace(/\{MM\}/g, p2(d.getMonth()+1));
}
function uriOf(text, path){
  var u = "obsidian://advanced-uri?";
  if(H.vault) u += "vault="+encodeURIComponent(H.vault)+"&";
  u += "filepath="+encodeURIComponent(path);
  u += "&mode="+H.mode+"&data="+encodeURIComponent(text);
  return u;
}
/* 今回送る分を、行数と URI の長さの両方で切る。
   長すぎるURIは端末側で黙って落ちることがあるため、必ず分ける。 */
function batchOf(list, path){
  var take = [], text = "";
  for(var i=0;i<list.length;i++){
    if(take.length >= H.maxRows) break;
    var next = text + list[i].s + "\n";
    if(take.length && uriOf(next, path).length > H.maxLen) break;
    text = next; take.push(list[i]);
  }
  return { rows:take, text:text };
}
/* リンクを押した瞬間に呼ばれる。印を付けるだけ。画面は作り直さない。 */
function markSent(ids, what){
  ids.forEach(function(id){ if(!isSent(id)) H.sent.push(id); });
  justSent = ids.length; justWhat = what || "";
  hSave();
  return true;
}
function resend(n){
  var k = Math.min(n, H.sent.length);
  H.sent = H.sent.slice(0, H.sent.length - k);
  hSave(); render();
  toast(k ? ("直近"+k+"件を未送信に戻しました。") : "戻すものがありません。");
}
function markAllSent(){
  var un = unsentLog();
  un.forEach(function(x){ H.sent.push(x.id); });
  hSave(); render();
  toast(un.length+"件を「送信済み」にしました（送ってはいません）。");
}
function copyId(id, okmsg){
  var t = document.getElementById(id); if(!t) return;
  var ok = false;
  try{ t.focus(); t.select(); t.setSelectionRange(0,999999); ok = document.execCommand("copy"); }catch(e){}
  var no = "コピーできませんでした。枠を長押し →「すべてを選択」→「コピー」でも同じことができます。";
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(function(){ toast(okmsg); }, function(){ toast(no); });
    return;
  }
  toast(ok?okmsg:no);
}
function toast(msg){
  var t = document.getElementById("toast"); if(!t) return;
  t.innerHTML = esc(msg); t.className = "on";
  setTimeout(function(){ var x=document.getElementById("toast"); if(x) x.className=""; }, 2400);
}

/* ---------- 設定 ---------- */
function grabCfg(){
  var v = document.getElementById("c_vault"); if(v) H.vault = v.value.trim();
  var f = document.getElementById("c_file");  if(f) H.file  = f.value.trim();
  var d = document.getElementById("c_def");   if(d) H.defFile = d.value.trim();
  var s = document.getElementById("c_since"); if(s && /^\d{4}-\d{2}-\d{2}$/.test(s.value.trim())) H.since = s.value.trim();
  var m = document.getElementById("c_rows");  if(m){ var n = parseInt(m.value,10); if(n>0) H.maxRows = n; }
}
function cfgGo(){ if(cfg) grabCfg(); cfg = !cfg; hSave(); render(); }
function modeGo(){ grabCfg(); H.mode = (H.mode==="append") ? "prepend" : "append"; hSave(); render(); }

/* ---------- 画面 ---------- */
function sendBlock(list, path, label, cls, taid, what){
  var b = batchOf(list, path);
  var h = '<div class="card">';
  h += '<a class="send'+(cls?" "+cls:"")+'" href="'+esc(uriOf(b.text, path))+'" onclick="return markSent('
     + JSON.stringify(b.rows.map(function(x){return x.id;})).replace(/"/g,"&quot;") + ',\''+what+'\')">'
     + label+'（'+b.rows.length+'件）</a>';
  h += '<p class="note">送り先： <b>'+esc(path)+'</b> の末尾'
     + (H.mode==="prepend" ? '（いまは先頭に入る設定）' : '')
     + (list.length > b.rows.length
        ? '<br>残り '+(list.length-b.rows.length)+'件は、送ったあとにもう一度押してください。'
        : '')
     + '</p>';
  h += '<textarea id="'+taid+'" class="ta" readonly onclick="this.select()">'+esc(b.text)+'</textarea>';
  h += '<button class="btn ghost" onclick="copyId(\''+taid+'\',\'コピーしました。'+esc(path)+' に貼ってください。\')">コピーする（Obsidianが開かないとき）</button>';
  h += '</div>';
  return h;
}

function render(){
  var el = document.getElementById("app"); if(!el) return;
  var all = collect(), un = unsentLog(), ud = unsentDef(), sk = skippedCount();
  var h = '<h1>記録ハブ</h1>';
  h += '<p class="sub">routine と gym の実施記録を、Obsidianへ追記します。'
     + '<b>記録そのものは各アプリの中に残ります。</b>ここが消えても記録は消えません。</p>';

  h += '<div class="card"><div class="big">'+un.length+'</div>'
     + '<div class="bigsub">未送信（'+H.since+' 以降の全'+all.length+'件のうち）</div></div>';

  if(justSent){
    h += '<div class="card"><p class="note">前回 '+justSent+'件'+(justWhat?'（'+esc(justWhat)+'）':'')+'を送りました。'
       + '<b>Obsidian側に入っているか、いちど確かめてください。</b>'
       + '入っていなければ、設定の「未送信に戻す」で送り直せます。</p></div>';
  }

  h += '<div class="sec">① 実施ログ（いつ何をやったか）</div>';
  if(!un.length){
    h += '<div class="card"><p class="note">送るものはありません。</p></div>';
  }else{
    h += sendBlock(un, fileName(), "Obsidianへ送る", "", "out", "実施ログ");
  }

  h += '<div class="sec">② 設計（セットの中身・有酸素のブロック構成）</div>';
  if(!ud.length){
    h += '<div class="card"><p class="note">前回送ったときから変わっていません。'
       + '<b>セットの中身か、有酸素のプログラムを編集すると、ここに出ます。</b></p></div>';
  }else{
    h += '<div class="card"><p class="note">中身が変わった（または、まだ一度も送っていない）セットが '
       + ud.length + '行ぶんあります。<b>実施ログとは別のファイルに入ります。</b><br>'
       + '飛ばした項目はアプリに記録が残らないので、この設計と突き合わせて'
       + '「記録に無い項目＝やらなかった」と読みます。有酸素は「設計の速度」と'
       + '「その日に実際に走った速度」の差が読めるようになります。</p></div>';
    h += sendBlock(ud, H.defFile, "設計を送る", "alt", "outd", "設計");
  }

  h += '<div class="sec">たまっているもの（新しい順に20件）</div>';
  h += '<div class="card">';
  if(!all.length){
    h += '<p class="note">まだ1件もありません。routine か gym で1回使うと、ここに出ます。</p>';
  }else{
    all.slice(-20).reverse().forEach(function(x){
      h += '<div class="row'+(isSent(x.id)?' sent':'')+'">'
         + (isSent(x.id) ? '<span class="m">済 </span>' : '<span>未 </span>')
         + esc(x.s.replace(/^- /,"")) + '</div>';
    });
  }
  h += '</div>';
  if(sk){
    h += '<p class="note">このほかに <b>'+sk+'件</b> が開始日（'+H.since+'）より前にあります。'
       + '数えていないだけで、消えてはいません。<b>設定で開始日を戻せば出てきます。</b></p>';
  }

  h += '<button class="btn ghost" onclick="cfgGo()">'+(cfg?'設定を閉じる':'⚙ 設定・送り直し')+'</button>';
  if(cfg){
    h += '<div class="card">';
    h += '<label class="lb">Vault名（この綴りのまま。空にすると届きません）</label>'
       + '<input class="inp" id="c_vault" type="text" value="'+esc(H.vault)+'">';
    h += '<label class="lb">① 実施ログの送り先（{YYYY-MM} は今月に置き換わります）</label>'
       + '<input class="inp" id="c_file" type="text" value="'+esc(H.file)+'">';
    h += '<label class="lb">② セット定義の送り先</label>'
       + '<input class="inp" id="c_def" type="text" value="'+esc(H.defFile)+'">';
    h += '<label class="lb">開始日（この日より前の記録は数えません）</label>'
       + '<input class="inp" id="c_since" type="text" placeholder="2026-09-07" value="'+esc(H.since)+'">';
    h += '<label class="lb">1回に送る件数の上限</label>'
       + '<input class="inp" id="c_rows" type="number" min="1" max="60" value="'+H.maxRows+'">';
    h += '<button class="btn ghost" onclick="modeGo()">入れる位置： '
       + (H.mode==="append" ? "ファイルの末尾" : "ファイルの先頭") + '（押すと切り替え）</button>';
    h += '<button class="btn ghost" onclick="cfgGo()">この内容で保存する</button>';
    h += '<p class="note">実績のある書き方は <b>末尾（append）</b>です。届かないときだけ先頭を試してください。</p>';
    h += '<div class="sec">送り直し</div>';
    h += '<button class="btn ghost" onclick="resend(15)">直近15件を未送信に戻す</button>';
    h += '<button class="btn ghost" onclick="resend(999999)">全部を未送信に戻す</button>';
    h += '<button class="btn ghost warn" onclick="markAllSent()">いまの未送信を、送らずに送信済みにする</button>';
    h += '<p class="note">送信済みの印は<b>このページだけ</b>が持っています。'
       + 'アプリ本体の記録には何も書き込んでいないので、ここを戻しても記録は壊れません。<br>'
       + '同じ記録を二重に送っても、行の末尾の <b>#ID</b> が同じなので後から片方を消せます。</p>';
    h += '</div>';
  }

  h += '<div class="sec">アプリへ戻る</div>';
  h += '<a class="btn" href="routine.html">🕒 切り替えルーティン</a>';
  h += '<a class="btn" href="gym.html">🏋️ ジム</a>';
  h += '<p class="note" style="text-align:center;opacity:.45;margin-top:14px">'+APPVER+'</p>';

  el.innerHTML = h;
}

/* Obsidianから戻ってきたら作り直す（リンクを押した時には作り直さない） */
try{
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) render();
  });
}catch(e){}

hLoad();
render();
</script>
