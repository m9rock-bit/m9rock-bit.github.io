<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stretch">
<meta name="theme-color" content="#12151c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2312151c'/%3E%3Cpath d='M90 34c9 0 16 7 16 16s-7 16-16 16-16-7-16-16 7-16 16-16z' fill='%237fd1c1'/%3E%3Cpath d='M90 72c-6 0-11 4-13 10l-9 30-22 22a9 9 0 1 0 13 13l25-25 6-19 6 19 25 25a9 9 0 1 0 13-13l-22-22-9-30c-2-6-7-10-13-10z' fill='%237fd1c1'/%3E%3C/svg%3E">
<title>B.M.C. ストレッチ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#12151c;color:#e8ecf2;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-user-select:none;user-select:none;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:19px;margin:4px 0 2px;letter-spacing:.02em}
.sub{color:#8a94a6;font-size:12.5px;margin:0 0 18px;line-height:1.6}
.card{
  background:#1a1f29;border:1px solid #262d3a;border-radius:14px;
  padding:15px 16px;margin-bottom:11px;display:block;width:100%;text-align:left;
  color:inherit;font:inherit;cursor:pointer;transition:transform .08s;
}
.card:active{transform:scale(.985)}
.card .t{font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px}
.card .d{font-size:12.5px;color:#8a94a6;margin-top:5px;line-height:1.55}
.badge{font-size:11px;background:#232b38;color:#9fb0c8;border-radius:6px;padding:2px 7px;font-weight:500}
.badge.hot{background:#3a2620;color:#f0a68a}
.badge.core{background:#1e3b36;color:#7fd1c1}
.sec{font-size:12px;color:#6f7a8c;margin:22px 0 9px;letter-spacing:.06em}
.btn{
  display:block;width:100%;padding:15px;border-radius:12px;border:none;
  background:#7fd1c1;color:#10161c;font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer;margin-top:10px;
}
.btn.ghost{background:#232b38;color:#cbd5e3;font-weight:600}
.btn.sm{padding:11px;font-size:14px}
.row{display:flex;gap:9px}
.row>*{flex:1}

/* runner */
#runner{display:none;position:fixed;inset:0;background:#12151c;z-index:10;overflow-y:auto}
.rwrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px)}
.rtop{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#8a94a6}
.xbtn{background:none;border:none;color:#8a94a6;font-size:22px;line-height:1;padding:4px 8px;cursor:pointer}
.prog{height:4px;background:#232b38;border-radius:3px;margin:12px 0 22px;overflow:hidden}
.prog i{display:block;height:100%;background:#7fd1c1;width:0;transition:width .3s}
.exname{font-size:25px;font-weight:700;line-height:1.35;margin:0 0 6px}
.side{display:inline-block;font-size:13px;font-weight:700;background:#7fd1c1;color:#10161c;border-radius:6px;padding:3px 10px;margin-bottom:10px}
.side.none{display:none}
.timer{font-size:76px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:14px 0 4px;letter-spacing:-.03em}
.timer.warn{color:#f0a68a}
.next{text-align:center;color:#6f7a8c;font-size:12.5px;min-height:18px;margin-bottom:20px}
.how{background:#1a1f29;border:1px solid #262d3a;border-radius:12px;padding:14px;font-size:14px;line-height:1.75;color:#c8d2e0}
.ease{margin-top:9px;border:1px solid #2f2a24;background:#1f1c19;border-radius:12px;padding:0 14px;overflow:hidden}
.ease summary{cursor:pointer;font-size:13.5px;font-weight:600;color:#f0c08a;padding:12px 0;list-style:none}
.ease summary::-webkit-details-marker{display:none}
.ease p{font-size:13.5px;line-height:1.75;color:#d8c9b4;margin:0 0 13px}
.ctrl{display:flex;gap:9px;margin-top:18px}
.ctrl button{
  flex:1;padding:15px 0;border-radius:12px;border:none;background:#232b38;color:#cbd5e3;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer
}
.ctrl button.main{flex:1.6;background:#7fd1c1;color:#10161c;font-weight:700}

/* forms */
label{display:block;font-size:13.5px;color:#c8d2e0;margin:15px 0 6px;line-height:1.5}
label small{display:block;color:#6f7a8c;font-size:11.5px;margin-top:3px}
input,select{
  width:100%;padding:13px;border-radius:10px;border:1px solid #2c3441;
  background:#12161d;color:#e8ecf2;font-size:16px;font-family:inherit
}
.log{font-size:13px;color:#a8b4c6;line-height:1.7;border-bottom:1px solid #232b38;padding:11px 0}
.log b{color:#e8ecf2;font-weight:600}
.streak{font-size:38px;font-weight:700;color:#7fd1c1;line-height:1}
.note{font-size:12px;color:#6f7a8c;line-height:1.7;margin-top:14px}
textarea{width:100%;height:150px;background:#12161d;color:#a8b4c6;border:1px solid #2c3441;border-radius:10px;padding:11px;font-size:11px;font-family:ui-monospace,Menlo,monospace}
.phase{text-align:center;font-size:13.5px;font-weight:700;color:#f0c08a;margin:6px 0 -4px;line-height:1.5}
.phase.hide{display:none}
.timer.prep{color:#f0c08a;font-weight:300}
.warnbox{background:#2a1d18;border:1px solid #4a3226;border-radius:12px;padding:14px;font-size:13px;line-height:1.75;color:#f0c9b4;margin-bottom:14px}
.warnbox b{color:#ffb995}
.hide{display:none}
.badge.imp{background:#2a2438;color:#c3aef0}
.pv{border-bottom:1px solid #232b38;padding:9px 0;font-size:13.5px;line-height:1.6;color:#e8ecf2}
.pv i{font-style:normal;color:#7fd1c1;font-weight:600;font-size:12.5px}
.pv small{display:block;color:#8a94a6;font-size:12px;margin-top:3px;line-height:1.65}
.errbox{background:#2a1d18;border:1px solid #4a3226;border-radius:12px;padding:13px;font-size:12.5px;line-height:1.85;color:#f0c9b4;margin-bottom:12px}
.errbox b{color:#ffb995;display:block;margin-bottom:5px}
.skipbox{background:#191d26;border:1px solid #2c3441;border-radius:12px;padding:13px;font-size:12px;line-height:1.85;color:#8a94a6;margin-bottom:12px}
.skipbox b{color:#c8d2e0;display:block;margin-bottom:5px}
textarea.big{height:240px;font-size:12px;color:#e8ecf2}
.spec{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.75;color:#a8b4c6;
  background:#12161d;border:1px solid #2c3441;border-radius:10px;padding:12px;max-height:340px;overflow:auto;
  -webkit-user-select:text;user-select:text}
</style>
</head>
<body>

<div id="app" class="wrap"></div>

<div id="runner"><div class="rwrap" id="rwrapDone" style="display:none">
  <!-- v8（2026-09-05）: 完了の画面。押すまでホームへ戻らない。
       連続日数・達成率・ほめ言葉は出さない（事実だけ）。 -->
  <div style="text-align:center;padding:8px 0">
    <div style="font-size:44px;line-height:1.1;margin-bottom:10px">🌿</div>
    <h2 class="exname" style="margin:0 0 6px">おつかれさまでした</h2>
    <div id="rd_name" style="font-size:17px;font-weight:700;color:#7fd1c1;margin-bottom:4px"></div>
    <div id="rd_sub" style="opacity:.8;font-size:14px"></div>
  </div>
  <div class="ctrl" style="margin-top:18px">
    <button onclick="doneAgain()">もう一度</button>
    <button class="main" onclick="doneClose()">ホームへ</button>
  </div>
  <p style="text-align:center;opacity:.55;font-size:12px;margin-top:12px">記録に残しました。<br>この画面は、押すまで閉じません。</p>
</div><div class="rwrap" id="rwrapMain">
  <div class="rtop">
    <button class="xbtn" onclick="quit()">✕</button>
    <span id="rname"></span>
    <span id="rcount"></span>
  </div>
  <div class="prog"><i id="rbar"></i></div>
  <div id="rside" class="side none"></div>
  <h2 id="rex" class="exname"></h2>
  <div id="rphase" class="phase hide"></div>
  <div id="rtimer" class="timer">0:00</div>
  <div id="rnext" class="next"></div>
  <div id="rhow" class="how"></div>
  <details class="ease"><summary>できない・つらいときは（緩和措置）</summary><p id="rease"></p></details>
  <div class="ctrl">
    <button onclick="jump(-1)">◀ 戻る</button>
    <button class="main" id="rpause" onclick="togglePause()">一時停止</button>
    <button onclick="jump(1)">スキップ ▶</button>
  </div>
</div></div>

<script>
/* ===================== プログラムデータ ===================== */
const P = {
A:{name:"朝の始動",time:"5分",tag:"ジム運動前",cls:"",
   desc:"動的ストレッチ。ここで柔軟性を伸ばそうとせず、関節を温めて怪我を防ぐのが目的。",
   steps:[
 {n:"足首まわし＋その場カーフ",f:"calf",s:15,side:"右",how:"片脚ずつつま先立ちになり、足首を大きく10回まわす。",ease:"壁に手をついて支える。"},
 {n:"足首まわし＋その場カーフ",f:"calf",s:15,side:"左",how:"反対側も同じ。",ease:"壁に手をついて支える。"},
 {n:"90/90 ヒップスイッチ",f:"hip9090",s:60,side:null,how:"床に座り両膝を90度に開いて片側に倒す→反対側へ。ゆっくり10往復。股関節の内旋と外旋を両方使う。",ease:"手を後ろについて上体を支える。可動範囲を半分にしてよい。"},
 {n:"レッグスイング（前後）",f:"swingFB",s:20,side:"右",how:"壁に手をつき、脚を前後に振る。最後に力を入れず、振り子のように。",ease:"振り幅を膝の高さまでに抑える。"},
 {n:"レッグスイング（前後）",f:"swingFB",s:20,side:"左",how:"反対側も同じ。",ease:"振り幅を小さく。"},
 {n:"レッグスイング（左右）",f:"swingLR",s:20,side:"右",how:"同じ姿勢で脚を体の前で左右に振る。内ももの動的な準備。",ease:"振り幅を小さく。"},
 {n:"レッグスイング（左右）",f:"swingLR",s:20,side:"左",how:"反対側も同じ。",ease:"振り幅を小さく。"},
 {n:"ワールドグレイテストストレッチ",f:"wgs",s:30,side:"右",how:"大きく前に踏み込み、前脚の内側に両手をつく。前脚側の手を天井へ開いて胸を回旋。3回。",ease:"後ろ膝を床につける。回旋は肘を天井に向ける程度でよい。"},
 {n:"ワールドグレイテストストレッチ",f:"wgs",s:30,side:"左",how:"反対側も同じ。",ease:"後ろ膝を床につける。"},
 {n:"立位ヒップサークル",f:"hipcircle",s:15,side:"右",how:"膝を腰の高さに上げ、外→後ろへ大きくまわす。8回。",ease:"壁に手をつく。円を小さく。"},
 {n:"立位ヒップサークル",f:"hipcircle",s:15,side:"左",how:"反対側も同じ。",ease:"壁に手をつく。"},
 {n:"アームサークル",f:"armcircle",s:20,side:null,how:"腕を大きく前まわし10回、後ろまわし10回。",ease:"小さくてよい。"},
 {n:"壁スライド",f:"wallslide",s:20,side:null,how:"壁に背中と腕をつけ、腕を上下にスライド10回。肩の可動域の準備。",ease:"壁につかず、その場で万歳の上げ下げ。"}
]},
B:{name:"サウナ座位",time:"5分",tag:"サウナ室内",cls:"hot",
   desc:"座ったまま完結する軽めの静的ストレッチ。肩の左右差の是正と合蹠の準備が目的。",
   warn:true,
   steps:[
 {n:"首の側屈",f:"neckside",s:20,side:"右へ倒す",how:"座って片手で反対側の頭を軽く倒す。引っ張らず、頭の重みだけ。",ease:"手は添えず、頭の重みだけで倒す。"},
 {n:"首の側屈",f:"neckside",s:20,side:"左へ倒す",how:"反対側も同じ。",ease:"手を添えない。"},
 {n:"首の回旋",f:"neckrot",s:20,side:"右",how:"顎を軽く引き、ゆっくり右を向いて止まる。",ease:"可動域の半分で止める。"},
 {n:"首の回旋",f:"neckrot",s:20,side:"左",how:"反対側も同じ。",ease:"可動域の半分で止める。"},
 {n:"牛の顔・腕 ★苦手な側",f:"gomuarm",s:30,side:"左手が上・右手が下",how:"背中で上下から手を近づける。届かなくてよい。これが今いちばん硬い組み合わせ。",ease:"タオルを縦に垂らして両手で持つ。指が届かなくても効果は同じ。"},
 {n:"牛の顔・腕",f:"gomuarm",s:30,side:"右手が上・左手が下",how:"できる側。左右のバランスを取るため両方やる。",ease:"タオルを使う。"},
 {n:"座位ツイスト",f:"sittwist",s:20,side:"右",how:"骨盤は正面のまま、上体だけ回して止まる。",ease:"手を膝に置いて軽く支える。"},
 {n:"座位ツイスト",f:"sittwist",s:20,side:"左",how:"反対側も同じ。",ease:"手を膝に置く。"},
 {n:"合蹠（座位）",f:"baddhaSit",s:40,side:null,how:"足裏どうしを合わせ、かかとを体から少し離した位置に。背すじを伸ばし、膝は自然に落とす。",ease:"膝を手で押さないこと。かかとをさらに前に置くと楽になる。"},
 {n:"座位フィギュア4",f:"fig4sit",s:30,side:"右足首を左膝へ",how:"足首を反対の膝の上に乗せ、背すじを伸ばしたまま軽く前傾。お尻の外側＝牛の顔の脚の準備。",ease:"前傾せず、乗せるだけでもよい。"},
 {n:"座位フィギュア4",f:"fig4sit",s:30,side:"左足首を右膝へ",how:"反対側も同じ。",ease:"乗せるだけでよい。"}
]},
C:{name:"夜の基本",time:"5分",tag:"就寝前・毎日",cls:"core",
   desc:"柔軟性向上の主役。ストレッチポールを使用。これを毎日の基準にする。",
   steps:[
 {n:"ポール：内ももローリング",f:"poleInner",s:30,side:"右",how:"うつ伏せで片脚を横に開き、内ももをポールに乗せる。膝上〜股関節の間を体重をかけてゆっくり往復。",ease:"体重を抜いて軽く当てるだけ。痛い一点で止めて呼吸する方法でもよい。"},
 {n:"ポール：内ももローリング",f:"poleInner",s:30,side:"左",how:"反対側も同じ。",ease:"体重を抜く。"},
 {n:"カエルストレッチ ★開脚の主役",f:"frog",s:60,side:null,how:"四つ這いから両膝を左右に開き、すねを床につけ、つま先は外向き。お尻を後ろに引いて止まる。呼吸を止めない。",ease:"膝が痛ければ膝の下にタオル。幅を狭くする。お尻を引く量を減らす。"},
 {n:"合蹠前屈（バッダコナーサナ）",f:"baddhaFwd",s:60,side:null,how:"足裏を合わせて座り、背すじを伸ばしたまま股関節から前に倒す。背中を丸めない。",ease:"お尻の下に折りたたんだタオルを敷くと骨盤が立って一気に楽になる。膝の下にクッション。前傾せず座るだけでも可。"},
 {n:"仰向けフィギュア4",f:"fig4sup",s:30,side:"右足首を左膝へ",how:"仰向けで片足首を反対の膝に乗せ、下の太ももを両手で胸に引き寄せる。お尻の外側＝牛の顔の脚。",ease:"頭は床につけたまま。タオルを太ももに回して引く。"},
 {n:"仰向けフィギュア4",f:"fig4sup",s:30,side:"左足首を右膝へ",how:"反対側も同じ。",ease:"タオルで引く。"},
 {n:"開脚前屈",f:"straddle",s:60,side:null,how:"開ける角度で開脚し、背すじを伸ばしたまま股関節から前傾。つま先は天井向き、膝は伸ばしすぎない。",ease:"お尻の下にタオル。壁にお尻と背中をつけて座り、前傾なしで開くだけでもよい。"}
]},
D:{name:"夜のフル",time:"15分",tag:"就寝前・余裕のある日",cls:"",
   desc:"ほぐし＋伸ばし＋入眠のためのリラックス。終わったらそのまま音声に切り替えて布団へ。",
   steps:[
 {n:"ポール：基本ポジション",f:"poleBasic",s:60,side:null,how:"ポールを背骨に沿わせて仰向けに乗り、腕を横に広げて脱力。胸が開く。",ease:"頭が乗らなければ枕を足す。膝を立てる。"},
 {n:"ポール：内ももローリング",f:"poleInner",s:30,side:"右",how:"うつ伏せで片脚を横に開き、内ももを往復。",ease:"体重を抜く。"},
 {n:"ポール：内ももローリング",f:"poleInner",s:30,side:"左",how:"反対側も同じ。",ease:"体重を抜く。"},
 {n:"ポール：お尻・外もも",f:"poleGlute",s:30,side:"右",how:"横向きで骨盤の少し下〜太もも外側をポールに乗せて往復。牛の顔の脚の準備。",ease:"反対の脚を前について体重を分散。"},
 {n:"ポール：お尻・外もも",f:"poleGlute",s:30,side:"左",how:"反対側も同じ。",ease:"体重を分散。"},
 {n:"ポール：脇の下・広背筋",f:"poleLat",s:30,side:"右",how:"横向きで脇の下をポールに乗せ、小さく往復。牛の顔の腕（上側）の準備。",ease:"体重を軽く。"},
 {n:"ポール：脇の下・広背筋",f:"poleLat",s:30,side:"左",how:"反対側も同じ。",ease:"体重を軽く。"},
 {n:"カエルストレッチ ★開脚の主役",f:"frog",s:90,side:null,how:"四つ這いから両膝を左右に開き、すねを床に、つま先は外向き。お尻を後ろに引いて止まる。",ease:"膝下にタオル。幅を狭く。引く量を減らす。"},
 {n:"合蹠前屈（バッダコナーサナ）",f:"baddhaFwd",s:60,side:null,how:"足裏を合わせ、背すじを伸ばしたまま股関節から前傾。",ease:"お尻の下にタオル。膝の下にクッション。"},
 {n:"開脚前屈",f:"straddle",s:90,side:null,how:"開ける角度で開脚し、背すじを伸ばしたまま前傾。膝は伸ばしすぎない。",ease:"お尻の下にタオル。壁に背をつけて座るだけでもよい。"},
 {n:"仰向けフィギュア4",f:"fig4sup",s:30,side:"右足首を左膝へ",how:"下の太ももを両手で胸へ引き寄せる。",ease:"タオルで引く。"},
 {n:"仰向けフィギュア4",f:"fig4sup",s:30,side:"左足首を右膝へ",how:"反対側も同じ。",ease:"タオルで引く。"},
 {n:"牛の顔・脚",f:"gomuleg",s:30,side:"右膝が上",how:"座って膝を上下に重ね、足は左右のお尻の外側へ。",ease:"重ならなくてよい。上の膝をできるだけ中央へ寄せて座るだけでOK。お尻が浮くならお尻の下にタオルを敷いて水平を作る。"},

function parseSec(t){
  t=String(t==null?"":t).trim().replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
  if(!t) return null;
  var m=t.match(/^(?:(\d+)\s*(?:分|min|m))?\s*(?:(\d+)\s*(?:秒|sec|s))?$/i);
  if(m&&(m[1]||m[2])) return (+(m[1]||0))*60+(+(m[2]||0));
  m=t.match(/^(\d+(?:\.\d+)?)$/);
  if(m) return Math.round(+m[1]);
  return null;
}

const FKEY={"プログラム名":"name","名前":"name","プログラム":"name","タイトル":"name","program":"name",
  "タグ":"tag","場面":"tag","いつ":"tag",
  "説明":"desc","概要":"desc","ねらい":"desc","目的":"desc",
  "注意":"warn","警告":"warn",
  "時間":"_","所要時間":"_","合計":"_","合計時間":"_","目安":"_"};

function parseImport(text){
  const progs=[],errs=[],skips=[];
  const lines=String(text||"").replace(/\r/g,"").split("\n");
  let p=null;
  lines.forEach(function(raw,i){
    const ln=i+1;
    let s=raw.replace(/　/g," ").trim();
    if(!s) return;
    if(s.slice(0,3)==="```") return;
    if(/^[-=—ー─＝]{3,}$/.test(s)) return;
    if(s.charAt(0)==="#") return;
    s=s.replace(/^[・･]\s*/,"").replace(/^[-*]\s+/,"").replace(/^\d+[.)]\s+/,"");
    const t=s.replace(/｜/g,"|");
    const k=s.match(/^([^:：|｜]{1,8})\s*[:：]\s*(.*)$/);
    if(k && FKEY[k[1].trim()]!==undefined && t.indexOf("|")<0){
      const f=FKEY[k[1].trim()], v=k[2].trim();
      if(f==="_") return;
      if(f==="name"){
        if(!v){ errs.push(ln+"行目：プログラム名が空です"); return; }
        p={name:v,tag:"",desc:"",warn:"",steps:[],line:ln}; progs.push(p); return;
      }
      if(!p){ errs.push(ln+"行目：「プログラム名:」より前に「"+k[1]+"」があります"); return; }
      p[f]=v; return;
    }
    if(t.indexOf("|")>=0){
      const c=t.split("|").map(function(x){return x.trim();});
      if(/^(種目名?|名前|ポーズ名?)$/.test(c[0])&&/^(秒数?|時間)$/.test(c[1]||"")) return;
      if(/^[-–—:：\s]*$/.test(c.join(""))) return;
      if(!p){ errs.push(ln+"行目：「プログラム名:」がまだ書かれていません"); return; }
      if(!c[0]){ errs.push(ln+"行目：種目名が空です"); return; }
      const sec=parseSec(c[1]||"");
      if(sec===null||sec<=0){ errs.push(ln+"行目：秒数が読み取れません（"+(c[1]?c[1]:"空欄")+"）"); return; }
      if(sec>1800){ errs.push(ln+"行目：秒数が長すぎます（"+sec+"秒）"); return; }
      let side=(c[2]||"").trim();
      if(/^([-–—ー]|なし|無し|none)$/i.test(side)) side="";
      p.steps.push({n:c[0],s:sec,side:side||null,how:(c[3]||"").trim(),ease:(c[4]||"").trim()});
      return;
    }
    skips.push(ln+"行目：" + (s.length>26?s.slice(0,26)+"…":s));
  });
  progs.forEach(function(q){
    if(!q.steps.length) errs.push(q.line+"行目：「"+q.name+"」に種目が1つもありません");
  });
  if(!progs.length) errs.push("プログラムが見つかりません。「プログラム名: 〜」の行が必要です。");
  return {progs:progs,errs:errs,skips:skips};
}

function progToText(p){
  const L=["#BMC-STRETCH v1","プログラム名: "+p.name];
  if(p.tag) L.push("タグ: "+p.tag);
  if(p.desc) L.push("説明: "+p.desc);
  if(typeof p.warn==="string"&&p.warn) L.push("注意: "+p.warn);
  L.push("---","種目名 | 秒数 | 左右 | やり方 | できないときは");
  p.steps.forEach(function(s){
    L.push([s.n,s.s+"秒",s.side||"",s.how||"",s.ease||""].join(" | "));
  });
  return L.join("\n");
}

function streak(){
  const days=[...new Set(DB.sessions.map(s=>s.date))].sort().reverse();
  if(!days.length) return 0;
  let n=0, d=new Date();
  if(days[0]!==today()){ d.setDate(d.getDate()-1); if(days[0]!==d.toLocaleDateString("sv-SE")) return 0; }
  for(const day of days){
    if(day===d.toLocaleDateString("sv-SE")){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}

/* ===================== v7（2026-09-05・問9のI）: 写真のセルフチェック =====================
   ご回答: 「アプリ側で写真が日付順に見れるようにしてほしい。
            iPhoneの写真アプリだとどこに保管したかわかりづらい」

   ■ 9/5に「アプリ内に写真を持たせるのは勧めない」と申し上げた件について
     反対した理由は2つありました。①iOS Safariがストレージごと捨てうる
     ②数十枚ぶんの容量が、既存の実施ログと同じ場所を圧迫する。
     **②はこの作りで完全に外せます。①は外せません。**正直にそう書いておきます。

   ■ 写真は localStorage に置かない。IndexedDB の別ストアに置く。
     理由がはっきりしています。localStorage は 5MB 程度が上限で、
     容量を超えると **save() 自体が失敗し、実施ログとチェックの記録が丸ごと
     保存できなくなります**（写真を1枚足したせいで、これまでの記録が
     止まる、という壊れ方をする）。写真を別の入れ物に分けておけば、
     写真がいっぱいになっても、消えても、**記録側は無傷**です。
     記録の書き出し（JSON）にも写真は混ざりません（巨大になって使えなくなるため）。

   ■ 保存する前に必ず縮める（長辺1280px・JPEG品質0.82）。
     iPhoneの写真はそのままだと1枚3〜5MBあり、数枚で破綻するため。

   ■ 出さないもの（8/8の安全4条件と、9/5のご指示）
     ・「先週より硬くなりました」等の判定を一切出さない。並べるだけ
     ・撮り忘れた週を欠測として赤く見せない。空いた週は、ただ無い
     ・連続週数・達成率を出さない
   ■ 消えたときのために「まとめて書き出す」を必ず置く（下の phExportAll）。 */

var PDB_NAME="bmc_stretch_photos", PDB_STORE="photos";
var pdb=null, pdbFailed=false;
function pdbOpen(){
  return new Promise(function(res,rej){
    if(pdb) return res(pdb);
    if(pdbFailed) return rej(new Error("indexeddb-unavailable"));
    try{
      var rq=indexedDB.open(PDB_NAME,1);
      rq.onupgradeneeded=function(){ 
        var d=rq.result;
        if(!d.objectStoreNames.contains(PDB_STORE)) d.createObjectStore(PDB_STORE,{keyPath:"id"});
      };
      rq.onsuccess=function(){ pdb=rq.result; res(pdb); };
      rq.onerror=function(){ pdbFailed=true; rej(rq.error||new Error("open-failed")); };
    }catch(e){ pdbFailed=true; rej(e); }
  });
}
function pdbTx(mode){ return pdbOpen().then(function(d){ return d.transaction(PDB_STORE,mode).objectStore(PDB_STORE); }); }
function pdbPut(rec){ return pdbTx("readwrite").then(function(st){ return new Promise(function(res,rej){ var r=st.put(rec); r.onsuccess=function(){res(true)}; r.onerror=function(){rej(r.error)}; }); }); }
function pdbAll(){ return pdbTx("readonly").then(function(st){ return new Promise(function(res,rej){ var r=st.getAll(); r.onsuccess=function(){res(r.result||[])}; r.onerror=function(){rej(r.error)}; }); }); }
function pdbDel(id){ return pdbTx("readwrite").then(function(st){ return new Promise(function(res,rej){ var r=st.delete(id); r.onsuccess=function(){res(true)}; r.onerror=function(){rej(r.error)}; }); }); }

/* 縮めてJPEGにする。元のファイルはそのまま端末に残る（こちらは触らない）。 */
function shrink(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var mx=1280, w=img.width, h=img.height;
        if(w>mx||h>mx){ var r=Math.min(mx/w,mx/h); w=Math.round(w*r); h=Math.round(h*r); }
        var c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        res({data:c.toDataURL("image/jpeg",0.82), w:w, h:h});
      };
      img.onerror=function(){ rej(new Error("画像として読めませんでした")); };
      img.src=fr.result;
    };
    fr.onerror=function(){ rej(new Error("ファイルを読めませんでした")); };
    fr.readAsDataURL(file);
  });
}

/* ===== v6（2026-09-05）: セットの整理（F=アーカイブ / J=コピーと書き出し） =====
   J の「AIと相談」は、アプリの中にAIを載せないという線をそのまま守る。
   ここでできるのは「コピーを作る」「テキストで書き出す」までで、
   相談そのものは Cowork／Spark で行う（できないことをできるように見せない）。 */
function copyProg(k){
  const src=getProg(k); if(!src) return;
  let base=String(src.name||"セット")+"（コピー）", nm=base, i=2;
  while(DB.progs.some(x=>x.name===nm)){ nm=base+i; i++; }
  const cp=JSON.parse(JSON.stringify({name:nm, tag:src.tag||"", desc:src.desc||"",
             warn:(typeof src.warn==="string"?src.warn:""), steps:src.steps||[]}));
  cp.id="p"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
  cp.at=today();
  DB.progs.push(cp);
  save();
  alert("「"+nm+"」を作りました。\n\n元のセットはそのままです。中身を直すときは「テキストを見る」でコピーして、直したものを取り込み直してください。");
  render();
}

function copyBox(id){
  const t=document.getElementById(id);
  const wasHidden=t.classList.contains("hide");
  if(wasHidden) t.classList.remove("hide");
  t.removeAttribute("readonly");
  t.select(); t.setSelectionRange(0,999999);
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){}
  t.setAttribute("readonly","");
  if(wasHidden) t.classList.add("hide");
  const done=r=>alert(r?"コピーしました":"コピーできませんでした。テキストを長押しして選択・コピーしてください");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(()=>done(true),()=>done(ok));
  } else done(ok);
}

      <div><div class="streak">${streak()}</div><div class="sub" style="margin:2px 0 0">連続日数</div></div>
      <div><div class="streak">${DB.sessions.length}</div><div class="sub" style="margin:2px 0 0">通算</div></div>
      <div><div class="streak">${DB.sessions.filter(x=>x.date>=new Date(Date.now()-6048e5).toLocaleDateString("sv-SE")).length}</div><div class="sub" style="margin:2px 0 0">直近7日</div></div>
    </div>
    <div class="sec">セルフチェックの推移</div>
    ${DB.checks.length?DB.checks.slice().reverse().slice(0,8).map(c=>
      `<div class="log"><b>${c.date}</b> 開脚 ${c.v.straddle??"-"}cm ／ 合蹠 ${c.v.baddha??"-"}cm ／ 牛の顔・脚 右${c.v.gomu_leg_r??"-"}・左${c.v.gomu_leg_l??"-"}${c.memo?"<br>"+c.memo:""}</div>`
    ).join(""):`<p class="sub">まだありません</p>`}
    <div class="sec">実施ログ</div>
    ${s.length?s.map(x=>`<div class="log"><b>${x.date}</b> ${x.prog}（${x.done}/${x.total}種目・${fmt(x.sec)}）</div>`).join(""):`<p class="sub">まだありません</p>`}
    <div class="sec">データ書き出し</div>
    <p class="sub">下のテキストをコピーして、Obsidianのノートに貼り付けてください。次のプログラム提案に使います。</p>
    <textarea id="dump" readonly>${JSON.stringify(DB)}</textarea>
    <div class="row">
      <button class="btn sm" onclick="copyAll()">コピー</button>
      <button class="btn sm ghost" onclick="dl()">ファイルで保存</button>
    </div>
    <button class="btn ghost" onclick="go('home')">戻る</button>
    <p class="note">記録はこの端末のブラウザ内に保存されています。定期的に書き出して保管してください。</p>`;
}
function copyAll(){
  const t=document.getElementById("dump");
  t.removeAttribute("readonly");
  t.select(); t.setSelectionRange(0,999999);
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){}
  t.setAttribute("readonly","");
  const done=r=>alert(r?"コピーしました":"コピーできませんでした。テキストを長押しして選択・コピーしてください");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(()=>done(true),()=>done(ok));
  } else done(ok);
}
function dl(){
  const b=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="stretch_"+today()+".json"; a.click();
}

/* ===================== タイマー ===================== */
let cur=null,CP=null,idx=0,left=0,tid=null,paused=false,startT=0,wake=null,phase="work";
const SAUNA=
  "【サウナ内での注意】\n\n"+
  "・最大の70%で止める（痛気持ちいいの手前）。熱で痛みを感じにくく、伸ばしすぎやすい\n"+
  "・必ず下段に座り、入室してすぐの前半に行う\n"+
  "・5分を超えて続けない\n"+
  "・入る前に水分を摂る\n"+
  "・めまい・吐き気・動悸・ふらつきが出たら即中止して退室\n\n"+
  "確認して開始しますか？";
const R=id=>document.getElementById(id);

function start(k){
  const p=getProg(k);
  if(!p||!p.steps||!p.steps.length){ alert("プログラムが見つかりませんでした"); return; }
  if(p.warn===true){ if(!confirm(SAUNA)) return; }
  else if(typeof p.warn==="string"&&p.warn){
    if(!confirm("【開始前の注意】\n\n"+p.warn+"\n\n確認して開始しますか？")) return;
  }
  CP=p; cur=k; idx=0; paused=false; startT=Date.now();
  /* v8: 前回の完了画面が残っていることがあるので、必ず実行の面に戻してから始める */
  var dw=R("rwrapDone"); if(dw) dw.style.display="none";
  var mw=R("rwrapMain"); if(mw) mw.style.display="";
  R("runner").style.display="block";
  R("rname").textContent=p.name;
  R("rpause").textContent="一時停止";
  document.body.style.overflow="hidden";
  try{ speechSynthesis.cancel(); }catch(e){}
  navigator.wakeLock?.request("screen").then(w=>wake=w).catch(()=>{});
  step();
}
function paint(){
  const st=CP.steps[idx];
  R("rex").textContent=st.n;
  const sd=R("rside");
  if(st.side){sd.textContent=st.side;sd.className="side";}else{sd.className="side none";}
  R("rhow").textContent=st.how;
  R("rease").textContent=st.ease||"痛みが出ない手前まで戻し、可動範囲を半分にして行ってください。";
  R("rcount").textContent=(idx+1)+" / "+CP.steps.length;
  const nx=CP.steps[idx+1];
  R("rnext").textContent=nx?"次：" + nx.n + (nx.side?"（"+nx.side+"）":""):"最後の種目です";
}
function step(){
  const st=CP.steps[idx];
  paint();
  if(S().prep>0){
    phase="prep"; left=S().prep;
    R("rphase").textContent="準備 ・ このあと "+st.s+"秒";
    R("rphase").className="phase";
    say("次は、"+st.n.replace("★苦手な側","")+(st.side?"、"+st.side:"")+"。"+st.s+"秒。準備してください");
  }else{
    phase="work"; left=st.s;
    R("rphase").className="phase hide";
    say(st.n.replace("★苦手な側","")+(st.side?"、"+st.side:"")+"、"+st.s+"秒");
  }
  tick(true);
  clearInterval(tid);
  tid=setInterval(()=>{ if(!paused){ left--; tick(); } },1000);
}
function toWork(){
  const st=CP.steps[idx];
  phase="work"; left=st.s;
  R("rphase").className="phase hide";
  beep(880,.18);
  say("スタート");
  tick(true);
}
function tick(init){
  const st=CP.steps[idx];
  R("rtimer").textContent=fmt(Math.max(left,0));
  R("rtimer").className="timer"+(phase==="prep"?" prep":(left<=3?" warn":""));
  const base=phase==="prep"?0:(1-left/st.s);
  R("rbar").style.width=((idx+base)/CP.steps.length*100)+"%";
  if(init) return;
  if(S().beep&&(left===3||left===2||left===1)) beep(660,.09);
  if(left<=0){
    if(phase==="prep") toWork();
    else { beep(880,.3); next(); }
  }
}
function next(){
  clearInterval(tid);
  if(idx<CP.steps.length-1){ idx++; step(); } else finish();
}
function jump(d){
  clearInterval(tid);
  try{ speechSynthesis.cancel(); }catch(e){}
  if(d>0&&phase==="prep"){ toWork(); startLoop(); return; }
  if(d<0&&idx===0){ step(); return; }
  if(d>0&&idx===CP.steps.length-1){ finish(); return; }
  idx+=d; step();
}
function startLoop(){
  clearInterval(tid);
  tid=setInterval(()=>{ if(!paused){ left--; tick(); } },1000);
}
function togglePause(){
  paused=!paused;
  R("rpause").textContent=paused?"再開":"一時停止";
}
/* v8（2026-09-05 ご指摘）: 終わったことに気づけない件の作り直し。
   ■ 何が起きていたか
     finish() は close_(true) で**すぐ実行画面を閉じてホームへ戻し**、
     900ms後に alert を出していた。iOSでは alert（ネイティブのダイアログ）が
     読み上げを止めるため、「音声が途中で切れる」。
     完了の画面も、実質この alert だけだった。
   ■ 直したこと
     1. **完了画面を実行画面の中に出す**（閉じない）。押すまでホームに戻らない。
     2. **alert をやめた**。読み上げを邪魔しない。
     3. **完了音を長くした**（chimeDone。下記）。
   ■ 出さないもの: 連続日数・達成率・「よくできました」の類は完了画面に出さない
     （8/8の安全4条件と、ホーム側との二重表示を避けるため）。事実だけ出す。 */
function finish(){
  const sec=Math.round((Date.now()-startT)/1000);
  DB.sessions.push({date:today(),prog:CP.name,done:idx+1,total:CP.steps.length,sec});
  save();
  clearInterval(tid);
  try{ wake&&wake.release(); wake=null; }catch(e){}
  showDone(CP.name, idx+1, CP.steps.length, sec);
  chimeDone();
  say("ストレッチ完了です。おつかれさまでした。");
}
/* 実行画面を「完了の表示」に差し替える。閉じるのは押されたときだけ。 */
function showDone(name, done, total, sec){
  var w=R("rwrapDone");
  if(w){
    R("rd_name").textContent=name;
    R("rd_sub").textContent=done+" / "+total+"種目 ・ "+fmt(sec);
    R("rwrapMain").style.display="none";
    w.style.display="";
    R("runner").style.display="";
  }
}
function doneClose(){
  var w=R("rwrapDone");
  if(w){ w.style.display="none"; R("rwrapMain").style.display=""; }
  close_(true);
}
function doneAgain(){
  var k=cur;
  var w=R("rwrapDone");
  if(w){ w.style.display="none"; R("rwrapMain").style.display=""; }
  close_();
  if(k) start(k);
}
function quit(){
  if(idx>0 && !confirm("中断しますか？（ここまでの分を記録します）")) return;
  if(idx>0){
    const sec=Math.round((Date.now()-startT)/1000);
    DB.sessions.push({date:today(),prog:CP.name+"（途中）",done:idx,total:CP.steps.length,sec});
    save();
  }
  close_();
}
function close_(keepSpeech){
  clearInterval(tid);
  if(!keepSpeech){ try{ speechSynthesis.cancel(); }catch(e){} }
  R("runner").style.display="none";
  document.body.style.overflow="";
  try{wake&&wake.release();wake=null;}catch(e){}
  render();
}

/* 音声・ビープ */
let ac=null;
/* v4: 完了チャイム。種目の切り替え音（単発880Hz）と区別できる上昇3音。
   設定の読み上げ／ビープをどちらもオフにしていても必ず鳴らす（完了に気づけない、というご指摘への対応） */
/* v8（2026-09-05 ご指摘「気づけないほど短い音」）:
   上昇3音を1回（約1秒）→ **上昇3音を2回くり返し、最後を長く伸ばす**（約3.4秒）に伸ばした。
   種目の切り替え音（単発880Hz・0.18秒）とは、長さでも回数でもはっきり違う。
   設定の読み上げ／ビープをどちらもオフにしていても必ず鳴らす（v4からの約束）。 */
function chimeDone(){
  const seq=[
    [784,.30,   0],[988,.30, 320],[1319,.75, 640],
    [784,.30,1500],[988,.30,1820],[1319,1.10,2140]
  ];
  seq.forEach(function(s){ setTimeout(function(){ beep(s[0],s[1]); }, s[2]); });
}
function beep(f,d){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    /* v8: 立ち上がりを少しなめらかにして、短く切れた印象を減らす。
       音量も 0.18 → 0.26 に上げた（ジムでも気づけるように）。 */
    g.gain.setValueAtTime(.0001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.26,ac.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.start();o.stop(ac.currentTime+d+.05);
  }catch(e){}
}
function say(t){
  try{
    if(!S().voice) return;
    const u=new SpeechSynthesisUtterance(t);
    u.lang="ja-JP";u.rate=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
render();
</script>
