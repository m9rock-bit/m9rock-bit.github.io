<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stretch">
<meta name="theme-color" content="#12151c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2312151c'/%3E%3Cpath d='M90 34c9 0 16 7 16 16s-7 16-16 16-16-7-16-16 7-16 16-16z' fill='%237fd1c1'/%3E%3Cpath d='M90 72c-6 0-11 4-13 10l-9 30-22 22a9 9 0 1 0 13 13l25-25 6-19 6 19 25 25a9 9 0 1 0 13-13l-22-22-9-30c-2-6-7-10-13-10z' fill='%237fd1c1'/%3E%3C/svg%3E">
<title>B.M.C. ストレッチ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#12151c;color:#e8ecf2;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-user-select:none;user-select:none;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:19px;margin:4px 0 2px;letter-spacing:.02em}
.sub{color:#8a94a6;font-size:12.5px;margin:0 0 18px;line-height:1.6}
.card{
  background:#1a1f29;border:1px solid #262d3a;border-radius:14px;
  padding:15px 16px;margin-bottom:11px;display:block;width:100%;text-align:left;
  color:inherit;font:inherit;cursor:pointer;transition:transform .08s;
}
.card:active{transform:scale(.985)}
.card .t{font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px}
.card .d{font-size:12.5px;color:#8a94a6;margin-top:5px;line-height:1.55}
.badge{font-size:11px;background:#232b38;color:#9fb0c8;border-radius:6px;padding:2px 7px;font-weight:500}
.badge.hot{background:#3a2620;color:#f0a68a}
.badge.core{background:#1e3b36;color:#7fd1c1}
.sec{font-size:12px;color:#6f7a8c;margin:22px 0 9px;letter-spacing:.06em}
.btn{
  display:block;width:100%;padding:15px;border-radius:12px;border:none;
  background:#7fd1c1;color:#10161c;font-size:16px;font-weight:700;
  font-family:inherit;cursor:pointer;margin-top:10px;
}
.btn.ghost{background:#232b38;color:#cbd5e3;font-weight:600}
.btn.sm{padding:11px;font-size:14px}
.row{display:flex;gap:9px}
.row>*{flex:1}

/* runner */
#runner{display:none;position:fixed;inset:0;background:#12151c;z-index:10;overflow-y:auto}
.rwrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px)}
.rtop{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#8a94a6}
.xbtn{background:none;border:none;color:#8a94a6;font-size:22px;line-height:1;padding:4px 8px;cursor:pointer}
.prog{height:4px;background:#232b38;border-radius:3px;margin:12px 0 22px;overflow:hidden}
.prog i{display:block;height:100%;background:#7fd1c1;width:0;transition:width .3s}
.exname{font-size:25px;font-weight:700;line-height:1.35;margin:0 0 6px}
.side{display:inline-block;font-size:13px;font-weight:700;background:#7fd1c1;color:#10161c;border-radius:6px;padding:3px 10px;margin-bottom:10px}
.side.none{display:none}
.timer{font-size:76px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:14px 0 4px;letter-spacing:-.03em}
.timer.warn{color:#f0a68a}
.next{text-align:center;color:#6f7a8c;font-size:12.5px;min-height:18px;margin-bottom:20px}
.how{background:#1a1f29;border:1px solid #262d3a;border-radius:12px;padding:14px;font-size:14px;line-height:1.75;color:#c8d2e0}
.ease{margin-top:9px;border:1px solid #2f2a24;background:#1f1c19;border-radius:12px;padding:0 14px;overflow:hidden}
.ease summary{cursor:pointer;font-size:13.5px;font-weight:600;color:#f0c08a;padding:12px 0;list-style:none}
.ease summary::-webkit-details-marker{display:none}
.ease p{font-size:13.5px;line-height:1.75;color:#d8c9b4;margin:0 0 13px}
.ctrl{display:flex;gap:9px;margin-top:18px}
.ctrl button{
  flex:1;padding:15px 0;border-radius:12px;border:none;background:#232b38;color:#cbd5e3;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer
}
.ctrl button.main{flex:1.6;background:#7fd1c1;color:#10161c;font-weight:700}

/* forms */
label{display:block;font-size:13.5px;color:#c8d2e0;margin:15px 0 6px;line-height:1.5}
label small{display:block;color:#6f7a8c;font-size:11.5px;margin-top:3px}
input,select{
  width:100%;padding:13px;border-radius:10px;border:1px solid #2c3441;
  background:#12161d;color:#e8ecf2;font-size:16px;font-family:inherit
}
.log{font-size:13px;color:#a8b4c6;line-height:1.7;border-bottom:1px solid #232b38;padding:11px 0}
.log b{color:#e8ecf2;font-weight:600}
.streak{font-size:38px;font-weight:700;color:#7fd1c1;line-height:1}
.note{font-size:12px;color:#6f7a8c;line-height:1.7;margin-top:14px}
textarea{width:100%;height:150px;background:#12161d;color:#a8b4c6;border:1px solid #2c3441;border-radius:10px;padding:11px;font-size:11px;font-family:ui-monospace,Menlo,monospace}
/* 姿勢イラスト */
.figbox{margin:14px 0 4px;text-align:center}
.fig{width:100%;max-width:300px;height:auto;background:#151a23;border:1px solid #232b38;border-radius:12px;padding:4px}
.fig .bd{fill:none;stroke:#7fd1c1;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.fig .fl{stroke:#46536a;stroke-width:2;fill:none}
.fig .fl2{stroke:#46536a;stroke-width:2;fill:none;stroke-dasharray:4 4}
.fig .pole{stroke:#5b6a85;stroke-width:9;stroke-linecap:round}
.fig .mo{stroke:#8a94a6;stroke-width:1.6;fill:none;stroke-dasharray:4 4}
.fig .mo2{stroke:#8a94a6;stroke-width:2.4;fill:none}
.phase{text-align:center;font-size:13.5px;font-weight:700;color:#f0c08a;margin:6px 0 -4px;line-height:1.5}
.phase.hide{display:none}
.timer.prep{color:#f0c08a;font-weight:300}
.warnbox{background:#2a1d18;border:1px solid #4a3226;border-radius:12px;padding:14px;font-size:13px;line-height:1.75;color:#f0c9b4;margin-bottom:14px}
.warnbox b{color:#ffb995}
.hide{display:none}
</style>
</head>
<body>

<div id="app" class="wrap"></div>

<div id="runner"><div class="rwrap">
  <div class="rtop">
    <button class="xbtn" onclick="quit()">✕</button>
    <span id="rname"></span>
    <span id="rcount"></span>
  </div>
  <div class="prog"><i id="rbar"></i></div>
  <div id="rside" class="side none"></div>
  <h2 id="rex" class="exname"></h2>
  <div id="rphase" class="phase hide"></div>
  <div id="rtimer" class="timer">0:00</div>
  <div id="rnext" class="next"></div>
  <div id="rfig" class="figbox"></div>
  <div id="rhow" class="how"></div>
  <details class="ease"><summary>できない・つらいときは（緩和措置）</summary><p id="rease"></p></details>
  <div class="ctrl">
    <button onclick="jump(-1)">◀ 戻る</button>
    <button class="main" id="rpause" onclick="togglePause()">一時停止</button>
    <button onclick="jump(1)">スキップ ▶</button>
  </div>
</div></div>

const today=()=>new Date().toLocaleDateString("sv-SE");
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");

function streak(){
  const days=[...new Set(DB.sessions.map(s=>s.date))].sort().reverse();
  if(!days.length) return 0;
  let n=0, d=new Date();
  if(days[0]!==today()){ d.setDate(d.getDate()-1); if(days[0]!==d.toLocaleDateString("sv-SE")) return 0; }
  for(const day of days){
    if(day===d.toLocaleDateString("sv-SE")){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}

/* ===================== タイマー ===================== */
let cur=null,idx=0,left=0,tid=null,paused=false,startT=0,wake=null,phase="work";
const R=id=>document.getElementById(id);

function start(k){
  if(P[k].warn && !confirm(
    "【サウナ内での注意】\n\n"+
    "・最大の70%で止める（痛気持ちいいの手前）。熱で痛みを感じにくく、伸ばしすぎやすい\n"+
    "・必ず下段に座り、入室してすぐの前半に行う\n"+
    "・5分を超えて続けない\n"+
    "・入る前に水分を摂る\n"+
    "・めまい・吐き気・動悸・ふらつきが出たら即中止して退室\n\n"+
    "確認して開始しますか？")) return;
  cur=k; idx=0; paused=false; startT=Date.now();
  R("runner").style.display="block";
  R("rname").textContent=P[k].name;
  R("rpause").textContent="一時停止";
  document.body.style.overflow="hidden";
  try{ speechSynthesis.cancel(); }catch(e){}
  navigator.wakeLock?.request("screen").then(w=>wake=w).catch(()=>{});
  step();
}
function paint(){
  const st=P[cur].steps[idx];
  R("rex").textContent=st.n;
  const sd=R("rside");
  if(st.side){sd.textContent=st.side;sd.className="side";}else{sd.className="side none";}
  R("rhow").textContent=st.how;
  R("rease").textContent=st.ease;
  R("rcount").textContent=(idx+1)+" / "+P[cur].steps.length;
  const nx=P[cur].steps[idx+1];
  R("rnext").textContent=nx?"次：" + nx.n + (nx.side?"（"+nx.side+"）":""):"最後の種目です";
  const box=R("rfig");
  if(S().fig){ box.innerHTML=fig(st.f); box.style.display="block"; }
  else { box.innerHTML=""; box.style.display="none"; }
}
function step(){
  const st=P[cur].steps[idx];
  paint();
  if(S().prep>0){
    phase="prep"; left=S().prep;
    R("rphase").textContent="準備 ・ このあと "+st.s+"秒";
    R("rphase").className="phase";
    say("次は、"+st.n.replace("★苦手な側","")+(st.side?"、"+st.side:"")+"。"+st.s+"秒。準備してください");
  }else{
    phase="work"; left=st.s;
    R("rphase").className="phase hide";
    say(st.n.replace("★苦手な側","")+(st.side?"、"+st.side:"")+"、"+st.s+"秒");
  }
  tick(true);
  clearInterval(tid);
  tid=setInterval(()=>{ if(!paused){ left--; tick(); } },1000);
}
function toWork(){
  const st=P[cur].steps[idx];
  phase="work"; left=st.s;
  R("rphase").className="phase hide";
  beep(880,.18);
  say("スタート");
  tick(true);
}
function tick(init){
  const st=P[cur].steps[idx];
  R("rtimer").textContent=fmt(Math.max(left,0));
  R("rtimer").className="timer"+(phase==="prep"?" prep":(left<=3?" warn":""));
  const base=phase==="prep"?0:(1-left/st.s);
  R("rbar").style.width=((idx+base)/P[cur].steps.length*100)+"%";
  if(init) return;
  if(S().beep&&(left===3||left===2||left===1)) beep(660,.09);
  if(left<=0){
    if(phase==="prep") toWork();
    else { beep(880,.3); next(); }
  }
}
function next(){
  clearInterval(tid);
  if(idx<P[cur].steps.length-1){ idx++; step(); } else finish();
}
function jump(d){
  clearInterval(tid);
  try{ speechSynthesis.cancel(); }catch(e){}
  if(d>0&&phase==="prep"){ toWork(); startLoop(); return; }
  if(d<0&&idx===0){ step(); return; }
  if(d>0&&idx===P[cur].steps.length-1){ finish(); return; }
  idx+=d; step();
}
function startLoop(){
  clearInterval(tid);
  tid=setInterval(()=>{ if(!paused){ left--; tick(); } },1000);
}
function togglePause(){
  paused=!paused;
  R("rpause").textContent=paused?"再開":"一時停止";
}
function finish(){
  const sec=Math.round((Date.now()-startT)/1000);
  DB.sessions.push({date:today(),prog:P[cur].name,done:idx+1,total:P[cur].steps.length,sec});
  save(); say("おつかれさまでした");
  close_();
  setTimeout(()=>alert("完了：" + P[cur].name + "\n" + (idx+1) + "/" + P[cur].steps.length + "種目 ・ " + fmt(sec)),120);
}
function quit(){
  if(idx>0 && !confirm("中断しますか？（ここまでの分を記録します）")) return;
  if(idx>0){
    const sec=Math.round((Date.now()-startT)/1000);
    DB.sessions.push({date:today(),prog:P[cur].name+"（途中）",done:idx,total:P[cur].steps.length,sec});
    save();
  }
  close_();
}
function close_(){
  clearInterval(tid);
  try{ speechSynthesis.cancel(); }catch(e){}
  R("runner").style.display="none";
  document.body.style.overflow="";
  try{wake&&wake.release();wake=null;}catch(e){}
  render();
}

/* 音声・ビープ */
let ac=null;
function beep(f,d){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.18,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
    o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
function say(t){
  try{
    if(!S().voice) return;
    const u=new SpeechSynthesisUtterance(t);
    u.lang="ja-JP";u.rate=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
render();
</script>
